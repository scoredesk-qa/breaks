/* ── Admin Live (the Live Rack) ── */
function ALive(){
  const [live,setLive]=useState([]);
  const [clocked,setClocked]=useState([]);
  const [maxB,setMaxB]=useState(3);
  const [loading,setLoad]=useState(true);
  const [err,setErr]=useState('');
  const [rt,setRt]=useState(false);
  const [confirm,setConfirm]=useState(null);
  const [remoting,setRemoting]=useState(null);

  const load=useCallback(async()=>{
    setErr('');
    const {data:bl,error:e1}=await run(SB.from('bt_logs').select('*').is('end_time',null).order('start_time'));
    if(e1){setErr(e1.message);setLoad(false);return;}
    setLive(bl||[]);
    const today=todayISO();
    const {data:ck}=await run(SB.from('bt_clocklogs').select('*').eq('date',today).is('clock_out',null));
    setClocked(ck||[]);
    const {data:cfg}=await run(SB.from('bt_settings').select('max_concurrent_breaks').eq('id',1).maybeSingle());
    if(cfg)setMaxB(cfg.max_concurrent_breaks);
    setLoad(false);
    bumpSync();
  },[]);

  useEffect(()=>{
    load();
    const ch=SB.channel('live-rt2')
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'bt_logs'},({new:nw})=>{ if(!nw.end_time)setLive(p=>[...p,nw]); bumpSync(); })
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'bt_logs'},({new:nw})=>{ if(nw.end_time)setLive(p=>p.filter(r=>r.id!==nw.id)); else setLive(p=>p.map(r=>r.id===nw.id?nw:r)); bumpSync(); })
      .subscribe(s=>{ setRt(s==='SUBSCRIBED'); if(s==='SUBSCRIBED') load(); });
    return()=>SB.removeChannel(ch);
  },[load]);
  useAutoRefresh(load, 4000);

  const remoteStart=async(agent)=>{
    setRemoting(agent.user_id); setErr('');
    // Re-check the live count fresh from the DB right before inserting — the button's
    // disabled state uses local `live`/`maxB`, which can lag a few seconds behind on a
    // slow connection, so we can't trust it alone as the only guard.
    const {data:tc}=await run(SB.from('bt_logs').select('id').is('end_time',null));
    if((tc||[]).length>=maxB){ setErr(`All ${maxB} break slots are taken. Please wait.`); setRemoting(null); setConfirm(null); return; }
    const now=new Date().toISOString();
    const {data,error}=await run(SB.from('bt_logs').insert({user_id:agent.user_id,agent_name:agent.agent_name,start_time:now}).select().single());
    if(error){setErr(error.message?.includes('break slots are taken')?error.message:'Remote break failed: '+error.message);}
    else{setLive(p=>[...p,data]);}
    setRemoting(null); setConfirm(null);
  };

  const onBreakIds=new Set(live.map(l=>l.user_id));
  const available=clocked.filter(a=>!onBreakIds.has(a.user_id));
  const atCap=live.length>=maxB;

  return(
    <div className="panel">
      <div className="phd">
        <div><h1 className="pt">Live Rack</h1><p className="ps"><TNum value={`${live.length}/${maxB}`}/> slots in use · updates instantly</p></div>
        <div className="fc g10">
          <ConnInstrument/>
          <button className="bs" onClick={load}><Ic n="refresh" size={14}/> Refresh</button>
        </div>
      </div>
      {err&&<div className="ebox"><Ic n="alert" size={14}/>{err}</div>}
      {loading?<div className="es"><div className="spin"/></div>:(
        <>
          {live.length>0&&(
            <div className="sc" style={{marginBottom:16}}>
              <div className="sc-hd"><span className="ldot"/><h2 className="sc-t">On Break Now ({live.length})</h2></div>
              <div className="tbl-wrap"><table className="dt">
                <thead><tr><th>Agent</th><th>Started</th><th>Elapsed</th><th>Predicted Type</th></tr></thead>
                <tbody>{live.map(l=><tr key={l.id}><td><AvC name={l.agent_name}/></td><td>{fmtT(l.start_time)}</td><td><LSec start={l.start_time}/></td><td><LType start={l.start_time}/></td></tr>)}</tbody>
              </table></div>
            </div>
          )}
          {live.length===0&&<div className="es" style={{padding:'24px 20px'}}><span className="es-ic"><Ic n="coffee" size={36} sw={1.2}/></span><p>No agents on break right now</p></div>}
          <div className="sc">
            <div className="sc-hd">
              <span className="sc-ic"><Ic n="play" size={15}/></span>
              <h2 className="sc-t">Start Break Remotely</h2>
              <span style={{marginLeft:8,fontSize:11,color:'var(--mut)'}}>For agents who left their desk without starting</span>
            </div>
            {available.length===0
              ?<div className="es" style={{padding:'24px 20px'}}><p>All clocked-in agents are already on break or none are clocked in yet.</p></div>
              :(
                <div className="tbl-wrap"><table className="dt">
                  <thead><tr><th>Agent</th><th>Clocked In</th><th>Status</th><th>Action</th></tr></thead>
                  <tbody>
                    {available.map(a=>(
                      <tr key={a.id}>
                        <td><AvC name={a.agent_name}/></td>
                        <td>{fmtT(a.clock_in)}</td>
                        <td><span className="badge b-in"><span style={{width:6,height:6,borderRadius:'50%',background:'var(--green)',display:'inline-block'}}/> On Shift</span></td>
                        <td>
                          <button className="btn-remote" disabled={atCap||remoting===a.user_id} onClick={()=>setConfirm({user_id:a.user_id,agent_name:a.agent_name})}>
                            {remoting===a.user_id?<span className="spin-sm"/>:<Ic n="play" size={12}/>}
                            {atCap?'Slots Full':'Start Break'}
                          </button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table></div>
              )
            }
          </div>
        </>
      )}
      {confirm&&(
        <div className="modal-bg" onClick={e=>e.target===e.currentTarget&&setConfirm(null)}>
          <div className="modal-box">
            <div className="modal-title">Start break for {confirm.agent_name}?</div>
            <div className="modal-sub">This will log a break starting right now on their behalf. The timer will begin immediately and they will see it on their screen.</div>
            <div className="modal-foot">
              <button className="bs" onClick={()=>setConfirm(null)}>Cancel</button>
              <button className="bp blue" onClick={()=>remoteStart(confirm)} disabled={!!remoting}>{remoting?<span className="spin-sm on-dark"/>:<Ic n="play" size={14}/>} Confirm</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ── Admin Clock In/Out ── */
function AClocks(){
  const [rows,setRows]=useState([]);
  const [date,setDate]=useState(todayISO());
  const [loading,setLoad]=useState(true);
  const [err,setErr]=useState('');
  const [rt,setRt]=useState(false);
  const [clockingIn,setClockingIn]=useState(null); // user_id being processed
  const [confirmClock,setConfirmClock]=useState(null); // {user_id,agent_name}

  const load=useCallback(async()=>{
    setLoad(true);setErr('');
    const {data,error}=await run(SB.from('bt_clocklogs').select('*').eq('date',date).order('clock_in',{ascending:true}));
    if(error){setErr(error.message);setLoad(false);return;}
    setRows(data||[]); setLoad(false);
    bumpSync();
  },[date]);

  useEffect(()=>{
    load();
    const ch=SB.channel('clock-rt2')
      .on('postgres_changes',{event:'*',schema:'public',table:'bt_clocklogs'},({eventType,new:nw,old:ol})=>{
        if(nw?.date!==date&&ol?.date!==date)return;
        if(eventType==='INSERT')setRows(p=>[...p,nw]);
        if(eventType==='UPDATE')setRows(p=>p.map(r=>r.id===nw.id?nw:r));
        if(eventType==='DELETE')setRows(p=>p.filter(r=>r.id!==ol.id));
        bumpSync();
      }).subscribe(s=>{ setRt(s==='SUBSCRIBED'); if(s==='SUBSCRIBED') load(); });
    return()=>SB.removeChannel(ch);
  },[load,date]);
  useAutoRefresh(load, 6000);

  /* Remote clock in — needs the user_id and display_name from Supabase Auth.
     We look them up from auth.users via a simple approach: we use the agent_name
     stored in existing clock records or fetch from a known list. Since we can't
     query auth.users from the client directly, we use a workaround:
     Admin types the agent name and we create the clock record with user_id from
     the most recent existing record for that agent, or admin picks from a dropdown. */
  const remoteClockIn=async(agentName,userId)=>{
    setClockingIn(userId);setErr('');
    const now=new Date().toISOString();
    const {data,error}=await run(
      SB.from('bt_clocklogs').insert({user_id:userId,agent_name:agentName,clock_in:now,date:date}).select().single()
    );
    if(error){setErr('Remote clock-in failed: '+error.message);}
    else{setRows(p=>[...p,data]);}
    setClockingIn(null);setConfirmClock(null);
  };

  const remoteClockOut=async(row)=>{
    const now=new Date().toISOString();
    const {data,error}=await run(SB.from('bt_clocklogs').update({clock_out:now}).eq('id',row.id).select().single());
    if(error){setErr('Clock-out failed: '+error.message);return;}
    setRows(p=>p.map(r=>r.id===row.id?data:r));
  };

  const clockedIn=rows.filter(r=>r.clock_in&&!r.clock_out);
  const clockedOut=rows.filter(r=>r.clock_out);
  const shiftDur=r=>{ if(!r.clock_in||!r.clock_out)return'—'; return durStr(Math.round((new Date(r.clock_out)-new Date(r.clock_in))/1000)); };

  return(
    <div className="panel">
      <div className="phd">
        <div><h1 className="pt">Clock In / Out</h1><p className="ps">Agent attendance · {rows.length} records</p></div>
        <div className="fc g10">
          <ConnInstrument/>
          <input className="si" type="date" value={date} onChange={e=>setDate(e.target.value)} style={{width:160}}/>
          <button className="bs" onClick={load}><Ic n="refresh" size={14}/> Refresh</button>
        </div>
      </div>
      {err&&<div className="ebox"><Ic n="alert" size={14}/>{err}</div>}
      <div className="sg3" style={{marginBottom:20}}>
        <SC n="users"  label="Total agents" val={rows.length}/>
        <SC n="login2" label="Currently in"  val={clockedIn.length} ac={clockedIn.length>0}/>
        <SC n="moon"   label="Clocked out"   val={clockedOut.length}/>
      </div>
      {loading?<div className="es"><div className="spin"/></div>:(
        <div className="sc">
          <div className="sc-hd">
            <span className="sc-ic"><Ic n="sun" size={15}/></span>
            <h2 className="sc-t">Attendance — {date}</h2>
            {date===todayISO()&&<button className="btn-remote" style={{marginLeft:'auto'}} onClick={()=>setConfirmClock('new')}><Ic n="login2" size={12}/> Clock In Agent</button>}
          </div>
          {rows.length===0
            ?<div className="es"><span className="es-ic"><Ic n="sun" size={36} sw={1.2}/></span><p>No clock records for this date</p></div>
            :(
              <div className="tbl-wrap"><table className="dt">
                <thead><tr><th>Agent</th><th>Clock In</th><th>Clock Out</th><th>Shift Duration</th><th>Status</th><th>Action</th></tr></thead>
                <tbody>
                  {rows.map(r=>(
                    <tr key={r.id}>
                      <td><AvC name={r.agent_name}/></td>
                      <td>{fmtT(r.clock_in)}</td>
                      <td>{r.clock_out?fmtT(r.clock_out):'—'}</td>
                      <td>{shiftDur(r)}</td>
                      <td>{r.clock_out?<span className="badge b-out">Clocked Out</span>:<span className="badge b-in"><span style={{width:6,height:6,borderRadius:'50%',background:'var(--green)',display:'inline-block'}}/> On Shift</span>}</td>
                      <td>{!r.clock_out&&<button className="btn-edit" onClick={()=>remoteClockOut(r)}><Ic n="logoff" size={12}/> Clock Out</button>}</td>
                    </tr>
                  ))}
                </tbody>
              </table></div>
            )
          }
        </div>
      )}
      {confirmClock==='new'&&<RemoteClockInModal date={date} onDone={(agentName,userId)=>remoteClockIn(agentName,userId)} onClose={()=>setConfirmClock(null)}/>}
    </div>
  );
}

/* Modal for remote clock in — picks from ALL known agents, filters out already clocked in today */
function RemoteClockInModal({date,onDone,onClose}){
  const [allAgents,  setAllAgents]  = useState([]); // everyone ever in bt_clocklogs
  const [todayNames, setTodayNames] = useState([]); // names already clocked in today
  const [available,  setAvailable]  = useState([]); // allAgents minus today
  const [selected,   setSelected]   = useState('');
  const [busy,       setBusy]       = useState(false);
  const [loading,    setLoading]    = useState(true);
  const [err,        setErr]        = useState('');

  useEffect(()=>{
    (async()=>{
      // 1. All unique agents ever recorded — order by clock_in desc, no created_at needed
      const {data:hist} = await run(
        SB.from('bt_clocklogs')
          .select('user_id,agent_name')
          .order('clock_in',{ascending:false})
          .limit(500)
      );
      const seen = new Set();
      const unique = [];
      (hist||[]).forEach(r=>{
        if(!seen.has(r.user_id)){ seen.add(r.user_id); unique.push(r); }
      });
      setAllAgents(unique);

      // 2. Who is already clocked in today?
      const {data:today} = await run(
        SB.from('bt_clocklogs').select('agent_name').eq('date',date)
      );
      const todaySet = new Set((today||[]).map(r=>r.agent_name));
      setTodayNames([...todaySet]);

      // 3. Available = in history but NOT already clocked in today
      const avail = unique.filter(a=>!todaySet.has(a.agent_name));
      setAvailable(avail);
      if(avail.length>0) setSelected(avail[0].user_id);
      setLoading(false);
    })();
  },[date]);

  const go=async()=>{
    const ag=available.find(a=>a.user_id===selected);
    if(!ag)return;
    setBusy(true);
    await onDone(ag.agent_name, ag.user_id);
    setBusy(false);
  };

  return(
    <div className="modal-bg" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal-box">
        <div className="modal-title">Clock In Agent Remotely</div>
        <div className="modal-sub">
          Select an agent to clock them in right now. Only agents not yet clocked in today are shown.
        </div>
        {loading
          ?<div style={{textAlign:'center',padding:'16px'}}><div className="spin" style={{margin:'0 auto'}}/></div>
          :available.length===0
            ?<div style={{background:'var(--card)',borderRadius:8,padding:'12px 14px',fontSize:13,color:'var(--mut)',marginBottom:16}}>
                {allAgents.length===0
                  ?'No agents found in the system yet. Each agent must clock in manually at least once before they appear here.'
                  :`All ${allAgents.length} known agent${allAgents.length>1?'s are':' is'} already clocked in today.`
                }
              </div>
            :(
              <div className="fg">
                <label className="fl">Select Agent ({available.length} available)</label>
                <select className="fi" value={selected} onChange={e=>setSelected(e.target.value)}>
                  {available.map(a=><option key={a.user_id} value={a.user_id}>{a.agent_name}</option>)}
                </select>
              </div>
            )
        }
        {err&&<div className="aerr"><Ic n="alert" size={14}/>{err}</div>}
        <div className="modal-foot">
          <button className="bs" onClick={onClose}>Cancel</button>
          <button className="bp" onClick={go} disabled={busy||available.length===0||loading}>
            {busy?<span className="spin-sm"/>:<Ic n="login2" size={14}/>} Clock In
          </button>
        </div>
      </div>
    </div>
  );
}

/* ── Admin Lunch Schedule ── */
function ALunch(){
  const [date,    setDate]    = useState(todayISO());
  const [row,     setRow]     = useState(null);   // bt_lunch_schedule row
  const [grpA,    setGrpA]    = useState([]);
  const [grpB,    setGrpB]    = useState([]);
  const [pool,    setPool]    = useState([]);     // clocked in but unassigned
  const [first,   setFirst]   = useState('A');    // which group goes at 12:00
  const [loading, setLoad]    = useState(true);
  const [saving,  setSaving]  = useState(false);
  const [err,     setErr]     = useState('');
  const [saved,   setSaved]   = useState(false);

  const load=useCallback(async()=>{
    setLoad(true);setErr('');setSaved(false);

    // Load existing schedule for the selected date
    const {data:ls}=await run(SB.from('bt_lunch_schedule').select('*').eq('date',date).maybeSingle());

    // Load agents clocked in on the selected date
    const {data:ck}=await run(SB.from('bt_clocklogs').select('agent_name').eq('date',date));
    const allClocked=[...new Set((ck||[]).map(r=>r.agent_name))];

    if(ls){
      // Schedule already exists for this date — use it directly
      const a=ls.group_a||[];
      const b=ls.group_b||[];
      setRow(ls); setGrpA(a); setGrpB(b);
      setFirst(ls.group_first||defaultFirst(date));
      // Any agent clocked in today but not yet assigned → pool
      setPool(allClocked.filter(n=>!a.includes(n)&&!b.includes(n)));
    } else {
      // No schedule for this date — try to auto-fill from the most recent previous schedule
      const {data:prev}=await run(
        SB.from('bt_lunch_schedule')
          .select('*')
          .lt('date', date)          // any date before today
          .order('date',{ascending:false})
          .limit(1)
          .maybeSingle()
      );

      setRow(null);
      setFirst(defaultFirst(date));

      if(prev){
        // Auto-fill: keep agents from previous groups if they're clocked in today
        const prevA = (prev.group_a||[]).filter(n=>allClocked.includes(n));
        const prevB = (prev.group_b||[]).filter(n=>allClocked.includes(n));
        const assigned = new Set([...prevA,...prevB]);
        // Any new agent clocked in today who wasn't in yesterday's schedule → pool
        const newAgents = allClocked.filter(n=>!assigned.has(n));
        setGrpA(prevA); setGrpB(prevB);
        setPool(newAgents);
      } else {
        // No previous schedule at all — everyone goes to pool
        setGrpA([]); setGrpB([]);
        setPool(allClocked);
      }
    }
    setLoad(false);
    bumpSync();
  },[date]);

  useEffect(()=>{load();},[load]);

  // Real-time: when the schedule changes (e.g. swap auto-applied or Supabase direct edit),
  // reload — but filter to only the date being viewed so unrelated days don't trigger a refresh.
  // No polling interval here — that was causing constant re-renders every 20s.
  useEffect(()=>{
    const ch=SB.channel('admin-lunch-rt')
      .on('postgres_changes',{event:'*',schema:'public',table:'bt_lunch_schedule'},({new:nw,old:ol})=>{
        const changedDate = nw?.date || ol?.date;
        if(changedDate && changedDate !== date) return;
        load();
      })
      .subscribe(s=>{ if(s==='SUBSCRIBED') load(); });
    return()=>{ SB.removeChannel(ch); };
  },[date,load]);
  useAutoRefresh(load, null); // no polling here (breaks drag-and-drop); just refetch when tab/app regains focus

  const move=(name,from,to)=>{
    const rem=arr=>arr.filter(n=>n!==name);
    if(from==='A')setGrpA(rem);
    else if(from==='B')setGrpB(rem);
    else setPool(rem);
    if(to==='A')setGrpA(p=>[...p,name]);
    else if(to==='B')setGrpB(p=>[...p,name]);
    else setPool(p=>[...p,name]);
  };

  const save=async()=>{
    setSaving(true);setErr('');setSaved(false);
    const payload={date,group_a:grpA,group_b:grpB,group_first:first,updated_at:new Date().toISOString()};
    let error;
    if(row){
      ({error}=await run(SB.from('bt_lunch_schedule').update(payload).eq('id',row.id)));
    } else {
      const {data,error:e}=await run(SB.from('bt_lunch_schedule').insert(payload).select().single());
      error=e; if(data)setRow(data);
    }
    if(error)setErr('Save failed: '+error.message);
    else setSaved(true);
    setSaving(false);
  };

  const slots=lunchSlots(first);

  return(
    <div className="panel">
      <div className="phd">
        <div><h1 className="pt">Lunch Schedule</h1><p className="ps">Assign agents to groups · groups rotate daily</p></div>
        <div className="fc g10">
          <input className="si" type="date" value={date} onChange={e=>setDate(e.target.value)} style={{width:160}}/>
          <button className="bs" onClick={load}><Ic n="refresh" size={14}/> Reload</button>
          <button className="bp" onClick={save} disabled={saving}>{saving?<span className="spin-sm"/>:<Ic n="check" size={14}/>} Save Schedule</button>

/* ── Admin Swap Requests ── */
function ASwapRequests(){
  const [swaps,setSwaps]=useState([]);
  const [loading,setLoad]=useState(true);
  const [err,setErr]=useState('');
  const [rt,setRt]=useState(false);
  const today=todayISO();

  const load=useCallback(async()=>{
    setLoad(true);setErr('');
    const {data,error}=await run(
      SB.from('bt_swap_requests').select('*').eq('date',today).order('created_at',{ascending:false})
    );
    if(error){setErr(error.message);}
    else setSwaps(data||[]);
    setLoad(false);
    bumpSync();
  },[today]);

  useEffect(()=>{
    load();
    const ch=SB.channel('admin-swaps-rt')
      .on('postgres_changes',{event:'*',schema:'public',table:'bt_swap_requests'},({eventType,new:nw,old:ol})=>{
        // Re-fetch on any change (safest approach regardless of REPLICA IDENTITY setting)
        load();
      }).subscribe(s=>{ setRt(s==='SUBSCRIBED'); if(s==='SUBSCRIBED') load(); });
    // Polling fallback every 12s
    const poll = setInterval(load, 12000);
    return()=>{ SB.removeChannel(ch); clearInterval(poll); };
  },[load]);
  useAutoRefresh(load, null); // instant refetch on regaining focus, on top of the 12s poll above

  const pending=swaps.filter(s=>s.status==='pending');
  const completed=swaps.filter(s=>s.status!=='pending'&&s.status!=='cancelled');
  const cancelled=swaps.filter(s=>s.status==='cancelled');

  const statusEl=(s)=>{
    if(s==='pending')return <span className="swap-status-pending">⏳ Pending</span>;
    if(s==='accepted')return <span className="swap-status-accepted">✅ Accepted</span>;
    if(s==='declined')return <span className="swap-status-declined">❌ Declined</span>;
    if(s==='cancelled')return <span style={{color:'var(--mut)'}}>Cancelled</span>;
    return <span>{s}</span>;
  };

  return(
    <div className="panel">
      <div className="phd">
        <div><h1 className="pt">Lunch Swap Requests</h1><p className="ps">Today's swap activity · auto-updates</p></div>
        <div className="fc g10">
          <ConnInstrument/>
          <button className="bs" onClick={load}><Ic n="refresh" size={14}/> Refresh</button>
        </div>
      </div>
      {err&&<div className="ebox"><Ic n="alert" size={14}/>{err}</div>}
      <div className="sg3" style={{marginBottom:20}}>
        <SC n="timer"    label="Pending"   val={pending.length}   wn={pending.length>0}/>
        <SC n="check"    label="Accepted"  val={completed.filter(s=>s.status==='accepted').length} ac={completed.filter(s=>s.status==='accepted').length>0}/>
        <SC n="activity" label="Declined"  val={completed.filter(s=>s.status==='declined').length}/>
      </div>
      {loading?<div className="es"><div className="spin"/></div>:swaps.length===0?(
        <div className="es"><span className="es-ic"><Ic n="swap" size={36} sw={1.2}/></span><p>No swap requests today</p></div>
      ):(
        <div className="sc">
          <div className="sc-hd"><span className="sc-ic"><Ic n="swap" size={15}/></span><h2 className="sc-t">All Swap Requests — Today</h2></div>
          <div className="tbl-wrap"><table className="dt">
            <thead><tr><th>From</th><th>To</th><th>Swap</th><th>Status</th><th>Time</th></tr></thead>
            <tbody>
              {swaps.map(s=>(
                <tr key={s.id}>
                  <td><AvC name={s.from_name}/></td>
                  <td><AvC name={s.to_name}/></td>
                  <td>
                    <span className="badge b-a">Grp {s.from_group}</span>
                    <span style={{color:'var(--mut)',margin:'0 6px'}}>↔</span>
                    <span className="badge b-b">Grp {s.to_group}</span>
                  </td>
                  <td>{statusEl(s.status)}</td>
                  <td style={{color:'var(--mut)',fontSize:12}}>{fmtT(s.created_at)}</td>
                </tr>
              ))}
            </tbody>
          </table></div>
        </div>
      )}
      {pending.length>0&&(
        <div className="awrn" style={{marginTop:16}}>
          <Ic n="alert" size={15}/> {pending.length} swap request{pending.length>1?'s are':' is'} waiting for a response. No action needed — swaps are automatic when accepted.
        </div>
      )}
    </div>
  );
}

/* ── Admin Analytics ── */
function AAnalytics(){
  const [agents,setAgents]=useState([]);
  const [summary,setSummary]=useState({count:0,total:0,avg:0,lunch:0,brk:0,bath:0});
  const [loading,setLoad]=useState(true);
  const [err,setErr]=useState('');
  const today=todayISO();
  const load=useCallback(async()=>{
    setLoad(true);setErr('');
    const {data,error}=await run(SB.from('bt_logs').select('agent_name,start_time,duration_secs,break_type').gte('start_time',today+'T00:00:00.000Z').not('duration_secs','is',null).order('start_time',{ascending:false}));
    if(error){setErr(error.message);setLoad(false);return;}
    const rows=data||[];
    const total=rows.reduce((s,l)=>s+(l.duration_secs||0),0);
    const avg=rows.length?Math.round(total/rows.length):0;
    const lunch=rows.filter(l=>l.break_type==='Lunch Break').length;
    const brk=rows.filter(l=>l.break_type==='Break').length;
    const bath=rows.filter(l=>l.break_type==='Bathroom Break').length;
    setSummary({count:rows.length,total,avg,lunch,brk,bath});
    const byAg={};
    rows.forEach(l=>{
      if(!byAg[l.agent_name])byAg[l.agent_name]={count:0,total:0,lunch:0,brk:0,bath:0};
      byAg[l.agent_name].count++; byAg[l.agent_name].total+=l.duration_secs||0;
      if(l.break_type==='Lunch Break')byAg[l.agent_name].lunch++;
      else if(l.break_type==='Break')byAg[l.agent_name].brk++;
      else if(l.break_type==='Bathroom Break')byAg[l.agent_name].bath++;
    });
    setAgents(Object.entries(byAg).map(([n,v])=>({name:n,...v,avg:Math.round(v.total/v.count)})).sort((a,b)=>b.total-a.total));
    setLoad(false);
    bumpSync();
  },[today]);
  useEffect(()=>{load();},[load]);
  useAutoRefresh(load, 8000); // no realtime channel on this screen, so poll + refetch-on-focus keeps it current
  return(
    <div className="panel">
      <div className="phd">
        <div><h1 className="pt">Analytics</h1><p className="ps">Today · {fmtD(today+'T12:00:00')}</p></div>
        <div className="fc g10"><ConnInstrument/><button className="bs" onClick={load}><Ic n="refresh" size={14}/> Refresh</button></div>
      </div>
      {err&&<div className="ebox"><Ic n="alert" size={14}/>{err}</div>}
      {loading?<div className="es"><div className="spin"/></div>:(
        <>
          <div className="sg4" style={{marginBottom:16}}>
            <SC n="activity" label="Total Breaks Today" val={summary.count}/>
            <SC n="clock"    label="Total Break Time"   val={durStr(summary.total)}/>
            <SC n="trending" label="Avg per Break"      val={durStr(summary.avg)}/>
            <SC n="users"    label="Agents on Breaks"   val={agents.length}/>
          </div>
          <div className="sg3" style={{marginBottom:20}}>
            <SC n="utensils" label="Lunch Breaks"    val={summary.lunch} ac={summary.lunch>0}/>
            <SC n="coffee"   label="Breaks"          val={summary.brk}/>
            <SC n="activity" label="Bathroom Breaks" val={summary.bath}/>
          </div>
          <div className="sc">
            <div className="sc-hd"><span className="sc-ic"><Ic n="users" size={15}/></span><h2 className="sc-t">Per Agent — Today</h2></div>
            {agents.length===0?<div className="es"><span className="es-ic"><Ic n="trending" size={36} sw={1.2}/></span><p>No completed breaks yet today</p></div>:(
              <div className="tbl-wrap"><table className="dt">
                <thead><tr><th>Agent</th><th>Breaks</th><th>Total Time</th><th>Avg</th><th>Lunch</th><th>Break</th><th>Bathroom</th></tr></thead>
                <tbody>{agents.map(a=><tr key={a.name}><td><AvC name={a.name}/></td><td>{a.count}</td><td style={{fontWeight:600,color:'var(--amber)'}}>{durStr(a.total)}</td><td>{durStr(a.avg)}</td><td>{a.lunch||'—'}</td><td>{a.brk||'—'}</td><td>{a.bath||'—'}</td></tr>)}</tbody>
              </table></div>
            )}
          </div>
        </>
      )}
    </div>
  );
}

/* ── Admin All Logs ── */

              <thead><tr><th>Agent</th><th>Date</th><th>Start</th><th>Return</th><th>Duration</th><th>Type</th><th></th></tr></thead>
              <tbody>

                  <tr key={l.id}>
                    <td><AvC name={l.agent_name}/></td>

                    <td>{l.end_time?fmtT(l.end_time):<span className="badge b-on">On Break</span>}</td>
                    <td>{l.duration_secs!=null?durStr(l.duration_secs):l.end_time?'—':<LSec start={l.start_time}/>}</td>
                    <td>
                      {editing===l.id?(
                        <div className="fc g6">
                          <select className="type-sel" defaultValue={l.break_type||''} onChange={e=>saveType(l.id,e.target.value)} disabled={saving===l.id}>
                            <option value="" disabled>Select…</option>
                            {BREAK_TYPES.map(t=><option key={t} value={t}>{t}</option>)}
                          </select>
                          {saving===l.id&&<span className="spin-sm"/>}
                        </div>
                      ):(l.break_type?<BB type={l.break_type}/>:l.end_time?<span style={{color:'var(--mut)',fontSize:12}}>No label</span>:<LType start={l.start_time}/>)}
                    </td>
                    <td>
                      {l.end_time&&(editing===l.id
                        ?<button className="btn-edit" onClick={()=>setEditing(null)}>✕</button>

const PRESETS = [
  { key:'lunch_a',  icon:'utensils', iconCls:'lunch',  title:'Lunch — Group A',   body:"Group A: your lunch break starts now. Please wrap up your call and do not take anymore calls.",   recipientHint:'group_a' },
  { key:'lunch_b',  icon:'utensils', iconCls:'break',  title:'Lunch — Group B',   body:"Group B: your lunch break starts now. Please wrap up your call and do not take anymore calls",   recipientHint:'group_b' },
  { key:'break',    icon:'coffee',   iconCls:'break',  title:'Take Your Break',    body:"It's time to take your 15-minute break. Please log it in BreakTrack.",  recipientHint:'all' },
  { key:'clockin',  icon:'login2',   iconCls:'info',   title:'Clock In Reminder', body:"Your shift is starting. Please clock in via BreakTrack now.",            recipientHint:'all' },
  { key:'return',   icon:'zap',      iconCls:'warn',   title:'Break Time',        body:"It's time for you to go on a break 😊",              recipientHint:'all' },
  { key:'meeting',  icon:'users',    iconCls:'custom', title:'Team Meeting',       body:"There is a team meeting starting shortly. Please wrap up and join teams meeting.",     recipientHint:'all' },
];

// recipientMode: 'all' | 'group_a' | 'group_b' | 'custom'
function ANotifications(){
  const [agents,        setAgents]        = useState([]);   // [{user_id, agent_name}]
  const [lunchGroups,   setLunchGroups]   = useState({ a:[], b:[] }); // names per group today
  const [recipientMode, setRecipientMode] = useState('all');
  const [customPicks,   setCustomPicks]   = useState(new Set()); // user_ids for 'custom' mode
  const [msgTab,        setMsgTab]        = useState('presets');
  const [customTitle,   setCustomTitle]   = useState('');
  const [customBody,    setCustomBody]    = useState('');
  const [alertMins,     setAlertMins]     = useState(5);
  const [sentLog,       setSentLog]       = useState([]);
  const [loading,       setLoading]       = useState(true);
  const [sending,       setSending]       = useState(false);
  const [err,           setErr]           = useState('');

  useEffect(() => {
    (async () => {
      const today = todayISO();
      // All known agents
      const { data: cl } = await run(SB.from('bt_clocklogs').select('user_id,agent_name').order('clock_in',{ascending:false}).limit(500));
      const seen = new Set(); const unique = [];
      (cl||[]).forEach(r => { if(!seen.has(r.user_id)){seen.add(r.user_id);unique.push(r);} });
      setAgents(unique);
      // Today's lunch groups
      const { data: ls } = await run(SB.from('bt_lunch_schedule').select('group_a,group_b').eq('date',today).maybeSingle());
      if (ls) setLunchGroups({ a: ls.group_a||[], b: ls.group_b||[] });
      setLoading(false);
    })();
  }, []);

  const toggleCustom = (uid) => setCustomPicks(s => { const n=new Set(s); n.has(uid)?n.delete(uid):n.add(uid); return n; });

  // Resolve who actually gets the notification given current recipientMode
  const resolveTargets = (overrideMode) => {
    const mode = overrideMode || recipientMode;
    if (mode === 'all')     return { lunchGroup: null, userIds: null, label: 'All agents' };
    if (mode === 'group_a') return { lunchGroup: 'A',  userIds: null, label: 'Group A' };
    if (mode === 'group_b') return { lunchGroup: 'B',  userIds: null, label: 'Group B' };
    // custom: specific user_ids
    const ids = [...customPicks];
    const names = ids.map(uid => agents.find(a=>a.user_id===uid)?.agent_name||'?').join(', ');
    return { lunchGroup: null, userIds: ids, label: names || 'No one selected' };
  };

  const doSend = async (title, body, type='custom', overrideMode=null) => {
    if (!title.trim()) return;
    const { lunchGroup, userIds, label } = resolveTargets(overrideMode);
    if (recipientMode==='custom' && !overrideMode && customPicks.size===0) { setErr('Select at least one agent in Custom mode.'); return; }
    setSending(true); setErr('');
    try {
      if (userIds) {
        for (const uid of userIds) await broadcastNotif({ title, body, type, targetUserId: uid, lunchGroup });
      } else {
        await broadcastNotif({ title, body, type, targetUserId: null, lunchGroup });
      }
      setSentLog(p => [{ id:Date.now(), title, body, type, to:label, time:new Date() }, ...p].slice(0,30));
      if (msgTab==='custom') { setCustomTitle(''); setCustomBody(''); }
    } catch(e) { setErr('Broadcast failed: '+e.message); }
    setSending(false);
  };

  const [autoEnabled, setAutoEnabled] = useState(true);

  const modeOpts = [
    { value:'all',     label:'All Agents' },
    { value:'group_a', label:'Group A'    },
    { value:'group_b', label:'Group B'    },
    { value:'custom',  label:'Custom…'   },
  ];

  const { label: recipientLabel } = resolveTargets();

  return (
    <div className="panel">
      <div className="phd">
        <div><h1 className="pt">Notifications</h1><p className="ps">Send real-time alerts — sound · toast · OS desktop notification</p></div>
      </div>
      {err&&<div className="ebox"><Ic n="alert" size={14}/>{err}</div>}

      {loading ? <div className="es"><div className="spin"/></div> : (
        <div style={{display:'grid',gridTemplateColumns:'1fr 300px',gap:20,alignItems:'start'}}>

          {/* ══ LEFT COLUMN ══ */}
          <div style={{display:'flex',flexDirection:'column',gap:20}}>

            {/* ── AUTOMATED LUNCH ALERTS ── */}
            <div style={{background:'var(--surf)',border:'1px solid var(--bdr)',borderRadius:14,padding:'18px 20px'}}>
              <div style={{display:'flex',alignItems:'center',gap:12}}>
                <div className="toast-ic lunch" style={{width:32,height:32,borderRadius:9,flexShrink:0}}><Ic n="utensils" size={14} sw={2}/></div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:14,fontWeight:700}}>Automated Lunch Alerts</div>
                  <div style={{fontSize:12,color:'var(--mut)',marginTop:1}}>Fires before each group's slot — only that group is notified</div>
                </div>
                {/* Toggle switch */}
                <button onClick={()=>setAutoEnabled(v=>!v)} style={{
                  width:44,height:24,borderRadius:12,border:'none',cursor:'pointer',flexShrink:0,
                  background:autoEnabled?'var(--violet)':'rgba(186,214,247,.12)',
                  position:'relative',transition:'background .2s',padding:0,
                }}>
                  <span style={{
                    position:'absolute',top:3,left:autoEnabled?22:3,width:18,height:18,
                    borderRadius:'50%',background:'#fff',transition:'left .2s',display:'block',
                  }}/>
                </button>
                <span style={{fontSize:12,fontWeight:700,color:autoEnabled?'var(--amber)':'var(--mut)',minWidth:32}}>{autoEnabled?'On':'Off'}</span>
              </div>
              {autoEnabled && (
                <div style={{display:'flex',alignItems:'center',gap:10,marginTop:14,paddingTop:14,borderTop:'1px solid var(--bdr)',flexWrap:'wrap'}}>
                  <span style={{fontSize:13,color:'var(--mut)'}}>Alert</span>
                  <button className="nb" style={{width:26,height:26,fontSize:15}} onClick={()=>setAlertMins(n=>Math.max(1,n-1))}>−</button>
                  <span style={{fontSize:20,fontWeight:800,color:'var(--amber)',minWidth:28,textAlign:'center',fontFamily:'var(--font-mono)'}}>{alertMins}</span>
                  <button className="nb" style={{width:26,height:26,fontSize:15}} onClick={()=>setAlertMins(n=>Math.min(30,n+1))}>+</button>
                  <span style={{fontSize:13,color:'var(--mut)'}}>minutes before lunch</span>
                  <span style={{fontSize:11,color:'var(--mut)'}}>· requires a schedule saved for today</span>
                </div>
              )}
            </div>

            {/* ── RECIPIENTS ── */}
            <div style={{background:'var(--surf)',border:'1px solid var(--bdr)',borderRadius:14,padding:'18px 20px'}}>
              <div style={{fontSize:11,fontWeight:700,color:'var(--mut)',letterSpacing:.5,textTransform:'uppercase',marginBottom:12}}>Recipients</div>
              <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center'}}>
                {modeOpts.map(o => (
                  <button key={o.value} onClick={()=>setRecipientMode(o.value)}
                    style={{padding:'7px 16px',borderRadius:8,border:'1.5px solid',fontWeight:700,fontSize:13,cursor:'pointer',fontFamily:'var(--font)',
                      background: recipientMode===o.value ? (o.value==='group_b'?'var(--indigo-d)':'var(--amber-d)') : 'var(--card)',
                      color:      recipientMode===o.value ? (o.value==='group_b'?'var(--indigo)':'var(--amber)') : 'var(--mut)',
                      borderColor:recipientMode===o.value ? (o.value==='group_b'?'var(--indigo-r)':'var(--amber-r)') : 'var(--bdr)',
                    }}>
                    {o.label}
                    {o.value==='group_a'&&lunchGroups.a.length>0&&<span style={{fontSize:10,opacity:.7,marginLeft:5}}>({lunchGroups.a.length})</span>}
                    {o.value==='group_b'&&lunchGroups.b.length>0&&<span style={{fontSize:10,opacity:.7,marginLeft:5}}>({lunchGroups.b.length})</span>}
                  </button>
                ))}
              </div>

              {recipientMode==='custom' && (
                <div style={{marginTop:14,paddingTop:14,borderTop:'1px solid var(--bdr)'}}>
                  <div style={{fontSize:11,fontWeight:700,color:'var(--mut)',letterSpacing:.5,textTransform:'uppercase',marginBottom:8,display:'flex',alignItems:'center',gap:8}}>
                    Select agents
                    {customPicks.size>0&&<button style={{background:'none',border:'none',color:'var(--amber)',cursor:'pointer',fontSize:11,fontWeight:700}} onClick={()=>setCustomPicks(new Set())}>Clear all</button>}
                  </div>
                  <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(180px,1fr))',gap:6,maxHeight:200,overflowY:'auto'}}>
                    {agents.length===0&&<div style={{fontSize:12,color:'var(--mut)',gridColumn:'1/-1'}}>No agents found yet.</div>}
                    {agents.map(a=>{
                      const on=customPicks.has(a.user_id);
                      const grp=lunchGroups.a.includes(a.agent_name)?'A':lunchGroups.b.includes(a.agent_name)?'B':null;
                      return(
                        <div key={a.user_id} onClick={()=>toggleCustom(a.user_id)} style={{
                          display:'flex',alignItems:'center',gap:8,padding:'7px 10px',borderRadius:8,cursor:'pointer',
                          background:on?'var(--amber-d)':'var(--card)',border:'1px solid',borderColor:on?'var(--amber-r)':'var(--bdr)',transition:'all .12s',
                        }}>
                          <input type="checkbox" readOnly checked={on} style={{accentColor:'var(--amber)',width:13,height:13,pointerEvents:'none',flexShrink:0}}/>
                          <div className="av" style={{width:22,height:22,fontSize:9,flexShrink:0}}>{ini(a.agent_name)}</div>
                          <span style={{fontSize:12,fontWeight:500,flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{a.agent_name}</span>
                          {grp&&<span className={`badge ${grp==='A'?'b-a':'b-b'}`} style={{fontSize:9,padding:'1px 6px'}}>{grp}</span>}
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}
            </div>

            {/* ── MESSAGE ── */}
            <div style={{background:'var(--surf)',border:'1px solid var(--bdr)',borderRadius:14,padding:'18px 20px'}}>
              <div style={{fontSize:11,fontWeight:700,color:'var(--mut)',letterSpacing:.5,textTransform:'uppercase',marginBottom:12}}>Message</div>
              <div style={{display:'flex',gap:8,marginBottom:16}}>
                <button onClick={()=>setMsgTab('presets')} className={msgTab==='presets'?'bp':'bs'} style={{fontSize:12,padding:'7px 16px'}}>Quick Presets</button>
                <button onClick={()=>setMsgTab('custom')}  className={msgTab==='custom'?'bp':'bs'}  style={{fontSize:12,padding:'7px 16px'}}>Custom Message</button>
              </div>

              {msgTab==='presets' && (
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
                  {PRESETS.map(p=>(
                    <button key={p.key} className="notif-preset" disabled={sending}
                      onClick={()=>doSend(p.title,p.body,p.iconCls,p.recipientHint!=='all'?p.recipientHint:null)}>
                      <div style={{display:'flex',alignItems:'center',gap:9,marginBottom:6}}>
                        <div className={`toast-ic ${p.iconCls}`} style={{width:28,height:28,borderRadius:7,flexShrink:0}}><Ic n={p.icon} size={13} sw={2}/></div>
                        <span className="notif-preset-title">{p.title}</span>
                      </div>
                      <div className="notif-preset-sub">{p.body}</div>
                      <div style={{marginTop:7,fontSize:10,color:'var(--mut)',fontWeight:600}}>
                        → {p.recipientHint==='group_a'?'Group A only':p.recipientHint==='group_b'?'Group B only':'selected recipients'}
                      </div>
                    </button>
                  ))}
                </div>
              )}

              {msgTab==='custom' && (
                <div style={{display:'flex',flexDirection:'column',gap:12}}>
                  <div className="fg" style={{marginBottom:0}}>
                    <label className="fl">Title</label>
                    <input className="fi" placeholder="e.g. System Update" value={customTitle} onChange={e=>setCustomTitle(e.target.value)} maxLength={80}/>
                  </div>
                  <div className="fg" style={{marginBottom:0}}>
                    <label className="fl">Message</label>
                    <textarea className="fi" rows={4} placeholder="Write your message here…" value={customBody} onChange={e=>setCustomBody(e.target.value)} maxLength={300} style={{resize:'vertical',minHeight:90}}/>
                  </div>
                  <div style={{display:'flex',alignItems:'center',gap:12}}>
                    <button className="bp" onClick={()=>doSend(customTitle,customBody,'custom')} disabled={sending||!customTitle.trim()}>
                      {sending?<span className="spin-sm"/>:<Ic n="send" size={14}/>} Send to {recipientLabel}
                    </button>
                    {sending&&<span style={{fontSize:12,color:'var(--mut)'}}>Sending…</span>}
                  </div>
                </div>
              )}
            </div>
          </div>

          {/* ══ RIGHT COLUMN — Sent Log ══ */}
          <div className="sc" style={{position:'sticky',top:16}}>
            <div className="sc-hd">
              <span className="sc-ic"><Ic n="bell" size={15}/></span>
              <h2 className="sc-t">Sent This Session</h2>
              <span style={{marginLeft:'auto',fontSize:10,color:'var(--mut)'}}>clears on refresh</span>
            </div>
            {sentLog.length===0
              ?<div className="es" style={{padding:'32px 20px'}}>
                  <span className="es-ic"><Ic n="bell" size={32} sw={1.2}/></span>
                  <p>Nothing sent yet</p>
                </div>
              :<div style={{padding:'10px 14px'}} className="notif-history">
                {sentLog.map(h=>(
                  <div key={h.id} className="notif-hist-item">
                    <div className={`notif-hist-ic toast-ic ${h.type}`} style={{width:26,height:26,borderRadius:7,flexShrink:0}}><Ic n="bell" size={11} sw={2}/></div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:12,fontWeight:700,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{h.title}</div>
                      <div style={{fontSize:11,color:'var(--mut)',marginTop:1,lineHeight:1.4,overflow:'hidden',display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical'}}>{h.body}</div>
                      <div style={{fontSize:10,color:'var(--mut)',marginTop:4}}>→ {h.to} · {h.time.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div>
                    </div>
                  </div>
                ))}
              </div>
            }
          </div>

        </div>
      )}
    </div>
  );
}

/* ── Admin Settings ── */
function ASettings(){
  const [maxB,setMaxB]=useState(3);
  const [lunchH,setLunchH]=useState(_lunchStart);
  const [busy,setBusy]=useState('');
  const [ok,setOk]=useState('');
  const [err,setErr]=useState('');
  const [needCol,setNeedCol]=useState(false);
  useEffect(()=>{
    run(SB.from('bt_settings').select('*').eq('id',1).maybeSingle())
      .then(({data,error})=>{
        if(error){setErr('Load: '+error.message);return;}
        if(data){ setMaxB(data.max_concurrent_breaks); if(data.lunch_start!=null) setLunchH(parseInt(data.lunch_start)); else setNeedCol(!('lunch_start' in data)); }
      });
  },[]);
  const flash=k=>{ setOk(k); setTimeout(()=>setOk(''),3000); };
  const saveMax=async()=>{
    setBusy('max');setErr('');
    const{error}=await run(SB.from('bt_settings').upsert({id:1,max_concurrent_breaks:maxB,updated_at:new Date().toISOString()},{onConflict:'id'}));
    setBusy(''); if(error){setErr('Save: '+error.message);return;} flash('max');
  };
  const saveLunch=async()=>{
    setBusy('lunch');setErr('');
    const{error}=await run(SB.from('bt_settings').update({lunch_start:lunchH,updated_at:new Date().toISOString()}).eq('id',1));
    setBusy('');
    if(error){ if(/lunch_start/.test(error.message||'')) setNeedCol(true); setErr('Save: '+error.message); return; }
    _lunchStart=lunchH; setNeedCol(false); flash('lunch');
    fireNotification({title:'Lunch times updated',body:`Lunch now runs ${fmtH(lunchH)}–${fmtH(lunchH+1)} and ${fmtH(lunchH+1)}–${fmtH(lunchH+2)}.`,type:'info',duration:5000});
  };
  const Saved=({k})=>ok===k?<span style={{color:'var(--green)',fontSize:14,display:'flex',alignItems:'center',gap:6}}><Ic n="check" size={15}/> Saved</span>:null;
  return(
    <div className="panel">
      <div className="phd"><div><h1 className="pt">Settings</h1><p className="ps">Team configuration</p></div></div>
      {err&&<div className="ebox"><Ic n="alert" size={14}/>{err}</div>}
      <div className="sblk">
        <h2 className="sh">Max concurrent breaks</h2>
        <p className="sd">How many agents can be on break at the same time. You can also change this from the Break slots card on Home.</p>
        <div className="num-wrap">
          <button className="nb" onClick={()=>setMaxB(n=>Math.max(0,n-1))}>−</button>
          <div className="nv">{maxB}</div>
          <button className="nb" onClick={()=>setMaxB(n=>n+1)}>+</button>
        </div>
        <p style={{fontSize:13.5,color:'var(--mut)',marginTop:12}}>Set to 0 to pause all breaks (e.g. during a peak-call window).</p>
        <div style={{marginTop:20,display:'flex',alignItems:'center',gap:12}}>
          <button className="bp" onClick={saveMax} disabled={!!busy}>{busy==='max'?<span className="spin-sm"/>:'Save'}</button>
          <Saved k="max"/>
        </div>
      </div>
      <div className="sblk">
        <h2 className="sh">Lunch start time</h2>
        <p className="sd">When the first lunch group leaves. The second group goes one hour later, and the groups swap order every day.</p>
        <div className="num-wrap">
          <button className="nb" onClick={()=>setLunchH(h=>Math.max(9,h-1))}>−</button>
          <div className="nv" style={{minWidth:110}}>{fmtH(lunchH)}</div>
          <button className="nb" onClick={()=>setLunchH(h=>Math.min(16,h+1))}>+</button>
        </div>
        <div className="sg2" style={{marginTop:20,marginBottom:0,maxWidth:520}}>
          <div className="stat"><div className="stl">First group</div><div className="stv" style={{fontSize:22,marginTop:0}}>{fmtH(lunchH)} – {fmtH(lunchH+1)}</div></div>
          <div className="stat"><div className="stl">Second group</div><div className="stv" style={{fontSize:22,marginTop:0}}>{fmtH(lunchH+1)} – {fmtH(lunchH+2)}</div></div>
        </div>
        {needCol&&(
          <div style={{marginTop:18}}>
            <p className="sd" style={{marginBottom:10}}>One-time setup: run this in the Supabase SQL Editor so the lunch time can be saved.</p>
            <div className="codebox"><b>ALTER TABLE</b> bt_settings <b>ADD COLUMN IF NOT EXISTS</b> lunch_start int <b>DEFAULT</b> 12;</div>
          </div>
        )}
        <div style={{marginTop:20,display:'flex',alignItems:'center',gap:12}}>
          <button className="bp" onClick={saveLunch} disabled={!!busy}>{busy==='lunch'?<span className="spin-sm"/>:'Save'}</button>
          <Saved k="lunch"/>
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   SHARED COMPONENTS
══════════════════════════════════════════════════════════════ */
function SC({n,label,val,ac,wn,ticker}){
  return(
    <div className={`stat${ac?' ac':''}${wn?' wn':''}`}>
      <div className="stat-hd"><div className="stic"><Ic n={n} size={16} sw={1.8}/></div></div>
      <div className="stv">{ticker?<TNum value={val}/>:val}</div>
      <div className="stl">{label}</div>
    </div>
  );
}
function AvC({name}){
  return <div className="fc g10"><div className="av">{ini(name)}</div><span>{name}</span></div>;
}
function BB({type}){
  if(!type)return null;
  return <span className={`badge ${BCLS[type]||'b-brk'}`}>{type}</span>;
}
function LiveClock(){
  const DAYS=['SUN','MON','TUE','WED','THU','FRI','SAT'];
  const [t,setT]=useState(new Date());
  useEffect(()=>{ const id=setInterval(()=>setT(new Date()),1000); return()=>clearInterval(id); },[]);
  const day=DAYS[t.getDay()],hrs=pad(t.getHours()),mins=pad(t.getMinutes()),secs=pad(t.getSeconds());
  return(
    <div className="live-clock">
      <div className="clk-seg"><div className="clk-day-val">{day}</div><div className="clk-unit">Day</div></div>
      <div className="clk-sep">:</div>
      <div className="clk-seg"><TNum className="clk-num" value={hrs}/><div className="clk-unit">Hours</div></div>
      <div className="clk-sep">:</div>
      <div className="clk-seg"><TNum className="clk-num" value={mins}/><div className="clk-unit">Minutes</div></div>
      <div className="clk-sep">:</div>
      <div className="clk-seg"><TNum className="clk-num" value={secs}/><div className="clk-unit">Seconds</div></div>
    </div>
  );
}
function LSec({start}){
  const [s,setS]=useState(Math.round((Date.now()-new Date(start).getTime())/1000));
  useEffect(()=>{ const id=setInterval(()=>setS(Math.round((Date.now()-new Date(start).getTime())/1000)),1000); return()=>clearInterval(id); },[start]);
  return <TNum className="mono act" value={tStr(Math.max(0,s))}/>;
}
function LType({start}){
  const [s,setS]=useState(Math.round((Date.now()-new Date(start).getTime())/1000));
  useEffect(()=>{ const id=setInterval(()=>setS(Math.round((Date.now()-new Date(start).getTime())/1000)),5000); return()=>clearInterval(id); },[start]);
  return <BB type={bType(s)}/>;
}
function LT({logs,showDate}){
  return(
    <div className="tbl-wrap"><table className="dt">
      <thead><tr><th>Agent</th>{showDate&&<th>Date</th>}<th>Start</th><th>Return</th><th>Duration</th><th>Type</th></tr></thead>
      <tbody>
        {logs.map(l=>(
          <tr key={l.id}>
            <td><AvC name={l.agent_name}/></td>
            {showDate&&<td style={{color:'var(--mut)',fontSize:12}}>{fmtD(l.start_time)}</td>}
            <td>{fmtT(l.start_time)}</td>
            <td>{l.end_time?fmtT(l.end_time):<span className="badge b-on">On Break</span>}</td>
            <td>{l.duration_secs!=null?durStr(l.duration_secs):l.end_time?'—':<LSec start={l.start_time}/>}</td>
            <td>{l.break_type?<BB type={l.break_type}/>:l.end_time?'—':<LType start={l.start_time}/>}</td>
          </tr>
        ))}
      </tbody>
    </table></div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
