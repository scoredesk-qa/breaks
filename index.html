<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>BreakTrack</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d0d0d'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%233ECF8E' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2' fill='%233ECF8E'/%3E%3Cline x1='16' y1='16' x2='16' y2='8' stroke='%233ECF8E' stroke-width='2' stroke-linecap='round'/%3E%3Cline x1='16' y1='16' x2='21' y2='19' stroke='%233ECF8E' stroke-width='2' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='6' r='1' fill='%233ECF8E'/%3E%3Ccircle cx='16' cy='26' r='1' fill='%233ECF8E'/%3E%3Ccircle cx='6' cy='16' r='1' fill='%233ECF8E'/%3E%3Ccircle cx='26' cy='16' r='1' fill='%233ECF8E'/%3E%3C/svg%3E"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.7/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.52.1/dist/umd/supabase.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0d0d;--surf:#141414;--card:#1a1a1a;--bdr:#252525;
  --acc:#3ECF8E;--acc-d:rgba(62,207,142,.10);--acc-r:rgba(62,207,142,.20);
  --txt:#ededed;--mut:#666;--dan:#f05252;--wrn:#eab308;
  --dan-d:rgba(240,82,82,.10);--wrn-d:rgba(234,179,8,.10);
  --purp:#a78bfa;--purp-d:rgba(167,139,250,.10);--purp-r:rgba(167,139,250,.25);
  --font:'Manrope',sans-serif;
}
html,body,#root{height:100%;background:var(--bg);color:var(--txt);font-family:var(--font);font-size:14px}
.spl{display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:16px}
.spin{width:28px;height:28px;border:2.5px solid var(--bdr);border-top-color:var(--acc);border-radius:50%;animation:rot .7s linear infinite}
.spin-sm{width:14px;height:14px;border:2px solid rgba(0,0,0,.2);border-top-color:#000;border-radius:50%;animation:rot .7s linear infinite;display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}
.auth-bg{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse 60% 40% at 50% 0%,rgba(62,207,142,.06) 0%,transparent 70%)}
.auth-card{background:var(--surf);border:1px solid var(--bdr);border-radius:16px;padding:40px 36px;width:100%;max-width:400px;box-shadow:0 32px 80px rgba(0,0,0,.6)}
.auth-logo{display:flex;align-items:center;gap:10px;margin-bottom:28px}
.auth-h{font-size:22px;font-weight:800;letter-spacing:-.5px;margin-bottom:6px}
.auth-s{color:var(--mut);font-size:13px;margin-bottom:28px;line-height:1.6}
.lm{background:var(--acc);color:#000;border-radius:8px;display:flex;align-items:center;justify-content:center;width:30px;height:30px;flex-shrink:0}
.lm.sm{width:24px;height:24px;border-radius:6px}
.lt{font-size:16px;font-weight:800;letter-spacing:-.3px}
.fg{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.fl{font-size:11px;font-weight:700;color:var(--mut);letter-spacing:.5px;text-transform:uppercase}
.fi{background:var(--card);border:1px solid var(--bdr);border-radius:8px;padding:10px 14px;color:var(--txt);font-size:14px;font-family:var(--font);outline:none;width:100%;transition:border .18s,box-shadow .18s}
.fi:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-r)}
.fi::placeholder{color:#2e2e2e}
.iw{position:relative}
.eb{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--mut);cursor:pointer;display:flex;padding:4px}
.eb:hover{color:var(--txt)}
.bp{background:var(--acc);color:#000;border:none;border-radius:8px;padding:10px 18px;font-size:14px;font-weight:700;font-family:var(--font);cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:opacity .15s,transform .12s;white-space:nowrap}
.bp:hover:not(:disabled){opacity:.88;transform:translateY(-1px)}
.bp:disabled{opacity:.4;cursor:not-allowed}
.bp.full{width:100%;justify-content:center;margin-top:4px}
.bs{background:var(--card);color:var(--txt);border:1px solid var(--bdr);border-radius:8px;padding:9px 16px;font-size:13px;font-weight:600;font-family:var(--font);cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:border-color .15s;white-space:nowrap}
.bs:hover{border-color:var(--acc)}
.ib{background:none;border:1px solid transparent;border-radius:6px;color:var(--mut);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:6px;transition:color .15s,background .15s}
.ib:hover{color:var(--txt);background:var(--card)}
.aerr{display:flex;align-items:center;gap:7px;color:var(--dan);font-size:13px;background:var(--dan-d);border:1px solid rgba(240,82,82,.2);border-radius:8px;padding:9px 12px;margin-bottom:12px}
.awrn{display:flex;align-items:center;gap:8px;color:var(--wrn);font-size:13px;background:var(--wrn-d);border:1px solid rgba(234,179,8,.25);border-radius:10px;padding:12px 16px;margin-bottom:16px;font-weight:600}
/* Agent */
.ag-root{min-height:100vh;display:flex;flex-direction:column}
.ag-hd{background:var(--surf);border-bottom:1px solid var(--bdr);padding:0 24px;height:54px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.ag-body{flex:1;max-width:720px;margin:0 auto;width:100%;padding:28px 20px;display:flex;flex-direction:column;gap:16px}
/* Clock card */
.clk-card{background:var(--surf);border:1px solid var(--bdr);border-radius:14px;padding:20px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.clk-info{display:flex;flex-direction:column;gap:4px}
.clk-title{font-size:13px;font-weight:700}
.clk-sub{font-size:12px;color:var(--mut)}
.clk-status{display:flex;align-items:center;gap:8px}
.clk-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.clk-dot.in{background:var(--acc);animation:pulse-a 2s ease-in-out infinite}
.clk-dot.out{background:var(--mut)}
@keyframes pulse-a{0%,100%{box-shadow:0 0 0 0 var(--acc-r)}50%{box-shadow:0 0 0 8px transparent}}
/* Lunch slot card (agent) */
.lunch-slot-card{border-radius:14px;padding:20px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.lunch-slot-card.grp-a{background:var(--acc-d);border:1.5px solid var(--acc-r)}
.lunch-slot-card.grp-b{background:var(--purp-d);border:1.5px solid var(--purp-r)}
.lunch-slot-card.unset{background:var(--card);border:1px dashed var(--bdr)}
.lunch-time{font-size:28px;font-weight:800;letter-spacing:-1px}
.lunch-time.grp-a{color:var(--acc)}
.lunch-time.grp-b{color:var(--purp)}
/* Break card */
.bcard{background:var(--surf);border:1px solid var(--bdr);border-radius:16px;overflow:hidden}
.bcard-top{padding:40px 32px 24px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.bcard-foot{border-top:1px solid var(--bdr);padding:18px 32px;display:flex;justify-content:center}
.pring{padding:14px;border-radius:50%;background:var(--card);border:2px solid var(--bdr);transition:all .3s}
.pring.on{background:var(--acc-d);border-color:var(--acc-r);animation:pulse-a 2s ease-in-out infinite}
.bic{color:var(--mut);display:flex;transition:color .3s}
.bic.on{color:var(--acc)}
.tbig{font-size:56px;font-weight:800;letter-spacing:-2px;color:var(--acc);font-variant-numeric:tabular-nums;line-height:1}
.tlbl{font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:2px}
.ttype{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px}
.tsince{font-size:12px;color:var(--mut)}
.idle-h{font-size:17px;font-weight:700}
.idle-s{font-size:13px;color:var(--mut)}
.btn-go{background:var(--acc);color:#000;border:none;border-radius:10px;padding:12px 36px;font-size:15px;font-weight:700;font-family:var(--font);cursor:pointer;display:flex;align-items:center;gap:8px;transition:opacity .15s,transform .12s}
.btn-go:hover{opacity:.88;transform:translateY(-1px)}
.btn-go:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-end{background:var(--dan-d);color:var(--dan);border:1px solid rgba(240,82,82,.25);border-radius:10px;padding:12px 36px;font-size:15px;font-weight:700;font-family:var(--font);cursor:pointer;display:flex;align-items:center;gap:8px;transition:all .15s}
.btn-end:hover{background:rgba(240,82,82,.18)}
/* Day bar */
.dbar{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.dst{background:var(--surf);border:1px solid var(--bdr);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:5px}
.dv{font-size:20px;font-weight:800;letter-spacing:-.5px}
.dl{font-size:11px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
/* Section card */
.sc{background:var(--surf);border:1px solid var(--bdr);border-radius:14px;overflow:hidden}
.sc-hd{padding:13px 18px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:8px}
.sc-t{font-size:13px;font-weight:700}
.sc-ic{color:var(--mut);display:flex}
.ldot{width:8px;height:8px;border-radius:50%;background:var(--acc);animation:pulse-a 1.5s ease-in-out infinite;flex-shrink:0}
/* Admin */
.adm{display:flex;min-height:100vh}
.sb{width:220px;min-height:100vh;background:var(--surf);border-right:1px solid var(--bdr);display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto}
.sb-logo{padding:18px 16px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:10px}
.sb-nav{flex:1;padding:10px 8px;display:flex;flex-direction:column;gap:2px}
.ni{background:none;border:none;border-radius:8px;padding:9px 12px;display:flex;align-items:center;gap:10px;color:var(--mut);font-size:13px;font-weight:600;font-family:var(--font);cursor:pointer;transition:background .15s,color .15s;text-align:left;width:100%}
.ni:hover{background:var(--card);color:var(--txt)}
.ni.on{background:var(--acc-d);color:var(--acc)}
.na{margin-left:auto;display:flex}
.sb-ft{padding:14px;border-top:1px solid var(--bdr);display:flex;align-items:center;gap:10px}
.sbu{flex:1;min-width:0}
.sbn{font-size:13px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbr{font-size:11px;color:var(--mut);display:block}
.adm-main{flex:1;min-width:0;overflow-x:auto}
/* Panel */
.panel{padding:28px}
.phd{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.pt{font-size:20px;font-weight:800;letter-spacing:-.4px}
.ps{font-size:13px;color:var(--mut);margin-top:3px}
.phr{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
/* Stats */
.sg4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.sg3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.sg2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px}
.stat{background:var(--surf);border:1px solid var(--bdr);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:8px}
.stat.ac{border-color:var(--acc-r);background:var(--acc-d)}
.stat.wn{border-color:rgba(234,179,8,.3);background:var(--wrn-d)}
.stic{color:var(--mut);display:flex}
.stat.ac .stic{color:var(--acc)}
.stat.wn .stic{color:var(--wrn)}
.stv{font-size:26px;font-weight:800;letter-spacing:-1px}
.stl{font-size:12px;color:var(--mut);font-weight:500}
/* Table */
.dt{width:100%;border-collapse:collapse;font-size:13.5px}
.dt th{text-align:left;padding:10px 16px;font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--bdr);white-space:nowrap}
.dt td{padding:11px 16px;border-bottom:1px solid #1c1c1c;vertical-align:middle}
.dt tbody tr:last-child td{border-bottom:none}
.dt tbody tr:hover td{background:rgba(255,255,255,.018)}
/* Avatar */
.av{width:28px;height:28px;border-radius:50%;background:var(--acc-d);color:var(--acc);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid var(--acc-r)}
.hdn{font-size:13px;font-weight:600;color:var(--mut)}
.fc{display:flex;align-items:center}
.g4{gap:4px}.g6{gap:6px}.g8{gap:8px}.g10{gap:10px}
.es{padding:40px 20px;text-align:center;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:10px;font-size:13px}
.es-ic{opacity:.2;display:flex}
.mono{font-family:'Courier New',monospace}
.act{color:var(--acc)}
.si{background:var(--card);border:1px solid var(--bdr);border-radius:8px;padding:8px 14px;color:var(--txt);font-size:13px;font-family:var(--font);outline:none;width:180px;transition:border .18s}
.si:focus{border-color:var(--acc)}
.si::placeholder{color:#2e2e2e}
/* Badges */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px}
.b-on{background:#2b1e00;color:#eab308;border:1px solid #3d2e00}
.b-done{background:#0f2b1e;color:#3ECF8E;border:1px solid #1a4030}
.b-lunch{background:#1a0d2b;color:#a78bfa;border:1px solid #2d1a4a}
.b-bath{background:#0d1f2b;color:#67e8f9;border:1px solid #1a3540}
.b-brk{background:#1e1f0d;color:#86efac;border:1px solid #2b3016}
.b-in{background:#0f2b1e;color:#3ECF8E;border:1px solid #1a4030}
.b-out{background:var(--card);color:var(--mut);border:1px solid var(--bdr)}
.b-a{background:var(--acc-d);color:var(--acc);border:1px solid var(--acc-r)}
.b-b{background:var(--purp-d);color:var(--purp);border:1px solid var(--purp-r)}
/* Settings */
.sblk{background:var(--surf);border:1px solid var(--bdr);border-radius:14px;padding:24px;margin-bottom:16px}
.sh{font-size:15px;font-weight:700;margin-bottom:8px}
.sd{font-size:13px;color:var(--mut);margin-bottom:16px;line-height:1.6}
.num-wrap{display:flex;align-items:center;gap:12px}
.nb{width:36px;height:36px;background:var(--card);border:1px solid var(--bdr);border-radius:8px;color:var(--txt);font-size:22px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color .15s;line-height:1;font-family:var(--font)}
.nb:hover{border-color:var(--acc);color:var(--acc)}
.nv{font-size:32px;font-weight:800;color:var(--acc);min-width:50px;text-align:center}
/* RT pill */
.rtp{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--acc);background:var(--acc-d);border:1px solid var(--acc-r);border-radius:20px;padding:3px 10px}
.rtd{width:6px;height:6px;border-radius:50%;background:var(--acc);animation:pulse-a 1.2s ease-in-out infinite}
/* Error box */
.ebox{background:var(--dan-d);border:1px solid rgba(240,82,82,.25);border-radius:10px;padding:14px 18px;color:var(--dan);font-size:13px;line-height:1.6;margin-bottom:16px;display:flex;align-items:flex-start;gap:8px}
/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;backdrop-filter:blur(4px)}
.modal-box{background:var(--surf);border:1px solid var(--bdr);border-radius:16px;padding:28px 32px;width:100%;max-width:420px;box-shadow:0 32px 80px rgba(0,0,0,.7);animation:mslide .2s ease}
@keyframes mslide{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.modal-title{font-size:17px;font-weight:800;margin-bottom:8px}
.modal-sub{font-size:13px;color:var(--mut);margin-bottom:24px;line-height:1.6}
.modal-foot{display:flex;justify-content:flex-end;gap:10px}
/* Toast notifications */
.toast-container{position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:10px;pointer-events:none;max-width:360px}
.toast{background:var(--surf);border:1px solid var(--bdr);border-radius:14px;padding:14px 16px;display:flex;align-items:flex-start;gap:12px;box-shadow:0 12px 40px rgba(0,0,0,.7);pointer-events:all;animation:toast-in .25s cubic-bezier(.16,1,.3,1);min-width:280px;position:relative;overflow:hidden}
.toast.leaving{animation:toast-out .22s ease forwards}
@keyframes toast-in{from{transform:translateX(110%);opacity:0}to{transform:none;opacity:1}}
@keyframes toast-out{from{transform:none;opacity:1}to{transform:translateX(110%);opacity:0}}
.toast-ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.toast-ic.lunch{background:var(--acc-d);color:var(--acc)}
.toast-ic.break{background:var(--purp-d);color:var(--purp)}
.toast-ic.info{background:#0f2b1e;color:#3ECF8E}
.toast-ic.warn{background:var(--wrn-d);color:var(--wrn)}
.toast-ic.custom{background:#1a1030;color:#a78bfa}
.toast-title{font-size:13px;font-weight:700;margin-bottom:2px}
.toast-body{font-size:12px;color:var(--mut);line-height:1.5}
.toast-close{margin-left:auto;background:none;border:none;color:var(--mut);cursor:pointer;padding:2px 0 2px 8px;display:flex;flex-shrink:0}
.toast-close:hover{color:var(--txt)}
.toast-bar{position:absolute;bottom:0;left:0;height:3px;border-radius:0 0 14px 14px;background:var(--acc)}
/* Notification panel */
.notif-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
@media(max-width:700px){.notif-grid{grid-template-columns:1fr}}
.notif-preset{background:var(--surf);border:1px solid var(--bdr);border-radius:12px;padding:16px;cursor:pointer;transition:border-color .15s,background .15s;text-align:left;font-family:var(--font);display:flex;flex-direction:column;gap:6px;width:100%}
.notif-preset:hover{border-color:var(--acc);background:var(--acc-d)}
.notif-preset-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:4px}
.notif-preset-title{font-size:13px;font-weight:700;color:var(--txt)}
.notif-preset-sub{font-size:11px;color:var(--mut);line-height:1.4}
.agent-check-list{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow-y:auto}
.agent-check-item{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--card);border:1px solid var(--bdr);border-radius:8px;cursor:pointer;transition:border-color .15s}
.agent-check-item:hover{border-color:var(--acc)}
.agent-check-item input[type=checkbox]{accent-color:var(--acc);width:15px;height:15px;cursor:pointer;flex-shrink:0}
.notif-history{display:flex;flex-direction:column;gap:8px;max-height:320px;overflow-y:auto}
.notif-hist-item{background:var(--card);border:1px solid var(--bdr);border-radius:10px;padding:12px 14px;display:flex;align-items:flex-start;gap:10px}
.notif-hist-ic{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
/* Action buttons */
.btn-remote{background:var(--acc-d);color:var(--acc);border:1px solid var(--acc-r);border-radius:6px;padding:5px 12px;font-size:12px;font-weight:700;font-family:var(--font);cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:background .15s}
.btn-remote:hover{background:var(--acc);color:#000}
.btn-remote:disabled{opacity:.4;cursor:not-allowed}
.btn-edit{background:none;border:1px solid var(--bdr);border-radius:6px;color:var(--mut);padding:4px 10px;font-size:11px;font-weight:700;font-family:var(--font);cursor:pointer;display:inline-flex;align-items:center;gap:4px;transition:all .15s}
.btn-edit:hover{border-color:var(--acc);color:var(--acc)}
.type-sel{background:var(--card);border:1px solid var(--acc-r);border-radius:6px;padding:4px 8px;color:var(--txt);font-size:12px;font-weight:600;font-family:var(--font);outline:none;cursor:pointer}
/* Swap request cards */

/* ── Helpers ── */

/* ══════════════════════════════════════════════════════════════
   TOAST / NOTIFICATION SYSTEM
══════════════════════════════════════════════════════════════ */

/* ── Web Audio notification sounds ── */
let _audioCtx = null;
function getAudioCtx() {
  if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return _audioCtx;
}
function playNotifSound(type = 'info') {
  try {
    const ctx = getAudioCtx();
    if (ctx.state === 'suspended') ctx.resume();
    const presets = {
      lunch:  [{ f:660, t:0,    d:0.12, g:0.5 }, { f:880, t:0.13, d:0.12, g:0.5 }, { f:1100, t:0.26, d:0.2, g:0.6 }],
      break:  [{ f:520, t:0,    d:0.15, g:0.4 }, { f:660, t:0.18, d:0.2,  g:0.4 }],
      warn:   [{ f:440, t:0,    d:0.1,  g:0.5 }, { f:340, t:0.13, d:0.1,  g:0.5 }, { f:440, t:0.26, d:0.15, g:0.5 }],
      info:   [{ f:600, t:0,    d:0.1,  g:0.3 }, { f:800, t:0.12, d:0.15, g:0.3 }],
      custom: [{ f:500, t:0,    d:0.1,  g:0.35}, { f:700, t:0.13, d:0.1,  g:0.35}, { f:900, t:0.26, d:0.2, g:0.4 }],
    };
    const notes = presets[type] || presets.info;
    const now = ctx.currentTime;
    notes.forEach(({ f, t, d, g }) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(f, now + t);
      gain.gain.setValueAtTime(0, now + t);
      gain.gain.linearRampToValueAtTime(g, now + t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, now + t + d);
      osc.start(now + t);
      osc.stop(now + t + d + 0.01);
    });
  } catch(e) { /* audio blocked — silent fail */ }
}

/* ── Global toast emitter — works without React context ── */
const _toastListeners = [];
const toastEmit = (toast) => _toastListeners.forEach(fn => fn(toast));

function useToastEmitter(addToast) {
  useEffect(() => {
    _toastListeners.push(addToast);
    return () => { const i = _toastListeners.indexOf(addToast); if(i>-1)_toastListeners.splice(i,1); };
  }, [addToast]);
}

/* ── Master fire function: in-app toast + OS desktop notification + sound ── */
function fireNotification({ title, body, type = 'info', duration = 7000 }) {
  playNotifSound(type);
  toastEmit({ id: Date.now() + Math.random(), title, body, type, duration });
  if ('Notification' in window) {
    const show = () => new Notification(title, { body, tag: type + '-' + Date.now() });
    if (Notification.permission === 'granted') show();
    else if (Notification.permission !== 'denied') Notification.requestPermission().then(p => { if(p==='granted') show(); });
  }
}

/* ── Toast Container ── */
function ToastContainer() {
  const [toasts, setToasts] = useState([]);
  const addToast = useCallback((t) => {
    setToasts(p => [...p, { ...t, leaving: false }]);
    setTimeout(() => {
      setToasts(p => p.map(x => x.id === t.id ? { ...x, leaving: true } : x));
      setTimeout(() => setToasts(p => p.filter(x => x.id !== t.id)), 260);
    }, t.duration || 7000);
  }, []);
  useToastEmitter(addToast);
  const dismiss = (id) => {
    setToasts(p => p.map(x => x.id === id ? { ...x, leaving: true } : x));
    setTimeout(() => setToasts(p => p.filter(x => x.id !== id)), 260);
  };
  const typeIcon = { lunch:'utensils', break:'coffee', info:'bell', warn:'alert', custom:'zap' };
  return (
    <div className="toast-container">
      {toasts.map(t => (
        <div key={t.id} className={`toast${t.leaving?' leaving':''}`}>
          <div className={`toast-ic ${t.type}`}><Ic n={typeIcon[t.type]||'bell'} size={16} sw={2}/></div>
          <div style={{flex:1,minWidth:0}}>
            <div className="toast-title">{t.title}</div>
            <div className="toast-body">{t.body}</div>
          </div>
          <button className="toast-close" onClick={()=>dismiss(t.id)}><Ic n="x" size={14}/></button>
          <div className="toast-bar" style={{animationDuration:`${t.duration||7000}ms`}}/>
        </div>
      ))}
    </div>
  );
}

/* ── Request OS permission early ── */
function useNotifPermission() {
  useEffect(() => {
    if ('Notification' in window && Notification.permission === 'default') {
      const t = setTimeout(() => Notification.requestPermission(), 2500);
      return () => clearTimeout(t);
    }
  }, []);
}

/* ══════════════════════════════════════════════════════════════
   SUPABASE REALTIME BROADCAST CHANNEL
   Admins publish to 'bt_broadcast'; agents receive.
   Nothing is written to the database.
══════════════════════════════════════════════════════════════ */
const BROADCAST_CHANNEL = 'bt_broadcast';
const BROADCAST_EVENT   = 'notif';
const SWAP_CHANNEL      = 'bt_swap';
const SWAP_EVENT        = 'swap_request';

/* Publish a notification to all agents (or a specific user_id) via Supabase Realtime broadcast */
async function broadcastNotif({ title, body, type = 'custom', targetUserId = null, lunchGroup = null }) {
  const ch = SB.channel(BROADCAST_CHANNEL);
  await new Promise(res => {
    ch.subscribe(status => { if(status === 'SUBSCRIBED') res(); });
  });
  await ch.send({ type:'broadcast', event: BROADCAST_EVENT, payload:{ title, body, type, targetUserId, lunchGroup } });
  SB.removeChannel(ch);
}

/* ── Broadcast a swap request/response via Realtime ── */
async function broadcastSwap(payload) {
  const ch = SB.channel(SWAP_CHANNEL);
  await new Promise(res => { ch.subscribe(s => { if(s==='SUBSCRIBED') res(); }); });
  await ch.send({ type:'broadcast', event: SWAP_EVENT, payload });
  SB.removeChannel(ch);
}

/* ── Persist swap request to DB ── */
async function createSwapRequest({ fromUserId, fromName, toUserId, toName, fromGroup, toGroup, date }) {
  const { data, error } = await run(
    SB.from('bt_swap_requests').insert({
      from_user_id: fromUserId, from_name: fromName,
      to_user_id: toUserId,   to_name: toName,
      from_group: fromGroup,  to_group: toGroup,
      date, status: 'pending',
      created_at: new Date().toISOString(),
    }).select().single()
  );
  return { data, error };
}

/* ── Agent: listen for incoming swap requests/responses ── */
function useSwapListener(userId, onRequest) {
  useEffect(() => {
    const ch = SB.channel(SWAP_CHANNEL + '-' + userId)
      .on('broadcast', { event: SWAP_EVENT }, ({ payload }) => {
        if (payload.toUserId === userId || payload.fromUserId === userId) {
          onRequest(payload);
        }
      })
      .subscribe();
    return () => SB.removeChannel(ch);
  }, [userId]);
}

/* ── Agent: listen for broadcast notifications ── */
/* lunchInfo is passed in so we can filter lunch broadcasts to the right group */
function useAgentNotifListener(userId, lunchInfo) {
  useEffect(() => {
    const ch = SB.channel(BROADCAST_CHANNEL)
      .on('broadcast', { event: BROADCAST_EVENT }, ({ payload }) => {
        // Filter by specific user if targeted
        if (payload.targetUserId && payload.targetUserId !== userId) return;
        // Filter lunch broadcasts: only show if agent is in the notified group
        if (payload.lunchGroup) {
          const myGroup = lunchInfo?.group || null;
          if (!myGroup || myGroup !== payload.lunchGroup) return;
        }
        fireNotification({ title: payload.title, body: payload.body, type: payload.type || 'custom', duration: 9000 });
      })
      .subscribe();
    return () => SB.removeChannel(ch);
  }, [userId, lunchInfo?.group]);
}

/* ══════════════════════════════════════════════════════════════
   LUNCH REMINDER HOOKS
══════════════════════════════════════════════════════════════ */

/* Agent: 5-min personal reminder based on their own lunch slot */
function useLunchReminder(lunchInfo) {
  const firedRef = useRef(new Set());
  useEffect(() => {
    if (!lunchInfo?.group || !lunchInfo?.slot) return;
    const check = () => {
      const nowUTC = Date.now();
      const nowDate = new Date(nowUTC);
      const [h, m] = lunchInfo.slot.from.split(':').map(Number);
      // Casablanca is UTC+1 → subtract 1 hour for UTC
      const lunchUTC = Date.UTC(
        nowDate.getUTCFullYear(),
        nowDate.getUTCMonth(),
        nowDate.getUTCDate(),
        h - 1,
        m,
        0,
        0
      );
      const diff = (lunchUTC - nowUTC) / 60000;
      const key = `${nowDate.toISOString().slice(0,10)}-${lunchInfo.slot.from}-${lunchInfo.group}`;
      if (diff > 0 && diff <= 5 && !firedRef.current.has(key)) {
        firedRef.current.add(key);
        fireNotification({
          title: `🍽️ Lunch in ${Math.ceil(diff)} min!`,
          body: `Group ${lunchInfo.group} — your lunch starts at ${lunchInfo.slot.from}. Get ready!`,
          type: 'lunch',
          duration: 10000,
        });
      }
    };
    check();
    const id = setInterval(check, 20000);
    return () => clearInterval(id);
  }, [lunchInfo]);
}

/* Admin: automated broadcast to ALL agents at the exact scheduled lunch times.
   Reads today's lunch schedule from Supabase once per minute and fires broadcasts
   at configured alert times (default 5 min before each group's slot). */
function useAdminLunchBroadcast(alertMinutes = 5) {
  const firedRef = useRef(new Set());
  useEffect(() => {
    const check = async () => {
      const today = todayISO();
      const { data: ls } = await run(
        SB.from('bt_lunch_schedule').select('*').eq('date', today).maybeSingle()
      );
      if (!ls) return;
      const first = ls.group_first || defaultFirst(today);
      const slots = lunchSlots(first);
      const nowUTC = Date.now();
      const nowDate = new Date(nowUTC);
      ['A', 'B'].forEach(grp => {
        const [h, m] = slots[grp].from.split(':').map(Number);
        const lunchUTC = Date.UTC(
          nowDate.getUTCFullYear(),
          nowDate.getUTCMonth(),
          nowDate.getUTCDate(),
          h - 1,
          m,
          0,
          0
        );
        const diff = (lunchUTC - nowUTC) / 60000;
        const key = `auto-${grp}-${slots[grp].from}-${today}`;
        if (diff > 0 && diff <= alertMinutes && !firedRef.current.has(key)) {
          firedRef.current.add(key);
          const mins = Math.ceil(diff);
          broadcastNotif({
            title: `🍽️ Group ${grp} Lunch in ${mins} min`,
            body: `Group ${grp}: your lunch break starts at ${slots[grp].from}. Please get ready to head out!`,
            type: 'lunch',
            lunchGroup: grp,
          });
        }
      });
    };
    check();
    const id = setInterval(check, 30000);
    return () => clearInterval(id);
  }, [alertMinutes]);
}

/* ══════════════════════════════════════════════════════════════
   AGENT
══════════════════════════════════════════════════════════════ */
function AgentApp({user,name,onLogout}){
  const [clockRow,  setClockRow]  = useState(null);
  const [active,    setActive]    = useState(null);
  const [logs,      setLogs]      = useState([]);
  const [elapsed,   setElapsed]   = useState(0);
  const [maxB,      setMaxB]      = useState(3);
  const [teamCount, setTeamCount] = useState(0);
  const [loading,   setLoading]   = useState(true);
  const [err,       setErr]       = useState('');
  const [lunchInfo, setLunchInfo] = useState(null); // {group:'A'|'B', slot:{from,to}}
  // Swap request state
  const [incomingSwaps, setIncomingSwaps] = useState([]); // pending requests TO this agent
  const [outgoingSwap,  setOutgoingSwap]  = useState(null); // request FROM this agent (pending)
  const [showSwapModal, setShowSwapModal] = useState(false);
  const [swapBusy,      setSwapBusy]      = useState(false);
  const timerRef = useRef(null);
  const outgoingSwapRef = useRef(null);
  useEffect(()=>{ outgoingSwapRef.current = outgoingSwap; },[outgoingSwap]);
  const today = todayISO();

  // Notification hooks
  useLunchReminder(lunchInfo);
  useAgentNotifListener(user.id, lunchInfo);

  // Swap listener — receives broadcast events for immediate response UX
  useSwapListener(user.id, useCallback((payload) => {
    if (payload.action === 'request' && payload.toUserId === user.id) {
      // New incoming request — the postgres_changes sub will also catch it, but toast here for immediacy
      fireNotification({ title: '🔄 Lunch Swap Request', body: `${payload.fromName} wants to swap lunch groups with you.`, type: 'custom', duration: 15000 });
    }
    if (payload.action === 'accepted' && payload.fromUserId === user.id) {
      // Our request was accepted — update outgoing swap and reload lunch
      setOutgoingSwap(null);
      fireNotification({ title: '✅ Swap Accepted!', body: `${payload.toName} accepted. Your lunch group has been updated.`, type: 'info', duration: 10000 });
      // Fetch fresh lunch schedule from DB
      run(SB.from('bt_lunch_schedule').select('*').eq('date',today).maybeSingle()).then(({data:ls})=>{
        if(!ls) return;
        const grpA=ls.group_a||[]; const grpB=ls.group_b||[];
        const myGrp=grpA.includes(name)?'A':grpB.includes(name)?'B':null;
        const first=ls.group_first||defaultFirst(today); const slots=lunchSlots(first);
        if(myGrp) setLunchInfo({group:myGrp,slot:slots[myGrp],allA:grpA,allB:grpB,first,slots});
        else setLunchInfo({group:null,allA:grpA,allB:grpB});
      });
    }
    if (payload.action === 'declined' && payload.fromUserId === user.id) {
      setOutgoingSwap(null);
      fireNotification({ title: '❌ Swap Declined', body: `${payload.toName} declined your swap request.`, type: 'warn', duration: 8000 });
    }
  }, [user.id, today, name]));

  const load = useCallback(async()=>{
    setLoading(true); setErr('');
    const {data:cr} = await run(SB.from('bt_clocklogs').select('*').eq('user_id',user.id).eq('date',today).maybeSingle());
    setClockRow(cr||null);
    const {data:bl,error:e2} = await run(SB.from('bt_logs').select('*').eq('user_id',user.id).gte('start_time',today+'T00:00:00.000Z').order('start_time',{ascending:false}));
    if(e2){setErr(e2.message);setLoading(false);return;}
    setLogs(bl||[]);
    const openBreak = (bl||[]).find(l=>!l.end_time);
    setActive(openBreak||null);
    const {data:cfg} = await run(SB.from('bt_settings').select('max_concurrent_breaks').eq('id',1).maybeSingle());
    if(cfg) setMaxB(cfg.max_concurrent_breaks);
    const {data:tc} = await run(SB.from('bt_logs').select('id').is('end_time',null));
    setTeamCount((tc||[]).length);
    // Lunch schedule
    const {data:ls} = await run(SB.from('bt_lunch_schedule').select('*').eq('date',today).maybeSingle());
    if(ls){
      const grpA = ls.group_a || [];
      const grpB = ls.group_b || [];
      const myGrp = grpA.includes(name) ? 'A' : grpB.includes(name) ? 'B' : null;
      if(myGrp){
        const first = ls.group_first || defaultFirst(today);
        const slots = lunchSlots(first);
        setLunchInfo({group:myGrp, slot:slots[myGrp], allA:grpA, allB:grpB, first, slots});
      } else {
        setLunchInfo({group:null, allA:grpA, allB:grpB});
      }
    } else {
      // No DB row for today yet — use default rotation so agents still see their group
      const first = defaultFirst(today);
      const slots = lunchSlots(first);
      setLunchInfo({ group: null, allA: [], allB: [], first, slots, isDefault: true });
    }
    // Load any pending outgoing swap requests
    const {data:mySwaps} = await run(SB.from('bt_swap_requests').select('*').eq('from_user_id',user.id).eq('date',today).eq('status','pending').order('created_at',{ascending:false}).limit(1));
    if(mySwaps&&mySwaps.length>0) setOutgoingSwap(mySwaps[0]);
    else setOutgoingSwap(null);
    // Load pending incoming swap requests
    const {data:incoming} = await run(SB.from('bt_swap_requests').select('*').eq('to_user_id',user.id).eq('date',today).eq('status','pending').order('created_at',{ascending:false}));
    setIncomingSwaps(incoming||[]);
    setLoading(false);
  },[user.id,today,name]);

  useEffect(()=>{ load(); },[load]);

  // Real-time: break logs
  useEffect(()=>{
    const ch = SB.channel('agent-rt-'+user.id)
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'bt_logs'},({new:nw})=>{
        if(nw.user_id!==user.id) setTeamCount(c=>c+1);
        else setLogs(p=>p.some(l=>l.id===nw.id)?p:[nw,...p]);
      })
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'bt_logs'},({new:nw})=>{
        if(nw.user_id!==user.id){ if(nw.end_time) setTeamCount(c=>Math.max(0,c-1)); }
        else setLogs(p=>p.map(l=>l.id===nw.id?nw:l));
      })
      .subscribe();
    return()=>SB.removeChannel(ch);
  },[user.id]);

  // Real-time: lunch schedule — call load() on any change so we always get fresh data
  // (REPLICA IDENTITY may not be FULL on this table, so we don't trust the payload)
  useEffect(()=>{
    // Helper: apply fetched schedule to agent state
    const applySchedule = (ls) => {
      if(!ls){
        const first = defaultFirst(today); const slots = lunchSlots(first);
        setLunchInfo(prev => prev?.group ? prev : { group:null, allA:[], allB:[], first, slots, isDefault:true });
        return;
      }
      const grpA = ls.group_a || []; const grpB = ls.group_b || [];
      const myGrp = grpA.includes(name) ? 'A' : grpB.includes(name) ? 'B' : null;
      const first = ls.group_first || defaultFirst(today); const slots = lunchSlots(first);
      if(myGrp) setLunchInfo({group:myGrp, slot:slots[myGrp], allA:grpA, allB:grpB, first, slots});
      else setLunchInfo({group:null, allA:grpA, allB:grpB, first, slots});
    };
    const fetchAndApply = () =>
      run(SB.from('bt_lunch_schedule').select('*').eq('date',today).maybeSingle()).then(({data})=>applySchedule(data));

    const ch = SB.channel('agent-lunch-rt-'+user.id)
      .on('postgres_changes',{event:'*',schema:'public',table:'bt_lunch_schedule'},()=>{
        // Always re-fetch rather than trusting payload (REPLICA IDENTITY may not be FULL)
        fetchAndApply();
      })
      // Re-fetch on reconnect so agents who were offline catch up immediately
      .subscribe(status => { if(status === 'SUBSCRIBED') fetchAndApply(); });
    return()=>SB.removeChannel(ch);
  },[user.id,today,name]);

  // Real-time: swap requests — re-fetch on any change, fire toast for new incoming
  useEffect(()=>{
    const ch = SB.channel('agent-swaps-rt-'+user.id)
      .on('postgres_changes',{event:'*',schema:'public',table:'bt_swap_requests'},async({eventType,new:nw})=>{
        // Re-fetch pending incoming swaps
        const {data:incoming} = await run(SB.from('bt_swap_requests').select('*').eq('to_user_id',user.id).eq('date',today).eq('status','pending').order('created_at',{ascending:false}));
        setIncomingSwaps(prev => {
          const newList = incoming||[];
          // Fire toast for brand-new incoming requests
          newList.forEach(sr => { if(!prev.some(p=>p.id===sr.id)) {
            fireNotification({ title:'🔄 Lunch Swap Request', body:`${sr.from_name} wants to swap lunch groups with you.`, type:'custom', duration:15000 });
          }});
          return newList;
        });
        // Re-fetch outgoing
        const {data:mySwaps} = await run(SB.from('bt_swap_requests').select('*').eq('from_user_id',user.id).eq('date',today).eq('status','pending').order('created_at',{ascending:false}).limit(1));
        const hadOutgoing = !!outgoingSwapRef.current;
        const newOutgoing = (mySwaps&&mySwaps.length>0) ? mySwaps[0] : null;
        setOutgoingSwap(newOutgoing);
        // If our outgoing just got accepted, reload lunch info
        if(hadOutgoing && !newOutgoing && nw?.from_user_id===user.id && nw?.status==='accepted') {
          fireNotification({ title:'✅ Swap Accepted!', body:`Your lunch group has been updated.`, type:'info', duration:10000 });
          run(SB.from('bt_lunch_schedule').select('*').eq('date',today).maybeSingle()).then(({data:ls})=>{
            if(!ls) return;
            const grpA=ls.group_a||[]; const grpB=ls.group_b||[];
            const myGrp=grpA.includes(name)?'A':grpB.includes(name)?'B':null;
            const first=ls.group_first||defaultFirst(today); const slots=lunchSlots(first);
            if(myGrp) setLunchInfo({group:myGrp,slot:slots[myGrp],allA:grpA,allB:grpB,first,slots});
          });
        }
        if(hadOutgoing && !newOutgoing && nw?.from_user_id===user.id && nw?.status==='declined') {
          fireNotification({ title:'❌ Swap Declined', body:`Your swap request was declined.`, type:'warn', duration:8000 });
        }
      })
      .subscribe();
    return()=>SB.removeChannel(ch);
  },[user.id,today,name]);

  useEffect(()=>{
    // Poll team break count every 15s
    const id=setInterval(async()=>{
      const {data}=await run(SB.from('bt_logs').select('id').is('end_time',null));
      setTeamCount((data||[]).length);
    },15000);
    // Poll lunch schedule every 30s as a safety net — catches changes that slip past
    // the realtime subscription (e.g. direct Supabase edits, brief network drops)
    const applyLunchData = (ls) => {
      if(!ls){
        const first=defaultFirst(today); const slots=lunchSlots(first);
        setLunchInfo(prev => prev?.group ? prev : { group:null, allA:[], allB:[], first, slots, isDefault:true });
        return;
      }
      const grpA=ls.group_a||[]; const grpB=ls.group_b||[];
      const myGrp=grpA.includes(name)?'A':grpB.includes(name)?'B':null;
      const first=ls.group_first||defaultFirst(today); const slots=lunchSlots(first);
      if(myGrp) setLunchInfo({group:myGrp,slot:slots[myGrp],allA:grpA,allB:grpB,first,slots});
      else setLunchInfo({group:null,allA:grpA,allB:grpB,first,slots});
    };
    const lunchPoll=setInterval(async()=>{
      const {data:ls}=await run(SB.from('bt_lunch_schedule').select('*').eq('date',today).maybeSingle());
      applyLunchData(ls);
    },30000);
    return()=>{ clearInterval(id); clearInterval(lunchPoll); };
  },[today,name]);

  useEffect(()=>{
    if(active){ const s=new Date(active.start_time).getTime(); timerRef.current=setInterval(()=>setElapsed(Date.now()-s),250); }
    else{ clearInterval(timerRef.current); setElapsed(0); }
    return()=>clearInterval(timerRef.current);
  },[active]);

  const clockIn = async()=>{
    setErr('');
    const now=new Date().toISOString();
    const {data,error}=await run(SB.from('bt_clocklogs').insert({user_id:user.id,agent_name:name,clock_in:now,date:today}).select().single());
    if(error){setErr('Clock-in failed: '+error.message);return;}
    setClockRow(data);
  };
  const clockOut = async()=>{
    if(!clockRow)return; setErr('');
    const now=new Date().toISOString();
    const {data,error}=await run(SB.from('bt_clocklogs').update({clock_out:now}).eq('id',clockRow.id).select().single());
    if(error){setErr('Clock-out failed: '+error.message);return;}
    setClockRow(data);
  };
  const startBreak = async()=>{
    setErr('');
    const {data:tc}=await run(SB.from('bt_logs').select('id').is('end_time',null));
    if((tc||[]).length>=maxB){setErr(`All ${maxB} break slots are taken. Please wait.`);return;}
    const now=new Date().toISOString();
    const {data,error}=await run(SB.from('bt_logs').insert({user_id:user.id,agent_name:name,start_time:now}).select().single());
    if(error){setErr('Could not start break: '+error.message);return;}
    setActive(data); setLogs(p=>[data,...p]); setTeamCount(c=>c+1);
  };
  const endBreak = async()=>{
    if(!active)return; setErr('');
    const now=new Date().toISOString();
    const durSecs=Math.round((new Date(now)-new Date(active.start_time))/1000);
    const bt=bType(durSecs);
    const {error}=await run(SB.from('bt_logs').update({end_time:now,duration_secs:durSecs,break_type:bt}).eq('id',active.id));
    if(error){setErr('Could not end break: '+error.message);return;}
    setLogs(p=>p.map(l=>l.id===active.id?{...l,end_time:now,duration_secs:durSecs,break_type:bt}:l));
    setActive(null); setTeamCount(c=>Math.max(0,c-1));
  };

  // Swap: send request to another agent
  const sendSwapRequest = async(targetAgent) => {
    if(!lunchInfo?.group) return;
    setSwapBusy(true);
    const targetGroup = targetAgent.group;
    const {data,error} = await createSwapRequest({
      fromUserId: user.id, fromName: name,
      toUserId: targetAgent.userId, toName: targetAgent.name,
      fromGroup: lunchInfo.group, toGroup: targetGroup, date: today,
    });
    if(error){ setErr('Could not send swap request: '+error.message); setSwapBusy(false); return; }
    setOutgoingSwap(data);
    await broadcastSwap({ action:'request', id:data.id, fromUserId:user.id, fromName:name, toUserId:targetAgent.userId, toName:targetAgent.name, fromGroup:lunchInfo.group, toGroup:targetGroup, date:today });
    setShowSwapModal(false);
    setSwapBusy(false);
    fireNotification({ title: '📤 Swap Request Sent', body: `Waiting for ${targetAgent.name} to respond.`, type: 'info', duration: 6000 });
  };

  const cancelSwapRequest = async() => {
    if(!outgoingSwap) return;
    await run(SB.from('bt_swap_requests').update({status:'cancelled'}).eq('id',outgoingSwap.id));
    setOutgoingSwap(null);
  };

  // Swap: respond to incoming request
  const respondToSwap = async(swapReq, accepted) => {
    setSwapBusy(true);
    const newStatus = accepted ? 'accepted' : 'declined';
    // 1. Update the swap request status
    await run(SB.from('bt_swap_requests').update({status:newStatus, responded_at:new Date().toISOString()}).eq('id',swapReq.id));
    setIncomingSwaps(p=>p.filter(s=>s.id!==swapReq.id));

    if(accepted) {
      // 2. Perform the actual group swap in bt_lunch_schedule
      const {data:ls} = await run(SB.from('bt_lunch_schedule').select('*').eq('date',today).maybeSingle());
      if(ls) {
        let newA = [...(ls.group_a||[])];
        let newB = [...(ls.group_b||[])];
        // Remove both from their current groups
        newA = newA.filter(n=>n!==swapReq.from_name && n!==swapReq.to_name);
        newB = newB.filter(n=>n!==swapReq.from_name && n!==swapReq.to_name);
        // Put each in the other's group
        if(swapReq.from_group==='A') { newB.push(swapReq.from_name); newA.push(swapReq.to_name); }
        else { newA.push(swapReq.from_name); newB.push(swapReq.to_name); }
        await run(SB.from('bt_lunch_schedule').update({group_a:newA,group_b:newB,updated_at:new Date().toISOString()}).eq('id',ls.id));
        // 3. Notify admin via the admin broadcast channel
        broadcastNotif({ title:`🔄 Lunch Swap Done`, body:`${swapReq.from_name} (Grp ${swapReq.from_group}) ↔ ${swapReq.to_name} (Grp ${swapReq.to_group}) · schedule updated automatically.`, type:'info' });
        // 4. Update our own lunch card immediately (the acceptor)
        const myGrp = swapReq.from_group === 'A' ? 'B' : 'A'; // acceptor moves to requester's old group
        // Actually recalculate: acceptor is to_name (us), we were in to_group, now in from_group
        const acceptorNewGroup = swapReq.from_group; // we take the requester's group
        const first = ls.group_first || defaultFirst(today);
        const slots = lunchSlots(first);
        setLunchInfo({group:acceptorNewGroup, slot:slots[acceptorNewGroup], allA:newA, allB:newB, first, slots});
      }
      // 5. Broadcast directly to the requester so they update immediately
      await broadcastSwap({ action:'accepted', id:swapReq.id, fromUserId:swapReq.from_user_id, fromName:swapReq.from_name, toUserId:user.id, toName:name });
    } else {
      // Notify requester of decline
      await broadcastSwap({ action:'declined', id:swapReq.id, fromUserId:swapReq.from_user_id, fromName:swapReq.from_name, toUserId:user.id, toName:name });
    }
    setSwapBusy(false);
  };

  const done=logs.filter(l=>l.end_time);
  const totalSec=done.reduce((s,l)=>s+(l.duration_secs||0),0);
  const predType=active?bType(Math.floor(elapsed/1000)):null;
  const atCap=teamCount>=maxB;
  const isClockedIn=clockRow?.clock_in&&!clockRow?.clock_out;
  const isClockedOut=clockRow?.clock_out;
  // Other agents in the opposite group (for swap target selection)
  const otherGroupAgents = lunchInfo?.group ? (
    lunchInfo.group==='A'
      ? (lunchInfo.allB||[]).map(n=>({name:n, group:'B', userId:null}))
      : (lunchInfo.allA||[]).map(n=>({name:n, group:'A', userId:null}))
  ) : [];

  return(
    <div className="ag-root">
      <header className="ag-hd">
        <div className="fc g8">

        </div>
        <div className="fc g10">
          <span className="rtp" style={{fontSize:10,padding:'2px 8px'}}><span className="rtd"/>Live</span>

          <button className="ib" onClick={onLogout} title="Sign out"><Ic n="logout" size={15}/></button>
        </div>
      </header>

      <div className="ag-body">
        {err&&<div className="aerr"><Ic n="alert" size={14}/> {err}</div>}
        {atCap&&!active&&<div className="awrn"><Ic n="alert" size={15}/> All break slots are taken ({teamCount}/{maxB}). Wait for a colleague to return.</div>}

        <LiveClock/>

        {/* Incoming swap requests */}
        {incomingSwaps.map(sr=>(
          <div key={sr.id} className="swap-req-card incoming">
            <div className="fc g8">
              <span className="swap-req-badge incoming"><Ic n="swap" size={11}/> Swap Request</span>
              <span style={{fontSize:11,color:'var(--mut)'}}>from {sr.from_name}</span>
            </div>
            <div className="swap-who">{sr.from_name} <span style={{color:'var(--mut)',fontWeight:400}}>wants to swap their</span> Group {sr.from_group} <span style={{color:'var(--mut)',fontWeight:400}}>for your</span> Group {sr.to_group}</div>
            <div className="swap-detail">
              If you accept: you move to Group {sr.from_group} · {sr.from_name} moves to Group {sr.to_group}. Admin will be notified automatically.
            </div>
            <div className="swap-action-row">
              <button className="btn-accept" onClick={()=>respondToSwap(sr,true)} disabled={swapBusy}>
                {swapBusy?<span className="spin-sm"/>:<Ic n="check" size={13}/>} Accept Swap
              </button>
              <button className="btn-decline" onClick={()=>respondToSwap(sr,false)} disabled={swapBusy}>
                <Ic n="x" size={13}/> Decline
              </button>
            </div>
          </div>
        ))}

        {/* Outgoing pending swap request */}
        {outgoingSwap&&(
          <div className="swap-req-card outgoing">
            <div className="fc g8">
              <span className="swap-req-badge pending"><Ic n="timer" size={11}/> Awaiting Response</span>
            </div>
            <div className="swap-who">Swap request sent to <span style={{color:'var(--purp)'}}>{outgoingSwap.to_name}</span></div>
            <div className="swap-detail">You asked to swap Group {outgoingSwap.from_group} for Group {outgoingSwap.to_group}. Waiting for {outgoingSwap.to_name} to respond…</div>
            <button className="btn-decline" style={{alignSelf:'flex-start'}} onClick={cancelSwapRequest}><Ic n="x" size={13}/> Cancel Request</button>

        {/* Clock in/out */}
        <div className="clk-card">
          <div className="clk-info">
            <div className="clk-title">{isClockedIn?'You are clocked in':isClockedOut?'You have clocked out':'Not clocked in'}</div>

        {/* Lunch schedule */}

          <div className={`lunch-slot-card ${lunchInfo.group?'grp-'+lunchInfo.group.toLowerCase():'unset'}`}>

                <thead><tr><th>Start</th><th>Return</th><th>Duration</th><th>Type</th></tr></thead>

  );

/* ── Swap Request Modal ── */
function SwapRequestModal({myName,myGroup,otherGroup,otherSlot,mySlot,date,onSend,onClose,busy}){
  const [agents,setAgents]=useState([]);
  const [loading,setLoading]=useState(true);
  const [selected,setSelected]=useState(null);
  const [err,setErr]=useState('');

  useEffect(()=>{
    (async()=>{
      // Load agents in the other group with their user_ids from bt_clocklogs
      const {data:ls}=await run(SB.from('bt_lunch_schedule').select('*').eq('date',date).maybeSingle());
      if(!ls){setErr('No lunch schedule found for today.');setLoading(false);return;}
      const otherNames = otherGroup==='A' ? (ls.group_a||[]) : (ls.group_b||[]);
      if(otherNames.length===0){setErr(`No agents in Group ${otherGroup} to swap with.`);setLoading(false);return;}
      // Look up user_ids from bt_clocklogs
      const {data:ck}=await run(SB.from('bt_clocklogs').select('user_id,agent_name').eq('date',date).in('agent_name',otherNames));
      const seen=new Set(); const list=[];
      (ck||[]).forEach(r=>{ if(!seen.has(r.user_id)){seen.add(r.user_id);list.push({userId:r.user_id,name:r.agent_name,group:otherGroup});} });
      setAgents(list);
      if(list.length>0)setSelected(list[0].userId);
      setLoading(false);
    })();
  },[date,otherGroup]);

  const handleSend=()=>{
    const ag=agents.find(a=>a.userId===selected);
    if(ag) onSend(ag);
  };

  return(
    <div className="modal-bg" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal-box">
        <div className="modal-title"><Ic n="swap" size={18}/> Request Lunch Swap</div>
        <div className="modal-sub">
          Ask a colleague in Group {otherGroup} to swap lunch slots with you.<br/>
          <strong>Your slot:</strong> Group {myGroup} · {mySlot.from}–{mySlot.to}<br/>
          <strong>Their slot:</strong> Group {otherGroup} · {otherSlot.from}–{otherSlot.to}
        </div>
        {err&&<div className="ebox" style={{marginBottom:12}}><Ic n="alert" size={14}/>{err}</div>}
        {loading?<div style={{textAlign:'center',padding:16}}><div className="spin" style={{margin:'0 auto'}}/></div>
         :agents.length===0&&!err?<div className="ebox"><Ic n="alert" size={14}/>No agents in Group {otherGroup} are clocked in today.</div>
         :(
          <div className="fg">
            <label className="fl">Select agent to request swap ({agents.length} available)</label>
            <select className="fi" value={selected||''} onChange={e=>setSelected(e.target.value)}>
              {agents.map(a=><option key={a.userId} value={a.userId}>{a.name} (Group {a.group})</option>)}
            </select>
          </div>
        )}
        <div style={{background:'var(--card)',border:'1px solid var(--bdr)',borderRadius:8,padding:'10px 14px',fontSize:12,color:'var(--mut)',marginBottom:20,lineHeight:1.6}}>
          If they accept: the swap happens automatically and admin is notified.
        </div>
        <div className="modal-foot">
          <button className="bs" onClick={onClose}>Cancel</button>
          <button className="bp" onClick={handleSend} disabled={busy||loading||agents.length===0||!selected}>
            {busy?<span className="spin-sm"/>:<Ic n="send" size={14}/>} Send Request
          </button>
        </div>
      </div>
    </div>
  );
}

/* ── Admin Dashboard ── */
function ADash(){
  const [logs,setLogs]=useState([]);
  const [maxB,setMaxB]=useState(3);
  const [loading,setLoad]=useState(true);
  const [err,setErr]=useState('');
  const [rt,setRt]=useState(false);
  const load=useCallback(async()=>{
    setErr('');
    const {data:cfg,error:e1}=await run(SB.from('bt_settings').select('max_concurrent_breaks').eq('id',1).maybeSingle());
    if(e1)setErr('Settings: '+e1.message); else if(cfg)setMaxB(cfg.max_concurrent_breaks);
    const {data:bl,error:e2}=await run(SB.from('bt_logs').select('*').order('start_time',{ascending:false}).limit(300));
    if(e2){setErr(p=>p+' | Logs: '+e2.message);setLoad(false);return;}
    setLogs(bl||[]); setLoad(false);
  },[]);
  useEffect(()=>{
    load();
    const ch=SB.channel('dash-rt')
      .on('postgres_changes',{event:'*',schema:'public',table:'bt_logs'},({eventType,new:nw,old:ol})=>{
        if(eventType==='INSERT')setLogs(p=>[nw,...p]);
        if(eventType==='UPDATE')setLogs(p=>p.map(r=>r.id===nw.id?nw:r));
        if(eventType==='DELETE')setLogs(p=>p.filter(r=>r.id!==ol.id));
      }).subscribe(s=>setRt(s==='SUBSCRIBED'));
    return()=>SB.removeChannel(ch);
  },[load]);
  const today=todayISO();
  const active=logs.filter(l=>!l.end_time);
  const done=logs.filter(l=>l.end_time&&l.duration_secs!=null);
  const todayL=logs.filter(l=>l.start_time.startsWith(today));
  const todaySec=todayL.filter(l=>l.duration_secs).reduce((s,l)=>s+l.duration_secs,0);
  const avg=done.length?Math.round(done.reduce((s,l)=>s+l.duration_secs,0)/done.length):0;
  return(
    <div className="panel">
      <div className="phd">
        <div><h1 className="pt">Dashboard</h1><p className="ps">All agents · realtime</p></div>
        <div className="fc g10">
          <span className="rtp"><span className="rtd"/>{rt?'Live':'Connecting…'}</span>
          <button className="bs" onClick={load}><Ic n="refresh" size={14}/> Refresh</button>
        </div>
      </div>
      {err&&<div className="ebox"><Ic n="alert" size={14}/>{err}</div>}
      {loading?<div className="es"><div className="spin"/></div>:(
        <>
          <div className="sg4">
            <SC n="activity" label="Total Breaks"    val={logs.length}/>
            <SC n="timer"    label="On Break Now"    val={active.length} ac={active.length>0&&active.length<maxB} wn={active.length>=maxB}/>
            <SC n="sun"      label="Breaks Today"    val={todayL.length}/>
            <SC n="clock"    label="Avg Duration"    val={durStr(avg)}/>
          </div>
          <div className="sg3">
            <SC n="trending" label="Today's Total Break Time" val={durStr(todaySec)}/>
            <SC n="users"    label="Max Concurrent"           val={maxB}/>
            <SC n="activity" label="Slots Used"               val={`${active.length}/${maxB}`} ac={active.length>0&&active.length<maxB} wn={active.length>=maxB}/>
          </div>
          {active.length>0&&(
            <div className="sc" style={{marginBottom:16}}>
              <div className="sc-hd"><span className="ldot"/><h2 className="sc-t">Currently on Break ({active.length})</h2></div>
              <LT logs={active}/>
            </div>
          )}
          <div className="sc">
            <div className="sc-hd"><span className="sc-ic"><Ic n="clock" size={15}/></span><h2 className="sc-t">Recent Breaks</h2></div>
            {logs.length===0?<div className="es"><span className="es-ic"><Ic n="activity" size={36} sw={1.2}/></span><p>No breaks logged yet</p></div>:<LT logs={logs.slice(0,15)} showDate/>}
          </div>
        </>
      )}
    </div>
  );
}

/* ── Admin Live ── */
function ALive(){
  const [live,setLive]=useState([]);
  const [clocked,setClocked]=useState([]);
  const [maxB,setMaxB]=useState(3);
  const [loading,setLoad]=useState(true);
  const [err,setErr]=useState('');
  const [rt,setRt]=useState(false);
  const [confirm,setConfirm]=useState(null);
  const [remoting,setRemoting]=useState(null);

  const load=useCallback(async()=>{
    setErr('');
    const {data:bl,error:e1}=await run(SB.from('bt_logs').select('*').is('end_time',null).order('start_time'));
    if(e1){setErr(e1.message);setLoad(false);return;}
    setLive(bl||[]);
    const today=todayISO();
    const {data:ck}=await run(SB.from('bt_clocklogs').select('*').eq('date',today).is('clock_out',null));
    setClocked(ck||[]);
    const {data:cfg}=await run(SB.from('bt_settings').select('max_concurrent_breaks').eq('id',1).maybeSingle());
    if(cfg)setMaxB(cfg.max_concurrent_breaks);
    setLoad(false);
  },[]);

  useEffect(()=>{
    load();
    const ch=SB.channel('live-rt2')
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'bt_logs'},({new:nw})=>{ if(!nw.end_time)setLive(p=>[...p,nw]); })
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'bt_logs'},({new:nw})=>{ if(nw.end_time)setLive(p=>p.filter(r=>r.id!==nw.id)); else setLive(p=>p.map(r=>r.id===nw.id?nw:r)); })
      .subscribe(s=>setRt(s==='SUBSCRIBED'));
    return()=>SB.removeChannel(ch);
  },[load]);

  const remoteStart=async(agent)=>{
    setRemoting(agent.user_id); setErr('');
    const now=new Date().toISOString();
    const {data,error}=await run(SB.from('bt_logs').insert({user_id:agent.user_id,agent_name:agent.agent_name,start_time:now}).select().single());
    if(error){setErr('Remote break failed: '+error.message);}
    else{setLive(p=>[...p,data]);}
    setRemoting(null); setConfirm(null);
  };

  const onBreakIds=new Set(live.map(l=>l.user_id));
  const available=clocked.filter(a=>!onBreakIds.has(a.user_id));
  const atCap=live.length>=maxB;

  return(
    <div className="panel">
      <div className="phd">
        <div><h1 className="pt">Live Breaks</h1><p className="ps">{live.length}/{maxB} slots · updates instantly</p></div>
        <div className="fc g10">
