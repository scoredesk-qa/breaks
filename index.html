/* ── Admin Settings ── */
/* ── Scheduled break slots ────────────────────────────────────
   The schedule is stored in bt_settings.slot_schedule and applied by the
   database itself (pg_cron runs bt_apply_slot_schedule every minute), so
   slots change on time even when nobody has the app open. Each entry fires
   once, so a manual change on Home stays until the next scheduled time. */
const SLOT_SETUP_SQL = `-- Scheduled break slots: one-time setup. Run in the Supabase SQL Editor.
-- Safe to run again. Re-run it whenever the app tells you the setup is out of date.
-- For the every-minute background job, turn on pg_cron first (Database > Extensions).
-- Without pg_cron the schedule still applies while anyone has the app open.

alter table bt_settings add column if not exists lunch_start int default 12;
alter table bt_settings add column if not exists slot_schedule jsonb default '[]'::jsonb;
alter table bt_settings add column if not exists slot_tz text;
alter table bt_settings add column if not exists slot_applied text;

-- Sets max_concurrent_breaks from the latest schedule entry that has started today.
-- Each entry fires once, so manual changes from the app stay until the next entry.
create or replace function bt_slot_apply(at_ts timestamptz default now()) returns jsonb
language plpgsql security definer set search_path = public as $$
declare
  s        bt_settings%rowtype;
  tz       text;
  loc      timestamp;
  today    date;
  hm       text;
  r        jsonb;
  lsj      jsonb;
  lh       int;
  first    text;
  a_size   int := 0;
  b_size   int := 0;
  best_t   text;
  best_n   int;
  ev_t     text;
  ev_n     int;
  k        text;
  changed  boolean := false;
  lunch_err text;
begin
  select * into s from bt_settings where id = 1;
  if not found then
    return jsonb_build_object('v', 4, 'ok', false, 'reason', 'bt_settings has no row with id 1');
  end if;
  if s.slot_schedule is null or jsonb_array_length(s.slot_schedule) = 0 then
    return jsonb_build_object('v', 4, 'ok', true, 'reason', 'No schedule saved yet');
  end if;
  tz    := coalesce(nullif(s.slot_tz, ''), 'UTC');
  loc   := at_ts at time zone tz;
  today := loc::date;
  hm    := to_char(loc, 'HH24:MI');
  lh    := coalesce(s.lunch_start, 12);

  -- Read today's lunch groups as JSON so a different column layout can't break the schedule.
  -- If anything about the lunch table is unexpected, skip only the lunch rules and say why.
  begin
    select to_jsonb(l) into lsj from bt_lunch_schedule l where l.date::text = today::text limit 1;
    if lsj is not null then
      if jsonb_typeof(lsj->'group_a') = 'array' then a_size := jsonb_array_length(lsj->'group_a'); end if;
      if jsonb_typeof(lsj->'group_b') = 'array' then b_size := jsonb_array_length(lsj->'group_b'); end if;
      first := coalesce(nullif(lsj->>'group_first', ''),
                        case when extract(day from today)::int % 2 = 0 then 'A' else 'B' end);
    end if;
  exception when others then
    lunch_err := sqlerrm; first := null;
  end;

  for r in select * from jsonb_array_elements(s.slot_schedule) loop
    for ev_t, ev_n in
      select t, n from (
        -- fixed time: {"time":"09:00","slots":4}
        select r->>'time' as t, (r->>'slots')::int as n where r ? 'time'
        -- lunch: {"lunch":true,"extra":1,"after":3}; group times come from lunch_start
        union all select lpad(lh::text, 2, '0') || ':00',
               (case when first = 'A' then a_size else b_size end) + coalesce((r->>'extra')::int, 0)
          where r ? 'lunch' and first is not null
        union all select lpad((lh + 1)::text, 2, '0') || ':00',
               (case when first = 'A' then b_size else a_size end) + coalesce((r->>'extra')::int, 0)
          where r ? 'lunch' and first is not null
        union all select lpad((lh + 2)::text, 2, '0') || ':00', (r->>'after')::int
          where r ? 'lunch' and r->>'after' is not null
      ) e
    loop
      if ev_t <= hm and (best_t is null or ev_t >= best_t) then
        best_t := ev_t; best_n := ev_n;
      end if;
    end loop;
  end loop;

  if best_t is null then
    return jsonb_build_object('v', 4, 'ok', true, 'reason', 'No scheduled time has started yet today', 'now', hm, 'tz', tz, 'lunch_error', lunch_err);
  end if;
  k := today::text || ' ' || best_t;
  if k is distinct from s.slot_applied then
    update bt_settings
       set max_concurrent_breaks = greatest(0, best_n), slot_applied = k, updated_at = now()
     where id = 1;
    changed := true;
  end if;
  return jsonb_build_object('v', 4, 'ok', true, 'lunch_error', lunch_err, 'changed', changed, 'slots', greatest(0, best_n),
                            'rule', best_t, 'now', hm, 'tz', tz);
end $$;

-- Called by the app (every 30s from any open screen, and by the Check now button).
-- It only applies what the admin saved, so it is safe for any signed-in user to call.
create or replace function bt_slot_sync() returns jsonb
language plpgsql security definer set search_path = public as $$
declare
  res      jsonb;
  cron_on  boolean := false;
  last_run text;
begin
  res := bt_slot_apply();
  begin
    execute $q$select exists(select 1 from cron.job where jobname = 'bt-slot-schedule')$q$ into cron_on;
  exception when others then cron_on := false;
  end;
  begin
    execute $q$select d.status || coalesce(' - ' || d.return_message, '')
               from cron.job_run_details d join cron.job j using (jobid)
               where j.jobname = 'bt-slot-schedule' order by d.start_time desc limit 1$q$ into last_run;
  exception when others then last_run := null;
  end;
  -- server_ms: the server's real time, so the app doesn't depend on each PC's clock
  return res || jsonb_build_object('cron', cron_on, 'cron_last_run', last_run,
                                   'server_ms', (extract(epoch from clock_timestamp()) * 1000)::bigint);
end $$;

revoke all on function bt_slot_apply(timestamptz) from public, anon, authenticated;
revoke all on function bt_slot_sync() from public, anon;
grant execute on function bt_slot_sync() to authenticated;

-- Background job: every minute, even when nobody has the app open.
do $$
begin
  perform cron.unschedule('bt-slot-schedule') where exists (select 1 from cron.job where jobname = 'bt-slot-schedule');
  perform cron.schedule('bt-slot-schedule', '* * * * *', 'select bt_slot_apply()');
exception when others then
  raise notice 'pg_cron is not enabled, so the background job was skipped: %', sqlerrm;
end $$;
`;
function Stepper({value,onChange,min=0,max=50}){
  return(
    <div style={{display:'flex',alignItems:'center',gap:8}}>
      <button className="nb" style={{width:32,height:32,fontSize:17}} onClick={()=>onChange(Math.max(min,value-1))}>−</button>
      <span style={{minWidth:28,textAlign:'center',fontSize:18,fontVariantNumeric:'tabular-nums'}}>{value}</span>
      <button className="nb" style={{width:32,height:32,fontSize:17}} onClick={()=>onChange(Math.min(max,value+1))}>+</button>
    </div>
  );
}
/* The schedule runs on a fixed UTC offset the admin picks, so it matches the clock they actually work by. */
const offToTz = o => o===0 ? 'UTC' : `Etc/GMT${o>0?'-':'+'}${Math.abs(o)}`;
const tzToOff = tz => { if(tz==='UTC') return 0; const m=/^Etc\/GMT([+-])(\d{1,2})$/.exec(tz||''); return m ? (m[1]==='-'?1:-1)*parseInt(m[2]) : null; };
const clockAt = off => { const d=new Date(appNow()+off*3600000); return `${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}`; };
function ASlotSchedule(){
  const [rules,setRules]=useState([]);                                  // [{time:'09:00',slots:4}]
  const [lunch,setLunch]=useState({on:false,extra:0,afterOn:false,after:3});
  const [lunchH,setLunchH]=useState(_lunchStart);
  const [off,setOff]=useState(()=>Math.round(-new Date().getTimezoneOffset()/60));
  const [,tick]=useState(0);
  const [needSetup,setNeedSetup]=useState(false);
  const [busy,setBusy]=useState(false);
  const [ok,setOk]=useState(false);
  const [copied,setCopied]=useState(false);
  const [status,setStatus]=useState(null);   // {text, warn}
  const [needFn,setNeedFn]=useState(false);
  const [checking,setChecking]=useState(false);
  const [err,setErr]=useState('');
  useEffect(()=>{ const id=setInterval(()=>tick(n=>n+1),15000); return()=>clearInterval(id); },[]);
  const checkNow=async()=>{
    setChecking(true);
    const {data,error}=await run(SB.rpc('bt_slot_sync'));
    setChecking(false);
    if(error||!data||!(data.v>=4)){
      setNeedFn(true); _slotFnMissing=true;
      setStatus({warn:true,text:'The schedule can’t run because the setup SQL in Supabase is old or didn’t finish'+(error?` (${error.message})`:'')+'. Use the Copy setup SQL button above, paste it into the SQL Editor, run it, and check the result panel for errors. Then click Check now.'});
      return;
    }
    setNeedFn(false); _slotFnMissing=false;
    const parts=[];
    if(!data.ok) parts.push(data.reason);
    let warn=!data.ok;
    if(data.lunch_error){ warn=true; parts.push('Lunch rules were skipped: '+data.lunch_error); }
    if(data.cron===false){ warn=true; parts.push('The background job isn’t running (pg_cron is off or wasn’t set up). The schedule still applies while anyone has the app open; for exact timing when nobody does, turn on pg_cron and run the setup SQL.'); }
    else if(data.cron_last_run && /^failed/i.test(data.cron_last_run)) { warn=true; parts.push('Last background run: '+data.cron_last_run); }
    setStatus(warn?{warn,text:parts.join(' ')}:null);
  };
  useEffect(()=>{
    checkNow();
    run(SB.from('bt_settings').select('*').eq('id',1).maybeSingle()).then(({data,error})=>{
      if(error){setErr('Load: '+error.message);return;}
      if(!data) return;
      if(!('slot_schedule' in data)){ setNeedSetup(true); return; }
      if(data.lunch_start!=null) setLunchH(parseInt(data.lunch_start));
      const o=tzToOff(data.slot_tz); if(o!==null) setOff(o);
      const list=Array.isArray(data.slot_schedule)?data.slot_schedule:[];
      setRules(list.filter(r=>r.time).map(r=>({time:r.time,slots:r.slots|0})).sort((a,b)=>a.time.localeCompare(b.time)));
      const l=list.find(r=>r.lunch);
      if(l) setLunch({on:true,extra:l.extra|0,afterOn:l.after!=null,after:l.after!=null?l.after|0:3});
    });
  },[]);
  const edit=(i,patch)=>setRules(rs=>rs.map((r,j)=>j===i?{...r,...patch}:r));
  const addRule=()=>setRules(rs=>{
    const last=rs.length?rs[rs.length-1].time:'07:00';
    const h=Math.min(23,parseInt(last)+1);
    return [...rs,{time:`${pad(h)}:00`,slots:rs.length?rs[rs.length-1].slots:3}];
  });
  const save=async()=>{
    setBusy(true);setErr('');setOk(false);
    const sorted=[...rules].filter(r=>/^\d\d:\d\d$/.test(r.time)).sort((a,b)=>a.time.localeCompare(b.time));
    const schedule=[...sorted];
    if(lunch.on) schedule.push(lunch.afterOn?{lunch:true,extra:lunch.extra,after:lunch.after}:{lunch:true,extra:lunch.extra});
    const tz=offToTz(off);
    const {error}=await run(SB.from('bt_settings').update({slot_schedule:schedule,slot_tz:tz,updated_at:nowISO()}).eq('id',1));
    setBusy(false);
    if(error){ if(/slot_schedule|slot_tz/.test(error.message||'')) setNeedSetup(true); setErr('Save: '+error.message); return; }
    setRules(sorted); setOk(true); setTimeout(()=>setOk(false),3000);
    checkNow();   // apply right away if a time has already passed today
  };
  const copySql=()=>{ navigator.clipboard?.writeText(SLOT_SETUP_SQL).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),3000);}); };
  const first=fmtH(lunchH), second=fmtH(lunchH+1), after=fmtH(lunchH+2);
  const row={display:'flex',alignItems:'center',gap:14,flexWrap:'wrap',marginBottom:12};

  return(
    <div className="sblk">
      <h2 className="sh">Automatic slot schedule</h2>
      <p className="sd">Change the number of break slots automatically at set times each day. At each time, slots are set to that number. You can still change slots by hand on Home; your change stays until the next scheduled time.</p>
      {err&&<div className="ebox"><Ic n="alert" size={14}/>{err}</div>}
      {needFn&&!needSetup&&(
        <div style={{marginBottom:18}}>
          <p className="sd" style={{marginBottom:10}}>The setup SQL in Supabase needs to be run again. Copy it, paste it into the Supabase SQL Editor, run it, and come back.</p>
          <button className="bs" onClick={copySql}>{copied?<><Ic n="check" size={15}/> Copied</>:'Copy setup SQL'}</button>
        </div>
      )}
      {needSetup?(
        <div>
          <p className="sd" style={{marginBottom:10}}>One-time setup: in Supabase, open <b>Database → Extensions</b> and turn on <b>pg_cron</b>. Then copy this SQL, paste it into the SQL Editor, run it, and reload this page.</p>
          <button className="bs" onClick={copySql}>{copied?<><Ic n="check" size={15}/> Copied</>:'Copy setup SQL'}</button>
        </div>
      ):(<>
        <div style={{...row,marginBottom:18}}>
          <span style={{fontSize:15,color:'var(--mut)'}}>Clock</span>
          <button className="nb" style={{width:32,height:32,fontSize:17}} onClick={()=>setOff(o=>Math.max(-12,o-1))} aria-label="One hour earlier">−</button>
          <span style={{minWidth:64,textAlign:'center',fontSize:16,fontVariantNumeric:'tabular-nums'}}>UTC{off<0?'−':'+'}{Math.abs(off)}</span>
          <button className="nb" style={{width:32,height:32,fontSize:17}} onClick={()=>setOff(o=>Math.min(14,o+1))} aria-label="One hour later">+</button>
          <span style={{fontSize:15,color:'var(--mut)'}}>Now <b style={{color:'var(--txt)',fontWeight:500,fontVariantNumeric:'tabular-nums'}}>{clockAt(off)}</b></span>
        </div>
        {rules.length===0&&<p style={{fontSize:14,color:'var(--mut)',marginBottom:12}}>No scheduled times yet.</p>}
        {rules.map((r,i)=>(
          <div key={i} style={row}>
            <span style={{fontSize:15,color:'var(--mut)'}}>At</span>
            <input className="fi" type="time" value={r.time} onChange={e=>edit(i,{time:e.target.value})} style={{width:130}}/>
            <span style={{fontSize:15,color:'var(--mut)'}}>set slots to</span>

  );

/* ── Trainees & shift end ─────────────────────────────────────
   Trainees have no break slot limit and one shared lunch time (no groups).
   Shift end is the clock-out time: agents who clock out earlier are asked to confirm. */
const TEAM_SETUP_SQL = `-- Trainees and shift end: one-time setup. Run in the Supabase SQL Editor. Safe to run again.

alter table bt_settings add column if not exists trainees jsonb default '[]'::jsonb;
alter table bt_settings add column if not exists trainee_lunch text default '12:00';
alter table bt_settings add column if not exists shift_end text default '16:30';

-- Break slot limit, now aware of trainees: a trainee can always start a break,
-- and trainees' open breaks don't count toward the limit for everyone else.
create or replace function public.enforce_max_concurrent_breaks()
 returns trigger
 language plpgsql
as $function$
declare
  cap int;
  v_trainees jsonb;
  current_count int;
begin
  -- Lock the settings row for the duration of this transaction. This is
  -- what makes the check atomic: if two breaks try to start at the same
  -- moment, the second one waits here until the first has fully committed,
  -- then sees the up-to-date count that includes the first break.
  select max_concurrent_breaks, coalesce(trainees, '[]'::jsonb)
    into cap, v_trainees
    from bt_settings where id = 1 for update;

  if cap is null then
    return new; -- no cap configured yet, don't block anything
  end if;

  if jsonb_typeof(v_trainees) is distinct from 'array' then
    v_trainees := '[]'::jsonb;
  end if;

  -- Trainees have no slot limit
  if exists (select 1 from jsonb_array_elements_text(v_trainees) t
              where lower(regexp_replace(trim(t), '[[:space:]]+', ' ', 'g'))
                  = lower(regexp_replace(trim(coalesce(new.agent_name, '')), '[[:space:]]+', ' ', 'g'))) then
    return new;
  end if;

  -- Trainees' open breaks don't use up slots for the rest of the team
  select count(*) into current_count
    from bt_logs l
   where l.end_time is null
     and not exists (select 1 from jsonb_array_elements_text(v_trainees) t
                      where lower(regexp_replace(trim(t), '[[:space:]]+', ' ', 'g'))
                          = lower(regexp_replace(trim(coalesce(l.agent_name, '')), '[[:space:]]+', ' ', 'g')));

  if current_count >= cap then
    raise exception 'All % break slots are taken. Please wait.', cap;
  end if;

  return new;
end;
$function$;`;
function CopySql({sql,label='Copy setup SQL'}){
  const [c,setC]=useState(false);
  return <button className="bs" onClick={()=>navigator.clipboard?.writeText(sql).then(()=>{setC(true);setTimeout(()=>setC(false),3000);})}>{c?<><Ic n="check" size={15}/> Copied</>:label}</button>;
}
function ATrainees(){
  const [list,setList]=useState([]);
  const [lunch,setLunch]=useState('12:00');
  const [known,setKnown]=useState([]);
  const [today,setToday]=useState({clocks:[],open:[]});
  const [input,setInput]=useState('');
  const [needSetup,setNeedSetup]=useState(false);
  const [loading,setLoading]=useState(true);
  const [busy,setBusy]=useState('');
  const [ok,setOk]=useState('');
  const [err,setErr]=useState('');
  const lunchLoaded=useRef(false);

  const load=useCallback(async()=>{
    const [cfg,hist,ck,open]=await Promise.all([
      run(SB.from('bt_settings').select('*').eq('id',1).maybeSingle()),
      run(SB.from('bt_clocklogs').select('agent_name').order('clock_in',{ascending:false}).limit(500)),
      run(SB.from('bt_clocklogs').select('agent_name,clock_in,clock_out').eq('date',todayISO())),
      run(SB.from('bt_logs').select('agent_name,start_time').is('end_time',null)),
    ]);
    if(cfg.error){ setErr('Load: '+cfg.error.message); setLoading(false); return; }
    const d=cfg.data;
    if(d){
      if(!('trainees' in d)) setNeedSetup(true);
      else{
        setNeedSetup(false);
        if(!lunchLoaded.current){ lunchLoaded.current=true; setLunch(HM_RE.test(d.trainee_lunch||'')?d.trainee_lunch:'12:00'); }
        setList(Array.isArray(d.trainees)?d.trainees.filter(x=>typeof x==='string'):[]);
      }
    }
    setKnown([...new Set((hist.data||[]).map(r=>r.agent_name).filter(Boolean))].sort((a,b)=>a.localeCompare(b)));
    setToday({clocks:ck.data||[],open:open.data||[]});
    setLoading(false); bumpSync();
  },[]);
  useEffect(()=>{ load(); },[load]);
  useAutoRefresh(load,8000);

  const save=async(patch,key)=>{
    setBusy(key);setErr('');
    const {error}=await run(SB.from('bt_settings').update({...patch,updated_at:nowISO()}).eq('id',1));
    setBusy('');
    if(error){ if(/trainees|trainee_lunch/.test(error.message||'')) setNeedSetup(true); setErr('Save: '+error.message); return false; }
    return true;
  };
  const saveList=async next=>{ if(await save({trainees:next},'list')){ setList(next); _traineeSet=new Set(next.map(normName)); return true; } return false; };
  const add=async()=>{
    const n=input.trim().replace(/\s+/g,' ');
    if(!n) return;
    if(list.some(x=>normName(x)===normName(n))){ setErr(`${n} is already a trainee.`); return; }
    setErr('');
    if(await saveList([...list,n])) setInput('');
  };
  const saveLunch=async()=>{
    if(await save({trainee_lunch:lunch},'lunch')){ setOk('lunch'); setTimeout(()=>setOk(''),3000); }
  };
  const statusOf=n=>{
    const k=normName(n);
    const br=today.open.find(l=>normName(l.agent_name)===k);
    if(br) return {cls:'b-on',text:`On break since ${hhmm(br.start_time)}`};
    const c=today.clocks.find(r=>normName(r.agent_name)===k);
    if(!c) return {cls:'b-out',text:'Not in yet'};
    if(c.clock_out) return {cls:'b-out',text:`Clocked out ${hhmm(c.clock_out)}`};
    return {cls:'b-in',text:`On shift since ${hhmm(c.clock_in)}`};
  };
  const options=known.filter(k=>!list.some(x=>normName(x)===normName(k)));
  const unknownTyped=input.trim()&&!known.some(k=>normName(k)===normName(input));
  const Saved=({k})=>ok===k?<span style={{color:'var(--green)',fontSize:14,display:'flex',alignItems:'center',gap:6}}><Ic n="check" size={15}/> Saved</span>:null;

  return(
    <div className="panel">
      <div className="phd"><div><h1 className="pt">Trainees</h1><p className="ps">Agents in training have no break slot limit and one shared lunch time</p></div></div>
      {err&&<div className="ebox"><Ic n="alert" size={14}/>{err}</div>}
      {loading?<div className="es"><div className="spin"/></div>
       :needSetup?(
        <div className="sblk">
          <h2 className="sh">One-time setup</h2>
          <p className="sd">Copy this SQL, paste it into the Supabase SQL Editor, run it, then reload this page.</p>
          <CopySql sql={TEAM_SETUP_SQL}/>
        </div>
       ):(<>
        <div className="sblk">
          <h2 className="sh">Trainee lunch</h2>
          <p className="sd">One lunch time for all trainees, every day. No groups, no swaps. It lasts one hour.</p>
          <div style={{display:'flex',alignItems:'center',gap:14,flexWrap:'wrap'}}>
            <input className="fi" type="time" value={lunch} onChange={e=>setLunch(e.target.value)} style={{width:140}}/>
            <span style={{fontSize:15,color:'var(--mut)'}}>{HM_RE.test(lunch)?`${lunch} – ${addMin(lunch,60)}`:''}</span>
          </div>
          <div style={{marginTop:20,display:'flex',alignItems:'center',gap:12}}>
            <button className="bp" onClick={saveLunch} disabled={!!busy||!HM_RE.test(lunch)}>{busy==='lunch'?<span className="spin-sm"/>:'Save'}</button>
            <Saved k="lunch"/>
          </div>
        </div>
        <div className="sblk">
          <h2 className="sh">Trainees ({list.length})</h2>
          <p className="sd">Their breaks don't need a slot and don't take one from the team. They aren't put in lunch groups.</p>
          {list.length===0&&<p style={{fontSize:14,color:'var(--mut)',marginBottom:14}}>No trainees yet.</p>}
          {list.map(n=>{ const st=statusOf(n); return(
            <div key={n} style={{display:'flex',alignItems:'center',gap:14,flexWrap:'wrap',marginBottom:10}}>
              <div style={{minWidth:200}}><AvC name={n}/></div>
              <span className={`badge ${st.cls}`}>{st.text}</span>
              <button className="ib" style={{marginLeft:'auto'}} onClick={()=>saveList(list.filter(x=>x!==n))} disabled={!!busy} aria-label={`Remove ${n}`}><Ic n="x" size={16}/></button>
            </div>
          );})}
          <div style={{display:'flex',alignItems:'center',gap:12,flexWrap:'wrap',marginTop:list.length?18:0}}>
            <input className="fi" list="trainee-names" placeholder="Agent name" value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&add()} style={{maxWidth:280}}/>
            <datalist id="trainee-names">{options.map(k=><option key={k} value={k}/>)}</datalist>
            <button className="bs" onClick={add} disabled={!!busy||!input.trim()}>{busy==='list'?<span className="spin-sm"/>:<><Ic n="plus" size={15}/> Add trainee</>}</button>
          </div>
          {unknownTyped&&<p style={{fontSize:13,color:'var(--mut)',marginTop:10}}>This name hasn't clocked in before. It must match the agent's name exactly as it shows on their screen.</p>}
        </div>
      </>)}
    </div>
  );
}

/* ═══ Part-time project ═══
   A separate group of agents on the fingerprint clock. No lunch schedule and no break slot limit: breaks are just counted.
   The clock server writes pt_punches (service_role key); only admins whose auth.users app_metadata has pt_admin=true can read them (RLS). */
const PT_SETUP_SQL = `-- Part-time project: one-time setup. Run in the Supabase SQL Editor. Safe to run again.
create table if not exists public.pt_punches(
  emp  int         not null,
  ts   timestamptz not null,
  day  text        not null,
  name text        not null,
  kind text        not null check (kind in ('shift','break')),
  dir  text        not null check (dir  in ('IN','OUT')),
  primary key (emp, ts));
alter table public.pt_punches enable row level security;
drop policy if exists "pt admins read" on public.pt_punches;
create policy "pt admins read" on public.pt_punches for select to authenticated
  using ((auth.jwt() -> 'app_metadata' ->> 'pt_admin') = 'true');
-- No other policy: nobody can write from the browser. The clock server writes with the service_role key.

-- Give an admin access (replace the email; they must log out and in again):
-- update auth.users set raw_app_meta_data = coalesce(raw_app_meta_data,'{}'::jsonb) || '{"pt_admin": true}'::jsonb where email = 'admin@example.com';`;

function APartTime(){
  const [day,setDay]=useState(todayISO());
  const [rows,setRows]=useState([]);
  const [needSetup,setNeedSetup]=useState(false);
  const [loading,setLoading]=useState(true);
  const [err,setErr]=useState('');
  const [now,setNow]=useState(Date.now());
  const load=useCallback(async()=>{
    const {data,error}=await run(SB.from('pt_punches').select('*').eq('day',day).order('ts'));
    if(error){ if(/pt_punches/.test(error.message||'')) setNeedSetup(true); else setErr(error.message); }
    else{ setNeedSetup(false); setErr(''); setRows(data||[]); }
    setLoading(false); bumpSync();
  },[day]);
  useEffect(()=>{ setLoading(true); load(); },[load]);
  useAutoRefresh(load,8000);
  useEffect(()=>{ const t=setInterval(()=>setNow(Date.now()),1000); return()=>clearInterval(t); },[]);

  const live=day===todayISO();
  const by={};
  for(const r of rows){ const p=(by[r.name]=by[r.name]||{name:r.name,shift:[],brk:[]}); p[r.kind==='break'?'brk':'shift'].push(new Date(r.ts).getTime()); }
  const pair=a=>{ const o=[]; for(let i=0;i<a.length;i+=2) o.push([a[i],a[i+1]??null]); return o; };
  const secs=l=>l.reduce((s,[a,b])=>s+(b!=null?b-a:live?now-a:0),0)/1000;   // an open interval keeps counting while today is shown
  const people=Object.values(by).map(p=>{
    const sh=pair(p.shift), br=pair(p.brk);
    return {...p,sh,br,breakSecs:secs(br),workSecs:secs(sh),onBreak:p.brk.length%2===1,working:p.shift.length%2===1};
  }).sort((a,b)=>a.name.localeCompare(b.name));
  const status=p=>p.onBreak?{cls:'b-on',text:`On break since ${hhmm(p.brk[p.brk.length-1])}`}
    :p.working?{cls:'b-in',text:'Working'}:p.shift.length?{cls:'b-out',text:'Clocked out'}:{cls:'b-out',text:'Not in'};

  return(
    <div className="panel">
      <div className="phd"><div><h1 className="pt">Part-time agents</h1><p className="ps">Separate project. Breaks are counted, with no slot limit and no lunch schedule</p></div>
        <input className="fi" type="date" value={day} onChange={e=>e.target.value&&setDay(e.target.value)} style={{width:170}}/></div>
      {err&&<div className="ebox"><Ic n="alert" size={14}/>{err}</div>}
      {loading?<div className="es"><div className="spin"/></div>
       :needSetup?(
        <div className="sblk">
          <h2 className="sh">One-time setup</h2>
          <p className="sd">Copy this SQL, paste it into the Supabase SQL Editor, run it, then reload this page.</p>
          <CopySql sql={PT_SETUP_SQL}/>
        </div>
       ):people.length===0?(
        <div className="es"><span className="es-ic"><Ic n="users" size={36} sw={1.2}/></span><p>No part-time punches on this day</p></div>
       ):(
        <div className="sc">
          <div className="tbl-wrap"><table className="dt">
            <thead><tr><th>Agent</th><th>Status</th><th>In</th><th>Out</th><th>Breaks</th><th>Break time</th><th>Net worked</th></tr></thead>
            <tbody>
              {people.map(p=>{ const st=status(p); const last=p.sh[p.sh.length-1]; return(
                <tr key={p.name}>
                  <td><AvC name={p.name}/></td>
                  <td><span className={`badge ${st.cls}`}>{st.text}</span></td>
                  <td>{p.sh.length?hhmm(p.sh[0][0]):'—'}</td>
                  <td>{last&&last[1]!=null?hhmm(last[1]):'—'}</td>
                  <td>{p.br.length}<div style={{color:'var(--mut)',fontSize:12}}>{p.br.map(([a,b])=>`${hhmm(a)}–${b!=null?hhmm(b):'now'}`).join(' · ')}</div></td>
                  <td><b>{durStr(Math.round(p.breakSecs))}</b></td>
                  <td>{durStr(Math.max(0,Math.round(p.workSecs-p.breakSecs)))}</td>
                </tr>
              );})}
            </tbody>
          </table></div>
        </div>
       )}
    </div>
  );
}

/* ═══ 3CX settings (shown in Settings → "3CX call alerts") ═══
   Saved in the database (bt_settings.cx_config) so the admin page and every agent's own stats use the same limits.
   Until the one-time setup SQL has been run they stay in this browser. */
const CX_CFG_KEY='bt_cx_cfg';
const CX_CFG_DEFAULT={ignoreRingSec:10,shortCallSec:60,repeatIgnoreCount:3,repeatIgnoreWindowMin:60,breakToleranceMin:3,breakCheckLeadMin:10,timelineStart:7,timelineEnd:18};
// keeps only the settings that still exist (older saved copies also had the logger PC clock and a separate database connection)
const cxClean=o=>{ const c={}; for(const k of Object.keys(CX_CFG_DEFAULT)){ const n=o&&o[k]!==''&&o[k]!=null?Number(o[k]):NaN; c[k]=Number.isFinite(n)?n:CX_CFG_DEFAULT[k]; } return c; };
let _cxCfg=(()=>{ try{ return cxClean(JSON.parse(localStorage.getItem(CX_CFG_KEY)||'{}')); }catch(e){ return {...CX_CFG_DEFAULT}; } })();
const CX_SAMPLE_USERS=['Jane Doe','Rick Roe','Pat Poe','Max Moe','Lou Lee','Kay Kim','Finn Fox','Gail Gray'].map((n,i)=>({id:'sample-'+i,name:n}));

function A3cxSettings(){
  const [v,setV]=useState({..._cxCfg});
  const [ok,setOk]=useState(false);
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState('');
  const [needSetup,setNeedSetup]=useState(false);
  useEffect(()=>{
    run(SB.from('bt_settings').select('*').eq('id',1).maybeSingle()).then(({data})=>{
      if(!data) return;
      if(!('cx_config' in data)){ setNeedSetup(true); return; }
      if(data.cx_config&&Object.keys(data.cx_config).length){ _cxCfg=cxClean(data.cx_config); setV({..._cxCfg}); }
    });
  },[]);
  const set=k=>e=>setV(p=>({...p,[k]:e.target.value}));
  const NUM=['ignoreRingSec','shortCallSec','repeatIgnoreCount','repeatIgnoreWindowMin','breakToleranceMin','breakCheckLeadMin'];
  const winOk=Number.isInteger(Number(v.timelineStart))&&Number.isInteger(Number(v.timelineEnd))&&Number(v.timelineStart)>=0&&Number(v.timelineEnd)<=24&&Number(v.timelineEnd)>Number(v.timelineStart);
  const valid=winOk&&NUM.every(k=>Number(v[k])>=1);
  const save=async()=>{
    const c={}; for(const k of NUM) c[k]=Math.max(1,Math.round(Number(v[k])));
    c.timelineStart=Number(v.timelineStart); c.timelineEnd=Number(v.timelineEnd);
    _cxCfg=c; try{ localStorage.setItem(CX_CFG_KEY,JSON.stringify(c)); }catch(e){}
    setV(c); setBusy(true); setErr('');
    const {error}=await run(SB.from('bt_settings').update({cx_config:c,updated_at:nowISO()}).eq('id',1));
    setBusy(false);
    if(error){ if(/cx_config/.test(error.message||'')) setNeedSetup(true); setErr('Saved in this browser only: '+error.message); return; }
    setNeedSetup(false); setOk(true); setTimeout(()=>setOk(false),3000);
  };
  const row=(label,k,unit)=>(
    <div style={{display:'flex',alignItems:'center',gap:14,flexWrap:'wrap',marginBottom:14}}>
      <span style={{minWidth:300,fontSize:15}}>{label}</span>
      <input className="fi" type="number" min={1} step={1} value={v[k]} onChange={set(k)} style={{width:100}}/>
      <span style={{fontSize:15,color:'var(--mut)'}}>{unit}</span>
    </div>
  );
  return(
    <div className="sblk">
      <h2 className="sh">3CX call alerts</h2>
      <p className="sd">When the 3CX page raises an alert, and what counts as an ignored or short call in the agents' own stats. Saved for everyone.</p>
      {err&&<div className="ebox"><Ic n="alert" size={14}/>{err}</div>}
      {row('Ignored call: a call rings at least','ignoreRingSec','seconds without being answered')}
      {row('Possible dropped call: a call shorter than','shortCallSec','seconds')}
      {row('Repeated ignores: this many ignored calls','repeatIgnoreCount','calls')}
      {row('...within','repeatIgnoreWindowMin','minutes')}
      {row('Break check: an agent\'s total break time may differ from 3CX by up to','breakToleranceMin','minutes')}
      {row('Break check notification, before shift end by','breakCheckLeadMin','minutes (the shift end is set above)')}
      <div style={{display:'flex',alignItems:'center',gap:14,flexWrap:'wrap',marginBottom:14}}>
        <span style={{minWidth:300,fontSize:15}}>Agent timeline shows the hours from</span>
        <input className="fi" type="number" min={0} max={23} step={1} value={v.timelineStart} onChange={set('timelineStart')} style={{width:80}} aria-label="Timeline start hour"/>
        <span style={{fontSize:15,color:'var(--mut)'}}>to</span>
        <input className="fi" type="number" min={1} max={24} step={1} value={v.timelineEnd} onChange={set('timelineEnd')} style={{width:80}} aria-label="Timeline end hour"/>
        <span style={{fontSize:15,color:'var(--mut)'}}>o'clock (company time)</span>
      </div>
      {needSetup&&(
        <div style={{marginTop:6,marginBottom:6}}>
          <p className="sd" style={{marginBottom:10}}>One-time setup so these are saved for everyone (and not just in this browser): copy this SQL, paste it into the Supabase SQL Editor, run it, then reload this page.</p>
          <CopySql sql={AGENT_STATS_SQL}/>
        </div>
      )}
      <div style={{marginTop:20,display:'flex',alignItems:'center',gap:12}}>
        <button className="bp" onClick={save} disabled={!valid||busy}>{busy?<span className="spin-sm"/>:'Save'}</button>
        {ok&&<span style={{color:'var(--green)',fontSize:14,display:'flex',alignItems:'center',gap:6}}><Ic n="check" size={15}/> Saved</span>}
      </div>
    </div>
  );
}

/* ═══ 3CX page: reads a status_log.csv from this PC and shows calls, ignored rings, short calls, admin time and
   breaks per agent. Saves nothing in the database and never changes what agents entered. Only agents that exist in the app are shown. ═══ */
const CXC={call:'#8e9cff',admin:'#ef6b5b',brk:'#f5a524',avail:'#2fb344',avail2:'#2ec4b6',away:'#7f8ab0',hol:'#2a8fe0',off:'#3a3d4a',ring:'#f5d04e',other:'#7d86a8'};   // the 3CX status colours: Available green, Away/Break orange, Do Not Disturb/Admin red, Available 2 teal, Holiday/Out of office blue
const CX_LABEL={call:'On a call',admin:'Admin',brk:'On break',avail:'Available',avail2:'Available 2',hol:'Out of office',off:'Offline',ring:'Ringing',other:'Other'};
const cxCat=s=>/^on call$/i.test(s)?'call':/admin|do not disturb|^dnd$/i.test(s)?'admin':/break|lunch|bathroom|toilet|^away/i.test(s)?'brk':/^ringing$/i.test(s)?'ring':/out of (the )?office|holiday/i.test(s)?'hol':/offline|not registered/i.test(s)?'off':/^available\s*2|remote/i.test(s)?'avail2':/^available/i.test(s)?'avail':'other';
const CX_DISMISS_KEY='bt_cx_dismissed';
// smooth line through points for the chart
const cxSmooth=pts=>{
  if(pts.length<2) return '';
  let d=`M${pts[0][0]},${pts[0][1]}`;
  for(let i=1;i<pts.length;i++){ const [x0,y0]=pts[i-1],[x1,y1]=pts[i],mx=(x0+x1)/2; d+=` C${mx},${y0} ${mx},${y1} ${x1},${y1}`; }
  return d;
};
function CxChart({labels,series}){
  const W=760,H=300,L=34,R=24,T=14,B=28;
  const max=Math.max(...series.flatMap(s=>s.vals),1);
  const step=Math.max(1,Math.ceil(max/4)), top=step*4;
  const x=i=>L+(W-L-R)*(labels.length>1?i/(labels.length-1):.5);
  const y=v=>T+(H-T-B)*(1-v/top);
  const area=series[0]&&labels.length>1?`${cxSmooth(series[0].vals.map((v,i)=>[x(i),y(v)]))} L${x(labels.length-1)},${y(0)} L${x(0)},${y(0)} Z`:'';
  return(
    <svg viewBox={`0 0 ${W} ${H}`} role="img" aria-label="Calls per hour">
      <defs><linearGradient id="cxg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stopColor={CXC.call} stopOpacity=".45"/><stop offset="1" stopColor={CXC.call} stopOpacity="0"/></linearGradient></defs>
      {[0,1,2,3,4].map(i=>(<g key={i}><line x1={L} x2={W-R} y1={y(i*step)} y2={y(i*step)} stroke="#2b2b33" strokeWidth="1"/><text x={L-8} y={y(i*step)+4} textAnchor="end" fontSize="11" fill="#7c7c88">{i*step}</text></g>))}
      {area&&<path d={area} fill="url(#cxg)"/>}
      {series.map((s,k)=>labels.length>1
        ?<path key={k} d={cxSmooth(s.vals.map((v,i)=>[x(i),y(v)]))} fill="none" stroke={s.color} strokeWidth="2.2" strokeDasharray={s.dashed?'5 5':undefined} strokeLinecap="round"/>
        :<circle key={k} cx={x(0)} cy={y(s.vals[0]||0)} r="4" fill={s.color}/>)}
      {labels.map((l,i)=>(i%Math.max(1,Math.ceil(labels.length/10))===0)&&<text key={i} x={x(i)} y={H-8} textAnchor="middle" fontSize="11" fill="#7c7c88">{l}</text>)}
    </svg>
  );
}

/* ═══ Agent view: 3CX call stats ═══
   An agent sees their own numbers plus a team average. The database function cx_team_day hands them their own status changes in full
   and everybody else's without names or extensions, so one analysis can still tell a call a colleague picked up from an ignored one. */
const AGENT_STATS_SQL=`-- Agent view: break allowance, shared 3CX limits, and each agent's own call stats.
-- Run once in the Supabase SQL Editor. Safe to run again. Needs the 3CX status_log table (3CX setup) to exist.

-- 1. settings the admin page saves and every agent's page reads
alter table public.bt_settings add column if not exists break_allowance_min int     not null default 105;   -- break minutes for a full shift
alter table public.bt_settings add column if not exists full_shift_hours    numeric not null default 8;     -- hours that count as a full shift
alter table public.bt_settings add column if not exists cx_config           jsonb   not null default '{}'::jsonb;   -- the 3CX limits from Settings

-- 2. "Doe, Jane" and "Jane Doe" are the same person (ignores order, case and accents)
create or replace function public.cx_name_key(t text) returns text language sql immutable as $$
  select coalesce(string_agg(w, ' ' order by w), '') from (
    select unnest(regexp_split_to_array(regexp_replace(translate(lower(coalesce(t, '')),
      'àáâãäåçèéêëìíîïñòóôõöùúûüýÿ', 'aaaaaaceeeeiiiinooooouuuuyy'), '[^a-z0-9]+', ' ', 'g'), ' ')) as w) s
  where w <> ''
$$;

-- 3. what an agent may read of the 3CX log: their own status changes, plus everyone else's WITHOUT names or extensions
--    (so the page can compare calls per hour with the team average, and can tell a call a colleague picked up from an ignored one)
create or replace function public.cx_team_day(p_from timestamptz, p_to timestamptz, p_name text)
returns jsonb language plpgsql stable security definer set search_path = public as $$
declare k text := public.cx_name_key(p_name);
begin
  if auth.uid() is null then raise exception 'sign in first'; end if;
  if p_to - p_from > interval '3 days' then p_to := p_from + interval '3 days'; end if;
  return jsonb_build_object(
    'mine', case when k = '' then '[]'::jsonb else coalesce((
        select jsonb_agg(jsonb_build_object('changed_at', changed_at, 'extension', extension, 'agent', agent,
                                            'old_status', old_status, 'new_status', new_status) order by changed_at)
        from public.status_log
        where changed_at >= p_from and changed_at < p_to and extension <> '000' and public.cx_name_key(agent) = k), '[]'::jsonb) end,
    'team', coalesce((
        select jsonb_agg(jsonb_build_object('changed_at', s.changed_at, 'extension', 'x' || s.rk, 'agent', 'Colleague ' || s.rk,
                                            'old_status', s.old_status, 'new_status', s.new_status) order by s.changed_at)
        from (select changed_at, old_status, new_status, dense_rank() over (order by extension) as rk
              from public.status_log
              where changed_at >= p_from and changed_at < p_to and extension <> '000' and public.cx_name_key(agent) <> k) s), '[]'::jsonb));
end $$;
revoke all on function public.cx_team_day(timestamptz, timestamptz, text) from public;
grant execute on function public.cx_team_day(timestamptz, timestamptz, text) to authenticated;

notify pgrst, 'reload schema';
`;

function cxAgentStats(data,name){
  const tz=clockOff(), day=todayISO(), now=appNow(), cfg=_cxCfg;
  const rows=CX.rowsFromStatusLog([...(data.mine||[]),...(data.team||[])]);
  if(!rows.length) return {empty:true};
  const R=CX.analyze(rows,{day,now,...cfg,tzOffsetHours:0,dayOffsetHours:tz});
  const key=CX.nameKey(name);
  const me=Object.values(R.agents).find(a=>CX.nameKey(a.agent)===key);
  if(!me) return {empty:true};
  const [from]=CX.dayRange(day,tz);
  const working=a=>Object.keys(a.statusSecs).some(st=>!['off','hol'].includes(cxCat(st)));
  const others=Object.values(R.agents).filter(a=>a.ext!==me.ext&&working(a));
  const around=(ext,hs,he)=>R.intervals.some(iv=>iv.ext===ext&&iv.start<he&&(iv.end==null?R.now:iv.end)>hs&&!['off','hol'].includes(cxCat(iv.status)));
  const hours=[];
  for(let h=cfg.timelineStart;h<cfg.timelineEnd;h++){
    const hs=from+h*3600000, he=hs+3600000; if(hs>now) break;
    const n=ext=>R.calls.filter(c=>c.ext===ext&&c.start>=hs&&c.start<he).length;
    const here=others.filter(a=>around(a.ext,hs,he));            // colleagues who were logged in that hour
    hours.push({h,label:fmtH(h),mine:n(me.ext),avg:here.length?here.reduce((t,a)=>t+n(a.ext),0)/here.length:null,mates:here.length,partial:he>now});
  }
  return {me,hours,mates:others.length,teamCalls:others.length?others.reduce((t,a)=>t+a.calls,0)/others.length:null};
}
function useAgentCx(name){
  const [raw,setRaw]=useState(null);       // null while loading; {off:true} if the setup SQL has not been run yet
  const load=useCallback(async()=>{
    const [from,to]=CX.dayRange(todayISO(),clockOff());
    const {data,error}=(await run(SB.rpc('cx_team_day',{p_from:new Date(from-36*3600000).toISOString(),p_to:new Date(to).toISOString(),p_name:name})))||{};
    setRaw(error||!data||Array.isArray(data)?{off:true}:data);
  },[name]);
  useEffect(()=>{ load(); },[load]);
  useAutoRefresh(load,15000);
  const cfgKey=JSON.stringify(_cxCfg);      // the shared 3CX limits arrive a moment after the page opens: work the numbers out again when they do
  return React.useMemo(()=>{ if(!raw||raw.off) return raw; try{ return cxAgentStats(raw,name); }catch(e){ return {off:true}; } },[raw,name,cfgKey]);
}

// calls per hour: the agent's bars against the team average per logged-in colleague
function CxHourBars({rows}){
  const W=760,H=180,L=30,R=12,T=12,B=26;
  const max=Math.max(1,...rows.map(r=>Math.max(r.mine,r.avg||0)));
  const step=Math.max(1,Math.ceil(max/4)), top=step*4;
  const bw=(W-L-R)/rows.length, x=i=>L+bw*i+bw/2, y=v=>T+(H-T-B)*(1-v/top);
  let line=''; rows.forEach((r,i)=>{ if(r.avg==null){ line+=' '; return; } line+=(line.trim()&&!line.endsWith(' ')?' L':(line.trim()?' M':'M'))+`${x(i)},${y(r.avg)}`; });
  return(
    <svg viewBox={`0 0 ${W} ${H}`} role="img" aria-label="Calls per hour: you compared with the team average">
      {[0,1,2,3,4].map(i=>(<g key={i}><line x1={L} x2={W-R} y1={y(i*step)} y2={y(i*step)} stroke="#2b2b33" strokeWidth="1"/><text x={L-8} y={y(i*step)+4} textAnchor="end" fontSize="11" fill="#7c7c88">{i*step}</text></g>))}
      {rows.map((r,i)=>(
        <g key={i} className="hb">
          <rect x={x(i)-bw*.27} width={bw*.54} y={y(r.mine)} height={Math.max(0,y(0)-y(r.mine))} rx="4" fill={CXC.call} opacity={r.partial?.6:1}/>
          <rect x={x(i)-bw/2} y={T} width={bw} height={H-T-B} fill="transparent"/>
          <title>{`${r.label}–${fmtH(r.h+1)}${r.partial?' (so far)':''}: you ${r.mine} call${r.mine===1?'':'s'} · team average ${r.avg==null?'–':(Math.round(r.avg*10)/10)} per agent`}</title>
          <text x={x(i)} y={H-8} textAnchor="middle" fontSize="11" fill="#7c7c88">{String(r.h).padStart(2,'0')}</text>
        </g>))}
      {line.trim()&&<path d={line.trim()} fill="none" stroke={CXC.admin} strokeWidth="2.2" strokeDasharray="5 5" strokeLinecap="round" strokeLinejoin="round"/>}
      {rows.map((r,i)=>r.avg==null?null:<circle key={'d'+i} cx={x(i)} cy={y(r.avg)} r="3.5" fill={CXC.admin}/>)}
    </svg>
  );
}

      while(!last&&i<60){
        let q=SB.from(tbl).select(cols).gte('changed_at',lo).lt('changed_at',hi);
        q=full?q.order('changed_at',{ascending:true}):q.gt('id',dbLastIdRef.current).order('id',{ascending:true});
        const {data,error}=await run(q.range(i*1000,i*1000+999));
        if(error){ setDbErr(error.message||String(error)); return; }
        got=got.concat(data||[]); last=!data||data.length<1000; i++;
      }
      let all;
      if(full) all=got;
      else if(got.length){ const seen=new Set(dbAllRef.current.map(r=>r.id)); all=dbAllRef.current.concat(got.filter(r=>!seen.has(r.id))).sort((a,b)=>Date.parse(a.changed_at)-Date.parse(b.changed_at)); }
      else all=dbAllRef.current;
      const ids=all.map(r=>Number(r.id)).filter(Number.isFinite);
      dbKeyRef.current=key; dbAllRef.current=all; dbLastIdRef.current=ids.length&&ids.length===all.length?Math.max(...ids):null;   // rows without an id can't be read incrementally: always re-read everything
      if(full) dbFullAtRef.current=Date.now();
      setDbErr(''); if(full||got.length||!dbAt) setDbRows(all); setDbAt(appNow()); bumpSync();
    } finally { dbBusyRef.current=false; }
  },[from,to]);
  useEffect(()=>{ if(source==='db') reloadDb(); },[source,reloadDb]);
  // Instant updates: Supabase Realtime pushes every new status_log row the moment the logger inserts it. Polling stays as a slow safety net
  // (and a faster one while the realtime socket is not connected).
  const [rtOn,setRtOn]=useState(false);
  const addLive=useCallback(row=>{
    if(!row||!row.changed_at||Date.parse(row.changed_at)>=to) return;
    const all=dbAllRef.current;
    if(row.id!=null&&all.some(r=>r.id===row.id)) return;
    const next=all.concat([row]).sort((a,b)=>Date.parse(a.changed_at)-Date.parse(b.changed_at));
    dbAllRef.current=next; if(row.id!=null&&dbLastIdRef.current!=null&&Number(row.id)>dbLastIdRef.current) dbLastIdRef.current=Number(row.id);
    setDbRows(next); setDbAt(appNow()); bumpSync();
  },[to]);
  useEffect(()=>{
    if(source!=='db') return;
    let ch=null;
    try{
      const c=SB, tbl='status_log';
      ch=c.channel('cx-status-'+Math.random().toString(36).slice(2))
        .on('postgres_changes',{event:'INSERT',schema:'public',table:tbl},p=>addLive(p&&p.new))
        .subscribe(st=>setRtOn(st==='SUBSCRIBED'));
    }catch(e){ setRtOn(false); }
    return()=>{ setRtOn(false); try{ ch&&SB.removeChannel(ch); }catch(e){} };
  },[source,addLive]);
  const reloadIfLive=useCallback(()=>{ if(source==='db') return reloadDb(); },[source,reloadDb]);
  useAutoRefresh(reloadIfLive,rtOn?60000:5000);          // safety net: every minute while realtime is connected, every 5 seconds if not
  const goLive=()=>{ setErr(''); setDbErr(''); setSel(null); setText(''); setFileMod(0); setFileName('Supabase · live'); setSource('db'); reloadDb(); };

  const load=(t,name,mod)=>{
    const rows=CX.parseCsv(t);
    if(!rows.length){ setErr('That file has no rows yet. Let the logger run for a while and try again.'); return; }
    setErr(''); setDbErr(''); setSource('file'); setText(t); setFileName(name); setFileMod(mod||0); setSel(null);   // the day is NOT changed: it stays on today (or the day you picked)
  };
  const chooseDay=d=>setPicked(!d||d===todayISO()?null:d);

  const match=isSample?CX_SAMPLE_USERS:users;
  const appLogs=isSample?CX_SAMPLE_APP.filter(l=>inDay(Date.parse(l.start_time))):dbLogs;
  const rowsAll=React.useMemo(()=>isDb?(dbAt?CX.rowsFromStatusLog(dbRows):null):(text?CX.parseCsv(text):null),[isDb,dbRows,dbAt,text]);
  const R=React.useMemo(()=>{
    if(!rowsAll) return null;
    // a CSV is on the logger PC's clock; rows from Supabase are real instants, so the logger clock setting doesn't apply to them.
    // "which day" and the times shown use the app's company clock.
    try{ return CX.analyze(rowsAll,{day,now:appNow(),..._cxCfg,tzOffsetHours:0,dayOffsetHours:tz}); }
    catch(e){ return {error:e.message}; }
  },[rowsAll,day,tz]);
  /* everything below is limited to agents that match an app agent */
  const ok=R&&!R.error;
  const byKey=new Map(match.map(u=>[CX.nameKey(u.name),u]));
  const all=ok?Object.values(R.agents):[];
  const matchedAny=all.some(a=>byKey.has(CX.nameKey(a.agent)));
  const agents=all.filter(a=>byKey.has(CX.nameKey(a.agent))&&Object.keys(a.statusSecs).some(st=>!['off','hol'].includes(cxCat(st)))).map(a=>({...a,app:byKey.get(CX.nameKey(a.agent)).name,uid:byKey.get(CX.nameKey(a.agent)).id})).sort((a,b)=>a.app.localeCompare(b.app));
  const shown=new Set(agents.map(a=>a.ext));
  const hidden=all.filter(a=>!byKey.has(CX.nameKey(a.agent))).length;
  const tot=agents.reduce((t,a)=>({calls:t.calls+a.calls,talk:t.talk+a.callSecs,ans:t.ans+a.answered,ign:t.ign+a.ignored,short:t.short+a.shortCalls,admin:t.admin+a.adminSecs}),{calls:0,talk:0,ans:0,ign:0,short:0,admin:0});
  const rate=tot.ans+tot.ign?Math.round(tot.ans/(tot.ans+tot.ign)*100)+'%':'–';

  /* break check: 3CX against what the agents entered. Read-only, and only shown in its own table:
     it is never added to the alerts or to notifications, and nothing the agents entered is changed. */
  const uids=new Set(agents.map(a=>a.uid));
  const cxBreaks=ok?CX.toBreakLogs(R.intervals,match,{tzOffsetHours:0}).logs.filter(l=>inDay(Date.parse(l.start_time))&&uids.has(l.user_id)):[];
  const appBreaks=appLogs.filter(l=>uids.has(l.user_id));
  const cmp=ok?CX.compareBreaks(cxBreaks,appBreaks,{tzOffsetHours:tz,now:R.now,breakToleranceSec:_cxCfg.breakToleranceMin*60}):[];
  // a row differs when the totals are further apart than the tolerance, or the number of breaks isn't the same
  const isDiff=c=>Math.abs(c.diffSecs)>_cxCfg.breakToleranceMin*60||c.cxCount!==c.appCount;
  const flagged=cmp.filter(isDiff);
  const extOfUid={}; agents.forEach(a=>{ extOfUid[a.uid]=a.ext; });

  /* The ONLY thing the break check does besides the table: one notification a day, `breakCheckLeadMin` minutes before shift end
     (Settings), if any agent's breaks differ. It is not added to the alerts list. */
  const checkAt=addMin(shiftEnd,-_cxCfg.breakCheckLeadMin);
  const notifyDue=day===todayStr&&wallHM()>=checkAt;
  const names=flagged.map(c=>c.agent_name);
  useEffect(()=>{
    if(!ok||!notifyDue||names.length===0) return;
    const k='bt_cx_notified_'+day;
    try{ if(localStorage.getItem(k)) return; localStorage.setItem(k,'1'); }catch(e){}
    fireNotification({title:'Break check',body:`${names.slice(0,4).join(', ')}${names.length>4?` and ${names.length-4} more`:''}: breaks in 3CX differ from what they logged`,type:'custom',duration:12000});
  },[ok,notifyDue,names.length,day]);

  /* alerts: the call alerts from the analysis */
  const alertsAll=ok?R.alerts.filter(a=>shown.has(a.ext)).map(a=>({...a,agent:(byKey.get(CX.nameKey(a.agent))||{}).name||a.agent})).sort((a,b)=>a.at-b.at):[];
  const akey=a=>`${a.type}|${a.ext}|${a.at}`;
  const alerts=alertsAll.filter(a=>!dismissed[akey(a)]);
  const done=alertsAll.filter(a=>dismissed[akey(a)]);
  const saveDismissed=n=>{ setDismissed(n); try{ localStorage.setItem(CX_DISMISS_KEY,JSON.stringify(n)); }catch(e){} };
  const dismiss=a=>saveDismissed({...dismissed,[akey(a)]:1});
  const restore=a=>{ const n={...dismissed}; delete n[akey(a)]; saveDismissed(n); };
  const clearAll=()=>{ const n={...dismissed}; alerts.forEach(a=>{ n[akey(a)]=1; }); saveDismissed(n); };

  // days that appear in the log (company clock), plus today; newest 14
  const days=ok?[...new Set([day,todayStr,...R.intervals.map(iv=>{ const w=wall(iv.start); return `${w.getUTCFullYear()}-${pad(w.getUTCMonth()+1)}-${pad(w.getUTCDate())}`; })])].sort().slice(-14):[];
  const dayLabel=new Date(day+'T00:00:00Z').toLocaleDateString([],{weekday:'long',month:'long',day:'numeric',timeZone:'UTC'});

  // chart range: real activity that started this day (idle "Available" and last night's carry-over don't set it)
  let startH=8,endH=18,capEnd=appNow();
  const mine=ok?R.intervals.filter(iv=>shown.has(iv.ext)):[];
  if(ok&&mine.length){
    const logEnd=Math.max(...mine.map(iv=>iv.end??iv.start));
    capEnd=Math.min(appNow(),Math.max(logEnd,from));
    const act=mine.filter(iv=>['call','ring','admin','brk'].includes(cxCat(iv.status))&&iv.start>=from&&iv.start<to);
    if(act.length){
      const mn=Math.min(...act.map(iv=>iv.start)), mx=Math.max(...act.map(iv=>Math.min(iv.end??capEnd,to)));
      startH=Math.max(0,Math.floor((mn-from)/3600000)); endH=Math.min(24,Math.ceil((mx-from)/3600000)+1);
      if(endH-startH<6) endH=Math.min(24,startH+6);
    }
  }
  const hours=[...Array(Math.max(0,endH-startH)).keys()].map(i=>startH+i);
  const callsAt=ok?R.calls.filter(c=>shown.has(c.ext)&&inDay(c.start)):[];
  const look=ok?[...R.rings.filter(r=>shown.has(r.ext)&&r.outcome==='ignored'&&inDay(r.start)).map(r=>r.start),
                 ...callsAt.filter(c=>!c.open&&!c.partialStart&&c.secs<_cxCfg.shortCallSec).map(c=>c.start)]:[];
  const bucket=list=>hours.map(h=>list.filter(t=>Math.floor((t-from)/3600000)===h).length);
  const chartCalls=bucket(callsAt.map(c=>c.start)), chartLook=bucket(look);

  const latest={};
  if(ok) for(const iv of R.intervals) if(iv.start<to&&(!latest[iv.ext]||iv.start>=latest[iv.ext].start)) latest[iv.ext]=iv;
  const statusOf=ext=>latest[ext]?latest[ext].status:'';
  const nowCount=cat=>agents.filter(a=>cxCat(statusOf(a.ext))===cat).length;

  const sgn=d=>Math.abs(d)<1?'0s':`+${CX.fmtDur(Math.abs(d))}`;   // how far the two totals are apart (both values are in the columns next to it)
  const kind=a=>a.type==='short_call'?{t:'Short call',cls:'b-bath',ic:'bth',d:`Lasted ${a.secs}s`}
    :a.type==='repeated_ignore'?{t:'Repeated',cls:'',ic:'brk',d:`${a.count} ignored calls within ${_cxCfg.repeatIgnoreWindowMin} min`,red:true}
    :{t:'Ignored',cls:'b-brk',ic:'brk',d:`Rang ${a.secs}s, not answered`};
  const alertText=a=>`${a.agent}: ${kind(a).d}`;
  const redBadge={background:'rgba(220,38,38,.18)',color:'var(--bad-txt)'};

  const header=(
    <>
      <div className="acts">
        <input className="fi" type="date" value={day} onChange={e=>chooseDay(e.target.value)} style={{width:190,height:47}} aria-label="Choose a day"/>
        {picked&&<button className="bs" onClick={()=>setPicked(null)}>Today</button>}
        <div className="acts-r"><ConnInstrument/></div>
      </div>
      {err&&<div className="ebox"><Ic n="alert" size={15}/>{err}</div>}
      {isDb&&dbErr&&<div className="ebox" style={{flexDirection:'column',alignItems:'flex-start',gap:10}}><span><Ic n="alert" size={15}/> Couldn't read the status_log table: {dbErr}</span><span style={{color:'var(--mut)',fontSize:14}}>{missingTable?'The table doesn\'t exist in this project yet. Run the SQL once in the Supabase SQL Editor (it also lets the logger add rows and admins read them), then reload the page. The logger must upload to this same project.':'If it says "permission denied", or the table is empty when it shouldn\'t be, admins need permission to read it.'}</span>{missingTable?<CopySql sql={CX_SETUP_SQL} label="Copy SQL to create the table"/>:<CopySql sql={CX_READ_SQL} label="Copy SQL to allow admins to read it"/>}</div>}
      {R&&R.error&&<div className="ebox"><Ic n="alert" size={15}/>{R.error}</div>}
    </>
  );

  /* ─────────────── one agent's profile ─────────────── */
  const profile=sel&&ok?agents.find(a=>a.ext===sel):null;
  if(profile){
    const a=profile, cat=cxCat(statusOf(a.ext)), col=CXC[cat];
    const myCalls=R.calls.filter(c=>c.ext===a.ext&&inDay(c.start));
    const myRings=R.rings.filter(r=>r.ext===a.ext&&inDay(r.start)&&r.outcome!=='ringing');
    const myAdmin=R.intervals.filter(iv=>iv.ext===a.ext&&cxCat(iv.status)==='admin'&&inDay(iv.start));
    const myAlerts=alerts.filter(x=>x.ext===a.ext);
    const mine=cmp.find(c=>c.user_id===a.uid);
    const ringLabel={answered:'Answered',ignored:'Not answered',taken_by_other:'Answered by a colleague',short_ring:'Caller hung up first'};
    const longest=myCalls.reduce((m,c)=>Math.max(m,c.secs),0);
    const hmOf=ms=>wallHM(ms);
    const row=(key,left,mid,right,flag)=>(
      <div key={key} className="acc-row" style={{minHeight:54}}>
        <div style={{width:112,fontVariantNumeric:'tabular-nums',color:'var(--mut)',fontSize:15}} className="pv">{left}</div>
        <div className="acc-n pv" style={{fontSize:16}}>{mid}{flag}</div>
        <div className="acc-v pv" style={{fontSize:16}}>{right}</div>
      </div>
    );
    return(
      <div className="page">
        <button className="bs cx-back" onClick={()=>setSel(null)}><span aria-hidden="true">←</span> All agents</button>
        {header}
        <div className="cx-prof">
          <div className="cx-av lg" style={{boxShadow:`inset 0 0 0 3px ${col}`}}>{ini(a.app)}</div>
          <div>
            <h1 className="pv">{a.app}</h1>
            <p className="hello-s" style={{marginBottom:10}}><span className="pv">ext {a.ext}</span> · {dayLabel}</p>
            <span className="cx-st" style={{'--c':col}}>{statusOf(a.ext)||'No activity'}</span>
          </div>
        </div>
        <div className="card acc" style={{marginBottom:34}}>
          <div className="cx-tiles pv">
            <div><span>Calls</span><b>{a.calls}</b></div>
            <div><span>Talk time</span><b>{CX.fmtDur(a.callSecs)}</b></div>
            <div><span>Average call</span><b>{CX.fmtDur(a.avgCallSecs)}</b></div>
            <div><span>Longest call</span><b>{CX.fmtDur(longest)}</b></div>
            <div><span>Answer rate</span><b>{a.answerRate==null?'–':Math.round(a.answerRate*100)+'%'}</b></div>
            <div><span>Ignored rings</span><b style={a.ignored?{color:'var(--bad-txt)'}:null}>{a.ignored}</b></div>
            <div><span>Short calls</span><b style={a.shortCalls?{color:'var(--warn-txt)'}:null}>{a.shortCalls}</b></div>
            <div><span>Admin time</span><b>{CX.fmtDur(a.adminSecs)}</b></div>
            <div><span>Breaks</span><b>{a.breaks}</b></div>
            <div><span>Break time</span><b>{CX.fmtDur(a.breakSecs)}</b></div>
          </div>
          <div style={{padding:'0 12px'}}>
            <div className="card-t" style={{fontSize:16,marginBottom:6}}>Timeline of the day</div>
            {(()=>{
              const H0=_cxCfg.timelineStart, H1=_cxCfg.timelineEnd, ws=from+H0*3600000, we=from+H1*3600000, span=we-ws;   // only the working window (company clock)
              const segs=R.intervals.filter(iv=>iv.ext===a.ext).map(iv=>({st:iv.status,s:Math.max(iv.start,ws),e:Math.min(iv.end==null?R.now:iv.end,we,R.now),part:iv.partialStart})).filter(x=>x.e>x.s).sort((p,q)=>p.s-q.s);
              const split={}; segs.forEach(x=>{ const c=cxCat(x.st); split[c]=(split[c]||0)+(x.e-x.s)/1000; });
              const order=['call','admin','brk','avail','avail2','hol','ring','other','off'].filter(c=>split[c]>0);
              const total=order.reduce((t,c)=>t+split[c],0)||1;
              const ticks=[]; for(let h=H0;h<=H1;h++) ticks.push(h);
              return(<div className="cx-tl pv">
                <div className="cx-tl-track">{segs.map((x,k)=>{ const l=(x.s-ws)/span*100, w=(x.e-x.s)/span*100, mid=l+w/2; return(
                  <div key={k} className={`cx-seg${mid<14?' l':mid>86?' r':''}`} style={{left:`${l}%`,width:`${w}%`,background:CXC[cxCat(x.st)]}}>
                    <span className="cx-tip"><b>{x.st}</b>{CX.fmtDur((x.e-x.s)/1000)}<em>{wallHM(x.s)} – {wallHM(x.e)}{x.part?' · started before logging':''}</em></span>
                  </div>); })}</div>
                <div className="cx-tl-axis">{ticks.map(h=><span key={h} style={{left:`${(h-H0)/(H1-H0)*100}%`}}>{String(h%24).padStart(2,'0')}:00</span>)}</div>
                <div className="cx-split pv">{order.map(c=><div key={c}><i style={{background:CXC[c]}}/>{CX_LABEL[c]}<b>{CX.fmtDur(split[c])} · {Math.round(split[c]/total*100)}%</b></div>)}</div>
              </div>);
            })()}
          </div>
        </div>
        <div className="cx-two2">
          <div className="card acc">
            <div className="card-hd"><div className="card-t">Calls <span className="cx-list-sub">{myCalls.length}</span></div></div>
            {myCalls.length===0?<div className="onb-empty"><div>No calls this day</div></div>:myCalls.map((c,i)=>row(i,`${hmOf(c.start)} – ${c.open?'now':hmOf(c.end)}`,'Call',CX.fmtDur(c.secs),
              !c.open&&!c.partialStart&&c.secs<_cxCfg.shortCallSec?<span className="badge b-bath">Short</span>:c.partialStart?<span className="badge">Started before logging</span>:null))}
          </div>
          <div className="card acc">
            <div className="card-hd"><div className="card-t">Rings <span className="cx-list-sub">{myRings.length}</span></div></div>
            {myRings.length===0?<div className="onb-empty"><div>No rings this day</div></div>:myRings.map((r,i)=>row(i,hmOf(r.start),ringLabel[r.outcome]||r.outcome,`${Math.round(r.secs)}s`,
              r.outcome==='ignored'?<span className="badge" style={redBadge}>Ignored</span>:null))}
          </div>
          <div className="card acc">
            <div className="card-hd"><div className="card-t">Breaks: agent's log and 3CX <span className="cx-list-sub">{mine?(mine.flagged?'differs':'matches'):'none'}</span></div></div>
            {!mine?<div className="onb-empty"><div>No breaks this day</div></div>:<>
              {mine.pairs.map((p,i)=>row('p'+i,`${hmOf(p.cx.s)} – ${p.cx.open?'now':hmOf(p.cx.e)}`,'3CX',`log ${hmOf(p.app.s)} – ${p.app.open?'now':hmOf(p.app.e)}`,null))}
              {mine.onlyCx.map((x,i)=>row('c'+i,`${hmOf(x.s)} – ${x.open?'now':hmOf(x.e)}`,'3CX only','',<span className="badge" style={redBadge}>Not in agent's log</span>))}
              {mine.onlyApp.map((x,i)=>row('a'+i,`${hmOf(x.s)} – ${x.open?'now':hmOf(x.e)}`,"Agent's log only",'',<span className="badge" style={redBadge}>Not in 3CX</span>))}
            </>}
          </div>
          <div className="card acc">
            <div className="card-hd"><div className="card-t">Admin <span className="cx-list-sub">{myAdmin.length}</span></div></div>
            {myAdmin.length===0?<div className="onb-empty"><div>No admin time this day</div></div>:myAdmin.map((iv,i)=>row(i,`${hmOf(iv.start)} – ${iv.end?hmOf(iv.end):'now'}`,iv.status,CX.fmtDur(((iv.end??capEnd)-iv.start)/1000),iv.partialStart?<span className="badge">Started before logging</span>:null))}
          </div>
          <div className="card acc" style={{gridColumn:'1 / -1'}}>
            <div className="card-hd"><div className="card-t">Alerts <span className="cx-list-sub">{myAlerts.length}</span></div></div>
            {myAlerts.length===0?<div className="onb-empty"><div>No open alerts for {a.app.split(' ')[0]} this day</div></div>:myAlerts.map((x,i)=>{ const k=kind(x); return(
              <div key={i} className="acc-row" style={{minHeight:54}}>
                <div style={{width:112,color:'var(--mut)',fontSize:15}} className="pv">{hmOf(x.at)}</div>
                <div className="acc-n pv" style={{fontSize:16,whiteSpace:'normal'}}>{k.d} <span className={`badge ${k.cls}`} style={k.red?redBadge:null}>{k.t}</span></div>
                <button className="cx-done" title="Mark as dealt with" aria-label="Mark as dealt with" onClick={()=>dismiss(x)}><Ic n="check" size={16}/></button>
              </div>); })}
          </div>
        </div>
      </div>
    );
  }

  /* ─────────────── the team page ─────────────── */
  return(
    <div className="page">
      <h1 className="hello">3CX calls</h1>
      <p className="hello-s">{ok?`${dayLabel}${day===todayStr?' (today)':''} · ${tot.calls} calls · ${alerts.length} alert${alerts.length===1?'':'s'}`:'Reads what the 3CX logger uploads to Supabase · nothing is written'}</p>
      {header}

      {!R&&(
        <div className="card acc"><div className="onb-empty">
          <div className="es-ic"><Ic n="phone" size={24}/></div>
          <div>{dbErr?'Waiting for the status log':'Reading the status_log table…'}</div>
          <span>This reads what the 3CX logger uploads. Nothing is written.</span>
        </div></div>
      )}

      {ok&&agents.length>0&&day===todayStr&&(()=>{
        const T=[['call','On a call','phone'],['brk','On break','coffee'],['admin','On admin','edit'],['avail','Available','check']];
        const here=agents.filter(a=>!['off','hol'].includes(cxCat(statusOf(a.ext)))).length, n=here||1, other=here-T.reduce((t,x)=>t+nowCount(x[0]),0);
        return(<div className="cx-live" aria-label="Right now">
          <div className="cx-live-t">Right now <small>{here} logged in</small></div>
          <div className="cx-live-g">
            {T.map(([c,l,ic])=>{ const v=nowCount(c); return(
              <div key={c} className={`cx-lt${v?'':' zero'}`} style={{'--c':CXC[c]}}>
                <div className="cx-lt-ic"><Ic n={ic} size={20}/></div>
                <b>{v}</b><span>{l}</span>
                <em><i style={{width:`${v/n*100}%`}}/></em>
              </div>); })}
          </div>
          <div className="cx-mix" title="Whole team right now">
            {T.map(([c,l])=>nowCount(c)>0&&<i key={c} style={{flex:nowCount(c),background:CXC[c]}} title={`${l} ${nowCount(c)}`}/>)}
            {other>0&&<i style={{flex:other,background:'#3a3d4a'}} title={`Other ${other}`}/>}
          </div>
        </div>);
      })()}

      {ok&&all.length===0&&(
        <div className="card acc"><div className="onb-empty">
          <div className="es-ic"><Ic n="phone" size={24}/></div>
          <div>No rows in the log for {dayLabel}</div>

/* ── Archive old data ─────────────────────────────────────────
   Frees Supabase storage: finds rows older than the chosen cutoff,
   lets the admin download each table as CSV, then deletes exactly
   the rows that were downloaded. Home analytics reads the last 30
   days, so the cutoff can't be shorter than ARCHIVE_MIN_DAYS. */
const ARCHIVE_MIN_DAYS = 35;
const ARCHIVE_TABLES = [
  { t:'bt_logs',           label:'Break logs',     q:(s,c)=>s.lt('start_time',c.iso).not('end_time','is',null) },
  { t:'bt_clocklogs',      label:'Clock logs',     q:(s,c)=>s.lt('date',c.date) },
  { t:'bt_swap_requests',  label:'Swap requests',  q:(s,c)=>s.lt('date',c.date) },
  { t:'bt_lunch_schedule', label:'Lunch schedules',q:(s,c)=>s.lt('date',c.date) },
];
const rowsToCsv = rows => {
  const cols = [...new Set(rows.flatMap(r=>Object.keys(r)))];
  const cell = v => v==null ? '' : `"${(typeof v==='object'?JSON.stringify(v):String(v)).replace(/"/g,'""')}"`;
  return cols.join(',')+'\n'+rows.map(r=>cols.map(k=>cell(r[k])).join(',')).join('\n');
};
function AArchive(){
  const [days,setDays]=useState(90);
  const [scan,setScan]=useState(null);   // {cut, tables:{[t]:rows}}
  const [saved,setSaved]=useState({});   // tables downloaded since the scan
  const [busy,setBusy]=useState('');
  const [msg,setMsg]=useState('');
  const [err,setErr]=useState('');
  const [needPolicy,setNeedPolicy]=useState(false);

  const cutoff=()=>{
    const ms=localMidnight()-days*864e5, w=wall(ms);
    return { iso:new Date(ms).toISOString(), date:`${w.getUTCFullYear()}-${pad(w.getUTCMonth()+1)}-${pad(w.getUTCDate())}` };
  };
  const doScan=async()=>{
    setBusy('scan');setErr('');setMsg('');setSaved({});setNeedPolicy(false);
    const cut=cutoff(), tables={};
    for(const {t,q} of ARCHIVE_TABLES){
      const rows=[];
      for(let from=0;;from+=1000){
        const {data,error}=await run(q(SB.from(t).select('*'),cut).order('id').range(from,from+999));
        if(error){ setErr(`${t}: ${error.message}`); setBusy(''); return; }
        rows.push(...(data||[]));
        if(!data||data.length<1000) break;
      }
      tables[t]=rows;
    }
    setScan({cut,tables}); setBusy('');
  };
  const download=t=>{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([rowsToCsv(scan.tables[t])],{type:'text/csv'}));
    a.download=`${t}-before-${scan.cut.date}.csv`; a.click();
    setSaved(s=>({...s,[t]:true}));
  };
  const nonEmpty = scan ? ARCHIVE_TABLES.filter(({t})=>scan.tables[t].length) : [];
  const total = nonEmpty.reduce((n,{t})=>n+scan.tables[t].length,0);
  const allSaved = nonEmpty.every(({t})=>saved[t]);
  const doDelete=async()=>{
    if(!confirm(`Permanently delete ${total} rows from before ${scan.cut.date}? Make sure the CSV files are saved somewhere safe.`)) return;
    setBusy('del');setErr('');setMsg('');
    let deleted=0, blocked=false;
    for(const {t} of nonEmpty){
      const ids=scan.tables[t].map(r=>r.id);
      for(let i=0;i<ids.length;i+=100){
        const chunk=ids.slice(i,i+100);
        const {data,error}=await run(SB.from(t).delete().in('id',chunk).select('id'));
        if(error){ setErr(`${t}: ${error.message}`); setBusy(''); return; }
        deleted+=(data||[]).length;
        if((data||[]).length<chunk.length) blocked=true;
      }
    }
    setBusy(''); setScan(null); setSaved({});
    setNeedPolicy(blocked);
    setMsg(`Deleted ${deleted} of ${total} rows.`);
  };

  return(
    <div className="sblk">
      <h2 className="sh">Archive old data</h2>
      <p className="sd">Frees database space. Rows older than the cutoff are downloaded as CSV files, then removed from the database. Open breaks are never removed. Agents who haven't clocked in since the cutoff will drop off the agent pickers.</p>
      {err&&<div className="ebox"><Ic n="alert" size={14}/>{err}</div>}
      <div className="num-wrap">
        <button className="nb" onClick={()=>{setDays(d=>Math.max(ARCHIVE_MIN_DAYS,d-5));setScan(null);}}>−</button>
        <div className="nv" style={{minWidth:110}}>{days} days</div>
        <button className="nb" onClick={()=>{setDays(d=>d+5);setScan(null);}}>+</button>
      </div>
      <p style={{fontSize:13.5,color:'var(--mut)',marginTop:12}}>Keep the last {days} days. Minimum {ARCHIVE_MIN_DAYS}, because Home analytics uses the last 30 days.</p>
      <div style={{marginTop:20,display:'flex',alignItems:'center',gap:12}}>
        <button className="bs" onClick={doScan} disabled={!!busy}>{busy==='scan'?<span className="spin-sm"/>:'Find old rows'}</button>
        {msg&&<span style={{color:'var(--green)',fontSize:14,display:'flex',alignItems:'center',gap:6}}><Ic n="check" size={15}/> {msg}</span>}
      </div>
      {scan&&(
        <div style={{marginTop:20}}>
          {total===0
            ? <p className="sd" style={{marginBottom:0}}>Nothing older than {scan.cut.date}.</p>
            : <>
                <p className="sd" style={{marginBottom:12}}>Step 1: download each file. Step 2: delete.</p>
                {nonEmpty.map(({t,label})=>(
                  <div key={t} style={{display:'flex',alignItems:'center',gap:12,marginBottom:10}}>
                    <button className="bs" onClick={()=>download(t)} disabled={!!busy}><Ic n="download" size={14}/> {label}</button>
                    <span style={{fontSize:14,color:'var(--mut)'}}>{scan.tables[t].length} rows</span>
                    {saved[t]&&<span style={{color:'var(--green)',fontSize:14,display:'flex',alignItems:'center'}}><Ic n="check" size={15}/></span>}
                  </div>
                ))}
                <div style={{marginTop:14}}>
                  <button className="bp" onClick={doDelete} disabled={!!busy||!allSaved}>{busy==='del'?<span className="spin-sm"/>:`Delete ${total} rows`}</button>
                </div>
              </>}
        </div>
      )}
      {needPolicy&&(
        <div style={{marginTop:18}}>
          <p className="sd" style={{marginBottom:10}}>Some rows weren't deleted because the database doesn't allow deletes yet. One-time setup: run this in the Supabase SQL Editor, sign out and back in, then try again. Change the email to your admin account.</p>
          <div className="codebox">
            <b>UPDATE</b> auth.users <b>SET</b> raw_app_meta_data = raw_app_meta_data || '{`{"role":"admin"}`}' <b>WHERE</b> email = 'admin@example.com';<br/>
            {ARCHIVE_TABLES.map(({t})=>(
              <React.Fragment key={t}><b>CREATE POLICY</b> "admin archive" <b>ON</b> {t} <b>FOR DELETE TO</b> authenticated <b>USING</b> ((auth.jwt()-&gt;'app_metadata'-&gt;&gt;'role') = 'admin');<br/></React.Fragment>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

  const [t,setT]=useState(appNow());
  useEffect(()=>{ const id=setInterval(()=>setT(appNow()),1000); return()=>clearInterval(id); },[]);
  const w=wall(t),day=DAYS[w.getUTCDay()],hrs=pad(w.getUTCHours()),mins=pad(w.getUTCMinutes()),secs=pad(w.getUTCSeconds());
  return(
    <div className="live-clock">
      <div className="clk-seg"><div className="clk-day-val">{day}</div><div className="clk-unit">Day</div></div>
      <div className="clk-sep">:</div>
      <div className="clk-seg"><TNum className="clk-num" value={hrs}/><div className="clk-unit">Hours</div></div>
      <div className="clk-sep">:</div>
      <div className="clk-seg"><TNum className="clk-num" value={mins}/><div className="clk-unit">Minutes</div></div>
      <div className="clk-sep">:</div>
      <div className="clk-seg"><TNum className="clk-num" value={secs}/><div className="clk-unit">Seconds</div></div>
    </div>
  );
}
function LSec({start}){
  const [s,setS]=useState(Math.round((appNow()-new Date(start).getTime())/1000));
  useEffect(()=>{ const id=setInterval(()=>setS(Math.round((appNow()-new Date(start).getTime())/1000)),1000); return()=>clearInterval(id); },[start]);
  return <TNum className="mono act" value={tStr(Math.max(0,s))}/>;
}
function LType({start}){
  const [s,setS]=useState(Math.round((appNow()-new Date(start).getTime())/1000));
  useEffect(()=>{ const id=setInterval(()=>setS(Math.round((appNow()-new Date(start).getTime())/1000)),5000); return()=>clearInterval(id); },[start]);
  return <BB type={bType(s)}/>;
}
function LT({logs,showDate}){
  return(
    <div className="tbl-wrap"><table className="dt">
      <thead><tr><th>Agent</th>{showDate&&<th>Date</th>}<th>Start</th><th>Return</th><th>Duration</th><th>Type</th></tr></thead>
      <tbody>
        {logs.map(l=>(
          <tr key={l.id}>
            <td><AvC name={l.agent_name}/></td>
            {showDate&&<td style={{color:'var(--mut)',fontSize:12}}>{fmtD(l.start_time)}</td>}
            <td>{fmtT(l.start_time)}</td>
            <td>{l.end_time?fmtT(l.end_time):<span className="badge b-on">On Break</span>}</td>
            <td>{l.duration_secs!=null?durStr(l.duration_secs):l.end_time?'—':<LSec start={l.start_time}/>}</td>
            <td>{l.break_type?<BB type={l.break_type}/>:l.end_time?'—':<LType start={l.start_time}/>}</td>
          </tr>
        ))}
      </tbody>
    </table></div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
