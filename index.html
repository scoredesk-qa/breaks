<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="theme-color" content="#17171c"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>BreakTrack</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2326262d'/%3E%3Ccircle cx='16' cy='16' r='10.5' fill='none' stroke='%23c9c9d2' stroke-width='2'/%3E%3Cline x1='16' y1='9' x2='16' y2='16' stroke='%23c9c9d2' stroke-width='2' stroke-linecap='round'/%3E%3Cline x1='16' y1='16' x2='21' y2='18.5' stroke='%23c9c9d2' stroke-width='2' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='1.6' fill='%23c9c9d2'/%3E%3C/svg%3E"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.7/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.52.1/dist/umd/supabase.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  /* ── Mercury-style dark banking palette ── */
  --bg:#17171c;--side:#17171c;
  --surf:#1d1d23;              /* card */
  --card:#26262d;              /* pill / input / icon-button fill */
  --card2:#2e2e36;
  --hover:#232329;
  --bdr:#2b2b33;--bdr-lt:#393943;
  --txt:#ededf1;--txt2:#c9c9d2;--mut:#9a9aa6;--mut2:#6c6c78;

  --violet:#5266eb;--violet-hi:#6377f5;   /* primary action */
  --link:#8e9cff;
  /* group A / accent, group B, status */
  --amber:#8e9cff;--amber-d:rgba(142,156,255,.12);--amber-r:rgba(142,156,255,.32);--amber-glow:rgba(142,156,255,.45);
  --indigo:#d4a5f5;--indigo-d:rgba(212,165,245,.11);--indigo-r:rgba(212,165,245,.3);
  --blue:#6cb0f5;--blue-d:rgba(108,176,245,.11);--blue-r:rgba(108,176,245,.3);
  --green:#4fc79a;--green-d:rgba(79,199,154,.11);--green-r:rgba(79,199,154,.3);--green-glow:rgba(79,199,154,.45);
  --red:#f0718b;--red-d:rgba(240,113,139,.11);--red-r:rgba(240,113,139,.3);

  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-mono:'Inter',-apple-system,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  --r-card:16px;
}
html,body,#root{min-height:100%;background:var(--bg);color:var(--txt);font-family:var(--font);font-size:15px;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
::selection{background:rgba(82,102,235,.5);color:#fff}
:focus-visible{outline:2px solid var(--link);outline-offset:2px;border-radius:8px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2f2f38;border-radius:999px;border:3px solid var(--bg)}
button{font-family:inherit;-webkit-tap-highlight-color:transparent}
.mono,.tnum{font-variant-numeric:tabular-nums}
.tnum{display:inline-flex;line-height:1}
.tnum-d{display:inline-block;animation:flapIn .35s var(--ease)}
@keyframes flapIn{0%{opacity:0;transform:translateY(-35%)}100%{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.tnum-d{animation:none}*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
.privacy .pv{filter:blur(7px);transition:filter .2s}
.pv{transition:filter .2s}

/* ── Loading ── */
.spl{display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:22px}
.spin{width:22px;height:22px;border:2px solid var(--bdr-lt);border-top-color:var(--txt);border-radius:50%;animation:rot .8s linear infinite}
.spin-sm{width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite;display:inline-block}
.spin-sm.on-dark{border:2px solid rgba(255,255,255,.2);border-top-color:#fff}
@keyframes rot{to{transform:rotate(360deg)}}

/* ── Wordmark / org switcher ── */
.wm{display:flex;align-items:center;gap:11px}
.wm-icon{width:32px;height:32px;border-radius:9px;background:#2a2a32;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.wm.sm .wm-icon{width:30px;height:30px}
.wm-t{font-size:15.5px;font-weight:500;color:var(--txt);letter-spacing:-.005em}
.wm-t b{font-weight:500}

/* ── Buttons ── */
.bp{background:var(--violet);color:#fff;border:none;border-radius:999px;padding:9px 18px;font-size:15px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;transition:background .15s,transform .1s}
.bp:hover:not(:disabled){background:var(--violet-hi)}
.bp:active:not(:disabled){transform:scale(.98)}
.bp:disabled{opacity:.4;cursor:not-allowed}
.bp.full{width:100%;margin-top:8px;padding:12px 18px;border-radius:10px}
.bp.blue{background:var(--violet)}
.bs{background:var(--card);color:var(--txt);border:none;border-radius:999px;padding:9px 18px;font-size:15px;font-weight:400;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;transition:background .15s,transform .1s}
.bs:hover:not(:disabled){background:var(--card2)}
.bs:active:not(:disabled){transform:scale(.98)}
.bs:disabled{opacity:.45;cursor:not-allowed}
.bs svg,.bp svg{opacity:.9}
.ib{background:none;border:none;border-radius:999px;color:var(--mut);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:8px;transition:color .15s,background .15s}
.ib:hover{color:var(--txt);background:var(--card)}
.icb{width:46px;height:46px;border-radius:999px;background:var(--card);border:none;color:var(--txt2);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;position:relative;transition:background .15s,color .15s;flex-shrink:0}
.icb:hover{background:var(--card2);color:var(--txt)}
.icb.on{color:var(--link)}
.icb .dot{position:absolute;top:11px;right:12px;width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--card)}
.icb.sm{width:40px;height:40px}
.kb{width:30px;height:30px;border-radius:999px;background:none;border:none;color:var(--txt2);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s}
.kb:hover{background:var(--card)}
.lnk{background:none;border:none;color:var(--link);font-size:15px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:4px 0;transition:color .15s}
.lnk:hover{color:#b3bdff}
.btn-go{background:var(--violet);color:#fff;border:none;border-radius:999px;padding:12px 26px;font-size:15px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:background .15s}
.btn-go:hover:not(:disabled){background:var(--violet-hi)}
.btn-go:disabled{opacity:.4;cursor:not-allowed}
.btn-end{background:var(--card);color:var(--txt);border:none;border-radius:999px;padding:12px 26px;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn-end:hover{background:var(--card2)}

/* ── Forms ── */
.fg{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}
.fl{font-size:13.5px;font-weight:400;color:var(--txt2)}
.fi{background:var(--bg);border:1px solid var(--bdr-lt);border-radius:10px;padding:11px 14px;color:var(--txt);font-size:15px;font-family:var(--font);outline:none;width:100%;transition:border-color .15s,box-shadow .15s}
.fi:focus{border-color:var(--link);box-shadow:0 0 0 3px rgba(142,156,255,.15)}
.fi::placeholder{color:var(--mut2)}
select.fi option,.type-sel option{background:#1d1d23}
.iw{position:relative}
.eb{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--mut);cursor:pointer;display:flex;padding:6px;border-radius:999px}
.eb:hover{color:var(--txt);background:var(--card)}
.si{background:var(--card);border:1px solid transparent;border-radius:999px;padding:9px 16px;color:var(--txt);font-size:14px;font-family:var(--font);outline:none;width:200px;transition:border-color .15s}
.si:focus{border-color:var(--bdr-lt)}
.si::placeholder{color:var(--mut2)}
.si[type=date]{color-scheme:dark}
.aerr{display:flex;align-items:center;gap:8px;color:var(--red);font-size:14px;background:var(--red-d);border-radius:10px;padding:11px 14px;margin-bottom:12px}
.awrn{display:flex;align-items:center;gap:10px;color:#f7b3c1;font-size:14px;background:var(--red-d);border:1px solid var(--red-r);border-radius:12px;padding:13px 16px}

/* ── Auth ── */
.auth-bg{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.auth-card{background:var(--surf);border:1px solid var(--bdr);border-radius:18px;padding:40px 36px 34px;width:100%;max-width:420px;animation:mslide .4s var(--ease)}
.auth-logo{margin-bottom:28px}
.auth-h{font-size:28px;font-weight:400;letter-spacing:-.01em;margin-bottom:6px}
.auth-s{color:var(--mut);font-size:15px;margin-bottom:28px}
.eyebrow{display:none}

/* ── Connection instrument ── */
.instr{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--txt2);border-radius:999px;padding:6px 12px 6px 10px;background:var(--card)}
.instr .lite{width:7px;height:7px;border-radius:50%;flex-shrink:0;background:var(--mut2)}
.instr.live .lite{background:var(--green);animation:pulseL 2s ease-in-out infinite}
.instr.connecting .lite{background:#e8b75c;animation:pulseL 1s ease-in-out infinite}
.instr.offline{color:var(--red)}
.instr.offline .lite{background:var(--red)}
.instr .syncedAt{color:var(--mut);margin-left:2px}
@keyframes pulseL{0%,100%{box-shadow:0 0 0 0 rgba(79,199,154,.55)}70%{box-shadow:0 0 0 6px rgba(79,199,154,0)}}

/* ══ App shell ══ */
.shell{display:flex;min-height:100vh}
.side{width:340px;flex-shrink:0;background:var(--side);border-right:1px solid var(--bdr);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow-y:auto;z-index:30}
.side-org{height:94px;padding:0 34px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bdr);flex-shrink:0}
.side-org .chev{color:var(--txt2)}
.side-nav{padding:34px 18px 24px;display:flex;flex-direction:column;gap:6px;flex:1}
.side-sec{font-size:14.5px;color:var(--mut);padding:34px 12px 14px}
.ni{background:none;border:none;border-radius:10px;height:52px;padding:0 16px 0 18px;display:flex;align-items:center;gap:22px;color:var(--txt);font-size:17px;font-weight:400;cursor:pointer;text-align:left;width:100%;transition:background .15s}
.ni svg{color:var(--txt2);flex-shrink:0}
.ni:hover{background:var(--hover)}
.ni.on{background:#26262d}
.ni.on svg{color:var(--link)}
.ni .nbadge{margin-left:auto;min-width:34px;height:30px;padding:0 9px;border-radius:7px;background:#262a45;color:#b9c2ff;font-size:14px;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.side-ft{padding:18px 30px 26px;border-top:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;gap:10px}
.side-ft .muted{font-size:13px;color:var(--mut)}
.scrim{display:none}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:94px;padding:0 120px 0 120px;display:flex;align-items:center;gap:24px;position:sticky;top:0;z-index:20;background:rgba(23,23,28,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.top-menu{display:none}
.srch{flex:1;position:relative;max-width:890px}
.srch-in{width:100%;height:58px;border-radius:12px;border:1px solid var(--bdr-lt);background:transparent;padding:0 90px 0 62px;color:var(--txt);font-size:17px;font-family:var(--font);outline:none;transition:border-color .15s,background .15s}
.srch-in::placeholder{color:var(--mut)}
.srch-in:focus{border-color:#4a4a57;background:#1b1b21}
.srch>svg{position:absolute;left:22px;top:50%;transform:translateY(-50%);color:var(--txt2);pointer-events:none}
.kbd{position:absolute;right:20px;top:50%;transform:translateY(-50%);display:flex;gap:4px;pointer-events:none}
.kbd span{min-width:24px;height:24px;border-radius:5px;background:#2b2b33;color:var(--mut);font-size:12.5px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.srch-pop{position:absolute;left:0;right:0;top:calc(100% + 8px);background:#202027;border:1px solid var(--bdr-lt);border-radius:14px;padding:8px;box-shadow:0 24px 60px rgba(0,0,0,.5);animation:pop .16s var(--ease);max-height:420px;overflow:auto}
.srch-h{font-size:12.5px;color:var(--mut);padding:8px 12px 6px}
.srch-it{display:flex;align-items:center;gap:14px;width:100%;background:none;border:none;color:var(--txt);font-size:15px;padding:11px 12px;border-radius:9px;cursor:pointer;text-align:left}
.srch-it svg{color:var(--txt2)}
.srch-it.act,.srch-it:hover{background:var(--card)}
.srch-it .hint{margin-left:auto;color:var(--mut);font-size:13px}
.srch-empty{padding:18px 12px;color:var(--mut);font-size:14px}
.mv{height:58px;border-radius:999px;border:1px solid var(--bdr-lt);background:none;color:var(--txt);font-size:17px;padding:0 26px 0 30px;display:inline-flex;align-items:center;gap:14px;cursor:pointer;white-space:nowrap;transition:background .15s}
.mv:hover{background:var(--hover)}
.top-ic{display:flex;align-items:center;gap:22px}
.avb{width:58px;height:58px;border-radius:999px;border:none;cursor:pointer;background:linear-gradient(145deg,#e9e9ee,#b9b9c4);color:#1b1b21;font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.clockpill{height:46px;border-radius:999px;background:var(--card);padding:0 18px;display:inline-flex;align-items:center;gap:10px;color:var(--txt2);font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.clockpill b{font-weight:500;color:var(--txt)}

/* ── Dropdown menu ── */
.mn{position:relative;display:inline-flex}
.mn-pop{position:absolute;top:calc(100% + 8px);min-width:240px;background:#202027;border:1px solid var(--bdr-lt);border-radius:14px;padding:6px;box-shadow:0 24px 60px rgba(0,0,0,.5);z-index:60;animation:pop .16s var(--ease)}
.mn-pop.right{right:0}.mn-pop.left{left:0}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
.mn-it{display:flex;align-items:center;gap:12px;width:100%;background:none;border:none;color:var(--txt);font-size:14.5px;padding:10px 12px;border-radius:9px;cursor:pointer;text-align:left;white-space:nowrap}
.mn-it svg{color:var(--txt2)}
.mn-it:hover{background:var(--card)}
.mn-it.danger{color:var(--red)}.mn-it.danger svg{color:var(--red)}
.mn-hd{padding:10px 12px 10px;border-bottom:1px solid var(--bdr);margin-bottom:6px}
.mn-hd b{display:block;font-weight:500;font-size:15px}
.mn-hd span{font-size:13px;color:var(--mut)}

/* ══ Page ══ */
.page{padding:44px 120px 90px;max-width:1660px;width:100%}
.hello{font-size:40px;font-weight:400;letter-spacing:-.015em;line-height:1.15;margin-bottom:10px}
.hello-s{color:var(--mut);font-size:15px;margin-bottom:34px}
.acts{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:34px}
.acts .bp,.acts .bs{height:47px;padding:0 22px;font-size:18px;gap:12px}
.acts-r{margin-left:auto;display:flex;align-items:center;gap:14px}
.cust{background:none;border:none;color:var(--txt);font-size:17px;display:inline-flex;gap:10px;align-items:center;cursor:pointer;padding:8px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:34px;margin-bottom:56px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:34px}
.card{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r-card);position:relative;min-width:0}
.card-p{padding:34px 36px}
.card-hd{display:flex;align-items:center;justify-content:space-between;gap:12px}
.card-t{font-size:19px;font-weight:400;color:var(--txt);display:flex;align-items:center;gap:12px}
.card-ctl{display:flex;align-items:center;gap:10px}
.vbadge{width:30px;height:30px;border-radius:999px;background:#2a2e4d;display:inline-flex;align-items:center;justify-content:center;color:#9aa6ff}
.livedot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulseL 2s ease-in-out infinite;display:inline-block}

/* Money-style number: large figure, raised small decimals */
.amt{display:inline-flex;align-items:flex-start;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.amt-s{font-size:.52em;margin-left:.08em;margin-top:.14em;letter-spacing:0}
.big{font-size:40px;font-weight:400;line-height:1.1;margin-top:8px}
.mid{font-size:26px;font-weight:400;line-height:1.2}

/* Balance-card chart */
.bal{padding:0;overflow:hidden;display:flex;flex-direction:column}
.bal-top{padding:30px 36px 0;display:flex;justify-content:space-between;gap:16px}
.bal-sub{padding:26px 36px 0;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.rng{background:none;border:none;color:var(--txt);font-size:19px;display:inline-flex;align-items:center;gap:10px;cursor:pointer;padding:4px 0}
.inout{display:flex;align-items:center;gap:22px;font-size:19px;font-variant-numeric:tabular-nums}
.inout>span{display:inline-flex;align-items:center;gap:8px}
.up{color:var(--green)}.dn{color:var(--red)}
.seg{display:inline-flex;border:1px solid var(--bdr-lt);border-radius:12px;overflow:hidden;height:58px;background:#1a1a20}
.seg button{width:60px;border:none;background:none;color:var(--txt2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s}
.seg button+button{border-left:1px solid var(--bdr-lt)}
.seg button.on{background:#25252c;color:var(--link)}
.ch{position:relative;margin-top:22px;flex:1;min-height:270px;display:flex;flex-direction:column;cursor:crosshair}
.ch svg{display:block;flex:1}
.ch-x{display:flex;justify-content:space-around;padding:14px 60px 20px;border-top:1px solid var(--bdr);font-size:15.5px;color:var(--mut);background:var(--surf)}
.ch-tip{position:absolute;top:6px;transform:translateX(-50%);background:#26262e;border:1px solid var(--bdr-lt);border-radius:10px;padding:8px 12px;font-size:13.5px;pointer-events:none;white-space:nowrap;box-shadow:0 12px 30px rgba(0,0,0,.4)}
.ch-tip b{display:block;font-weight:500;font-size:15px;margin-top:2px;font-variant-numeric:tabular-nums}
.ch-tip span{color:var(--mut)}
.ch-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:14px;pointer-events:none}
.tview{margin-top:22px;flex:1;max-height:330px;overflow:auto;border-top:1px solid var(--bdr)}

/* Account-style list */
.acc{padding:30px 24px 22px}
.acc .card-hd{padding:0 12px 18px}
.acc-row{position:relative;display:flex;align-items:center;gap:18px;padding:12px 12px;border-radius:10px;min-height:64px;cursor:default;transition:background .12s}
.acc-row:hover{background:var(--hover)}
.acc-ic{width:42px;height:42px;border-radius:999px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;color:var(--txt);background:#26262d;box-shadow:inset 0 0 0 1.5px #55555f}
.acc-ic.brk{box-shadow:inset 0 0 0 1.5px var(--link);color:#c6cdff;background:#23253a}
.acc-ic.lun{box-shadow:inset 0 0 0 1.5px var(--indigo);color:var(--indigo);background:#2a2331}
.acc-ic.bth{box-shadow:inset 0 0 0 1.5px var(--blue);color:var(--blue);background:#1f2833}
.acc-ic.more{box-shadow:none;background:#2a2a32;color:var(--txt2);font-size:13px}
.acc-n{flex:1;min-width:0;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:10px}
.acc-n small{font-size:13px;color:var(--mut)}
.acc-v{font-size:19px;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.acc-v.mut{color:var(--mut);font-size:16px}
.acc-row.link{cursor:pointer}
.acc-tip{position:absolute;right:-50px;bottom:calc(100% - 14px);background:#26262e;border:1px solid var(--bdr-lt);border-radius:10px;padding:14px 18px;min-width:290px;z-index:15;box-shadow:0 18px 40px rgba(0,0,0,.45);opacity:0;pointer-events:none;transform:translateY(4px);transition:opacity .15s,transform .15s}
.acc-row:hover .acc-tip{opacity:1;transform:none}
.acc-tip div{display:flex;justify-content:space-between;gap:24px;font-size:15.5px;line-height:1.9;font-variant-numeric:tabular-nums}
.acc-tip div span:first-child{color:var(--txt2)}
.acc-tip hr{border:none;border-top:1px solid var(--bdr-lt);margin:8px 0}
.acc-empty{padding:40px 12px;color:var(--mut);font-size:15px;text-align:center}

/* On-break-now card + team tiles */
.onb-row{min-height:74px}
.onb-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px}
.onb-bar{height:4px;border-radius:999px;background:#303038;overflow:hidden;max-width:260px}
.onb-bar i{display:block;height:100%;border-radius:999px;background:var(--link);transition:width 1s linear}
.onb-bar.lun i{background:var(--indigo)}.onb-bar.bth i{background:var(--blue)}
.onb-r{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.onb-r small{font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums}
.onb-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:36px 12px;text-align:center;font-size:17px}
.onb-empty span{font-size:14px;color:var(--mut)}
.acc .card-hd{align-items:flex-start}
.onb,.acc{display:flex;flex-direction:column}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding:0 12px;margin-bottom:22px}
.tiles>div{background:#212128;border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tiles>div>span{font-size:13.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tiles b{font-weight:400;font-size:21px;font-variant-numeric:tabular-nums;white-space:nowrap}
.acc-n .badge{flex-shrink:0}
.onb-mid .acc-n{flex-wrap:wrap;white-space:normal;row-gap:4px}
.top3-h{font-size:14px;color:var(--mut);padding:0 12px 6px}
.top3{min-height:58px}
.top3 .onb-mid{gap:7px}

/* Summary cards */
.sm{padding:34px 36px 30px;display:flex;flex-direction:column}
.sm .card-hd{min-height:48px}
.sm-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px}
.sm-cols.two{grid-template-columns:1fr 1fr 1fr}
.sm-l{font-size:16.5px;color:var(--txt2);margin-bottom:10px}
.sm-v{font-size:19px;font-variant-numeric:tabular-nums}
.sm-v .amt-s{font-size:.62em}
.sm-hr{border:none;border-top:1px solid var(--bdr-lt);margin:30px 0 24px}
.sm-ft{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:auto}
.sm-ft .sm-l{display:flex;align-items:center;gap:7px}
.bar{height:10px;border-radius:999px;background:#3a3a44;overflow:hidden;margin-top:26px;display:flex}
.bar i{display:block;height:100%;background:var(--violet);border-radius:999px;transition:width .5s var(--ease)}
.bar i.full{background:var(--red)}
.legend{display:flex;align-items:center;gap:22px;margin-top:14px;font-size:15px;color:var(--txt2);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--violet)}
.legend i.f{background:#6b6b78}
.legend .r{margin-left:auto}
.pay{height:48px;padding:0 24px;border-radius:999px;background:var(--card);border:none;color:var(--txt);font-size:18px;cursor:pointer;transition:background .15s}
.pay:hover{background:var(--card2)}
.fab{position:fixed;right:40px;bottom:30px;width:72px;height:72px;border-radius:999px;background:#25252c;border:1px solid var(--bdr-lt);color:var(--link);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:25;box-shadow:0 14px 40px rgba(0,0,0,.45);transition:background .15s,transform .15s}
.fab:hover{background:#2c2c34;transform:translateY(-1px)}
.fab.spinning svg{animation:rot .8s linear infinite}

/* Slot stepper */
.stepper{display:inline-flex;align-items:center;gap:2px;background:var(--card);border-radius:999px;padding:4px}
.stepper button{width:40px;height:40px;border-radius:999px;border:none;background:none;color:var(--txt);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s}
.stepper button:hover:not(:disabled){background:var(--card2)}
.stepper button:disabled{opacity:.35;cursor:not-allowed}
.stepper span{min-width:30px;text-align:center;font-size:18px;font-variant-numeric:tabular-nums;justify-content:center}

/* Agent: centred single-column page */
.solo>.top{padding-left:max(20px,calc((100% - 1320px)/2));padding-right:max(20px,calc((100% - 1320px)/2))}
.solo>.page{max-width:1400px;margin:0 auto;padding-left:40px;padding-right:40px}

/* Agent break timer card */
.timer{padding:34px 36px 30px;display:flex;flex-direction:column}
.timer.on{border-color:rgba(142,156,255,.35);background:radial-gradient(ellipse 70% 60% at 20% 0%,rgba(82,102,235,.12),transparent 70%),var(--surf)}
.timer-big{font-size:68px;font-weight:400;letter-spacing:-.02em;line-height:1;margin:34px 0 14px;font-variant-numeric:tabular-nums}
.timer-big.idle{color:var(--txt2)}
.timer-sub{color:var(--mut);font-size:16px;line-height:1.5;margin-bottom:28px}
.timer .btn-go{align-self:flex-start;height:52px;padding:0 30px;font-size:17px}
.tbar{margin:-4px 0 28px}
.tbar-track{position:relative;display:flex;gap:4px;height:8px}
.tbar-track span{background:#34343d;border-radius:999px}
.tbar-track i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,var(--violet),#8e9cff);transition:width 1s linear}
.tbar-l{display:flex;gap:4px;margin-top:9px;font-size:13px;color:var(--mut)}
.tstats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:auto;padding-top:26px;border-top:1px solid var(--bdr-lt)}
.timer .btn-go+.tstats{margin-top:34px}

/* Notices (swap requests etc.) */
.notice{background:var(--surf);border:1px solid var(--bdr);border-radius:14px;padding:20px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:18px}
.notice.hi{border-color:rgba(142,156,255,.35);background:linear-gradient(0deg,rgba(82,102,235,.06),rgba(82,102,235,.06)),var(--surf)}
.notice-b{flex:1;min-width:240px}
.notice-t{font-size:16px;margin-bottom:4px}
.notice-s{font-size:14px;color:var(--mut);line-height:1.5}
.notice-a{display:flex;gap:10px}

/* ══ Legacy admin pages (restyled) ══ */
.panel{padding:44px 120px 90px;max-width:1660px}
.phd{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:34px;flex-wrap:wrap;gap:14px}
.pt{font-size:40px;font-weight:400;letter-spacing:-.015em;line-height:1.15}
.ps{font-size:15px;color:var(--mut);margin-top:8px}
.phr{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sg4{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:20px}
.sg3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:20px}
.sg2{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-bottom:20px}
.stat{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r-card);padding:24px 26px;display:flex;flex-direction:column;gap:10px}
.stat-hd{display:flex;align-items:center;justify-content:space-between}
.stic{width:40px;height:40px;border-radius:999px;background:var(--card);color:var(--txt2);display:flex;align-items:center;justify-content:center}
.stat.ac .stic{color:var(--green)}
.stat.wn .stic{color:var(--red)}
.stv{font-size:30px;font-weight:400;letter-spacing:-.01em;font-variant-numeric:tabular-nums;margin-top:6px}
.stl{font-size:15px;color:var(--txt2)}
.sc{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r-card);overflow:hidden}
.sc-hd{padding:22px 26px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sc-t{font-size:18px;font-weight:400}
.sc-ic{color:var(--txt2);display:flex}
.ldot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulseL 2s ease-in-out infinite;flex-shrink:0}
.dt{width:100%;border-collapse:collapse;font-size:15px}
.dt th{text-align:left;padding:14px 26px;font-size:13.5px;font-weight:400;color:var(--mut);border-bottom:1px solid var(--bdr);white-space:nowrap}
.dt td{padding:15px 26px;border-bottom:1px solid var(--bdr);vertical-align:middle;white-space:nowrap;font-variant-numeric:tabular-nums}
.dt tbody tr:last-child td{border-bottom:none}
.dt tbody tr{transition:background .12s}
.dt tbody tr:hover td{background:var(--hover)}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.av{width:34px;height:34px;border-radius:999px;background:#26262d;color:var(--txt);font-size:12.5px;font-weight:500;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:inset 0 0 0 1.5px #4d4d58}
.hdn{font-size:15px;color:var(--txt2)}
.fc{display:flex;align-items:center}
.g4{gap:4px}.g6{gap:6px}.g8{gap:8px}.g10{gap:10px}
.es{padding:48px 20px;text-align:center;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:12px;font-size:15px}
.es-ic{width:60px;height:60px;border-radius:999px;background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--txt2)}
.es-ic svg{width:24px;height:24px}
.act{color:var(--link)}
.badge{display:inline-flex;align-items:center;gap:7px;font-size:13px;padding:4px 10px;border-radius:999px;background:var(--card);color:var(--txt2);white-space:nowrap}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;flex-shrink:0;background:var(--mut)}
.b-on,.b-brk,.b-a{background:var(--amber-d);color:#bcc5ff}
.b-on::before,.b-brk::before,.b-a::before{background:var(--amber)}
.b-on::before{animation:pulseL 1.6s ease-in-out infinite}
.b-done,.b-in{background:var(--green-d);color:var(--green)}
.b-done::before,.b-in::before{background:var(--green)}
.b-lunch,.b-b{background:var(--indigo-d);color:var(--indigo)}
.b-lunch::before,.b-b::before{background:var(--indigo)}
.b-bath{background:var(--blue-d);color:var(--blue)}
.b-bath::before{background:var(--blue)}
.b-out{background:var(--card);color:var(--mut)}
.b-out::before{background:var(--mut2)}
.sblk{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r-card);padding:28px 30px;margin-bottom:20px}
.sh{font-size:18px;font-weight:400;margin-bottom:8px}
.sd{font-size:15px;color:var(--mut);margin-bottom:18px;line-height:1.55}
.num-wrap{display:flex;align-items:center;gap:14px}
.nb{width:40px;height:40px;background:var(--card);border:none;border-radius:999px;color:var(--txt);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;transition:background .15s}
.nb:hover{background:var(--card2)}
.nv{font-size:34px;font-weight:400;min-width:54px;text-align:center;font-variant-numeric:tabular-nums}
.codebox{background:var(--bg);border:1px solid var(--bdr);border-radius:10px;padding:14px 16px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;color:var(--mut);line-height:2;overflow-x:auto}
.codebox b{color:var(--link);font-weight:500}
.ebox{background:var(--red-d);border-radius:12px;padding:14px 18px;color:#f7b3c1;font-size:14.5px;line-height:1.55;margin-bottom:18px;display:flex;align-items:flex-start;gap:10px}
.modal-bg{position:fixed;inset:0;background:rgba(8,8,11,.7);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);animation:fadeIn .15s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-box{background:#1f1f26;border:1px solid var(--bdr-lt);border-radius:18px;padding:30px;width:100%;max-width:460px;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:mslide .25s var(--ease)}
@keyframes mslide{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.modal-title{font-size:22px;font-weight:400;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.modal-sub{font-size:15px;color:var(--mut);margin-bottom:24px;line-height:1.6}
.modal-sub strong{color:var(--txt2);font-weight:500}
.modal-foot{display:flex;justify-content:flex-end;gap:10px}
.toast-container{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:10px;pointer-events:none;max-width:380px}
.toast{background:#23232a;border:1px solid var(--bdr-lt);border-radius:14px;padding:14px 16px;display:flex;align-items:flex-start;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.55);pointer-events:all;animation:toast-in .3s var(--ease);min-width:290px;position:relative;overflow:hidden}
.toast.leaving{animation:toast-out .2s ease forwards}
@keyframes toast-in{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
@keyframes toast-out{to{transform:translateY(-6px);opacity:0}}
.toast-ic{width:36px;height:36px;border-radius:999px!important;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.toast-ic.lunch{background:var(--indigo-d);color:var(--indigo)}
.toast-ic.break{background:var(--amber-d);color:var(--amber)}
.toast-ic.info{background:var(--green-d);color:var(--green)}
.toast-ic.warn{background:var(--red-d);color:var(--red)}
.toast-ic.custom{background:var(--card);color:var(--link)}
.toast-title{font-size:15px;font-weight:500;margin-bottom:3px}
.toast-body{font-size:14px;color:var(--mut);line-height:1.45}
.toast-close{margin-left:auto;background:none;border:none;color:var(--mut);cursor:pointer;padding:2px 0 2px 8px;display:flex;flex-shrink:0}
.toast-close:hover{color:var(--txt)}
.toast-bar{position:absolute;bottom:0;left:0;height:2px;background:var(--violet)}
.notif-preset{background:var(--surf);border:1px solid var(--bdr);border-radius:14px;padding:18px;cursor:pointer;transition:background .15s,border-color .15s;text-align:left;display:flex;flex-direction:column;gap:8px;width:100%;color:inherit}
.notif-preset:hover{background:var(--hover);border-color:var(--bdr-lt)}
.notif-preset-title{font-size:15px;font-weight:500}
.notif-preset-sub{font-size:13.5px;color:var(--mut);line-height:1.45}
.notif-history{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow-y:auto}
.notif-hist-item{background:var(--bg);border:1px solid var(--bdr);border-radius:12px;padding:12px 14px;display:flex;align-items:flex-start;gap:10px}
.btn-remote{background:var(--card);color:var(--txt);border:none;border-radius:999px;padding:7px 14px;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:background .15s}
.btn-remote:hover{background:var(--card2)}
.btn-remote:disabled{opacity:.4;cursor:not-allowed}
.btn-edit{background:none;border:1px solid var(--bdr-lt);border-radius:999px;color:var(--txt2);padding:5px 12px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .15s}
.btn-edit:hover{background:var(--card);color:var(--txt)}
.type-sel{background:var(--card);border:1px solid var(--bdr-lt);border-radius:8px;padding:5px 8px;color:var(--txt);font-size:13.5px;font-family:var(--font);outline:none;cursor:pointer}
.swap-req-card{background:var(--surf);border:1px solid var(--bdr);border-radius:14px;padding:20px 24px;display:flex;flex-direction:column;gap:12px}
.swap-req-badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:4px 10px;border-radius:999px}
.swap-req-badge.incoming{background:var(--amber-d);color:#bcc5ff}
.swap-req-badge.outgoing{background:var(--indigo-d);color:var(--indigo)}
.swap-req-badge.pending{background:var(--card);color:var(--txt2)}
.swap-action-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-accept{background:var(--violet);color:#fff;border:none;border-radius:999px;padding:9px 18px;font-size:14.5px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:background .15s}
.btn-accept:hover{background:var(--violet-hi)}
.btn-decline{background:var(--card);color:var(--txt);border:none;border-radius:999px;padding:9px 18px;font-size:14.5px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:background .15s}
.btn-decline:hover{background:var(--card2)}
.btn-accept:disabled,.btn-decline:disabled{opacity:.4;cursor:not-allowed}
.swap-who{font-size:16px;line-height:1.45}
.swap-detail{font-size:14px;color:var(--mut);line-height:1.5}
.lunch-groups{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
.lunch-group-card{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r-card);padding:22px;min-height:120px}
.lunch-group-card.unset-pool{border-style:dashed}
.agent-chip{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;margin-bottom:4px;transition:background .12s}
.agent-chip:hover{background:var(--hover)}
.chip-move{margin-left:auto;background:var(--card);border:none;border-radius:999px;color:var(--txt2);font-size:12.5px;padding:4px 11px;cursor:pointer;white-space:nowrap;transition:background .15s}
.chip-move:hover{background:var(--card2);color:var(--txt)}

/* ══ Responsive ══ */
@media(max-width:1500px){
  .side{width:280px}.side-org{padding:0 26px}
  .top,.page,.panel{padding-left:56px;padding-right:56px}
  .grid2,.grid3{gap:24px}
}
@media(max-width:1200px){
  .grid2{grid-template-columns:1fr}
  .grid3{grid-template-columns:1fr 1fr}
  .grid3>.card:last-child{grid-column:1/-1}
  .sg4{grid-template-columns:repeat(2,1fr)}
  .acc-tip{right:12px}
}
@media(max-width:960px){
  .side{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .25s var(--ease);width:300px}
  .side.open{transform:none;box-shadow:30px 0 80px rgba(0,0,0,.5)}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:29}
  .top-menu{display:inline-flex}
  .top{height:76px;gap:12px;padding:0 20px}
  .srch-in{height:48px;font-size:15px}
  .mv,.avb{height:48px}.avb{width:48px}
  .mv{padding:0 18px;font-size:15px}
  .top-ic{gap:10px}
  .icb{width:44px;height:44px}
  .page,.panel{padding:28px 20px 70px}
  .sg3{grid-template-columns:repeat(2,1fr)}
  .lunch-groups{grid-template-columns:1fr}
}
@media(max-width:680px){
  html,body,#root{font-size:14px}
  .top .kbd,.top .mn:has(.mv),.top-ic .hide-s,.clockpill .hide-s{display:none}
  .top{padding:0 16px;gap:10px}
  .srch{min-width:0}
  .srch-in{padding:0 12px 0 44px}
  .srch>svg{left:14px}
  .top-ic{gap:8px}
  .top .icb{width:42px;height:42px}
  .avb{width:42px;height:42px;font-size:14px}
  .clockpill{height:42px;padding:0 12px}
  .hello,.pt{font-size:30px}
  .acts{gap:10px}
  .acts .bp,.acts .bs{height:42px;font-size:15px;padding:0 16px}
  .acts-r{margin-left:0;width:100%}
  .grid3{grid-template-columns:1fr}
  .grid2{margin-bottom:24px}
  .card-p,.sm{padding:24px 22px}
  .bal-top{padding:24px 22px 0}.bal-sub{padding:18px 22px 0}
  .big{font-size:34px}
  .inout,.rng{font-size:16px}
  .seg{height:46px}.seg button{width:48px}
  .ch-x{padding:12px 16px 16px;font-size:13px}
  .acc{padding:22px 12px 16px}
  .acc-n,.acc-v{font-size:16px}
  .tiles{grid-template-columns:1fr 1fr}
  .onb-bar{max-width:none}
  .acc-tip{display:none}
  .sm-cols{gap:8px}.sm-l{font-size:14px}.sm-v{font-size:16px}
  .sg4,.sg3,.sg2{grid-template-columns:1fr 1fr;gap:12px}
  .stat{padding:18px}
  .stv{font-size:24px}
  .dt{font-size:14px}.dt th,.dt td{padding:12px 16px}
  .fab{right:18px;bottom:18px;width:58px;height:58px}

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const SB = supabase.createClient(window.BT_URL, window.BT_KEY, {
  auth: { persistSession: true, autoRefreshToken: true }
});

/* ── Company clock ─────────────────────────────────────────────
   Every time the app shows or compares uses ONE clock, so a PC with a wrong clock or time zone
   can't change reminders, the shift-end check or the times that get stored:
     • the time zone is the UTC offset saved in Settings → Clock (bt_settings.slot_tz)
     • the real time comes from the server (bt_slot_sync returns it every 30s)
   Until those are known it falls back to the PC's own clock, which is how it behaved before. */
let _skew = 0;     // server time minus this PC's clock, in ms
let _coff = null;  // company UTC offset in hours (null = use the PC's)
const appNow   = () => Date.now() + _skew;
const nowISO   = () => new Date(appNow()).toISOString();
const clockOff = () => _coff !== null ? _coff : -new Date().getTimezoneOffset()/60;
const wall     = t  => new Date((t==null ? appNow() : new Date(t).getTime()) + clockOff()*3600000);   // read with the UTC getters
const wallHM   = t  => { const w=wall(t); return `${pad(w.getUTCHours())}:${pad(w.getUTCMinutes())}`; };
const wallAt   = (h,m) => { const w=wall(); return Date.UTC(w.getUTCFullYear(),w.getUTCMonth(),w.getUTCDate(),h,m) - clockOff()*3600000; };
const applyClockTz = tz => { const o=tzToOff(tz); if(o===null||o===_coff) return false; _coff=o; return true; };

/* ── Auto-refresh safety net ──────────────────────────────────────────
   Supabase Realtime pushes changes instantly when it's working, but it can
   silently drop (phone screen locks, wifi/cell handoff, tab backgrounded,
   Realtime not enabled on a table, RLS quirks, etc). This hook re-runs the
   given load function on an interval AND immediately whenever the tab/app
   becomes visible or regains focus again, so a screen never goes stale for
   more than a few seconds even if the live socket dies quietly. */
function useAutoRefresh(load, intervalMs = 6000){
  useEffect(() => {
    const id = intervalMs ? setInterval(() => { load(); }, intervalMs) : null;
    const onVis = () => { if (document.visibilityState === 'visible') load(); };
    document.addEventListener('visibilitychange', onVis);
    window.addEventListener('focus', onVis);
    window.addEventListener('online', onVis);
    return () => {
      if (id) clearInterval(id);
      document.removeEventListener('visibilitychange', onVis);
      window.removeEventListener('focus', onVis);
      window.removeEventListener('online', onVis);
    };
  }, [load, intervalMs]);
}

/* ── Global "last synced" clock — bumped every time any screen finishes a
   successful load, read by the connection instrument so agent and admin
   both show an honest "how fresh is what I'm looking at" readout. ── */
let _lastSync = appNow();
const _syncListeners = [];
function bumpSync(){ _lastSync = appNow(); _syncListeners.forEach(fn => fn(_lastSync)); }
function useLastSync(){
  const [t,setT] = useState(_lastSync);
  useEffect(() => { _syncListeners.push(setT); return () => { const i=_syncListeners.indexOf(setT); if(i>-1)_syncListeners.splice(i,1); }; }, []);
  return t;
}

/* ── Live connection instrument — reads the real Supabase Realtime socket
   state (not just "did my one channel's callback fire"), so the pill in
   the header tells the truth about whether this screen can currently
   receive live updates at all. ── */
function useConnectionState(){
  const [state, setState] = useState('connecting');
  useEffect(() => {
    const check = () => {
      if (typeof navigator !== 'undefined' && !navigator.onLine) { setState('offline'); return; }
      try {
        const cs = SB.realtime && SB.realtime.connectionState ? SB.realtime.connectionState() : null;
        if (cs === 'open') setState('live');
        else if (cs === 'connecting') setState('connecting');
        else setState('connecting');
      } catch(e) { setState('connecting'); }
    };
    check();
    const id = setInterval(check, 2500);
    window.addEventListener('online', check);
    window.addEventListener('offline', check);
    return () => { clearInterval(id); window.removeEventListener('online', check); window.removeEventListener('offline', check); };
  }, []);
  return state;
}

function agoStr(ts){
  const s = Math.max(0, Math.round((appNow()-ts)/1000));
  if (s < 3) return 'just now';
  if (s < 60) return `${s}s ago`;
  return `${Math.floor(s/60)}m ago`;
}

function ConnInstrument({compact}){
  const conn = useConnectionState();
  const lastSync = useLastSync();
  const [, force] = useState(0);
  useEffect(() => { const id = setInterval(() => force(n=>n+1), 4000); return () => clearInterval(id); }, []);
  const label = conn === 'live' ? 'Live' : conn === 'offline' ? 'Offline' : 'Reconnecting…';
  return (
    <span className={`instr ${conn}`} title="Realtime connection status">
      <span className="lite"/>{label}
      {!compact && <span className="syncedAt">· synced {agoStr(lastSync)}</span>}
    </span>
  );
}

/* ── Ticker digits — the engineered "this number just changed" motif.
   Re-keying each character on change forces React to remount it, which
   triggers the CSS flap-in animation — a cheap, honest way to make a
   live readout visibly announce its own updates instead of silently
   swapping text. ── */
function TNum({value, className, mono=true}){
  const str = String(value);
  return (
    <span className={`tnum ${className||''}`} style={mono?{}:{fontFamily:'inherit'}}>
      {str.split('').map((c,i) => <span key={i+'|'+c} className="tnum-d">{c}</span>)}
    </span>
  );
}

/* ═══ 3CX analysis (copy of tools/3cx/analyze.js) ═══ */
const CX = (function(){ const module = { exports: {} }; const exports = module.exports;
// 3CX status log analysis: turns the rows written by logger.js (status_log.csv) into
//   - per-agent time per status (Admin, Break, Available, On call, ...)
//   - call counts and talk time per agent
//   - ignored rings (the phone rang, the agent didn't answer)
//   - short calls (possible dropped calls)
//   - break records shaped like the app's bt_logs rows
//   - a list of alerts for the admin
//
// Pure functions, no dependencies and no network. Nothing here is connected to the app yet.

const DEFAULTS = {
  tzOffsetHours: 0,        // UTC offset of the PC that ran the logger (its clock wrote the log's timestamps)
  dayOffsetHours: null,    // UTC offset used to cut the log into days (the app's Settings → Clock); null = same as tzOffsetHours
  shortCallSec: 60,        // a call shorter than this is a possible dropped call
  ignoreRingSec: 10,       // a ring that ends unanswered after at least this long counts as ignored
  takenByOtherSec: 3,      // someone else answered within this many seconds of the ring ending → not ignored
  repeatIgnoreCount: 3,    // this many ignored rings ...
  repeatIgnoreWindowMin: 60, // ... inside this many minutes raises a "repeated" alert
  minBreakSec: 10,         // ignore break blips shorter than this when building break records
  quietCapMin: 30,         // a status with no change keeps running only this long after the log's last row (the logger may have stopped)
  breakToleranceSec: 180,  // break check: an agent's total break time may differ from 3CX by this much before it is flagged
};

const S = { CALL: 'On call', RING: 'Ringing', ADMIN: 'Admin', BREAK: 'Break', OFFLINE: 'Offline' };
// logger.js logs custom 3CX statuses as written, so Lunch / Bathroom / Break all count as breaks
const isBreak = status => /break|lunch|bathroom|toilet/i.test(status || '');

/* ── CSV ─────────────────────────────────────────────────────────── */
function parseCsv(text) {
  const rows = []; let row = [], cur = '', q = false;
  const s = String(text).replace(/^﻿/, '');
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (q) {
      if (c === '"') { if (s[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && s[i + 1] === '\n') i++;
      row.push(cur); cur = '';
      if (row.length > 1 || row[0] !== '') rows.push(row);
      row = [];
    } else cur += c;
  }
  if (cur !== '' || row.length) { row.push(cur); if (row.length > 1 || row[0] !== '') rows.push(row); }
  if (!rows.length) return [];
  const head = rows[0].map(h => h.trim());
  return rows.slice(1).map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] ?? '').trim()])));
}

// "2026-10-27 12:51:57" is written in the logger PC's clock. Convert it to a real instant (ms).
function parseStamp(str, tz) {
  const m = /^(\d{4})-(\d\d)-(\d\d)[ T](\d\d):(\d\d):(\d\d)/.exec(str || '');
  if (!m) return NaN;
  return Date.UTC(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +m[6]) - tz * 3600000;
}
function dayRange(day, tz) {                     // [start, end) of a day on the company clock
  const m = /^(\d{4})-(\d\d)-(\d\d)$/.exec(day);
  if (!m) throw new Error('day must look like 2026-10-27');
  const start = Date.UTC(+m[1], +m[2] - 1, +m[3]) - tz * 3600000;
  return [start, start + 864e5];
}
function isoLocal(ms, tz) {                      // an instant as "YYYY-MM-DD HH:MM:SS" on the company clock
  return new Date(ms + tz * 3600000).toISOString().slice(0, 19).replace('T', ' ');
}

/* ── rows uploaded by the logger to Supabase ────────────────────── */
// The logger can also post each status change to a Supabase table (status_log: changed_at, extension, agent, old_status,
// new_status, detail). changed_at is a real instant (UTC), so these rows do NOT depend on the logger PC's time zone.
// This turns them into the same rows the CSV gives, written in UTC: analyze them with tzOffsetHours: 0.
function rowsFromStatusLog(rows) {
  return (rows || []).filter(r => r && r.extension && r.extension !== '000' && r.changed_at && Number.isFinite(Date.parse(r.changed_at)))   // 000 = the logger's connection test
    .map(r => ({
      timestamp: new Date(r.changed_at).toISOString().slice(0, 19).replace('T', ' '),
      extension: String(r.extension), agent: r.agent || '', old_status: r.old_status || '', new_status: r.new_status || '', detail: r.detail || '',
    }));
}

/* ── names ───────────────────────────────────────────────────────── */
// 3CX shows "Sghir, Abdulkarim"; the app has "Abdulkarim Sghir". Compare ignoring order, case, accents.
function nameKey(n) {
  return String(n || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
    .split(/[^a-z0-9]+/).filter(Boolean).sort().join(' ');
}
function displayName(n) {                        // "Sghir, Abdulkarim" -> "Abdulkarim Sghir"
  const s = String(n || '').trim();
  const i = s.indexOf(',');
  return i < 0 ? s : `${s.slice(i + 1).trim()} ${s.slice(0, i).trim()}`.replace(/\s+/g, ' ');
}

/* ── status intervals ────────────────────────────────────────────── */
// Each log row says "this extension is now <new_status>". Turn that into intervals
// {ext, agent, status, detail, start, end}; the last interval of each extension stays open (end = null).
function buildIntervals(rows, opts = {}) {
  const tz = opts.tzOffsetHours ?? DEFAULTS.tzOffsetHours;
  const ev = rows.map(r => ({
    t: parseStamp(r.timestamp, tz), ext: r.extension, agent: r.agent,
    status: r.new_status, detail: r.detail || '', first: !r.old_status,
  })).filter(e => Number.isFinite(e.t) && e.ext && e.status).sort((a, b) => a.t - b.t);

  const out = []; const open = {};
  for (const e of ev) {
    const cur = open[e.ext];
    if (cur && cur.status === e.status) { cur.detail = cur.detail || e.detail; continue; }   // logger restart: same state, keep going
    if (cur) cur.end = e.t;
    // first = the logger had just started and only saw this status; it began earlier, so its length is understated
    const iv = { ext: e.ext, agent: e.agent, status: e.status, detail: e.detail, start: e.t, end: null, partialStart: e.first };
    open[e.ext] = iv; out.push(iv);
  }
  return out;
}

const endOf = (iv, now) => iv.end ?? now;
const secs = (a, b) => Math.max(0, (b - a) / 1000);

/* ── rings and calls ─────────────────────────────────────────────── */
function buildRings(intervals, now, o) {
  const byExt = {};
  for (const iv of intervals) (byExt[iv.ext] = byExt[iv.ext] || []).push(iv);
  const rings = [];
  for (const list of Object.values(byExt)) {
    list.forEach((iv, i) => {
      if (iv.status !== S.RING) return;
      const next = list[i + 1];
      rings.push({
        ext: iv.ext, agent: iv.agent, start: iv.start, end: iv.end, partialStart: iv.partialStart,
        secs: secs(iv.start, endOf(iv, now)),
        endedAs: next ? next.status : null,
        outcome: !next ? 'ringing' : next.status === S.CALL ? 'answered' : 'unanswered',
      });
    });
  }
  // A group ring stops for everybody when one agent picks up. If another agent answered at the
  // moment this ring ended, this agent did not ignore the call.
  const answered = rings.filter(r => r.outcome === 'answered');

  return day % 2 === 0 ? 'A' : 'B';
};

/* Team config from bt_settings: trainees (names), trainee_lunch ('HH:MM', one hour), shift_end ('HH:MM').
   Module-level so any screen can ask isTrainee(). Trainee breaks don't use or count toward break slots. */
const normName = n => String(n||'').trim().replace(/\s+/g,' ').toLowerCase();
let _team = { trainees:[], lunch:'12:00', shiftEnd:null, ready:false };
let _traineeSet = new Set();
const isTrainee = n => _traineeSet.has(normName(n));
const slotCount = rows => (rows||[]).filter(r=>!isTrainee(r.agent_name)).length;   // open breaks that use a slot
const addMin = (hm,m) => { const [h,mm]=hm.split(':').map(Number); const t=((h*60+mm+m)%1440+1440)%1440; return `${pad(Math.floor(t/60))}:${pad(t%60)}`; };
const HM_RE = /^\d\d:\d\d$/;
function useTeamConfig(){
  const [v,setV]=useState(_team);
  const load=useCallback(async()=>{
    const {data}=await run(SB.from('bt_settings').select('*').eq('id',1).maybeSingle());
    if(!data) return;
    const t=Array.isArray(data.trainees)?data.trainees.filter(x=>typeof x==='string'):[];
    _traineeSet=new Set(t.map(normName));
    _team={ trainees:t, lunch:HM_RE.test(data.trainee_lunch||'')?data.trainee_lunch:'12:00', shiftEnd:HM_RE.test(data.shift_end||'')?data.shift_end:null, ready:true };
    applyClockTz(data.slot_tz);
    setV(_team);
  },[]);
  useEffect(()=>{ load(); },[load]);
  useAutoRefresh(load,30000);
  return v;
}

const csvExport = (rows) => {
  const h = 'Agent,Date,Start,Return,Duration,Type\n';
  const b = rows.map(r=>{

    return `"${r.agent_name}","${fmtD(r.start_time)}","${fmtT(r.start_time)}","${fmtT(r.end_time)}","${durStr(d)}","${r.break_type||''}"`;

};

/* ── Web Audio notification sounds ── */
let _audioCtx = null;
function getAudioCtx() {
  if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return _audioCtx;
}
function playNotifSound(type = 'info') {
  try {
    const ctx = getAudioCtx();
    if (ctx.state === 'suspended') ctx.resume();
    const presets = {
      lunch:  [{ f:660, t:0,    d:0.12, g:0.5 }, { f:880, t:0.13, d:0.12, g:0.5 }, { f:1100, t:0.26, d:0.2, g:0.6 }],
      break:  [{ f:520, t:0,    d:0.15, g:0.4 }, { f:660, t:0.18, d:0.2,  g:0.4 }],
      warn:   [{ f:440, t:0,    d:0.1,  g:0.5 }, { f:340, t:0.13, d:0.1,  g:0.5 }, { f:440, t:0.26, d:0.15, g:0.5 }],
      info:   [{ f:600, t:0,    d:0.1,  g:0.3 }, { f:800, t:0.12, d:0.15, g:0.3 }],
      custom: [{ f:500, t:0,    d:0.1,  g:0.35}, { f:700, t:0.13, d:0.1,  g:0.35}, { f:900, t:0.26, d:0.2, g:0.4 }],
    };
    const notes = presets[type] || presets.info;
    const now = ctx.currentTime;
    notes.forEach(({ f, t, d, g }) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(f, now + t);
      gain.gain.setValueAtTime(0, now + t);
      gain.gain.linearRampToValueAtTime(g, now + t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, now + t + d);
      osc.start(now + t);
      osc.stop(now + t + d + 0.01);
    });
  } catch(e) { /* audio blocked — silent fail */ }
}

/* ── Global toast emitter — works without React context ── */
const _toastListeners = [];
const toastEmit = (toast) => _toastListeners.forEach(fn => fn(toast));

function useToastEmitter(addToast) {
  useEffect(() => {
    _toastListeners.push(addToast);
    return () => { const i = _toastListeners.indexOf(addToast); if(i>-1)_toastListeners.splice(i,1); };
  }, [addToast]);
}

/* ── Master fire function: in-app toast + OS desktop notification + sound ── */
function fireNotification({ title, body, type = 'info', duration = 7000 }) {
  playNotifSound(type);
  toastEmit({ id: appNow() + Math.random(), title, body, type, duration });
  if ('Notification' in window) {
    const show = () => new Notification(title, { body, tag: type + '-' + appNow() });
    if (Notification.permission === 'granted') show();
    else if (Notification.permission !== 'denied') Notification.requestPermission().then(p => { if(p==='granted') show(); });
  }
}

/* ── Toast Container ── */
function ToastContainer() {
  const [toasts, setToasts] = useState([]);
  const addToast = useCallback((t) => {
    setToasts(p => [...p, { ...t, leaving: false }]);
    setTimeout(() => {
      setToasts(p => p.map(x => x.id === t.id ? { ...x, leaving: true } : x));
      setTimeout(() => setToasts(p => p.filter(x => x.id !== t.id)), 260);
    }, t.duration || 7000);
  }, []);
  useToastEmitter(addToast);
  const dismiss = (id) => {
    setToasts(p => p.map(x => x.id === id ? { ...x, leaving: true } : x));
    setTimeout(() => setToasts(p => p.filter(x => x.id !== id)), 260);
  };
  const typeIcon = { lunch:'utensils', break:'coffee', info:'bell', warn:'alert', custom:'zap' };
  return (
    <div className="toast-container">
      {toasts.map(t => (
        <div key={t.id} className={`toast${t.leaving?' leaving':''}`}>
          <div className={`toast-ic ${t.type}`}><Ic n={typeIcon[t.type]||'bell'} size={16} sw={2}/></div>
          <div style={{flex:1,minWidth:0}}>
            <div className="toast-title">{t.title}</div>
            <div className="toast-body">{t.body}</div>
          </div>
          <button className="toast-close" onClick={()=>dismiss(t.id)}><Ic n="x" size={14}/></button>
          <div className="toast-bar" style={{animationDuration:`${t.duration||7000}ms`}}/>
        </div>
      ))}
    </div>
  );
}

/* ── Request OS permission early ── */
function useNotifPermission() {
  useEffect(() => {
    if ('Notification' in window && Notification.permission === 'default') {
      const t = setTimeout(() => Notification.requestPermission(), 2500);
      return () => clearTimeout(t);
    }
  }, []);
}

/* ══════════════════════════════════════════════════════════════
   SUPABASE REALTIME BROADCAST CHANNEL
   Admins publish to 'bt_broadcast'; agents receive.
   Nothing is written to the database.
══════════════════════════════════════════════════════════════ */
const BROADCAST_CHANNEL = 'bt_broadcast';
const BROADCAST_EVENT   = 'notif';
const SWAP_CHANNEL      = 'bt_swap';
const SWAP_EVENT        = 'swap_request';

/* Publish a notification to all agents (or a specific user_id) via Supabase Realtime broadcast */
async function broadcastNotif({ title, body, type = 'custom', targetUserId = null, lunchGroup = null }) {
  const ch = SB.channel(BROADCAST_CHANNEL);
  await new Promise(res => {
    ch.subscribe(status => { if(status === 'SUBSCRIBED') res(); });
  });
  await ch.send({ type:'broadcast', event: BROADCAST_EVENT, payload:{ title, body, type, targetUserId, lunchGroup } });
  SB.removeChannel(ch);
}

/* ── Broadcast a swap request/response via Realtime ── */
async function broadcastSwap(payload) {
  const ch = SB.channel(SWAP_CHANNEL);
  await new Promise(res => { ch.subscribe(s => { if(s==='SUBSCRIBED') res(); }); });
  await ch.send({ type:'broadcast', event: SWAP_EVENT, payload });
  SB.removeChannel(ch);
}

/* ── Persist swap request to DB ── */
async function createSwapRequest({ fromUserId, fromName, toUserId, toName, fromGroup, toGroup, date }) {
  const { data, error } = await run(
    SB.from('bt_swap_requests').insert({
      from_user_id: fromUserId, from_name: fromName,
      to_user_id: toUserId,   to_name: toName,
      from_group: fromGroup,  to_group: toGroup,
      date, status: 'pending',
      created_at: nowISO(),
    }).select().single()
  );
  return { data, error };
}

/* ── Agent: listen for incoming swap requests/responses ── */
function useSwapListener(userId, onRequest) {
  useEffect(() => {
    const ch = SB.channel(SWAP_CHANNEL + '-' + userId)
      .on('broadcast', { event: SWAP_EVENT }, ({ payload }) => {
        if (payload.toUserId === userId || payload.fromUserId === userId) {
          onRequest(payload);
        }
      })
      .subscribe();
    return () => SB.removeChannel(ch);
  }, [userId]);
}

/* ── Agent: listen for broadcast notifications ── */
/* lunchInfo is passed in so we can filter lunch broadcasts to the right group */
function useAgentNotifListener(userId, lunchInfo) {
  useEffect(() => {
    const ch = SB.channel(BROADCAST_CHANNEL)
      .on('broadcast', { event: BROADCAST_EVENT }, ({ payload }) => {
        // Filter by specific user if targeted
        if (payload.targetUserId && payload.targetUserId !== userId) return;
        // Filter lunch broadcasts: only show if agent is in the notified group
        if (payload.lunchGroup) {
          const myGroup = lunchInfo?.group || null;
          if (!myGroup || myGroup !== payload.lunchGroup) return;
        }
        fireNotification({ title: payload.title, body: payload.body, type: payload.type || 'custom', duration: 9000 });
      })
      .subscribe();
    return () => SB.removeChannel(ch);
  }, [userId, lunchInfo?.group]);
}

   LUNCH REMINDER HOOKS
══════════════════════════════════════════════════════════════ */

/* Agent: 5-min personal reminder based on their own lunch slot */
function useLunchReminder(lunchInfo) {
  const firedRef = useRef(new Set());
  useEffect(() => {
    if (!lunchInfo?.group || !lunchInfo?.slot) return;
    const check = () => {
      const nowUTC = appNow();
      const nowDate = new Date(nowUTC);
      const [h, m] = lunchInfo.slot.from.split(':').map(Number);
      // Lunch times are on the company clock (Settings → Clock), not the PC's
      const lunchAt = wallAt(h, m);
      const diff = (lunchAt - nowUTC) / 60000;
      const key = `${nowDate.toISOString().slice(0,10)}-${lunchInfo.slot.from}-${lunchInfo.group}`;
      if (diff > 0 && diff <= 5 && !firedRef.current.has(key)) {
        firedRef.current.add(key);
        fireNotification({
          title: `🍽️ Lunch in ${Math.ceil(diff)} min!`,
          body: `Group ${lunchInfo.group} — your lunch starts at ${lunchInfo.slot.from}. Get ready!`,
          type: 'lunch',
          duration: 10000,
        });
      }
    };
    check();
    const id = setInterval(check, 20000);
    return () => clearInterval(id);
  }, [lunchInfo]);
}

/* Applies the saved slot schedule from any open screen, as a backup to the pg_cron job.
   bt_slot_sync only does what the admin saved, so it is safe for every signed-in user. */
let _slotFnMissing = false;
function useSlotSchedulerTick() {
  const [, bump] = useState(0);
  useEffect(() => {
    const tick = async () => {
      if (_slotFnMissing) return;
      const t0 = Date.now();
      const { data, error } = await run(SB.rpc('bt_slot_sync'));
      const t1 = Date.now();
      if (error && /bt_slot_sync|schema cache/.test(error.message || '')) _slotFnMissing = true;
      let changed = false;
      if (data && data.server_ms) {                         // server time, minus half the round trip
        const sk = data.server_ms - (t0 + t1) / 2;
        if (Math.abs(sk - _skew) > 1500) { _skew = sk; changed = true; }
      }
      if (data && data.tz && applyClockTz(data.tz)) changed = true;
      if (changed) bump(n => n + 1);
    };
    tick();
    const id = setInterval(tick, 30000);
    return () => clearInterval(id);
  }, []);
}

/* Admin: automated broadcast to ALL agents at the exact scheduled lunch times.
   Reads today's lunch schedule from Supabase once per minute and fires broadcasts
   at configured alert times (default 5 min before each group's slot). */
function useAdminLunchBroadcast(alertMinutes = 5) {
  const firedRef = useRef(new Set());
  useEffect(() => {
    const check = async () => {
      const today = todayISO();
      const { data: ls } = await run(
        SB.from('bt_lunch_schedule').select('*').eq('date', today).maybeSingle()
      );
      if (!ls) return;
      const first = ls.group_first || defaultFirst(today);
      const slots = lunchSlots(first);
      const nowUTC = appNow();
      const nowDate = new Date(nowUTC);
      ['A', 'B'].forEach(grp => {
        const [h, m] = slots[grp].from.split(':').map(Number);
        // Lunch times are on the company clock (Settings → Clock), not the PC's
        const lunchAt = wallAt(h, m);
        const diff = (lunchAt - nowUTC) / 60000;
        const key = `auto-${grp}-${slots[grp].from}-${today}`;
        if (diff > 0 && diff <= alertMinutes && !firedRef.current.has(key)) {
          firedRef.current.add(key);
          const mins = Math.ceil(diff);
          broadcastNotif({
            title: `🍽️ Group ${grp} Lunch in ${mins} min`,
            body: `Group ${grp}: your lunch break starts at ${slots[grp].from}. Please get ready to head out!`,
            type: 'lunch',
            lunchGroup: grp,
          });
        }
      });
    };
    check();
    const id = setInterval(check, 30000);
    return () => clearInterval(id);
  }, [alertMinutes]);
}
