<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="theme-color" content="#17171c"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>BreakTrack</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23a3aeff'/%3E%3Cstop offset='1' stop-color='%235266eb'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='%231c1d26'/%3E%3Cpath d='M4.3 14.8L4.3 24.6L10.4 24.6Z' fill='%233b47a8' stroke='%233b47a8' stroke-width='.8' stroke-linejoin='round'/%3E%3Cpath d='M4.6 14.5L16.6 14.6L19.1 18.2L13.2 27.8Z' fill='%23f4f5ff' stroke='%23f4f5ff' stroke-width='.8' stroke-linejoin='round'/%3E%3Cpath d='M27.7 4.3L26.1 27.8L13.4 27.8Z' fill='url(%23g)' stroke='%236b7cf0' stroke-width='.8' stroke-linejoin='round'/%3E%3C/svg%3E"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.7/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.52.1/dist/umd/supabase.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<script>(function(){var t='dark';try{var v=localStorage.getItem('bt_theme');if(v==='light'||v==='dark')t=v;}catch(e){}document.documentElement.setAttribute('data-theme',t);})();</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  /* ── Mercury-style dark banking palette ── */
  --bg:#17171c;--side:#17171c;
  --surf:#1d1d23;              /* card */
  --card:#26262d;              /* pill / input / icon-button fill */
  --card2:#2e2e36;
  --hover:#232329;
  --bdr:#2b2b33;--bdr-lt:#393943;
  --txt:#ededf1;--txt2:#c9c9d2;--mut:#9a9aa6;--mut2:#6c6c78;

  --violet:#5266eb;--violet-hi:#6377f5;   /* primary action */
  --link:#8e9cff;
  /* group A / accent, group B, status */
  --amber:#8e9cff;--amber-d:rgba(142,156,255,.12);--amber-r:rgba(142,156,255,.32);--amber-glow:rgba(142,156,255,.45);
  --indigo:#d4a5f5;--indigo-d:rgba(212,165,245,.11);--indigo-r:rgba(212,165,245,.3);
  --blue:#6cb0f5;--blue-d:rgba(108,176,245,.11);--blue-r:rgba(108,176,245,.3);
  --green:#4fc79a;--green-d:rgba(79,199,154,.11);--green-r:rgba(79,199,154,.3);--green-glow:rgba(79,199,154,.45);
  --red:#f0718b;--red-d:rgba(240,113,139,.11);--red-r:rgba(240,113,139,.3);

  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-mono:'Inter',-apple-system,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  --r-card:22px;
  --top-bg:rgba(23,23,28,.86);--pop:#202027;--tile:#212128;--track:#2a2a33;--shadow:0 24px 60px rgba(0,0,0,.5);
  --bad-txt:#ff8fa3;--warn-txt:#ffb86b;--acc-txt:#bcc5ff;
  --sb-bg:#1b1b21;--sb-bdr:#2b2b33;--sb-txt:#b4b4c0;--sb-hover:rgba(255,255,255,.06);--sb-on:rgba(255,255,255,.09);--sb-acc:#8e9cff;--sb-w:272px;--sb-wc:86px;
}
html,body,#root{min-height:100%;background:var(--bg);color:var(--txt);font-family:var(--font);font-size:15px;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
::selection{background:rgba(82,102,235,.5);color:#fff}
:focus-visible{outline:2px solid var(--link);outline-offset:2px;border-radius:8px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2f2f38;border-radius:999px;border:3px solid var(--bg)}
button{font-family:inherit;-webkit-tap-highlight-color:transparent}
.mono,.tnum{font-variant-numeric:tabular-nums}
.tnum{display:inline-flex;line-height:1}
.tnum-d{display:inline-block;animation:flapIn .35s var(--ease)}
@keyframes flapIn{0%{opacity:0;transform:translateY(-35%)}100%{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.tnum-d{animation:none}*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
.privacy .pv{filter:blur(7px);transition:filter .2s}
.pv{transition:filter .2s}

/* ── Loading ── */
.spl{display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:22px}
.spin{width:22px;height:22px;border:2px solid var(--bdr-lt);border-top-color:var(--txt);border-radius:50%;animation:rot .8s linear infinite}
.spin-sm{width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite;display:inline-block}
.spin-sm.on-dark{border:2px solid rgba(255,255,255,.2);border-top-color:#fff}
@keyframes rot{to{transform:rotate(360deg)}}

/* ── Wordmark / org switcher ── */
.wm{display:flex;align-items:center;gap:11px}
.wm-icon{width:32px;height:32px;border-radius:9px;background:#2a2a32;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.wm.sm .wm-icon{width:30px;height:30px}
.wm-t{font-size:15.5px;font-weight:500;color:var(--txt);letter-spacing:-.005em}
.wm-t b{font-weight:500}

/* ── Buttons ── */
.bp{background:var(--violet);color:#fff;border:none;border-radius:999px;padding:9px 18px;font-size:15px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;transition:background .15s,transform .1s}
.bp:hover:not(:disabled){background:var(--violet-hi)}
.bp:active:not(:disabled){transform:scale(.98)}
.bp:disabled{opacity:.4;cursor:not-allowed}
.bp.full{width:100%;margin-top:8px;padding:12px 18px;border-radius:10px}
.bp.blue{background:var(--violet)}
.bs{background:var(--card);color:var(--txt);border:none;border-radius:999px;padding:9px 18px;font-size:15px;font-weight:400;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;transition:background .15s,transform .1s}
.bs:hover:not(:disabled){background:var(--card2)}
.bs:active:not(:disabled){transform:scale(.98)}
.bs:disabled{opacity:.45;cursor:not-allowed}
.bs svg,.bp svg{opacity:.9}
.ib{background:none;border:none;border-radius:999px;color:var(--mut);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:8px;transition:color .15s,background .15s}
.ib:hover{color:var(--txt);background:var(--card)}
.icb{width:46px;height:46px;border-radius:999px;background:var(--card);border:none;color:var(--txt2);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;position:relative;transition:background .15s,color .15s;flex-shrink:0}
.icb:hover{background:var(--card2);color:var(--txt)}
.icb.on{color:var(--link)}
.icb .dot{position:absolute;top:11px;right:12px;width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--card)}
.icb.sm{width:40px;height:40px}
.kb{width:30px;height:30px;border-radius:999px;background:none;border:none;color:var(--txt2);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s}
.kb:hover{background:var(--card)}
.lnk{background:none;border:none;color:var(--link);font-size:15px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:4px 0;transition:color .15s}
.lnk:hover{color:var(--acc-txt)}
.btn-go{background:var(--violet);color:#fff;border:none;border-radius:999px;padding:12px 26px;font-size:15px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:background .15s}
.btn-go:hover:not(:disabled){background:var(--violet-hi)}
.btn-go:disabled{opacity:.4;cursor:not-allowed}
.btn-end{background:var(--card);color:var(--txt);border:none;border-radius:999px;padding:12px 26px;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn-end:hover{background:var(--card2)}

/* ── Forms ── */
.fg{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}
.fl{font-size:13.5px;font-weight:400;color:var(--txt2)}
.fi{background:var(--bg);border:1px solid var(--bdr-lt);border-radius:10px;padding:11px 14px;color:var(--txt);font-size:15px;font-family:var(--font);outline:none;width:100%;transition:border-color .15s,box-shadow .15s}
.fi:focus{border-color:var(--link);box-shadow:0 0 0 3px rgba(142,156,255,.15)}
.fi::placeholder{color:var(--mut2)}
select.fi option,.type-sel option{background:#1d1d23}
.iw{position:relative}
.eb{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--mut);cursor:pointer;display:flex;padding:6px;border-radius:999px}
.eb:hover{color:var(--txt);background:var(--card)}
.si{background:var(--card);border:1px solid transparent;border-radius:999px;padding:9px 16px;color:var(--txt);font-size:14px;font-family:var(--font);outline:none;width:200px;transition:border-color .15s}
.si:focus{border-color:var(--bdr-lt)}
.si::placeholder{color:var(--mut2)}
.si[type=date]{color-scheme:dark}
.aerr{display:flex;align-items:center;gap:8px;color:var(--red);font-size:14px;background:var(--red-d);border-radius:10px;padding:11px 14px;margin-bottom:12px}
.awrn{display:flex;align-items:center;gap:10px;color:var(--bad-txt);font-size:14px;background:var(--red-d);border:1px solid var(--red-r);border-radius:12px;padding:13px 16px}

/* ── Auth ── */
.auth-bg{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.auth-card{background:var(--surf);border:1px solid var(--bdr);border-radius:18px;padding:40px 36px 34px;width:100%;max-width:420px;animation:mslide .4s var(--ease)}
.auth-logo{margin-bottom:28px}
.auth-h{font-size:28px;font-weight:400;letter-spacing:-.01em;margin-bottom:6px}
.auth-s{color:var(--mut);font-size:15px;margin-bottom:28px}
.eyebrow{display:none}

/* ── Connection instrument ── */
.instr{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--txt2);border-radius:999px;padding:6px 12px 6px 10px;background:var(--card)}
.instr .lite{width:7px;height:7px;border-radius:50%;flex-shrink:0;background:var(--mut2)}
.instr.live .lite{background:var(--green);animation:pulseL 2s ease-in-out infinite}
.instr.connecting .lite{background:#e8b75c;animation:pulseL 1s ease-in-out infinite}
.instr.offline{color:var(--red)}
.instr.offline .lite{background:var(--red)}
.instr .syncedAt{color:var(--mut);margin-left:2px}
@keyframes pulseL{0%,100%{box-shadow:0 0 0 0 rgba(79,199,154,.55)}70%{box-shadow:0 0 0 6px rgba(79,199,154,0)}}

/* ══ App shell ══ */
.shell{display:flex;min-height:100vh}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:84px;padding:0 44px;display:flex;align-items:center;gap:24px;position:sticky;top:0;z-index:20;background:var(--top-bg);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.top-menu{display:none}
.srch{flex:1;position:relative;max-width:890px}
.srch-in{width:100%;height:58px;border-radius:12px;border:1px solid var(--bdr-lt);background:transparent;padding:0 90px 0 62px;color:var(--txt);font-size:17px;font-family:var(--font);outline:none;transition:border-color .15s,background .15s}
.srch-in::placeholder{color:var(--mut)}
.srch-in:focus{border-color:#4a4a57;background:#1b1b21}
.srch>svg{position:absolute;left:22px;top:50%;transform:translateY(-50%);color:var(--txt2);pointer-events:none}
.kbd{position:absolute;right:20px;top:50%;transform:translateY(-50%);display:flex;gap:4px;pointer-events:none}
.kbd span{min-width:24px;height:24px;border-radius:5px;background:#2b2b33;color:var(--mut);font-size:12.5px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.srch-pop{position:absolute;left:0;right:0;top:calc(100% + 8px);background:#202027;border:1px solid var(--bdr-lt);border-radius:14px;padding:8px;box-shadow:0 24px 60px rgba(0,0,0,.5);animation:pop .16s var(--ease);max-height:420px;overflow:auto}
.srch-h{font-size:12.5px;color:var(--mut);padding:8px 12px 6px}
.srch-it{display:flex;align-items:center;gap:14px;width:100%;background:none;border:none;color:var(--txt);font-size:15px;padding:11px 12px;border-radius:9px;cursor:pointer;text-align:left}
.srch-it svg{color:var(--txt2)}
.srch-it.act,.srch-it:hover{background:var(--card)}
.srch-it .hint{margin-left:auto;color:var(--mut);font-size:13px}
.srch-empty{padding:18px 12px;color:var(--mut);font-size:14px}
.mv{height:58px;border-radius:999px;border:1px solid var(--bdr-lt);background:none;color:var(--txt);font-size:17px;padding:0 26px 0 30px;display:inline-flex;align-items:center;gap:14px;cursor:pointer;white-space:nowrap;transition:background .15s}
.mv:hover{background:var(--hover)}
.top-ic{display:flex;align-items:center;gap:22px}
.avb{width:58px;height:58px;border-radius:999px;border:none;cursor:pointer;background:linear-gradient(145deg,#e9e9ee,#b9b9c4);color:#1b1b21;font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.clockpill{height:46px;border-radius:999px;background:var(--card);padding:0 18px;display:inline-flex;align-items:center;gap:10px;color:var(--txt2);font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.clockpill b{font-weight:500;color:var(--txt)}

/* ── Dropdown menu ── */
.mn{position:relative;display:inline-flex}
.mn-pop{position:absolute;top:calc(100% + 8px);min-width:240px;background:#202027;border:1px solid var(--bdr-lt);border-radius:14px;padding:6px;box-shadow:0 24px 60px rgba(0,0,0,.5);z-index:60;animation:pop .16s var(--ease)}
.mn-pop.right{right:0}.mn-pop.left{left:0}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
.mn-it{display:flex;align-items:center;gap:12px;width:100%;background:none;border:none;color:var(--txt);font-size:14.5px;padding:10px 12px;border-radius:9px;cursor:pointer;text-align:left;white-space:nowrap}
.mn-it svg{color:var(--txt2)}
.mn-it:hover{background:var(--card)}
.mn-it.danger{color:var(--red)}.mn-it.danger svg{color:var(--red)}
.mn-hd{padding:10px 12px 10px;border-bottom:1px solid var(--bdr);margin-bottom:6px}
.mn-hd b{display:block;font-weight:500;font-size:15px}
.mn-hd span{font-size:13px;color:var(--mut)}

/* ══ Page ══ */
.page{padding:30px 44px 90px;max-width:none;width:100%}
.hello{font-size:40px;font-weight:400;letter-spacing:-.015em;line-height:1.15;margin-bottom:10px}
.hello-s{color:var(--mut);font-size:15px;margin-bottom:34px}
.acts{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:34px}
.acts .bp,.acts .bs{height:47px;padding:0 22px;font-size:18px;gap:12px}
.acts-r{margin-left:auto;display:flex;align-items:center;gap:14px}
.cust{background:none;border:none;color:var(--txt);font-size:17px;display:inline-flex;gap:10px;align-items:center;cursor:pointer;padding:8px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:34px;margin-bottom:56px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:34px}
.card{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r-card);position:relative;min-width:0}
.card-p{padding:34px 36px}
.card-hd{display:flex;align-items:center;justify-content:space-between;gap:12px}
.card-t{font-size:19px;font-weight:400;color:var(--txt);display:flex;align-items:center;gap:12px}
.card-ctl{display:flex;align-items:center;gap:10px}
.vbadge{width:30px;height:30px;border-radius:999px;background:#2a2e4d;display:inline-flex;align-items:center;justify-content:center;color:var(--acc-txt)}
.livedot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulseL 2s ease-in-out infinite;display:inline-block}

/* Money-style number: large figure, raised small decimals */
.amt{display:inline-flex;align-items:flex-start;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.amt-s{font-size:.52em;margin-left:.08em;margin-top:.14em;letter-spacing:0}
.big{font-size:40px;font-weight:400;line-height:1.1;margin-top:8px}
.mid{font-size:26px;font-weight:400;line-height:1.2}

/* Balance-card chart */
.bal{padding:0;overflow:hidden;display:flex;flex-direction:column}
.bal-top{padding:30px 36px 0;display:flex;justify-content:space-between;gap:16px}
.bal-sub{padding:26px 36px 0;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.rng{background:none;border:none;color:var(--txt);font-size:19px;display:inline-flex;align-items:center;gap:10px;cursor:pointer;padding:4px 0}
.inout{display:flex;align-items:center;gap:22px;font-size:19px;font-variant-numeric:tabular-nums}
.inout>span{display:inline-flex;align-items:center;gap:8px}
.up{color:var(--green)}.dn{color:var(--red)}
.seg{display:inline-flex;border:1px solid var(--bdr-lt);border-radius:12px;overflow:hidden;height:58px;background:#1a1a20}
.seg button{width:60px;border:none;background:none;color:var(--txt2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s}
.seg button+button{border-left:1px solid var(--bdr-lt)}
.seg button.on{background:#25252c;color:var(--link)}
.ch{position:relative;margin-top:22px;flex:1;min-height:270px;display:flex;flex-direction:column;cursor:crosshair}
.ch svg{display:block;flex:1}
.ch-x{display:flex;justify-content:space-around;padding:14px 60px 20px;border-top:1px solid var(--bdr);font-size:15.5px;color:var(--mut);background:var(--surf)}
.ch-tip{position:absolute;top:6px;transform:translateX(-50%);background:#26262e;border:1px solid var(--bdr-lt);border-radius:10px;padding:8px 12px;font-size:13.5px;pointer-events:none;white-space:nowrap;box-shadow:0 12px 30px rgba(0,0,0,.4)}
.ch-tip b{display:block;font-weight:500;font-size:15px;margin-top:2px;font-variant-numeric:tabular-nums}
.ch-tip span{color:var(--mut)}
.ch-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:14px;pointer-events:none}
.tview{margin-top:22px;flex:1;max-height:330px;overflow:auto;border-top:1px solid var(--bdr)}

/* Account-style list */
.acc{padding:30px 24px 22px}
.acc .card-hd{padding:0 12px 18px}
.acc-row{position:relative;display:flex;align-items:center;gap:18px;padding:12px 12px;border-radius:10px;min-height:64px;cursor:default;transition:background .12s}
.acc-row:hover{background:var(--hover)}
.acc-ic{width:42px;height:42px;border-radius:999px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;color:var(--txt);background:#26262d;box-shadow:inset 0 0 0 1.5px #55555f}
.acc-ic.brk{box-shadow:inset 0 0 0 1.5px var(--link);color:var(--acc-txt);background:#23253a}
.acc-ic.lun{box-shadow:inset 0 0 0 1.5px var(--indigo);color:var(--indigo);background:#2a2331}
.acc-ic.bth{box-shadow:inset 0 0 0 1.5px var(--blue);color:var(--blue);background:#1f2833}
.acc-ic.more{box-shadow:none;background:#2a2a32;color:var(--txt2);font-size:13px}
.acc-n{flex:1;min-width:0;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:10px}
.acc-n small{font-size:13px;color:var(--mut)}
.acc-v{font-size:19px;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.acc-v.mut{color:var(--mut);font-size:16px}
.acc-row.link{cursor:pointer}
.acc-tip{position:absolute;right:-50px;bottom:calc(100% - 14px);background:#26262e;border:1px solid var(--bdr-lt);border-radius:10px;padding:14px 18px;min-width:290px;z-index:15;box-shadow:0 18px 40px rgba(0,0,0,.45);opacity:0;pointer-events:none;transform:translateY(4px);transition:opacity .15s,transform .15s}
.acc-row:hover .acc-tip{opacity:1;transform:none}
.acc-tip div{display:flex;justify-content:space-between;gap:24px;font-size:15.5px;line-height:1.9;font-variant-numeric:tabular-nums}
.acc-tip div span:first-child{color:var(--txt2)}
.acc-tip hr{border:none;border-top:1px solid var(--bdr-lt);margin:8px 0}

/* 3CX page: agent profile cards, day strip, chart. Uses the app's own colour variables. */
.cx-days{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 14px;margin-bottom:22px}
.cx-day{flex:0 0 auto;min-width:68px;background:var(--surf);border:1px solid var(--bdr);border-radius:14px;padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--txt);cursor:pointer;font:inherit;transition:background .12s,border-color .12s}
.cx-day b{font-size:19px;font-weight:500;font-variant-numeric:tabular-nums}
.cx-day span{font-size:12.5px;color:var(--mut)}
.cx-day:hover{border-color:var(--bdr-lt)}
.cx-day.on{background:#d9d4ff;border-color:#d9d4ff;color:#14131c}
.cx-day.on span{color:#4b4a66}

.cx-two{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:34px;margin-bottom:34px;align-items:start}
@media(max-width:1200px){.cx-two{grid-template-columns:1fr}}
.cx-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px;padding:0 12px;margin-bottom:18px}
.cx-tiles>div{background:#212128;border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:5px;min-width:0}
.cx-tiles span{font-size:12.5px;color:var(--mut);white-space:nowrap}
.cx-tiles b{font-weight:400;font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap}
.cx-chart{padding:0 12px}
.cx-chart svg{width:100%;height:auto;display:block}
.cx-leg{display:flex;flex-wrap:wrap;gap:18px;font-size:13px;color:var(--mut);padding:10px 12px 0}
.cx-leg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:baseline}

.cx-sec{font-size:24px;font-weight:400;margin:6px 0 16px;display:flex;align-items:baseline;gap:12px}
.cx-sec small{font-size:14px;color:var(--mut)}
.cx-chips{display:flex;gap:10px;flex-wrap:wrap;margin:-4px 0 18px}
.cx-chip{background:var(--surf);border:1px solid var(--bdr);border-radius:999px;padding:8px 16px;font-size:14px;color:var(--txt2);display:inline-flex;align-items:center;gap:8px}
.cx-chip b{font-weight:500;color:var(--txt)}
.cx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:22px;margin-bottom:38px}
.cx-card{text-align:left;font:inherit;color:inherit;cursor:pointer;background:linear-gradient(180deg,#201d2e,#18171f);border:1px solid var(--bdr);border-radius:var(--r-card);padding:22px 22px 18px;display:flex;flex-direction:column;gap:18px;transition:transform .14s,border-color .14s;min-width:0}
.cx-card:hover{border-color:#4b4f78;transform:translateY(-2px)}
.cx-top{display:flex;align-items:center;gap:14px;min-width:0}
.cx-av{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:500;background:#262633;flex-shrink:0;color:var(--txt)}
.cx-av.lg{width:92px;height:92px;font-size:30px}
.cx-who{min-width:0;display:flex;flex-direction:column;gap:6px}
.cx-name{font-size:19px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cx-ext{margin-left:auto;font-size:13px;color:var(--mut);white-space:nowrap}
.cx-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 12px}
.cx-stats>div{display:flex;flex-direction:column;gap:3px;min-width:0}
.cx-stats span{font-size:12.5px;color:var(--mut);white-space:nowrap}
.cx-stats b{font-weight:400;font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
.cx-stats .warn{color:var(--bad-txt)}.cx-stats .note{color:var(--warn-txt)}
.cx-tlbig .cx-st{display:inline-flex;align-items:center;gap:7px;font-size:13px;padding:4px 10px;border-radius:999px;background:var(--card);color:var(--txt2);white-space:nowrap;width:max-content}
.cx-st::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--c,#6b7390)}

.cx-back{margin-bottom:20px}
.cx-prof{display:flex;align-items:center;gap:26px;flex-wrap:wrap;margin-bottom:28px}
.cx-prof h1{font-size:34px;font-weight:400;line-height:1.15;margin-bottom:8px}
.cx-two2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:34px;margin-bottom:34px}
@media(max-width:1200px){.cx-two2{grid-template-columns:1fr}}
.cx-list-sub{font-size:13px;color:var(--mut)}

.cx-bar{display:flex;height:18px;border-radius:999px;overflow:hidden;background:#23252f;gap:2px;margin:6px 0 4px}
.cx-bar i{display:block;height:100%;min-width:3px}
.cx-split{display:flex;flex-wrap:wrap;gap:10px 32px;padding:12px 0 0;font-size:14px}
.cx-split>div{display:flex;align-items:center;gap:10px;color:var(--txt2)}
.cx-split i{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.cx-split b{font-weight:400;margin-left:4px;font-variant-numeric:tabular-nums;color:var(--txt)}
.cx-reason{font-size:13.5px;color:var(--mut);line-height:1.5}
.cx-ok{background:var(--green-d);color:var(--green)}
.cx-bad{background:rgba(220,38,38,.18);color:var(--bad-txt)}
.cx-cmp{display:flex;gap:26px;flex-wrap:wrap;font-size:14px;color:var(--mut);margin-top:4px}
.cx-cmp b{font-weight:400;color:var(--txt2)}

.cx-alerts .acc-row{gap:14px}
.cx-alerts .acc-n{white-space:normal;flex:0 1 auto}
.cx-alerts .cx-reason{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cx-done{width:36px;height:36px;border-radius:50%;border:none;background:var(--card);color:var(--txt2);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.cx-done:hover{background:var(--card2);color:var(--green)}

.cx-live{margin:0 0 22px}
.cx-live-t{font-size:15px;color:var(--txt2);margin-bottom:10px}.cx-live-t small{color:var(--mut);font-size:13px;margin-left:6px}
.cx-live-g{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.cx-lt{position:relative;border:1px solid var(--bdr);border-radius:var(--r-card);padding:18px 20px 16px;display:flex;flex-direction:column;gap:2px;background:var(--surf)}
.cx-lt-ic{position:absolute;right:16px;top:16px;width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.cx-lt b{font-weight:300;font-size:44px;line-height:1.1;font-variant-numeric:tabular-nums}
.cx-lt span{font-size:14px;color:var(--txt2)}
.cx-lt em{display:block;height:4px;border-radius:99px;background:rgba(255,255,255,.07);margin-top:12px;overflow:hidden}
.cx-lt em i{display:block;height:100%;background:var(--c);border-radius:99px;transition:width .5s}
.cx-lt.zero b{color:var(--mut)}
.cx-mix{display:flex;height:8px;border-radius:99px;overflow:hidden;gap:2px;margin-top:12px;background:#23252f}
@media(max-width:760px){.cx-live-g{grid-template-columns:repeat(2,minmax(0,1fr))}.cx-lt b{font-size:36px}}

.cx-tl{margin:8px 0 6px}
.cx-tl-track{position:relative;height:12px;border-radius:99px;background:#23252f}
.cx-seg{position:absolute;top:0;bottom:0;min-width:2px;border-right:1px solid #18171f;opacity:.92;transition:opacity .12s,transform .12s}
.cx-seg:first-child{border-radius:99px 0 0 99px}.cx-seg:last-child{border-radius:0 99px 99px 0;border-right:0}
.cx-seg:hover{opacity:1;z-index:5;filter:brightness(1.15)}
.cx-tip{display:none;position:absolute;bottom:calc(100% + 14px);left:50%;transform:translateX(-50%);z-index:20;background:#0f0f14;border:1px solid var(--bdr);border-radius:10px;padding:9px 12px;white-space:nowrap;font-size:13px;color:var(--txt);text-align:left;box-shadow:0 8px 24px rgba(0,0,0,.45);pointer-events:none;font-variant-numeric:tabular-nums}
.cx-tip b{display:block;font-weight:500;margin-bottom:2px}.cx-tip em{display:block;font-style:normal;color:var(--mut);font-size:12.5px;margin-top:2px}
.cx-seg:hover .cx-tip{display:block}
.cx-seg.l .cx-tip{left:0;transform:none}.cx-seg.r .cx-tip{left:auto;right:0;transform:none}
.cx-tl-axis{position:relative;height:20px;margin-top:6px;font-size:12px;color:var(--mut)}
.cx-tl-axis span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.cx-tl-axis span:first-child{transform:none}

.cx-two2>.card{max-height:380px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#3a3d4a transparent}
.cx-two2>.card{padding-top:0}
.cx-two2>.card>.card-hd{position:sticky;top:0;z-index:2;background:var(--surf);padding:26px 0 12px}
.cx-two2>.card::-webkit-scrollbar{width:8px}.cx-two2>.card::-webkit-scrollbar-thumb{background:#3a3d4a;border-radius:99px}
.cx-tl-axis span:last-child{transform:translateX(-100%)}


/* agent view: break time left, call stats */
.al-sub{font-size:13px;color:var(--mut);margin-top:4px}
.al-big{font-size:34px;font-weight:300;font-variant-numeric:tabular-nums;line-height:1.1}.al-big.over{color:var(--bad-txt)}
.al-bar{position:relative;height:12px;border-radius:99px;background:#23252f;margin:10px 0 4px}
.al-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:#8e9cff}.al-bar i.over{background:#ef6b5b}
.al-bar b{position:absolute;top:-4px;bottom:-4px;width:2px;background:#f5f5fa;border-radius:2px}
.cx-tiles>div.warn{box-shadow:inset 0 0 0 1px rgba(245,165,36,.55)}.cx-tiles>div.bad{box-shadow:inset 0 0 0 1px rgba(239,107,91,.55)}
.al-flag{font-style:normal;font-size:11px;letter-spacing:.03em;text-transform:uppercase;color:#14131c;background:#f5a524;border-radius:99px;padding:1px 8px;margin-left:8px}
.lunch-strip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:-6px 0 18px}
.lunch-pill{display:inline-flex;align-items:center;gap:8px;background:var(--surf);border:1px solid var(--bdr);border-radius:999px;padding:8px 16px;font-size:14.5px;color:var(--txt2)}.lunch-pill b{font-weight:500;color:var(--txt)}.lunch-pill.now{border-color:#b3812a;color:var(--warn-txt)}.lunch-pill.now b{color:var(--warn-txt)}

/* ═════ new shell: floating sidebar, theme, requests, calendar ═════ */
:root[data-theme="light"]{
  --bg:#f2f3f8;--side:#fff;--surf:#ffffff;--card:#eceef5;--card2:#e2e5ef;--hover:#f0f2f8;
  --bdr:#e4e7ef;--bdr-lt:#d6dae6;
  --txt:#15161c;--txt2:#3a3d4b;--mut:#6b7081;--mut2:#98a0b3;
  --violet:#4f5fe6;--violet-hi:#5d6cf0;--link:#4251d6;
  --amber:#4f5fe6;--amber-d:rgba(79,95,230,.1);--amber-r:rgba(79,95,230,.3);--amber-glow:rgba(79,95,230,.3);
  --indigo:#8a4fc4;--indigo-d:rgba(138,79,196,.1);--indigo-r:rgba(138,79,196,.28);
  --blue:#2c7fd0;--blue-d:rgba(44,127,208,.1);--blue-r:rgba(44,127,208,.28);
  --green:#17915f;--green-d:rgba(23,145,95,.1);--green-r:rgba(23,145,95,.28);--green-glow:rgba(23,145,95,.3);
  --red:#d3425c;--red-d:rgba(211,66,92,.09);--red-r:rgba(211,66,92,.26);
  --top-bg:rgba(242,243,248,.86);--pop:#ffffff;--tile:#f1f3f9;--track:#e3e6ef;--shadow:0 24px 60px rgba(30,34,60,.16);
  --bad-txt:#c1304b;--warn-txt:#a35a05;--acc-txt:#3f4ed0;
  --sb-bg:#0f1014;--sb-bdr:#0f1014;--sb-txt:#aeb0bf;--sb-hover:rgba(255,255,255,.07);--sb-on:rgba(255,255,255,.13);--sb-acc:#9aa8ff;
}
:root[data-theme="light"] ::selection{background:rgba(79,95,230,.25);color:inherit}
:root[data-theme="light"] ::-webkit-scrollbar-thumb{background:#c9cddb}
.theming *,.theming *::before,.theming *::after{transition:background-color .35s,color .35s,border-color .35s,fill .35s,stroke .35s,box-shadow .35s!important}

/* light theme: the places that used fixed dark colours */
[data-theme="light"] .card,[data-theme="light"] .sblk,[data-theme="light"] .stat,[data-theme="light"] .sc,[data-theme="light"] .lunch-group-card,[data-theme="light"] .tile,[data-theme="light"] .rq-card,[data-theme="light"] .lunch-pill{box-shadow:0 1px 2px rgba(25,28,50,.04),0 10px 30px rgba(25,28,50,.05)}
[data-theme="light"] .wm-icon{background:#e9ebf3;box-shadow:none}
[data-theme="light"] .wm-t{color:var(--txt)}
[data-theme="light"] select.fi option,[data-theme="light"] select.fi option,[data-theme="light"] .type-sel option{background:#fff}
[data-theme="light"] .srch-in:focus{border-color:var(--link);background:#fff}
[data-theme="light"] .kbd span{background:#e9ebf3}
[data-theme="light"] .srch-pop,[data-theme="light"] .mn-pop{background:var(--pop);box-shadow:var(--shadow)}
[data-theme="light"] .avb{background:linear-gradient(145deg,#6b7bff,#4251d6);color:#fff}
[data-theme="light"] .vbadge{background:#e6e9ff}
[data-theme="light"] .seg{background:#eceef5}[data-theme="light"] .seg button.on{background:#fff}
[data-theme="light"] .ch-tip,[data-theme="light"] .acc-tip,[data-theme="light"] .toast,[data-theme="light"] .modal-box{background:#fff;box-shadow:var(--shadow)}
[data-theme="light"] .acc-ic{background:#eef0f7;box-shadow:inset 0 0 0 1.5px #c3c8d8}
[data-theme="light"] .acc-ic.brk{background:#e8ebff}[data-theme="light"] .acc-ic.lun{background:#f2e9fb}[data-theme="light"] .acc-ic.bth{background:#e5f1fc}[data-theme="light"] .acc-ic.more{background:#e9ebf3}
[data-theme="light"] .onb-bar,[data-theme="light"] .bar,[data-theme="light"] .tbar-track span{background:#e3e6ef}
[data-theme="light"] .legend i.f{background:#b9bfd0}
[data-theme="light"] .tiles>div,[data-theme="light"] .cx-tiles>div{background:var(--tile)}
[data-theme="light"] .fab{background:#fff;box-shadow:0 8px 28px rgba(25,28,50,.16)}[data-theme="light"] .fab:hover{background:#f3f4fa}
[data-theme="light"] .av,[data-theme="light"] .cx-av{background:#eef0f7;box-shadow:inset 0 0 0 1.5px #c3c8d8}
[data-theme="light"] .cx-card{background:linear-gradient(180deg,#ffffff,#f6f7fc)}
[data-theme="light"] .cx-bar,[data-theme="light"] .cx-mix,[data-theme="light"] .cx-tl-track,[data-theme="light"] .al-bar{background:var(--track)}
[data-theme="light"] .cx-seg{border-right-color:#fff}
[data-theme="light"] .cx-tip{background:#fff;color:var(--txt);box-shadow:var(--shadow)}
[data-theme="light"] .cx-day.on{background:#4f5fe6;border-color:#4f5fe6;color:#fff}[data-theme="light"] .cx-day.on span{color:#dfe3ff}
[data-theme="light"] .cx-lt em{background:rgba(20,22,40,.08)}
[data-theme="light"] .al-bar b{background:#15161c}
[data-theme="light"] .al-flag{color:#fff;background:#d98a0b}
[data-theme="light"] .cx-bad{background:rgba(211,66,92,.12)}
[data-theme="light"] .cx-two2>.card{scrollbar-color:#c9cddb transparent}
[data-theme="light"] .cx-two2>.card::-webkit-scrollbar-thumb{background:#c9cddb}
[data-theme="light"] .lunch-pill.now{border-color:#d98a0b;color:#a35a05;background:#fff8ea}[data-theme="light"] .lunch-pill.now b{color:#7a4303}
[data-theme="light"] .instr.connecting .lite{background:#e0a02c}
[data-theme="light"] svg [stroke="#2b2b33"]{stroke:#e4e7ef}
[data-theme="light"] svg [fill="#7c7c88"]{fill:#6b7081}
[data-theme="light"] .ebox,[data-theme="light"] .awrn{background:var(--red-d)}
[data-theme="light"] .b-on,[data-theme="light"] .b-brk,[data-theme="light"] .b-a{background:var(--amber-d);color:var(--acc-txt)}
[data-theme="light"] .spin{border-color:#d6dae6;border-top-color:#15161c}
[data-theme="light"] .tbar-track i{background:linear-gradient(90deg,#4f5fe6,#8e9cff)}

/* ── sidebar ── */
.shell{display:flex;min-height:100vh}
.sb{position:sticky;top:12px;align-self:flex-start;height:calc(100vh - 24px);margin:12px 0 12px 12px;width:var(--sb-w);flex-shrink:0;background:var(--sb-bg);border:1px solid var(--sb-bdr);border-radius:30px;display:flex;flex-direction:column;overflow:hidden;z-index:30;transition:width .42s var(--ease),transform .4s var(--ease);box-shadow:0 18px 50px rgba(0,0,0,.28)}
.sb.col{width:var(--sb-wc)}
.sb-hd{height:92px;display:flex;align-items:center;gap:14px;padding:0 20px;flex-shrink:0}
.sb-logo{width:46px;height:46px;border-radius:15px;background:linear-gradient(145deg,#5266eb,#8e9cff);display:grid;place-items:center;color:#fff;flex-shrink:0;box-shadow:0 10px 24px rgba(82,102,235,.45);animation:sbLogo .8s var(--ease) both}
@keyframes sbLogo{0%{transform:scale(.6) rotate(-20deg);opacity:0}100%{transform:none;opacity:1}}
.sb-name{font-size:18px;font-weight:500;color:#fff;white-space:nowrap;letter-spacing:-.01em;transition:opacity .25s,transform .4s var(--ease)}
.sb-nav{position:relative;flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 14px 12px;display:flex;flex-direction:column;gap:4px;scrollbar-width:none}
.sb-nav::-webkit-scrollbar{display:none}
.sb-ind{position:absolute;left:14px;right:14px;top:0;border-radius:17px;background:var(--sb-on);pointer-events:none;transition:transform .45s var(--ease),height .3s var(--ease),opacity .2s;z-index:0}
.sb-ind::before{content:'';position:absolute;left:-14px;top:24%;bottom:24%;width:4px;border-radius:0 5px 5px 0;background:var(--sb-acc);box-shadow:0 0 14px var(--sb-acc)}
.sb-i{position:relative;z-index:1;height:52px;flex-shrink:0;display:flex;align-items:center;gap:16px;padding:0 15px;border:none;background:none;border-radius:17px;color:var(--sb-txt);font-size:15.5px;font-family:inherit;cursor:pointer;text-align:left;white-space:nowrap;width:100%;transition:color .2s,background .2s;animation:sbIn .6s var(--ease) both;animation-delay:calc(var(--i,0)*32ms + 120ms)}
@keyframes sbIn{0%{opacity:0;transform:translateX(-14px)}100%{opacity:1;transform:none}}
.sb-i:hover{color:#fff;background:var(--sb-hover)}
.sb-i:hover .sb-ic{transform:translateX(2px) scale(1.1)}
.sb-i:focus-visible{outline:2px solid var(--sb-acc);outline-offset:-2px}
.sb-ic{width:24px;height:24px;display:grid;place-items:center;flex-shrink:0;transition:transform .3s var(--ease),color .2s}
.sb-i.on{color:#fff}
.sb-i.on .sb-ic{color:var(--sb-acc);animation:sbPop .55s var(--ease)}
@keyframes sbPop{0%{transform:scale(.7) rotate(-14deg)}55%{transform:scale(1.2) rotate(5deg)}100%{transform:none}}
.sb-lb{flex:1;transition:opacity .25s,transform .4s var(--ease)}
.sb-badge{min-width:24px;height:24px;padding:0 7px;border-radius:99px;background:var(--sb-acc);color:#13141c;font-size:12.5px;font-weight:600;display:grid;place-items:center;font-variant-numeric:tabular-nums;animation:sbBadge .5s var(--ease);transition:opacity .2s}
@keyframes sbBadge{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:none}}
.sb.col .sb-badge{position:absolute;top:7px;right:9px;min-width:18px;height:18px;font-size:10.5px;padding:0 4px}
.sb-sec{padding:20px 15px 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#6e7081;white-space:nowrap;flex-shrink:0;transition:opacity .25s}
.sb.col .sb-name,.sb.col .sb-lb{opacity:0;transform:translateX(-10px);pointer-events:none}
.sb.col .sb-sec{padding:12px 0 6px;font-size:0}.sb.col .sb-sec::after{content:'';display:block;height:1px;background:var(--sb-hover)}
.sb-ft{padding:10px 14px 16px;display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--sb-hover);flex-shrink:0}
.sb-meta{display:flex;align-items:center;gap:10px;padding:8px 15px 10px;font-size:13px;color:#7e8092;white-space:nowrap;overflow:hidden}
.sb-meta span{transition:opacity .25s}.sb.col .sb-meta span{opacity:0}
.sb .instr{background:rgba(255,255,255,.08);color:#c9cad6}
.sb-sm{height:46px;font-size:14.5px}
.theme-ic{position:relative;width:22px;height:22px;display:block}
.theme-ic svg{position:absolute;inset:0;transition:transform .55s var(--ease),opacity .3s}
[data-theme="dark"] .theme-ic .t-sun{transform:rotate(-90deg) scale(.4);opacity:0}
[data-theme="light"] .theme-ic .t-moon{transform:rotate(90deg) scale(.4);opacity:0}
.sb-col-ic{transition:transform .45s var(--ease)}.sb.col .sb-col-ic{transform:rotate(180deg)}
.scrim{display:none}
.theme-fab{position:fixed;top:16px;right:16px;width:46px;height:46px;border-radius:999px;border:1px solid var(--bdr);background:var(--surf);color:var(--txt2);display:grid;place-items:center;cursor:pointer;z-index:5;transition:transform .2s}

<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useLayoutEffect, useMemo } = React;

const SB = supabase.createClient(window.BT_URL, window.BT_KEY, {
  auth: { persistSession: true, autoRefreshToken: true }
});

/* ── Company clock ─────────────────────────────────────────────
   Every time the app shows or compares uses ONE clock, so a PC with a wrong clock or time zone
   can't change reminders, the shift-end check or the times that get stored:
     • the time zone is the UTC offset saved in Settings → Clock (bt_settings.slot_tz)
     • the real time comes from the server (bt_slot_sync returns it every 30s)
   Until those are known it falls back to the PC's own clock, which is how it behaved before. */
let _skew = 0;     // server time minus this PC's clock, in ms
let _coff = null;  // company UTC offset in hours (null = use the PC's)
const appNow   = () => Date.now() + _skew;
const nowISO   = () => new Date(appNow()).toISOString();
const clockOff = () => _coff !== null ? _coff : -new Date().getTimezoneOffset()/60;
const wall     = t  => new Date((t==null ? appNow() : new Date(t).getTime()) + clockOff()*3600000);   // read with the UTC getters
const wallHM   = t  => { const w=wall(t); return `${pad(w.getUTCHours())}:${pad(w.getUTCMinutes())}`; };
const wallAt   = (h,m) => { const w=wall(); return Date.UTC(w.getUTCFullYear(),w.getUTCMonth(),w.getUTCDate(),h,m) - clockOff()*3600000; };
const applyClockTz = tz => { const o=tzToOff(tz); if(o===null||o===_coff) return false; _coff=o; return true; };

/* ── Auto-refresh safety net ──────────────────────────────────────────
   Supabase Realtime pushes changes instantly when it's working, but it can
   silently drop (phone screen locks, wifi/cell handoff, tab backgrounded,
   Realtime not enabled on a table, RLS quirks, etc). This hook re-runs the
   given load function on an interval AND immediately whenever the tab/app
   becomes visible or regains focus again, so a screen never goes stale for
   more than a few seconds even if the live socket dies quietly. */
function useAutoRefresh(load, intervalMs = 6000){
  useEffect(() => {
    const id = intervalMs ? setInterval(() => { load(); }, intervalMs) : null;
    const onVis = () => { if (document.visibilityState === 'visible') load(); };
    document.addEventListener('visibilitychange', onVis);
    window.addEventListener('focus', onVis);
    window.addEventListener('online', onVis);
    return () => {
      if (id) clearInterval(id);
      document.removeEventListener('visibilitychange', onVis);
      window.removeEventListener('focus', onVis);
      window.removeEventListener('online', onVis);
    };
  }, [load, intervalMs]);
}

/* ── Global "last synced" clock — bumped every time any screen finishes a
   successful load, read by the connection instrument so agent and admin
   both show an honest "how fresh is what I'm looking at" readout. ── */
let _lastSync = appNow();
const _syncListeners = [];
function bumpSync(){ _lastSync = appNow(); _syncListeners.forEach(fn => fn(_lastSync)); }
function useLastSync(){
  const [t,setT] = useState(_lastSync);
  useEffect(() => { _syncListeners.push(setT); return () => { const i=_syncListeners.indexOf(setT); if(i>-1)_syncListeners.splice(i,1); }; }, []);
  return t;
}

/* ── Live connection instrument — reads the real Supabase Realtime socket
   state (not just "did my one channel's callback fire"), so the pill in
   the header tells the truth about whether this screen can currently
   receive live updates at all. ── */
function useConnectionState(){
  const [state, setState] = useState('connecting');
  useEffect(() => {
    const check = () => {
      if (typeof navigator !== 'undefined' && !navigator.onLine) { setState('offline'); return; }
      try {
        const cs = SB.realtime && SB.realtime.connectionState ? SB.realtime.connectionState() : null;
        if (cs === 'open') setState('live');
        else if (cs === 'connecting') setState('connecting');
        else setState('connecting');
      } catch(e) { setState('connecting'); }
    };
    check();
    const id = setInterval(check, 2500);
    window.addEventListener('online', check);
    window.addEventListener('offline', check);
    return () => { clearInterval(id); window.removeEventListener('online', check); window.removeEventListener('offline', check); };
  }, []);
  return state;
}

function agoStr(ts){
  const s = Math.max(0, Math.round((appNow()-ts)/1000));
  if (s < 3) return 'just now';
  if (s < 60) return `${s}s ago`;
  return `${Math.floor(s/60)}m ago`;
}

function ConnInstrument({compact}){
  const conn = useConnectionState();
  const lastSync = useLastSync();
  const [, force] = useState(0);
  useEffect(() => { const id = setInterval(() => force(n=>n+1), 4000); return () => clearInterval(id); }, []);
  const label = conn === 'live' ? 'Live' : conn === 'offline' ? 'Offline' : 'Reconnecting…';
  return (
    <span className={`instr ${conn}`} title="Realtime connection status">
      <span className="lite"/>{label}
      {!compact && <span className="syncedAt">· synced {agoStr(lastSync)}</span>}
    </span>
  );
}

/* ── Ticker digits — the engineered "this number just changed" motif.
   Re-keying each character on change forces React to remount it, which
   triggers the CSS flap-in animation — a cheap, honest way to make a
   live readout visibly announce its own updates instead of silently
   swapping text. ── */
function TNum({value, className, mono=true}){
  const str = String(value);
  return (
    <span className={`tnum ${className||''}`} style={mono?{}:{fontFamily:'inherit'}}>
      {str.split('').map((c,i) => <span key={i+'|'+c} className="tnum-d">{c}</span>)}
    </span>
  );
}

/* ═══ 3CX analysis (copy of tools/3cx/analyze.js) ═══ */
const CX = (function(){ const module = { exports: {} }; const exports = module.exports;
// 3CX status log analysis: turns the rows written by logger.js (status_log.csv) into
//   - per-agent time per status (Admin, Break, Available, On call, ...)
//   - call counts and talk time per agent
//   - ignored rings (the phone rang, the agent didn't answer)
//   - short calls (possible dropped calls)
//   - break records shaped like the app's bt_logs rows
//   - a list of alerts for the admin
//
// Pure functions, no dependencies and no network. Nothing here is connected to the app yet.

const DEFAULTS = {
  tzOffsetHours: 0,        // UTC offset of the PC that ran the logger (its clock wrote the log's timestamps)
  dayOffsetHours: null,    // UTC offset used to cut the log into days (the app's Settings → Clock); null = same as tzOffsetHours
  shortCallSec: 60,        // a call shorter than this is a possible dropped call
  ignoreRingSec: 10,       // a ring that ends unanswered after at least this long counts as ignored
  takenByOtherSec: 3,      // someone else answered within this many seconds of the ring ending → not ignored
  repeatIgnoreCount: 3,    // this many ignored rings ...
  repeatIgnoreWindowMin: 60, // ... inside this many minutes raises a "repeated" alert
  minBreakSec: 10,         // ignore break blips shorter than this when building break records
  quietCapMin: 30,         // a status with no change keeps running only this long after the log's last row (the logger may have stopped)
  breakToleranceSec: 180,  // break check: an agent's total break time may differ from 3CX by this much before it is flagged
};

const S = { CALL: 'On call', RING: 'Ringing', ADMIN: 'Admin', BREAK: 'Break', OFFLINE: 'Offline' };
// logger.js logs custom 3CX statuses as written, so Lunch / Bathroom / Break all count as breaks
const isBreak = status => /break|lunch|bathroom|toilet/i.test(status || '');

/* ── CSV ─────────────────────────────────────────────────────────── */
function parseCsv(text) {
  const rows = []; let row = [], cur = '', q = false;
  const s = String(text).replace(/^﻿/, '');
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (q) {
      if (c === '"') { if (s[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && s[i + 1] === '\n') i++;
      row.push(cur); cur = '';
      if (row.length > 1 || row[0] !== '') rows.push(row);
      row = [];
    } else cur += c;
  }
  if (cur !== '' || row.length) { row.push(cur); if (row.length > 1 || row[0] !== '') rows.push(row); }
  if (!rows.length) return [];
  const head = rows[0].map(h => h.trim());
  return rows.slice(1).map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] ?? '').trim()])));
}

// "2026-10-27 12:51:57" is written in the logger PC's clock. Convert it to a real instant (ms).
function parseStamp(str, tz) {
  const m = /^(\d{4})-(\d\d)-(\d\d)[ T](\d\d):(\d\d):(\d\d)/.exec(str || '');
  if (!m) return NaN;
  return Date.UTC(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +m[6]) - tz * 3600000;
}
function dayRange(day, tz) {                     // [start, end) of a day on the company clock
  const m = /^(\d{4})-(\d\d)-(\d\d)$/.exec(day);
  if (!m) throw new Error('day must look like 2026-10-27');
  const start = Date.UTC(+m[1], +m[2] - 1, +m[3]) - tz * 3600000;
  return [start, start + 864e5];
}
function isoLocal(ms, tz) {                      // an instant as "YYYY-MM-DD HH:MM:SS" on the company clock
  return new Date(ms + tz * 3600000).toISOString().slice(0, 19).replace('T', ' ');
}

/* ── rows uploaded by the logger to Supabase ────────────────────── */
// The logger can also post each status change to a Supabase table (status_log: changed_at, extension, agent, old_status,
// new_status, detail). changed_at is a real instant (UTC), so these rows do NOT depend on the logger PC's time zone.
// This turns them into the same rows the CSV gives, written in UTC: analyze them with tzOffsetHours: 0.
function rowsFromStatusLog(rows) {

/* ── Web Audio notification sounds ── */
let _audioCtx = null;
function getAudioCtx() {
  if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return _audioCtx;
}
function playNotifSound(type = 'info') {
  try {
    const ctx = getAudioCtx();
    if (ctx.state === 'suspended') ctx.resume();
    const presets = {
      lunch:  [{ f:660, t:0,    d:0.12, g:0.5 }, { f:880, t:0.13, d:0.12, g:0.5 }, { f:1100, t:0.26, d:0.2, g:0.6 }],
      break:  [{ f:520, t:0,    d:0.15, g:0.4 }, { f:660, t:0.18, d:0.2,  g:0.4 }],
      warn:   [{ f:440, t:0,    d:0.1,  g:0.5 }, { f:340, t:0.13, d:0.1,  g:0.5 }, { f:440, t:0.26, d:0.15, g:0.5 }],
      info:   [{ f:600, t:0,    d:0.1,  g:0.3 }, { f:800, t:0.12, d:0.15, g:0.3 }],
      custom: [{ f:500, t:0,    d:0.1,  g:0.35}, { f:700, t:0.13, d:0.1,  g:0.35}, { f:900, t:0.26, d:0.2, g:0.4 }],
    };
    const notes = presets[type] || presets.info;
    const now = ctx.currentTime;
    notes.forEach(({ f, t, d, g }) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(f, now + t);
      gain.gain.setValueAtTime(0, now + t);
      gain.gain.linearRampToValueAtTime(g, now + t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, now + t + d);
      osc.start(now + t);
      osc.stop(now + t + d + 0.01);
    });
  } catch(e) { /* audio blocked — silent fail */ }
}

/* ── Global toast emitter — works without React context ── */
const _toastListeners = [];
const toastEmit = (toast) => _toastListeners.forEach(fn => fn(toast));

function useToastEmitter(addToast) {
  useEffect(() => {
    _toastListeners.push(addToast);
    return () => { const i = _toastListeners.indexOf(addToast); if(i>-1)_toastListeners.splice(i,1); };
  }, [addToast]);
}

/* ── Master fire function: in-app toast + OS desktop notification + sound ── */
function fireNotification({ title, body, type = 'info', duration = 7000 }) {
  playNotifSound(type);
  toastEmit({ id: appNow() + Math.random(), title, body, type, duration });
  if ('Notification' in window) {
    try { if (Notification.permission === 'granted') new Notification(title, { body, tag: type + '-' + appNow(), requireInteraction: type === 'lunch' }); } catch (e) {}
  }
}

/* ── Toast Container ── */
function ToastContainer() {
  const [toasts, setToasts] = useState([]);
  const addToast = useCallback((t) => {
    setToasts(p => [...p, { ...t, leaving: false }]);
    setTimeout(() => {
      setToasts(p => p.map(x => x.id === t.id ? { ...x, leaving: true } : x));
      setTimeout(() => setToasts(p => p.filter(x => x.id !== t.id)), 260);
    }, t.duration || 7000);
  }, []);
  useToastEmitter(addToast);
  const dismiss = (id) => {
    setToasts(p => p.map(x => x.id === id ? { ...x, leaving: true } : x));
    setTimeout(() => setToasts(p => p.filter(x => x.id !== id)), 260);
  };
  const typeIcon = { lunch:'utensils', break:'coffee', info:'bell', warn:'alert', custom:'zap' };
  return (
    <div className="toast-container">
      {toasts.map(t => (
        <div key={t.id} className={`toast${t.leaving?' leaving':''}`}>
          <div className={`toast-ic ${t.type}`}><Ic n={typeIcon[t.type]||'bell'} size={16} sw={2}/></div>
          <div style={{flex:1,minWidth:0}}>
            <div className="toast-title">{t.title}</div>
            <div className="toast-body">{t.body}</div>
          </div>
          <button className="toast-close" onClick={()=>dismiss(t.id)}><Ic n="x" size={14}/></button>
          <div className="toast-bar" style={{animationDuration:`${t.duration||7000}ms`}}/>
        </div>
      ))}
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   SUPABASE REALTIME BROADCAST CHANNEL
   Admins publish to 'bt_broadcast'; agents receive.
   Nothing is written to the database.
══════════════════════════════════════════════════════════════ */
const BROADCAST_CHANNEL = 'bt_broadcast';
const BROADCAST_EVENT   = 'notif';
const SWAP_CHANNEL      = 'bt_swap';
const SWAP_EVENT        = 'swap_request';

/* Publish a notification to all agents (or a specific user_id) via Supabase Realtime broadcast */
async function broadcastNotif({ title, body, type = 'custom', targetUserId = null, lunchGroup = null }) {
  const ch = SB.channel(BROADCAST_CHANNEL);
  await new Promise(res => {
    ch.subscribe(status => { if(status === 'SUBSCRIBED') res(); });
  });
  await ch.send({ type:'broadcast', event: BROADCAST_EVENT, payload:{ title, body, type, targetUserId, lunchGroup } });
  SB.removeChannel(ch);
}

/* ── Broadcast a swap request/response via Realtime ── */
async function broadcastSwap(payload) {
  const ch = SB.channel(SWAP_CHANNEL);
  await new Promise(res => { ch.subscribe(s => { if(s==='SUBSCRIBED') res(); }); });
  await ch.send({ type:'broadcast', event: SWAP_EVENT, payload });
  SB.removeChannel(ch);
}

/* ── Persist swap request to DB ── */
async function createSwapRequest({ fromUserId, fromName, toUserId, toName, fromGroup, toGroup, date }) {
  const { data, error } = await run(
    SB.from('bt_swap_requests').insert({
      from_user_id: fromUserId, from_name: fromName,
      to_user_id: toUserId,   to_name: toName,
      from_group: fromGroup,  to_group: toGroup,
      date, status: 'pending',
      created_at: nowISO(),
    }).select().single()
  );
  return { data, error };
}

/* ── Agent: listen for incoming swap requests/responses ── */
function useSwapListener(userId, onRequest) {
  useEffect(() => {
    const ch = SB.channel(SWAP_CHANNEL + '-' + userId)
      .on('broadcast', { event: SWAP_EVENT }, ({ payload }) => {
        if (payload.toUserId === userId || payload.fromUserId === userId) {
          onRequest(payload);
        }
      })
      .subscribe();
    return () => SB.removeChannel(ch);
  }, [userId]);
}

/* ── Agent: listen for broadcast notifications ── */
/* lunchInfo is passed in so we can filter lunch broadcasts to the right group */
function useAgentNotifListener(userId, lunchInfo) {
  // one subscription for the whole session (the group is read through a ref), so it is never torn down and re-joined on the same channel name
  const grpRef = useRef(null);
  grpRef.current = lunchInfo?.group || null;
  useEffect(() => {
    let ch = null, dead = false, retry = null, tries = 0, gen = 0;
    const drop = () => { if (ch) { try { SB.removeChannel(ch); } catch (e) {} ch = null; } };
    const connect = () => {
      if (dead) return;
      drop();
      const my = ++gen;
      ch = SB.channel(BROADCAST_CHANNEL)
        .on('broadcast', { event: BROADCAST_EVENT }, ({ payload }) => {
          if (!payload) return;
          if (payload.targetUserId && payload.targetUserId !== userId) return;
          if (payload.lunchGroup && (!grpRef.current || grpRef.current !== payload.lunchGroup)) return;
          fireNotification({ title: payload.title, body: payload.body, type: payload.type || 'custom', duration: 9000 });
        })
        .subscribe(status => {
          if (my !== gen || dead) return;
          if (status === 'SUBSCRIBED') { tries = 0; return; }
          if ((status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') && !retry) {
            retry = setTimeout(() => { retry = null; tries++; connect(); }, Math.min(30000, 2000 * (tries + 1)));
          }
        });
    };
    connect();
    const vis = () => { if (document.visibilityState === 'visible' && ch && ch.state && ch.state !== 'joined' && !retry) connect(); };
    document.addEventListener('visibilitychange', vis);
    return () => { dead = true; clearTimeout(retry); document.removeEventListener('visibilitychange', vis); drop(); };
  }, [userId]);
}

/* Agent: 5-min personal reminder based on their own lunch slot */
function useLunchReminder(lunchInfo) {
  const firedRef = useRef(new Set());
  useEffect(() => {
    if (!lunchInfo?.group || !lunchInfo?.slot) return;
    const check = () => {
      const nowUTC = appNow();
      const nowDate = new Date(nowUTC);
      const [h, m] = lunchInfo.slot.from.split(':').map(Number);
      // Lunch times are on the company clock (Settings → Clock), not the PC's
      const lunchAt = wallAt(h, m);
      const diff = (lunchAt - nowUTC) / 60000;
      const key = `${nowDate.toISOString().slice(0,10)}-${lunchInfo.slot.from}-${lunchInfo.group}`;
      if (diff > 0 && diff <= 5 && !firedRef.current.has(key)) {
        firedRef.current.add(key);
        fireNotification({
          title: `🍽️ Lunch in ${Math.ceil(diff)} min!`,
          body: `Group ${lunchInfo.group} — your lunch starts at ${lunchInfo.slot.from}. Get ready!`,
          type: 'lunch',
          duration: 10000,
        });
      }
    };
    check();
    const id = setInterval(check, 20000);
    return () => clearInterval(id);
  }, [lunchInfo]);
}

/* Applies the saved slot schedule from any open screen, as a backup to the pg_cron job.
   bt_slot_sync only does what the admin saved, so it is safe for every signed-in user. */
let _slotFnMissing = false;
function useSlotSchedulerTick() {
  const [, bump] = useState(0);
  useEffect(() => {
    const tick = async () => {
      if (_slotFnMissing) return;
      const t0 = Date.now();
      const { data, error } = await run(SB.rpc('bt_slot_sync'));
      const t1 = Date.now();
      if (error && /bt_slot_sync|schema cache/.test(error.message || '')) _slotFnMissing = true;
      let changed = false;
      if (data && data.server_ms) {                         // server time, minus half the round trip
        const sk = data.server_ms - (t0 + t1) / 2;
        if (Math.abs(sk - _skew) > 1500) { _skew = sk; changed = true; }
      }
      if (data && data.tz && applyClockTz(data.tz)) changed = true;
      if (changed) bump(n => n + 1);
    };
    tick();
    const id = setInterval(tick, 30000);
    return () => clearInterval(id);
  }, []);
}

/* Admin: automated broadcast to ALL agents at the exact scheduled lunch times.
   Reads today's lunch schedule from Supabase once per minute and fires broadcasts
   at configured alert times (default 5 min before each group's slot). */
function useAdminLunchBroadcast(alertMinutes = 5) {
  const firedRef = useRef(new Set());
  useEffect(() => {
    const check = async () => {
      const today = todayISO();
      const { data: ls } = await run(
        SB.from('bt_lunch_schedule').select('*').eq('date', today).maybeSingle()
      );
      if (!ls) return;
      const first = ls.group_first || defaultFirst(today);
      const slots = lunchSlots(first);
      const nowUTC = appNow();
      const nowDate = new Date(nowUTC);
      ['A', 'B'].forEach(grp => {
        const [h, m] = slots[grp].from.split(':').map(Number);
        // Lunch times are on the company clock (Settings → Clock), not the PC's
        const lunchAt = wallAt(h, m);
        const diff = (lunchAt - nowUTC) / 60000;
        const key = `auto-${grp}-${slots[grp].from}-${today}`;
        if (diff > 0 && diff <= alertMinutes && !firedRef.current.has(key)) {
          firedRef.current.add(key);
          const mins = Math.ceil(diff);
          broadcastNotif({
            title: `🍽️ Group ${grp} Lunch in ${mins} min`,
            body: `Group ${grp}: your lunch break starts at ${slots[grp].from}. Please get ready to head out!`,
            type: 'lunch',
            lunchGroup: grp,
          });
        }
      });
    };
    check();
    const id = setInterval(check, 30000);
    return () => clearInterval(id);
  }, [alertMinutes]);
}

-- an agent can only cancel their own pending request; they cannot touch the decision fields
create or replace function public.bt_requests_guard() returns trigger language plpgsql as $$
begin
  if public.bt_is_admin() then
    if new.status is distinct from old.status then new.decided_at := now(); end if;
    return new;
  end if;
  if new.user_id is distinct from old.user_id or new.admin_note is distinct from old.admin_note
     or new.decided_by is distinct from old.decided_by or new.decided_at is distinct from old.decided_at then
    raise exception 'not allowed';
  end if;
  return new;
end $$;
drop trigger if exists bt_requests_guard on public.bt_requests;
create trigger bt_requests_guard before update on public.bt_requests for each row execute function public.bt_requests_guard();

grant select, insert, update on public.bt_requests to authenticated;

const THEME_KEY='bt_theme', SIDE_KEY='bt_side';

    const root=document.documentElement, n=root.getAttribute('data-theme')==='light'?'dark':'light';

    try{ localStorage.setItem(THEME_KEY,n); }catch(e){}

  },[]);
  return [t,toggle];
}

/* Desktop (Windows) notifications need a click to switch on */
function useNotifPerm(){
  const get=()=>('Notification' in window)?Notification.permission:'unsupported';
  const [perm,setPerm]=useState(get);
  useEffect(()=>{ const f=()=>setPerm(get()); window.addEventListener('bt-notif-perm',f); window.addEventListener('focus',f); return()=>{ window.removeEventListener('bt-notif-perm',f); window.removeEventListener('focus',f); }; },[]);
  const ask=useCallback(()=>{
    if(!('Notification' in window)) return;
    if(Notification.permission==='denied'){ fireNotification({title:'Notifications are blocked',body:'Click the padlock next to the address bar, set Notifications to Allow, then reload this page.',type:'warn',duration:14000}); return; }
    const done=p=>{ window.dispatchEvent(new Event('bt-notif-perm')); if(p==='granted'){ try{ new Notification('Notifications are on',{body:'You will get lunch and message alerts here.'}); }catch(e){} } };
    try{ const r=Notification.requestPermission(done); if(r&&r.then) r.then(done); }catch(e){}
  },[]);
  return [perm,ask];
}

/* ── requests: shared bits ── */
const REQ_KINDS={pto:'Time off',document:'Document',other:'Other',sick:'Sick leave',shift:'Shift change'};
const REQ_NEW=['pto','document','other'];   // what an agent can ask for (older sick/shift requests still show)
const REQ_STATUS={pending:'Pending',approved:'Approved',denied:'Denied',cancelled:'Cancelled'};
const REQ_ICON={pto:'palm',document:'file',sick:'drop',shift:'swap',other:'message'};
const isoAdd=(iso,n)=>new Date(Date.parse(iso+'T00:00:00Z')+n*86400000).toISOString().slice(0,10);
const dShort=iso=>new Date(iso+'T00:00:00Z').toLocaleDateString('en-GB',{day:'numeric',month:'short',timeZone:'UTC'});
const reqRange=r=>{ if(!r.start_date) return 'No dates'; const a=dShort(r.start_date), b=dShort(r.end_date||r.start_date); return a===b?a:`${a} – ${b}`; };
const reqDays=r=>r.start_date?Math.round((Date.parse((r.end_date||r.start_date)+'T00:00:00Z')-Date.parse(r.start_date+'T00:00:00Z'))/86400000)+1:0;
const reqOn=(r,d)=>!!r.start_date&&r.start_date<=d&&d<=(r.end_date||r.start_date);
const reqMissing=e=>/bt_requests|bt_request_msgs|schema cache|does not exist/i.test((e&&e.message)||'');
const StatusChip=({s})=><span className={`st ${s}`}>{REQ_STATUS[s]||s}</span>;

function ReqThread({req,me}){
  const [msgs,setMsgs]=useState([]);
  const [text,setText]=useState('');
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState('');
  const box=useRef(null);
  const load=useCallback(async()=>{
    const {data,error}=await run(SB.from('bt_request_msgs').select('*').eq('request_id',req.id).order('created_at',{ascending:true}));
    if(!error) setMsgs(data||[]);
  },[req.id]);
  useEffect(()=>{ load(); },[load]);
  useAutoRefresh(load,8000);
  useReqChanged(load);
  useEffect(()=>{ if(box.current) box.current.scrollTop=box.current.scrollHeight; },[msgs.length]);
  const send=async()=>{
    const body=text.trim(); if(!body||busy) return;
    setBusy(true); setErr('');
    const {error}=await run(SB.from('bt_request_msgs').insert({request_id:req.id,user_id:me.id,author_name:me.name,is_admin:me.isAdmin,body}));
    setBusy(false);
    if(error){ setErr(error.message); return; }
    setText(''); load();
  };
  return(
    <div className="thread" data-thread={req.id}>
      <div className="msgs" ref={box}>
        {msgs.length===0&&<div className="rq-s">No messages yet.</div>}
        {msgs.map(m=>(
          <div key={m.id} className={`msg ${m.user_id===me.id?'mine':'theirs'}`}><small>{m.user_id===me.id?'You':m.author_name}{m.is_admin&&m.user_id!==me.id?' · admin':''} · {fmtD(m.created_at)} {hhmm(m.created_at)}</small>{m.body}</div>
        ))}
      </div>
      {err&&<div className="ebox" style={{marginBottom:0}}><Ic n="alert" size={14}/>{err}</div>}
      <div className="rq-compose">
        <textarea className="fi" placeholder="Write a message…" value={text} maxLength={2000} onChange={e=>setText(e.target.value)} onKeyDown={e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send(); } }}/>
        <button className="bp" onClick={send} disabled={busy||!text.trim()}><Ic n="send" size={15}/> Send</button>
      </div>
    </div>
  );
}

/* toasts for new requests, decisions and messages (live); screens refresh themselves through the 'bt-req' event */
const reqChanged=()=>window.dispatchEvent(new Event('bt-req'));
function useReqChanged(load){ useEffect(()=>{ window.addEventListener('bt-req',load); return()=>window.removeEventListener('bt-req',load); },[load]); }
function useRequestToasts(user,isAdmin){
  const cb=useRef(reqChanged);
  useEffect(()=>{
    const ch=SB.channel('req-toast-'+user.id)
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'bt_requests'},({new:r})=>{
        if(isAdmin&&r.user_id!==user.id) fireNotification({title:'📥 New request',body:`${r.agent_name}: ${REQ_KINDS[r.kind]||r.kind}${r.start_date?' · '+reqRange(r):''}`,type:'info',duration:9000});
        cb.current&&cb.current();
      })
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'bt_requests'},({new:r})=>{
        if(!isAdmin&&r.user_id===user.id&&(r.status==='approved'||r.status==='denied'))
          fireNotification({title:r.status==='approved'?'✅ Request approved':'❌ Request denied',body:`${REQ_KINDS[r.kind]||r.kind}${r.start_date?' · '+reqRange(r):''}`,type:r.status==='approved'?'info':'warn',duration:10000});
        cb.current&&cb.current();
      })
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'bt_request_msgs'},({new:m})=>{
        if(m.user_id!==user.id&&(isAdmin||m.is_admin)) fireNotification({title:isAdmin?`💬 ${m.author_name}`:'💬 Message from admin',body:String(m.body).slice(0,120),type:'custom',duration:8000});
        cb.current&&cb.current();
      })
      .subscribe();
    return()=>SB.removeChannel(ch);
  },[user.id,isAdmin]);
}
/* sidebar badge: admin = requests waiting; agent = decisions and admin messages since they last opened Requests */
function useReqBadge(user,isAdmin,onTab){
  const [n,setN]=useState(0);
  const key='bt_req_seen_'+user.id;
  const load=useCallback(async()=>{
    if(isAdmin){ const {data,error}=await run(SB.from('bt_requests').select('id').eq('status','pending')); setN(error?0:(data||[]).length); return; }
    let seen=0; try{ seen=Number(localStorage.getItem(key)||0); }catch(e){}
    if(onTab||!seen){ try{ localStorage.setItem(key,String(Date.now())); }catch(e){} setN(0); return; }
    const iso=new Date(seen).toISOString();
    const [a,b]=await Promise.all([
      run(SB.from('bt_requests').select('id').eq('user_id',user.id).in('status',['approved','denied']).gte('decided_at',iso)),
      run(SB.from('bt_request_msgs').select('id').eq('is_admin',true).gte('created_at',iso)),
    ]);
    setN((a.error?0:(a.data||[]).length)+(b.error?0:(b.data||[]).length));
  },[user.id,isAdmin,onTab]);
  useEffect(()=>{ load(); },[load]);
  useAutoRefresh(load,15000);
  useReqChanged(load);
  return [n,load];
}

/* ── agent: Requests tab ── */
function AgentRequests({user,name}){
  const [rows,setRows]=useState([]);
  const [loading,setLoading]=useState(true);
  const [needSetup,setNeedSetup]=useState(false);
  const [err,setErr]=useState('');
  const [busy,setBusy]=useState(false);
  const [open,setOpen]=useState(null);
  const today=todayISO();
  const [f,setF]=useState({kind:'pto',start:today,end:today,note:''});
  const load=useCallback(async()=>{
    const {data,error}=await run(SB.from('bt_requests').select('*').eq('user_id',user.id).order('created_at',{ascending:false}));
    if(error){ if(reqMissing(error)) setNeedSetup(true); else setErr(error.message); }
    else{ setNeedSetup(false); setErr(''); setRows(data||[]); }
    setLoading(false); bumpSync();
  },[user.id]);
  useEffect(()=>{ load(); },[load]);
  useAutoRefresh(load,10000);
  useReqChanged(load);
  const needsDates=f.kind==='pto';
  const valid=(!needsDates||(f.start&&f.end&&f.end>=f.start))&&(f.kind==='pto'||f.note.trim().length>0);
  const submit=async()=>{
    if(!valid||busy) return;
    setBusy(true); setErr('');
    const row={user_id:user.id,agent_name:name,kind:f.kind,start_date:needsDates?f.start:null,end_date:needsDates?f.end:null,note:f.note.trim()||null,status:'pending'};
    const {data,error}=await run(SB.from('bt_requests').insert(row).select().single());
    setBusy(false);
    if(error){ if(reqMissing(error)) setNeedSetup(true); else setErr('Could not send: '+error.message); return; }
    setRows(p=>[data,...p]); setOpen(data.id); setF(x=>({...x,note:''}));
    fireNotification({title:'Request sent',body:`${REQ_KINDS[data.kind]}${data.start_date?' · '+reqRange(data):''} is waiting for approval.`,type:'info',duration:5000});
  };
  const cancel=async r=>{
    const {error}=await run(SB.from('bt_requests').update({status:'cancelled'}).eq('id',r.id).eq('status','pending'));
    if(error){ setErr('Could not cancel: '+error.message); return; }
    setRows(p=>p.map(x=>x.id===r.id?{...x,status:'cancelled'}:x));
  };
  const cnt=s=>rows.filter(r=>r.status===s).length;
  const me={id:user.id,name,isAdmin:false};
  return(
    <div className="panel" style={{padding:0}} id="tab-requests">
      <div className="tab-h"><h1>Requests</h1><p>Ask for time off or anything else, and message the admin about it.</p></div>
      {err&&<div className="ebox"><Ic n="alert" size={14}/>{err}</div>}
      {needSetup?(
        <div className="sblk"><h2 className="sh">Requests are not set up yet</h2><p className="sd">Your admin needs to finish a one-time setup first. It takes a minute and then this page works.</p></div>
      ):(<>
        <div className="kpis">
          <div className="kpi"><div className="kpi-ic"><Ic n="timer" size={20}/></div><b>{cnt('pending')}</b><span>Waiting for a decision</span></div>
          <div className="kpi"><div className="kpi-ic g"><Ic n="check" size={20}/></div><b>{cnt('approved')}</b><span>Approved</span></div>
          <div className="kpi"><div className="kpi-ic r"><Ic n="x" size={20}/></div><b>{cnt('denied')}</b><span>Denied</span></div>
        </div>
        <div className="rq-grid">
          <div className="card rq-form" id="rq-form">
            <h2>New request</h2>
            <label>Type
              <select className="fi" value={f.kind} onChange={e=>setF({...f,kind:e.target.value})} aria-label="Request type">
                {REQ_NEW.map(k=><option key={k} value={k}>{k==='document'?'Document request':REQ_KINDS[k]}</option>)}
              </select>
            </label>
            {needsDates&&<div className="rq-two">
              <label>From<input className="fi" type="date" min={today} value={f.start} onChange={e=>setF({...f,start:e.target.value,end:f.end<e.target.value?e.target.value:f.end})} aria-label="From date"/></label>
              <label>To<input className="fi" type="date" min={f.start||today} value={f.end} onChange={e=>setF({...f,end:e.target.value})} aria-label="To date"/></label>
            </div>}
            <label>{f.kind==='document'?'Which document do you need?':f.kind==='other'?'What do you need?':'Note (optional)'}
              <textarea className="fi" value={f.note} maxLength={2000} onChange={e=>setF({...f,note:e.target.value})} placeholder={f.kind==='pto'?'e.g. family trip':f.kind==='document'?'e.g. employment letter, payslip, reference':''} aria-label="Note"/>
            </label>
            <button className="bp" onClick={submit} disabled={!valid||busy}>{busy?<span className="spin-sm"/>:<><Ic n="send" size={15}/> Send request</>}</button>
          </div>
          <div className="rq-list" id="rq-list">
            {loading?<div className="es"><div className="spin"/></div>
             :rows.length===0?<div className="card rq-empty">No requests yet. Your requests and the admin's replies will show up here.</div>
             :rows.map(r=>(
              <div key={r.id} className="rq-card" data-req={r.id}>
                <div className="rq-top">
                  <div className={`rq-ico ${r.kind}`}><Ic n={REQ_ICON[r.kind]||'message'} size={20}/></div>
                  <div><div className="rq-t">{REQ_KINDS[r.kind]||r.kind}{r.start_date?` · ${reqRange(r)}`:''}</div>
                    <div className="rq-s">{r.start_date?`${reqDays(r)} day${reqDays(r)===1?'':'s'} · `:''}sent {fmtD(r.created_at)}</div></div>
                  <span className="rq-sp"><StatusChip s={r.status}/></span>
                </div>
                {r.note&&<div className="rq-note">{r.note}</div>}
                {r.admin_note&&<div className="rq-dec"><b>{r.decided_by||'Admin'}:</b> {r.admin_note}</div>}
                <div className="rq-acts">
                  <button className="bs" onClick={()=>setOpen(open===r.id?null:r.id)}><Ic n="message" size={15}/> {open===r.id?'Hide messages':'Messages'}</button>
                  {r.status==='pending'&&<button className="bs" onClick={()=>cancel(r)}>Cancel request</button>}
                </div>
                {open===r.id&&<ReqThread req={r} me={me}/>}
              </div>
            ))}
          </div>
        </div>
      </>)}
    </div>
  );
}

/* ── admin: Requests tab (list + calendar) ── */
function calGrid(month){      // month = 'YYYY-MM-01'
  const dow=(new Date(month+'T00:00:00Z').getUTCDay()+6)%7, start=isoAdd(month,-dow), cells=[];
  for(let i=0;i<42;i++){ const d=isoAdd(start,i); cells.push({d,out:d.slice(0,7)!==month.slice(0,7)}); }
  while(cells.length>35&&cells.slice(-7).every(c=>c.out)) cells.length-=7;
  return cells;
}
const monthAdd=(month,n)=>{ const d=new Date(month+'T00:00:00Z'); return new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+n,1)).toISOString().slice(0,10); };
function ARequests({user,name}){
  const [rows,setRows]=useState([]);
  const [loading,setLoading]=useState(true);
  const [needSetup,setNeedSetup]=useState(false);
  const [err,setErr]=useState('');
  const [view,setView]=useState('list');
  const [filter,setFilter]=useState('pending');
  const [open,setOpen]=useState(null);
  const [deny,setDeny]=useState(null);       // {id,reason}
  const [showPend,setShowPend]=useState(true);
  const today=todayISO();
  const [month,setMonth]=useState(today.slice(0,7)+'-01');
  const [sel,setSel]=useState(today);
  const load=useCallback(async()=>{
    const {data,error}=await run(SB.from('bt_requests').select('*').order('created_at',{ascending:false}));
    if(error){ if(reqMissing(error)) setNeedSetup(true); else setErr(error.message); }
    else{ setNeedSetup(false); setErr(''); setRows(data||[]); }
    setLoading(false); bumpSync();
  },[]);
  useEffect(()=>{ load(); },[load]);
  useAutoRefresh(load,10000);
  useReqChanged(load);
  const me={id:user.id,name,isAdmin:true};
  const decide=async(r,status,reason)=>{
    const patch={status,decided_by:name,decided_at:nowISO(),admin_note:reason?reason:null};
    const {error}=await run(SB.from('bt_requests').update(patch).eq('id',r.id));
    if(error){ setErr('Could not save: '+error.message); return; }
    setRows(p=>p.map(x=>x.id===r.id?{...x,...patch}:x)); setDeny(null); reqChanged();
  };
  const live=r=>r.status==='approved'||r.status==='pending';
  const overlaps=r=>r.start_date?rows.filter(o=>o.id!==r.id&&o.user_id!==r.user_id&&live(o)&&o.start_date&&o.start_date<=(r.end_date||r.start_date)&&(o.end_date||o.start_date)>=r.start_date):[];

  const gen=()=>{ const c='abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'; const a=new Uint32Array(10); crypto.getRandomValues(a); setF(x=>({...x,pw:Array.from(a,n=>c[n%c.length]).join('')})); setShow(true); };
  const submit=async()=>{
