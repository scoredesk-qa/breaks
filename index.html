/* ══════════════════════════════════════════════════════════════
   AGENT
══════════════════════════════════════════════════════════════ */
function AgentApp({user,name,onLogout}){
  const [clockRow,  setClockRow]  = useState(null);
  const [active,    setActive]    = useState(null);
  const [logs,      setLogs]      = useState([]);
  const [elapsed,   setElapsed]   = useState(0);
  const [maxB,      setMaxB]      = useState(3);
  const [teamCount, setTeamCount] = useState(0);
  useSlotSchedulerTick();
  const team = useTeamConfig();
  const trainee = isTrainee(name);
  const [confirmOut, setConfirmOut] = useState(false);
  const [loading,   setLoading]   = useState(true);
  const [err,       setErr]       = useState('');
  const [lunchInfo, setLunchInfo] = useState(null); // {group:'A'|'B', slot:{from,to}}
  // Swap request state
  const [incomingSwaps, setIncomingSwaps] = useState([]); // pending requests TO this agent
  const [outgoingSwap,  setOutgoingSwap]  = useState(null); // request FROM this agent (pending)
  const [showSwapModal, setShowSwapModal] = useState(false);
  const [swapBusy,      setSwapBusy]      = useState(false);
  const timerRef = useRef(null);
  const outgoingSwapRef = useRef(null);
  useEffect(()=>{ outgoingSwapRef.current = outgoingSwap; },[outgoingSwap]);
  const today = todayISO();

  // Notification hooks
  useLunchReminder(trainee ? null : lunchInfo);
  useAgentNotifListener(user.id, trainee ? null : lunchInfo);

  // Swap listener — receives broadcast events for immediate response UX
  useSwapListener(user.id, useCallback((payload) => {
    if (payload.action === 'request' && payload.toUserId === user.id) {
      // New incoming request — the postgres_changes sub will also catch it, but toast here for immediacy
      fireNotification({ title: '🔄 Lunch Swap Request', body: `${payload.fromName} wants to swap lunch groups with you.`, type: 'custom', duration: 15000 });
    }
    if (payload.action === 'accepted' && payload.fromUserId === user.id) {
      // Our request was accepted — update outgoing swap and reload lunch
      setOutgoingSwap(null);
      fireNotification({ title: '✅ Swap Accepted!', body: `${payload.toName} accepted. Your lunch group has been updated.`, type: 'info', duration: 10000 });
      // Fetch fresh lunch schedule from DB
      run(SB.from('bt_lunch_schedule').select('*').eq('date',today).maybeSingle()).then(({data:ls})=>{
        if(!ls) return;
        const grpA=ls.group_a||[]; const grpB=ls.group_b||[];
        const myGrp=grpA.includes(name)?'A':grpB.includes(name)?'B':null;
        const first=ls.group_first||defaultFirst(today); const slots=lunchSlots(first);
        if(myGrp) setLunchInfo({group:myGrp,slot:slots[myGrp],allA:grpA,allB:grpB,first,slots});
        else setLunchInfo({group:null,allA:grpA,allB:grpB});
      });
    }
    if (payload.action === 'declined' && payload.fromUserId === user.id) {
      setOutgoingSwap(null);
      fireNotification({ title: '❌ Swap Declined', body: `${payload.toName} declined your swap request.`, type: 'warn', duration: 8000 });
    }
  }, [user.id, today, name]));

  const load = useCallback(async()=>{
    setLoading(true); setErr('');
    const {data:cr} = await run(SB.from('bt_clocklogs').select('*').eq('user_id',user.id).eq('date',today).maybeSingle());
    setClockRow(cr||null);
    const {data:bl,error:e2} = await run(SB.from('bt_logs').select('*').eq('user_id',user.id).gte('start_time',today+'T00:00:00.000Z').order('start_time',{ascending:false}));
    if(e2){setErr(e2.message);setLoading(false);return;}
    setLogs(bl||[]);
    const openBreak = (bl||[]).find(l=>!l.end_time);
    setActive(openBreak||null);
    const {data:cfg} = await run(SB.from('bt_settings').select('max_concurrent_breaks').eq('id',1).maybeSingle());
    if(cfg) setMaxB(cfg.max_concurrent_breaks);
    const {data:tc} = await run(SB.from('bt_logs').select('id,agent_name').is('end_time',null));
    setTeamCount(slotCount(tc));
    // Lunch schedule
    const {data:ls} = await run(SB.from('bt_lunch_schedule').select('*').eq('date',today).maybeSingle());
    if(ls){
      const grpA = ls.group_a || [];
      const grpB = ls.group_b || [];
      const myGrp = grpA.includes(name) ? 'A' : grpB.includes(name) ? 'B' : null;
      if(myGrp){
        const first = ls.group_first || defaultFirst(today);
        const slots = lunchSlots(first);
        setLunchInfo({group:myGrp, slot:slots[myGrp], allA:grpA, allB:grpB, first, slots});
      } else {
        setLunchInfo({group:null, allA:grpA, allB:grpB});
      }
    } else {
      // No DB row for today yet — use default rotation so agents still see their group
      const first = defaultFirst(today);
      const slots = lunchSlots(first);
      setLunchInfo({ group: null, allA: [], allB: [], first, slots, isDefault: true });
    }
    // Load any pending outgoing swap requests
    const {data:mySwaps} = await run(SB.from('bt_swap_requests').select('*').eq('from_user_id',user.id).eq('date',today).eq('status','pending').order('created_at',{ascending:false}).limit(1));
    if(mySwaps&&mySwaps.length>0) setOutgoingSwap(mySwaps[0]);
    else setOutgoingSwap(null);
    // Load pending incoming swap requests
    const {data:incoming} = await run(SB.from('bt_swap_requests').select('*').eq('to_user_id',user.id).eq('date',today).eq('status','pending').order('created_at',{ascending:false}));
    setIncomingSwaps(incoming||[]);
    setLoading(false);
    bumpSync();
  },[user.id,today,name]);

  useEffect(()=>{ load(); },[load]);

  // Real-time: break logs — re-fetches team count/logs whenever the socket (re)connects,
  // so a dropped-and-restored connection never leaves this screen showing stale state.
  useEffect(()=>{
    const ch = SB.channel('agent-rt-'+user.id)
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'bt_logs'},({new:nw})=>{
        if(nw.user_id!==user.id) setTeamCount(c=>c+1);
        else setLogs(p=>p.some(l=>l.id===nw.id)?p:[nw,...p]);
        bumpSync();
      })
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'bt_logs'},({new:nw})=>{
        if(nw.user_id!==user.id){ if(nw.end_time) setTeamCount(c=>Math.max(0,c-1)); }
        else setLogs(p=>p.map(l=>l.id===nw.id?nw:l));
        bumpSync();
      })
      .subscribe(status => { if(status === 'SUBSCRIBED') load(); });
    return()=>SB.removeChannel(ch);
  },[user.id]);

  // Real-time: lunch schedule — call load() on any change so we always get fresh data
  // (REPLICA IDENTITY may not be FULL on this table, so we don't trust the payload)
  useEffect(()=>{
    // Helper: apply fetched schedule to agent state
    const applySchedule = (ls) => {
      if(!ls){
        const first = defaultFirst(today); const slots = lunchSlots(first);
        setLunchInfo(prev => prev?.group ? prev : { group:null, allA:[], allB:[], first, slots, isDefault:true });
        return;
      }
      const grpA = ls.group_a || []; const grpB = ls.group_b || [];
      const myGrp = grpA.includes(name) ? 'A' : grpB.includes(name) ? 'B' : null;
      const first = ls.group_first || defaultFirst(today); const slots = lunchSlots(first);
      if(myGrp) setLunchInfo({group:myGrp, slot:slots[myGrp], allA:grpA, allB:grpB, first, slots});
      else setLunchInfo({group:null, allA:grpA, allB:grpB, first, slots});
    };
    const fetchAndApply = () =>
      run(SB.from('bt_lunch_schedule').select('*').eq('date',today).maybeSingle()).then(({data})=>{applySchedule(data); bumpSync();});

    const ch = SB.channel('agent-lunch-rt-'+user.id)
      .on('postgres_changes',{event:'*',schema:'public',table:'bt_lunch_schedule'},()=>{
        // Always re-fetch rather than trusting payload (REPLICA IDENTITY may not be FULL)
        fetchAndApply();
      })
      // Re-fetch on reconnect so agents who were offline catch up immediately
      .subscribe(status => { if(status === 'SUBSCRIBED') fetchAndApply(); });
    return()=>SB.removeChannel(ch);
  },[user.id,today,name]);

  // Real-time: swap requests — re-fetch on any change, fire toast for new incoming
  useEffect(()=>{
    const ch = SB.channel('agent-swaps-rt-'+user.id)
      .on('postgres_changes',{event:'*',schema:'public',table:'bt_swap_requests'},async({eventType,new:nw})=>{
        // Re-fetch pending incoming swaps
        const {data:incoming} = await run(SB.from('bt_swap_requests').select('*').eq('to_user_id',user.id).eq('date',today).eq('status','pending').order('created_at',{ascending:false}));
        setIncomingSwaps(prev => {
          const newList = incoming||[];
          // Fire toast for brand-new incoming requests
          newList.forEach(sr => { if(!prev.some(p=>p.id===sr.id)) {
            fireNotification({ title:'🔄 Lunch Swap Request', body:`${sr.from_name} wants to swap lunch groups with you.`, type:'custom', duration:15000 });
          }});
          return newList;
        });
        // Re-fetch outgoing
        const {data:mySwaps} = await run(SB.from('bt_swap_requests').select('*').eq('from_user_id',user.id).eq('date',today).eq('status','pending').order('created_at',{ascending:false}).limit(1));
        const hadOutgoing = !!outgoingSwapRef.current;
        const newOutgoing = (mySwaps&&mySwaps.length>0) ? mySwaps[0] : null;
        setOutgoingSwap(newOutgoing);
        bumpSync();
        // If our outgoing just got accepted, reload lunch info
        if(hadOutgoing && !newOutgoing && nw?.from_user_id===user.id && nw?.status==='accepted') {
          fireNotification({ title:'✅ Swap Accepted!', body:`Your lunch group has been updated.`, type:'info', duration:10000 });
          run(SB.from('bt_lunch_schedule').select('*').eq('date',today).maybeSingle()).then(({data:ls})=>{
            if(!ls) return;
            const grpA=ls.group_a||[]; const grpB=ls.group_b||[];
            const myGrp=grpA.includes(name)?'A':grpB.includes(name)?'B':null;
            const first=ls.group_first||defaultFirst(today); const slots=lunchSlots(first);
            if(myGrp) setLunchInfo({group:myGrp,slot:slots[myGrp],allA:grpA,allB:grpB,first,slots});
          });
        }
        if(hadOutgoing && !newOutgoing && nw?.from_user_id===user.id && nw?.status==='declined') {
          fireNotification({ title:'❌ Swap Declined', body:`Your swap request was declined.`, type:'warn', duration:8000 });
        }
      })
      .subscribe(status => { if(status==='SUBSCRIBED'){ /* resync happens via the effect above on mount */ } });
    return()=>SB.removeChannel(ch);
  },[user.id,today,name]);

  useEffect(()=>{
    // Poll team break count every 8s (tightened from 15s so a dropped realtime
    // socket never leaves the agent staring at a stale team-capacity number)
    const id=setInterval(async()=>{
      const {data}=await run(SB.from('bt_logs').select('id,agent_name').is('end_time',null));
      setTeamCount(slotCount(data));
      const {data:cfg}=await run(SB.from('bt_settings').select('max_concurrent_breaks').eq('id',1).maybeSingle());
      if(cfg) setMaxB(cfg.max_concurrent_breaks);
    },8000);
    // Poll lunch schedule every 20s as a safety net — catches changes that slip past
    // the realtime subscription (e.g. direct Supabase edits, brief network drops)
    const applyLunchData = (ls) => {
      if(!ls){
        const first=defaultFirst(today); const slots=lunchSlots(first);
        setLunchInfo(prev => prev?.group ? prev : { group:null, allA:[], allB:[], first, slots, isDefault:true });
        return;
      }
      const grpA=ls.group_a||[]; const grpB=ls.group_b||[];
      const myGrp=grpA.includes(name)?'A':grpB.includes(name)?'B':null;
      const first=ls.group_first||defaultFirst(today); const slots=lunchSlots(first);
      if(myGrp) setLunchInfo({group:myGrp,slot:slots[myGrp],allA:grpA,allB:grpB,first,slots});
      else setLunchInfo({group:null,allA:grpA,allB:grpB,first,slots});
    };
    const lunchPoll=setInterval(async()=>{
      const {data:ls}=await run(SB.from('bt_lunch_schedule').select('*').eq('date',today).maybeSingle());
      applyLunchData(ls);
    },20000);
    return()=>{ clearInterval(id); clearInterval(lunchPoll); };
  },[today,name]);

  useEffect(()=>{
    if(active){ const s=new Date(active.start_time).getTime(); timerRef.current=setInterval(()=>setElapsed(appNow()-s),250); }
    else{ clearInterval(timerRef.current); setElapsed(0); }
    return()=>clearInterval(timerRef.current);
  },[active]);

  const clockIn = async()=>{
    setErr('');
    const now=nowISO();
    const {data,error}=await run(SB.from('bt_clocklogs').insert({user_id:user.id,agent_name:name,clock_in:now,date:today}).select().single());
    if(error){setErr('Clock-in failed: '+error.message);return;}
    setClockRow(data);
  };
  const clockOut = async()=>{
    if(!clockRow)return; setErr('');
    const now=nowISO();
    const {data,error}=await run(SB.from('bt_clocklogs').update({clock_out:now}).eq('id',clockRow.id).select().single());
    if(error){setErr('Clock-out failed: '+error.message);return;}
    setClockRow(data);
  };
  // Ask before clocking out unless the shift has ended (clocking out can't be undone for the day)
  const askClockOut = ()=>{
    if(!clockRow) return;
    if(team.shiftEnd && hhmm(appNow())>=team.shiftEnd){ clockOut(); return; }
    setConfirmOut(true);
  };
  const startBreak = async()=>{
    setErr('');
    const {data:tc}=await run(SB.from('bt_logs').select('id,agent_name').is('end_time',null));
    // Read the cap fresh too: the slot schedule may have changed it since this screen loaded
    const {data:cfg}=await run(SB.from('bt_settings').select('max_concurrent_breaks').eq('id',1).maybeSingle());
    const cap=cfg?cfg.max_concurrent_breaks:maxB; if(cfg) setMaxB(cap);
    // Trainees have no slot limit: they skip this check, and their breaks aren't counted for others
    if(!trainee&&slotCount(tc)>=cap){setErr(`All ${cap} break slots are taken. Please wait.`);return;}
    const now=nowISO();
    const {data,error}=await run(SB.from('bt_logs').insert({user_id:user.id,agent_name:name,start_time:now}).select().single());
    if(error){setErr(error.message?.includes('break slots are taken')?error.message:'Could not start break: '+error.message);return;}
    setActive(data); setLogs(p=>[data,...p]); if(!trainee) setTeamCount(c=>c+1);
  };
  const endBreak = async()=>{
    if(!active)return; setErr('');
    const now=nowISO();
    const durSecs=Math.round((new Date(now)-new Date(active.start_time))/1000);
    const bt=bType(durSecs);
    const {error}=await run(SB.from('bt_logs').update({end_time:now,duration_secs:durSecs,break_type:bt}).eq('id',active.id));
    if(error){setErr('Could not end break: '+error.message);return;}
    setLogs(p=>p.map(l=>l.id===active.id?{...l,end_time:now,duration_secs:durSecs,break_type:bt}:l));
    setActive(null); if(!trainee) setTeamCount(c=>Math.max(0,c-1));
  };

  // Swap: send request to another agent
  const sendSwapRequest = async(targetAgent) => {
    if(!lunchInfo?.group) return;
    setSwapBusy(true);
    const targetGroup = targetAgent.group;
    const {data,error} = await createSwapRequest({
      fromUserId: user.id, fromName: name,
      toUserId: targetAgent.userId, toName: targetAgent.name,
      fromGroup: lunchInfo.group, toGroup: targetGroup, date: today,
    });
    if(error){ setErr('Could not send swap request: '+error.message); setSwapBusy(false); return; }
    setOutgoingSwap(data);
    await broadcastSwap({ action:'request', id:data.id, fromUserId:user.id, fromName:name, toUserId:targetAgent.userId, toName:targetAgent.name, fromGroup:lunchInfo.group, toGroup:targetGroup, date:today });
    setShowSwapModal(false);
    setSwapBusy(false);
    fireNotification({ title: '📤 Swap Request Sent', body: `Waiting for ${targetAgent.name} to respond.`, type: 'info', duration: 6000 });
  };

  const cancelSwapRequest = async() => {
    if(!outgoingSwap) return;
    await run(SB.from('bt_swap_requests').update({status:'cancelled'}).eq('id',outgoingSwap.id));
    setOutgoingSwap(null);
  };

  // Swap: respond to incoming request
  const respondToSwap = async(swapReq, accepted) => {
    setSwapBusy(true);
    const newStatus = accepted ? 'accepted' : 'declined';
    // 1. Update the swap request status
    await run(SB.from('bt_swap_requests').update({status:newStatus, responded_at:nowISO()}).eq('id',swapReq.id));
    setIncomingSwaps(p=>p.filter(s=>s.id!==swapReq.id));

    if(accepted) {
      // 2. Perform the actual group swap in bt_lunch_schedule
      const {data:ls} = await run(SB.from('bt_lunch_schedule').select('*').eq('date',today).maybeSingle());
      if(ls) {
        let newA = [...(ls.group_a||[])];
        let newB = [...(ls.group_b||[])];
        // Remove both from their current groups
        newA = newA.filter(n=>n!==swapReq.from_name && n!==swapReq.to_name);
        newB = newB.filter(n=>n!==swapReq.from_name && n!==swapReq.to_name);
        // Put each in the other's group
        if(swapReq.from_group==='A') { newB.push(swapReq.from_name); newA.push(swapReq.to_name); }
        else { newA.push(swapReq.from_name); newB.push(swapReq.to_name); }
        await run(SB.from('bt_lunch_schedule').update({group_a:newA,group_b:newB,updated_at:nowISO()}).eq('id',ls.id));
        // 3. Notify admin via the admin broadcast channel
        broadcastNotif({ title:`🔄 Lunch Swap Done`, body:`${swapReq.from_name} (Grp ${swapReq.from_group}) ↔ ${swapReq.to_name} (Grp ${swapReq.to_group}) · schedule updated automatically.`, type:'info' });
        // 4. Update our own lunch card immediately (the acceptor)
        const acceptorNewGroup = swapReq.from_group; // we take the requester's group
        const first = ls.group_first || defaultFirst(today);
        const slots = lunchSlots(first);
        setLunchInfo({group:acceptorNewGroup, slot:slots[acceptorNewGroup], allA:newA, allB:newB, first, slots});
      }
      // 5. Broadcast directly to the requester so they update immediately
      await broadcastSwap({ action:'accepted', id:swapReq.id, fromUserId:swapReq.from_user_id, fromName:swapReq.from_name, toUserId:user.id, toName:name });
    } else {
      // Notify requester of decline
      await broadcastSwap({ action:'declined', id:swapReq.id, fromUserId:swapReq.from_user_id, fromName:swapReq.from_name, toUserId:user.id, toName:name });
    }
    setSwapBusy(false);
  };

  const done=logs.filter(l=>l.end_time);
  const totalSec=done.reduce((s,l)=>s+(l.duration_secs||0),0);
  const predType=active?bType(Math.floor(elapsed/1000)):null;
  const atCap=!trainee&&teamCount>=maxB;
  const li=trainee?null:lunchInfo;   // trainees have no lunch group
  const isClockedIn=clockRow?.clock_in&&!clockRow?.clock_out;
  const isClockedOut=clockRow?.clock_out;
  // Other agents in the opposite group (for swap target selection)
  const otherGroupAgents = li?.group ? (
    li.group==='A'
      ? (li.allB||[]).map(n=>({name:n, group:'B', userId:null}))
      : (li.allA||[]).map(n=>({name:n, group:'A', userId:null}))
  ) : [];

  const [showAll,setShowAll]=useState(false);
  const [nowA,setNowA]=useState(appNow());
  useEffect(()=>{ const id=setInterval(()=>setNowA(appNow()),1000); return()=>clearInterval(id); },[]);
  const todaySec=logs.reduce((s,l)=>s+secOf(l,nowA),0);
  const avgMine=done.length?Math.round(totalSec/done.length):0;
  const breakDisabled=atCap||loading||!isClockedIn;
  const breakHint=!isClockedIn?(isClockedOut?'Your shift has ended for today':'Clock in first to take breaks')
    :(!trainee&&maxB<=0)?'Breaks are paused right now — check with your supervisor'
    :atCap?`All ${maxB} break slots are in use — wait for a colleague to return`:null;
  const listed=showAll?logs:logs.slice(0,5);
  const shiftSec=clockRow?.clock_in?Math.round(((clockRow.clock_out?new Date(clockRow.clock_out).getTime():nowA)-new Date(clockRow.clock_in).getTime())/1000):0;
  const pct=maxB>0?Math.min(100,teamCount/maxB*100):100;
  const elSec=Math.floor(elapsed/1000);
  const idleWord=!isClockedIn?(isClockedOut?'Shift ended':'Off shift'):breakHint?'Paused':'Ready';

  return(
    <div className="main solo" style={{minHeight:'100vh'}}>
      <header className="top">
        <div className="wm" style={{marginRight:'auto'}}>
          <div className="wm-icon"><Ic n="tower" size={16} col="#c9c9d2" sw={1.8}/></div>
          <span className="wm-t">BreakTrack</span>
        </div>
        <div className="top-ic">
          <ClockPill/>
          <span className="hide-s"><ConnInstrument compact/></span>
          <AvatarMenu name={name} role={trainee?'Agent · Trainee':li?.group?`Agent · Group ${li.group}`:'Agent'} onLogout={onLogout}
            extra={<MI n="refresh" onClick={load}>Refresh</MI>}/>
        </div>
      </header>

      <div className="page">
        {err&&<div className="aerr"><Ic n="alert" size={15}/> {err}</div>}

        {incomingSwaps.map(sr=>(
          <div key={sr.id} className="notice hi">
            <div className="acc-ic brk"><Ic n="swap" size={17}/></div>
            <div className="notice-b">
              <div className="notice-t">{sr.from_name} wants to swap lunch groups</div>
              <div className="notice-s">You'd move to Group {sr.from_group} and {sr.from_name} to Group {sr.to_group}. Admin is notified automatically.</div>
            </div>
            <div className="notice-a">
              <button className="bs" onClick={()=>respondToSwap(sr,false)} disabled={swapBusy}>Decline</button>
              <button className="bp" onClick={()=>respondToSwap(sr,true)} disabled={swapBusy}>{swapBusy?<span className="spin-sm"/>:<Ic n="check" size={15}/>} Accept</button>
            </div>
          </div>
        ))}
        {outgoingSwap&&(
          <div className="notice">
            <div className="acc-ic"><Ic n="timer" size={17}/></div>
            <div className="notice-b">
              <div className="notice-t">Swap request sent to {outgoingSwap.to_name}</div>
              <div className="notice-s">Group {outgoingSwap.from_group} ↔ Group {outgoingSwap.to_group} · waiting for a response…</div>
            </div>
            <button className="bs" onClick={cancelSwapRequest}>Cancel request</button>
          </div>
        )}

        <h1 className="hello">Welcome, {firstName(name)}</h1>
        <p className="hello-s">{wall(nowA).toLocaleDateString([],{weekday:'long',month:'long',day:'numeric',timeZone:'UTC'})}{isClockedIn?` · on shift since ${hhmm(clockRow.clock_in)}`:''}</p>

        <div className="acts">
          {!clockRow&&<button className="bp" onClick={clockIn}><Ic n="login2" size={16}/> Clock in</button>}
          {isClockedIn&&<button className="bs" onClick={askClockOut}><Ic n="logoff" size={16}/> Clock out</button>}
          {li?.group&&!outgoingSwap&&isClockedIn&&<button className="bs" onClick={()=>setShowSwapModal(true)}><Ic n="swap" size={16}/> Swap lunch</button>}
          <button className="bs" onClick={load}><Ic n="refresh" size={16}/> Refresh</button>
          <div className="acts-r"><ConnInstrument/></div>
        </div>

        <div className="grid2">
          {/* Break timer — the one thing an agent needs */}
          <div className={`card timer${active?' on':''}`}>
            <div className="card-hd">
              <div className="card-t">
                {active?'On break':'Break timer'}
                {active?<span className={`badge ${BCLS[predType]||'b-on'}`}>{predType}</span>:<span className={`badge ${breakHint?'b-out':'b-in'}`}>{breakHint?'Unavailable':'Available'}</span>}
              </div>
            </div>
            <div className={`timer-big${active?'':' idle'}`}>{active?<DurAmt s={elSec}/>:idleWord}</div>
            <div className="timer-sub">{active?`Started at ${fmtT(active.start_time)} · logged automatically when you return`:breakHint||'Your break will be timed and logged automatically'}</div>
            {active&&(
              <div className="tbar">
                <div className="tbar-track">
                  <span style={{flex:13}}/><span style={{flex:37}}/><span style={{flex:10}}/>
                  <i style={{width:`${Math.min(100,elSec/3600*100)}%`}}/>
                </div>
                <div className="tbar-l"><span style={{flex:13}}>Bathroom</span><span style={{flex:37}}>Break · 13m+</span><span style={{flex:10,textAlign:'right'}}>Lunch · 50m+</span></div>
              </div>
            )}
            {!active
              ?<button className="btn-go" onClick={startBreak} disabled={breakDisabled}><Ic n="play" size={17} sw={2.2}/> Start break</button>
              :<button className="btn-go" onClick={endBreak}><Ic n="stop" size={17} sw={2.2}/> Return from break</button>}
            <div className="tstats">
              <div><div className="sm-l">Breaks today</div><div className="sm-v"><TNum value={done.length}/></div></div>
              <div><div className="sm-l">Total</div><div className="sm-v">{durStr(todaySec)}</div></div>
              <div><div className="sm-l">Average</div><div className="sm-v">{durStr(avgMine)}</div></div>
              {trainee
                ?<div><div className="sm-l">Break slots</div><div className="sm-v">No limit</div></div>
                :<div><div className="sm-l">Team out</div><div className="sm-v"><TNum value={teamCount}/><span style={{color:'var(--mut)'}}>/{maxB}</span></div></div>}
            </div>
          </div>

          <div className="card acc">
            <div className="card-hd">
              <div className="card-t">Today's breaks</div>
              <div className="card-ctl">
                <Kebab><MI n="refresh" onClick={load}>Refresh</MI></Kebab>
              </div>
            </div>
            {loading?<div className="es"><div className="spin"/></div>
             :logs.length===0?<div className="acc-empty">No breaks yet today.<br/>They'll be timed and logged automatically.</div>
             :listed.map(l=>{
                const s=secOf(l,nowA); const t=l.break_type||bType(s);
                const cls=t==='Lunch Break'?'lun':t==='Bathroom Break'?'bth':'brk';
                return (
                  <div key={l.id} className="acc-row">
                    <div className={`acc-ic ${cls}`}><Ic n={t==='Lunch Break'?'utensils':t==='Bathroom Break'?'drop':'coffee'} size={17}/></div>
                    <div className="acc-n">{l.end_time?t:<>{t} <span className="badge b-on">Live</span></>} <small>{hhmm(l.start_time)}{l.end_time?` – ${hhmm(l.end_time)}`:''}</small></div>
                    <div className="acc-v"><DurAmt s={s}/></div>
                    <div className="acc-tip">
                      <div><span>Started</span><span>{fmtT(l.start_time)}</span></div>
                      <div><span>Returned</span><span>{l.end_time?fmtT(l.end_time):'—'}</span></div>
                      <hr/>
                      <div><span>Duration</span><span>{durStr(s)}</span></div>
                    </div>
                  </div>
                );
              })}
            {logs.length>5&&(
              <div className="acc-row link" onClick={()=>setShowAll(v=>!v)}>
                <div className="acc-ic more">{showAll?<Ic n="chevdown" size={16}/>:`+${logs.length-5}`}</div>
                <div className="acc-n">{showAll?'Show less':'View all breaks'}</div>
              </div>
            )}
          </div>
        </div>

        <div className="grid3">
          <div className="card sm">
            <div className="card-hd">
              <div>
                <div className="card-t">Shift</div>
                <div className="mid" style={{marginTop:8}}>{clockRow?.clock_in?<DurAmt s={shiftSec}/>:<span style={{color:'var(--mut)'}}>Not started</span>}</div>
              </div>
              <div className="card-ctl"><span className={`badge ${isClockedIn?'b-in':'b-out'}`}>{isClockedIn?'On shift':isClockedOut?'Ended':'Off'}</span></div>
            </div>
            <div className="sm-cols">
              <div><div className="sm-l">Clock in</div><div className="sm-v">{clockRow?.clock_in?hhmm(clockRow.clock_in):'–'}</div></div>
              <div><div className="sm-l">Clock out</div><div className="sm-v">{clockRow?.clock_out?hhmm(clockRow.clock_out):'–'}</div></div>
              <div><div className="sm-l">On break</div><div className="sm-v">{durStr(todaySec)}</div></div>
            </div>
            <hr className="sm-hr"/>
            <div className="sm-ft">
              <div><div className="sm-l"><Ic n="clock" size={14}/> Status</div><div className="sm-v">{isClockedIn?'Working':isClockedOut?'Shift ended':'Not clocked in'}</div></div>
              {!clockRow&&<button className="pay" onClick={clockIn}>Clock in</button>}
              {isClockedIn&&<button className="pay" onClick={askClockOut}>Clock out</button>}
            </div>
          </div>

          <div className="card sm">
            <div className="card-hd">
              <div>
                <div className="card-t">{trainee?'Lunch · Trainee':`Lunch${li?.group?` · Group ${li.group}`:''}`}</div>
                <div className="mid" style={{marginTop:8}}>{trainee?<Amt main={team.lunch} sup={`–${addMin(team.lunch,60)}`}/>:li?.group?<Amt main={li.slot.from} sup={`–${li.slot.to}`}/>:<span style={{color:'var(--mut)'}}>Unassigned</span>}</div>
              </div>

/* ── Swap Request Modal ── */
function SwapRequestModal({myName,myGroup,otherGroup,otherSlot,mySlot,date,onSend,onClose,busy}){
  const [agents,setAgents]=useState([]);
  const [loading,setLoading]=useState(true);
  const [selected,setSelected]=useState(null);
  const [err,setErr]=useState('');

  useEffect(()=>{
    (async()=>{
      // Load agents in the other group with their user_ids from bt_clocklogs
      const {data:ls}=await run(SB.from('bt_lunch_schedule').select('*').eq('date',date).maybeSingle());
      if(!ls){setErr('No lunch schedule found for today.');setLoading(false);return;}
      const otherNames = otherGroup==='A' ? (ls.group_a||[]) : (ls.group_b||[]);
      if(otherNames.length===0){setErr(`No agents in Group ${otherGroup} to swap with.`);setLoading(false);return;}
      // Look up user_ids from bt_clocklogs
      const {data:ck}=await run(SB.from('bt_clocklogs').select('user_id,agent_name').eq('date',date).in('agent_name',otherNames));
      const seen=new Set(); const list=[];
      (ck||[]).forEach(r=>{ if(!seen.has(r.user_id)){seen.add(r.user_id);list.push({userId:r.user_id,name:r.agent_name,group:otherGroup});} });
      setAgents(list);
      if(list.length>0)setSelected(list[0].userId);
      setLoading(false);
    })();
  },[date,otherGroup]);

  const handleSend=()=>{
    const ag=agents.find(a=>a.userId===selected);
    if(ag) onSend(ag);
  };

  return(
    <div className="modal-bg" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal-box">
        <div className="modal-title"><Ic n="swap" size={18}/> Request Lunch Swap</div>
        <div className="modal-sub">
          Ask a colleague in Group {otherGroup} to swap lunch slots with you.<br/>
          <strong>Your slot:</strong> Group {myGroup} · {mySlot.from}–{mySlot.to}<br/>
          <strong>Their slot:</strong> Group {otherGroup} · {otherSlot.from}–{otherSlot.to}
        </div>
        {err&&<div className="ebox" style={{marginBottom:12}}><Ic n="alert" size={14}/>{err}</div>}
        {loading?<div style={{textAlign:'center',padding:16}}><div className="spin" style={{margin:'0 auto'}}/></div>
         :agents.length===0&&!err?<div className="ebox"><Ic n="alert" size={14}/>No agents in Group {otherGroup} are clocked in today.</div>
         :(
          <div className="fg">
            <label className="fl">Select agent to request swap ({agents.length} available)</label>
            <select className="fi" value={selected||''} onChange={e=>setSelected(e.target.value)}>
              {agents.map(a=><option key={a.userId} value={a.userId}>{a.name} (Group {a.group})</option>)}
            </select>
          </div>
        )}
        <div style={{background:'var(--card)',border:'1px solid var(--bdr)',borderRadius:8,padding:'10px 14px',fontSize:12,color:'var(--mut)',marginBottom:20,lineHeight:1.6}}>
          If they accept: the swap happens automatically and admin is notified.
        </div>
        <div className="modal-foot">
          <button className="bs" onClick={onClose}>Cancel</button>
          <button className="bp" onClick={handleSend} disabled={busy||loading||agents.length===0||!selected}>
            {busy?<span className="spin-sm"/>:<Ic n="send" size={14}/>} Send Request
          </button>
        </div>
      </div>
    </div>
  );
}

const firstName = n => (n||'').split(/[\s@]/)[0] || 'there';
const secOf = (l, now) => l.duration_secs!=null ? l.duration_secs
  : Math.max(0, Math.round(((l.end_time?new Date(l.end_time).getTime():now) - new Date(l.start_time).getTime())/1000));
const localMidnight = (d=appNow()) => { const w=wall(d); return Date.UTC(w.getUTCFullYear(),w.getUTCMonth(),w.getUTCDate()) - clockOff()*3600000; };   // start of the company day
const hhmm = t => wallHM(t);
const mdy  = t => wall(t).toLocaleDateString([], {month:'short', day:'numeric', timeZone:'UTC'});
/* Split a duration into a large figure and a raised remainder, like $12,505.87 */
const splitDur = s => {
  s=Math.max(0,Math.round(s||0)); const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), x=s%60;
  if(h>0) return {main:`${h}h ${pad(m)}m`, sup:`${pad(x)}s`};
  return {main:`${m}m`, sup:`${pad(x)}s`};
};
function Amt({main, sup, className=''}){
  return <span className={`amt ${className}`}><span>{main}</span>{sup!=null&&<span className="amt-s">{sup}</span>}</span>;
}
const DurAmt = ({s, className}) => { const d=splitDur(s); return <Amt main={d.main} sup={d.sup} className={className}/>; };

/* Dropdown menu with outside-click / Escape to close */
function Menu({trigger, children, align='right'}){

    document.addEventListener('mousedown',h); document.addEventListener('keydown',k);

  return (

/* Smooth area chart with hover crosshair — sized to its container */
function AreaChart({points, fmt, live, emptyText}){
  const ref=useRef(null); const [w,setW]=useState(640); const [hov,setHov]=useState(null);
  const gid=useRef('g'+Math.random().toString(36).slice(2)).current;
  useEffect(()=>{
    const el=ref.current; if(!el) return;
    const ro=new ResizeObserver(([e])=>setW(Math.max(200,e.contentRect.width)));
    ro.observe(el); return()=>ro.disconnect();
  },[]);
  const H=250, top=34, n=points.length;
  const max=Math.max(1,...points.map(p=>p.v))*1.12;
  const X=i=> n<=1 ? w/2 : (i/(n-1))*w;
  const Y=v=> top+(H-top-2)*(1-v/max);
  const P=points.map((p,i)=>[X(i),Y(p.v)]);
  let line='';
  P.forEach(([x,y],i)=>{
    if(i===0){ line=`M ${x} ${y}`; return; }
    const [px,py]=P[i-1]; const cx=(px+x)/2;
    line+=` C ${cx} ${py}, ${cx} ${y}, ${x} ${y}`;
  });
  const area = n ? `${line} L ${w} ${H} L 0 ${H} Z` : '';
  const labels = (() => {
    if(n<2) return points.map(p=>p.label);
    const k=5, out=[];
    for(let j=0;j<k;j++){ const i=Math.round((j+0.5)*(n-1)/k); out.push(points[i].label); }
    return out;
  })();
  const onMove=e=>{
    if(!n) return; const r=ref.current.getBoundingClientRect();
    const i=Math.round(((e.clientX-r.left)/r.width)*(n-1)); setHov(Math.max(0,Math.min(n-1,i)));
  };
  const allZero = !points.some(p=>p.v>0);
  const last = P[P.length-1];
  return (
    <div className="ch">
      <div ref={ref} style={{position:'relative',flex:1,display:'flex'}} onMouseMove={onMove} onMouseLeave={()=>setHov(null)}>
        <svg width={w} height={H} viewBox={`0 0 ${w} ${H}`}>
          <defs>
            <linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stopColor="#6e76e6" stopOpacity=".42"/>
              <stop offset="1" stopColor="#6e76e6" stopOpacity=".04"/>
            </linearGradient>
          </defs>
          {n>0&&<path d={area} fill={`url(#${gid})`}/>}
          {n>0&&<path d={line} fill="none" stroke="#8d93f2" strokeWidth="1.8" strokeLinejoin="round"/>}
          {live&&last&&<>
            <circle cx={last[0]-3} cy={last[1]} r="9" fill="#8d93f2" opacity=".18"><animate attributeName="r" values="4;11;4" dur="2s" repeatCount="indefinite"/></circle>
            <circle cx={last[0]-3} cy={last[1]} r="3.5" fill="#c3c7ff"/>
          </>}
          {hov!=null&&P[hov]&&<>
            <line x1={P[hov][0]} x2={P[hov][0]} y1={0} y2={H} stroke="rgba(255,255,255,.18)" strokeDasharray="3 4"/>
            <circle cx={P[hov][0]} cy={P[hov][1]} r="4.5" fill="#17171c" stroke="#c3c7ff" strokeWidth="2"/>
          </>}
        </svg>
        {hov!=null&&points[hov]&&(
          <div className="ch-tip" style={{left:Math.max(70,Math.min(w-70,P[hov][0]))}}>
            <span>{points[hov].label}</span><b>{fmt(points[hov].v)}</b>
          </div>
        )}
        {allZero&&<div className="ch-empty">{emptyText||'No activity yet'}</div>}
      </div>
      <div className="ch-x">{labels.map((l,i)=><span key={i}>{l}</span>)}</div>
    </div>
  );
}

/* Command-style search: jump to any page or action */
function SearchBar({items, onPick}){
  const [q,setQ]=useState(''); const [open,setOpen]=useState(false); const [sel,setSel]=useState(0);
  const inRef=useRef(null); const wrap=useRef(null);
  useEffect(()=>{
    const k=e=>{ if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); inRef.current?.focus(); } };
    const h=e=>{ if(wrap.current&&!wrap.current.contains(e.target)) setOpen(false); };
    document.addEventListener('keydown',k); document.addEventListener('mousedown',h);
    return()=>{ document.removeEventListener('keydown',k); document.removeEventListener('mousedown',h); };
  },[]);
  const res=items.filter(i=>(i.label+' '+(i.kw||'')).toLowerCase().includes(q.trim().toLowerCase())).slice(0,9);
  useEffect(()=>setSel(0),[q]);
  const pick=it=>{ if(!it) return; onPick(it); setQ(''); setOpen(false); inRef.current?.blur(); };
  const isMac=/Mac|iPhone|iPad/.test(navigator.platform||'');
  return (
    <div className="srch" ref={wrap}>
      <Ic n="search" size={20}/>
      <input ref={inRef} className="srch-in" placeholder="Search for anything" value={q}
        onFocus={()=>setOpen(true)} onChange={e=>{setQ(e.target.value);setOpen(true);}}
        onKeyDown={e=>{
          if(e.key==='ArrowDown'){e.preventDefault();setSel(s=>Math.min(res.length-1,s+1));}
          else if(e.key==='ArrowUp'){e.preventDefault();setSel(s=>Math.max(0,s-1));}
          else if(e.key==='Enter') pick(res[sel]);
          else if(e.key==='Escape'){ setOpen(false); e.target.blur(); }
        }}/>
      {!q&&<div className="kbd"><span>{isMac?'⌘':'Ctrl'}</span><span>K</span></div>}
      {open&&(
        <div className="srch-pop">
          <div className="srch-h">{q?'Results':'Jump to'}</div>
          {res.length===0&&<div className="srch-empty">Nothing matches “{q}”</div>}
          {res.map((it,i)=>(
            <button key={it.id} className={`srch-it${i===sel?' act':''}`} onMouseEnter={()=>setSel(i)} onClick={()=>pick(it)}>
              <Ic n={it.n} size={17}/>{it.label}<span className="hint">{it.hint||''}</span>
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

function ClockPill(){

/* ══════════════════════════════════════════════════════════════
   ADMIN HOME — live dashboard
══════════════════════════════════════════════════════════════ */
function AHome({name, go, hide}){
  const [logs,setLogs]=useState([]);
  const [clocks,setClocks]=useState([]);
  const [maxB,setMaxB]=useState(3);
  const [ls,setLs]=useState(null);
  const [swaps,setSwaps]=useState(0);
  const [loading,setLoading]=useState(true);
  const [err,setErr]=useState('');
  const [now,setNow]=useState(appNow());
  const today=todayISO();

  const capBusyRef=useRef(false);
  const load=useCallback(async()=>{
    const since=new Date(localMidnight()-30*864e5);
    const [a,open,c,s,l,w]=await Promise.all([
      run(SB.from('bt_logs').select('id,user_id,agent_name,start_time,end_time,duration_secs,break_type').gte('start_time',since.toISOString()).order('start_time',{ascending:false}).limit(5000)),
      run(SB.from('bt_logs').select('id,user_id,agent_name,start_time,end_time,duration_secs,break_type').is('end_time',null)),
      run(SB.from('bt_clocklogs').select('*').eq('date',today).order('clock_in',{ascending:true})),
      run(SB.from('bt_settings').select('max_concurrent_breaks').eq('id',1).maybeSingle()),
      run(SB.from('bt_lunch_schedule').select('*').eq('date',today).maybeSingle()),
      run(SB.from('bt_swap_requests').select('id').eq('date',today).eq('status','pending')),
    ]);
    if(a.error){ setErr(a.error.message); setLoading(false); return; }
    const byId=new Map(); [...(a.data||[]),...(open.data||[])].forEach(r=>byId.set(r.id,r));
    setLogs([...byId.values()]);
    setClocks(c.data||[]);
    if(s.data && !capBusyRef.current) setMaxB(s.data.max_concurrent_breaks);
    setLs(l.data||null);
    setSwaps((w.data||[]).length);
    setErr(''); setLoading(false); bumpSync();
  },[today]);

  useEffect(()=>{
    load();
    let t=null; const soon=()=>{ clearTimeout(t); t=setTimeout(load,250); };
    const ch=SB.channel('home-rt')
      .on('postgres_changes',{event:'*',schema:'public',table:'bt_logs'},soon)
      .on('postgres_changes',{event:'*',schema:'public',table:'bt_clocklogs'},soon)
      .on('postgres_changes',{event:'*',schema:'public',table:'bt_lunch_schedule'},soon)
      .on('postgres_changes',{event:'*',schema:'public',table:'bt_swap_requests'},soon)
      .subscribe(st=>{ if(st==='SUBSCRIBED') load(); });
    return()=>{ clearTimeout(t); SB.removeChannel(ch); };
  },[load]);
  useAutoRefresh(load,5000);
  useEffect(()=>{ const id=setInterval(()=>setNow(appNow()),1000); return()=>clearInterval(id); },[]);

  /* ── derived live stats ── */
  const t0=localMidnight();
  const todayLogs=logs.filter(l=>new Date(l.start_time).getTime()>=t0);
  const active=logs.filter(l=>!l.end_time).sort((a,b)=>new Date(a.start_time)-new Date(b.start_time));
  const doneToday=todayLogs.filter(l=>l.end_time);
  const avgToday=doneToday.length?Math.round(doneToday.reduce((s,l)=>s+secOf(l,now),0)/doneToday.length):0;
  const longest=doneToday.reduce((m,l)=>Math.max(m,secOf(l,now)),0);
  const todayTotal=todayLogs.reduce((s,l)=>s+secOf(l,now),0);
  const topAgents=(()=>{ const m={}; todayLogs.forEach(l=>{ const k=l.agent_name||'—'; (m[k]=m[k]||{name:k,total:0,count:0}); m[k].total+=secOf(l,now); m[k].count++; });
    return Object.values(m).sort((a,b)=>b.total-a.total).slice(0,3); })();

  /* team roster: on break first, then on shift */
  const onBreakIds=new Set(active.map(l=>l.user_id));
  const onShift=clocks.filter(c=>c.clock_in&&!c.clock_out&&!onBreakIds.has(c.user_id));
  const clockedOut=clocks.filter(c=>c.clock_out);
  const todayBy = uid => todayLogs.filter(l=>l.user_id===uid);
  const roster=[
    ...active.map(l=>({key:'b'+l.id, kind:'break', name:l.agent_name, log:l, uid:l.user_id})),
    ...onShift.map(c=>({key:'s'+c.id, kind:'shift', name:c.agent_name, clock:c, uid:c.user_id})),
  ];
  const shown=roster.slice(0,5), extra=roster.length-shown.length;

  /* lunch */
  const first=ls?.group_first||defaultFirst(today);
  const slots=lunchSlots(first);
  const grpA=ls?.group_a||[], grpB=ls?.group_b||[];
  const nowHM=hhmm(now);
  const atLunch = ['A','B'].find(g=>nowHM>=slots[g].from && nowHM<slots[g].to) || null;

  const slotActive=active.filter(l=>!isTrainee(l.agent_name));   // trainees don't use break slots
  const pct=maxB>0?Math.min(100,slotActive.length/maxB*100):100;
  const atCap=slotActive.length>=maxB;

  const [savingCap,setSavingCap]=useState(false);
  const capSeq=useRef(0);
  const setCap=async(n)=>{
    n=Math.max(0,Math.min(50,n)); setMaxB(n); setSavingCap(true); capBusyRef.current=true;
    const seq=++capSeq.current;
    const {error}=await run(SB.from('bt_settings').upsert({id:1,max_concurrent_breaks:n,updated_at:nowISO()},{onConflict:'id'}));
    if(seq!==capSeq.current) return;
    capBusyRef.current=false; setSavingCap(false);
    if(error){ setErr('Could not update slots: '+error.message); load(); }
  };
  const exportToday=()=>csvExport(todayLogs.slice().sort((a,b)=>new Date(a.start_time)-new Date(b.start_time)));

  return (
    <div className="page">
      <h1 className="hello">Welcome, {firstName(name)}</h1>
      <p className="hello-s">{wall(now).toLocaleDateString([],{weekday:'long',month:'long',day:'numeric',timeZone:'UTC'})} · {active.length} on break · {onShift.length+active.length} on shift</p>

      <div className="acts">
        <button className="bp" onClick={()=>go('notifs')}><Ic n="send" size={17}/> Broadcast</button>
        <button className="bs" onClick={()=>go('live')}><Ic n="play" size={16}/> Start break</button>
        <button className="bs" onClick={()=>go('clocks')}><Ic n="plus" size={17}/> Clock in</button>
        <button className="bs" onClick={()=>go('lunch')}><Ic n="utensils" size={16}/> Lunch</button>
        <button className="bs" onClick={exportToday}><Ic n="download" size={16}/> Export</button>
        <div className="acts-r"><ConnInstrument/></div>
      </div>

      {err&&<div className="ebox"><Ic n="alert" size={15}/>{err}</div>}

      <div className="grid2">
        {/* ── On break now: every agent out, with a live timer ── */}
        <div className="card acc onb">
          <div className="card-hd">
            <div>
              <div className="card-t">On break now <span className="vbadge" title="Live"><span className="livedot"/></span></div>
              <div className="big pv" style={{marginTop:6}}>{loading?<span style={{color:'var(--mut)'}}>—</span>:<Amt main={<TNum value={slotActive.length}/>} sup={maxB<=0?' · paused':`/${maxB} slots`}/>}</div>
            </div>
            <div className="card-ctl">
              <button className="icb sm" onClick={()=>go('live')} title="Start a break remotely"><Ic n="play" size={16}/></button>
              <Kebab><MI n="activity" onClick={()=>go('live')}>Open live rack</MI><MI n="refresh" onClick={load}>Refresh</MI></Kebab>
            </div>
          </div>
          {loading?<div className="es"><div className="spin"/></div>
           :active.length===0?(
            <div className="onb-empty">
              <div className="es-ic"><Ic n="coffee" size={24}/></div>
              <div>Nobody is on break right now</div>
              <span>{maxB<=0?'Breaks are paused':`${maxB} slot${maxB===1?'':'s'} free`} · {onShift.length} agents working</span>
            </div>
           ):active.map(l=>{
              const el=secOf(l,now); const pt=bType(el);
              const cls=pt==='Lunch Break'?'lun':pt==='Bathroom Break'?'bth':'brk';
              const tl=todayBy(l.user_id);
              return (
                <div key={l.id} className="acc-row onb-row">
                  <div className={`acc-ic ${cls}`}>{ini(l.agent_name)}</div>
                  <div className="onb-mid">
                    <div className="acc-n pv">{l.agent_name} <span className={`badge ${BCLS[pt]||'b-on'}`}>{pt==='Bathroom Break'?'Bathroom':pt==='Lunch Break'?'Lunch':'Break'}</span></div>
                    <div className={`onb-bar ${cls}`}><i style={{width:`${Math.min(100,el/3600*100)}%`}}/></div>
                  </div>
                  <div className="onb-r">
                    <div className="acc-v pv"><DurAmt s={el}/></div>
                    <small>since {hhmm(l.start_time)}</small>
                  </div>
                  <div className="acc-tip">
                    <div><span>Started</span><span>{fmtT(l.start_time)}</span></div>
                    <div><span>Logged as</span><span>{pt}</span></div>
                    <hr/>
                    <div><span>Breaks today</span><span>{tl.length} · {durStr(tl.reduce((s,x)=>s+secOf(x,now),0))}</span></div>
                  </div>
                </div>
              );
            })}
        </div>

        {/* ── Team: who's working + today's numbers ── */}
        <div className="card acc">
          <div className="card-hd">
            <div>
              <div className="card-t">On shift</div>
              <div className="big pv" style={{marginTop:6}}>{loading?<span style={{color:'var(--mut)'}}>—</span>:<Amt main={<TNum value={onShift.length+active.length}/>} sup=" agents"/>}</div>
            </div>
            <div className="card-ctl">
              <button className="icb sm" onClick={()=>go('clocks')} title="Clock in an agent"><Ic n="plus" size={18}/></button>
              <Kebab>
                <MI n="clock" onClick={()=>go('clocks')}>Attendance</MI>
                <MI n="bars" onClick={()=>go('analytics')}>Analytics</MI>
                <MI n="download" onClick={exportToday}>Export today</MI>
              </Kebab>
            </div>
          </div>
          <div className="tiles pv">
            <div><span>Working</span><b><TNum value={onShift.length}/></b></div>
            <div><span>On break</span><b><TNum value={active.length}/></b></div>
            <div><span>Clocked out</span><b><TNum value={clockedOut.length}/></b></div>
            <div><span>Breaks today</span><b><TNum value={todayLogs.length}/></b></div>
            <div><span>Average break</span><b>{durStr(avgToday)}</b></div>
            <div><span>Total break time</span><b>{durStr(todayTotal).replace(/ \d+s$/,'')}</b></div>
          </div>
          <div className="top3-h">Most break time today</div>
          {topAgents.length===0?<div className="acc-empty" style={{padding:'18px 12px'}}>No breaks logged yet today.</div>
           :topAgents.map(a=>(
            <div key={a.name} className="acc-row top3">
              <div className="acc-ic">{ini(a.name)}</div>
              <div className="onb-mid">
                <div className="acc-n pv">{a.name} <small>{a.count} break{a.count===1?'':'s'}</small></div>
                <div className="onb-bar"><i style={{width:`${a.total/topAgents[0].total*100}%`}}/></div>
              </div>
              <div className="acc-v pv">{durStr(a.total).replace(/ \d+s$/,'')}</div>
            </div>
          ))}
          <div className="acc-row link" onClick={()=>go('live')}>
            <div className="acc-ic more"><Ic n="chevron" size={16}/></div>
            <div className="acc-n">View all agents</div>
          </div>
        </div>
      </div>

      <div className="grid3">
        {/* Capacity */}
        <div className="card sm">
          <div className="card-hd">
            <div>
              <div className="card-t">Break slots</div>
              <div className="mid pv" style={{marginTop:8}}><Amt main={<TNum value={slotActive.length}/>} sup={`/${maxB}`}/></div>
            </div>
            <div className="card-ctl">
              <Kebab><MI n="activity" onClick={()=>go('live')}>Live rack</MI><MI n="plus" onClick={()=>setCap(maxB+1)}>Add a slot</MI><MI n="stop" onClick={()=>setCap(0)}>Pause all breaks</MI></Kebab>
            </div>
          </div>
          <div className="bar"><i className={atCap?'full':''} style={{width:`${pct}%`}}/></div>
          <div className="legend">
            <span>On break <i/></span><span>Free <i className="f"/></span>
            <span className="r">{maxB<=0?'Breaks paused':`${Math.max(0,maxB-slotActive.length)} available`}</span>
          </div>
          <hr className="sm-hr"/>
          <div className="sm-ft">
            <div><div className="sm-l">Slots</div><div className="sm-v">{savingCap?'Saving…':maxB<=0?'Paused':`${maxB} at once`}</div></div>
            <div className="stepper">
              <button onClick={()=>setCap(maxB-1)} disabled={maxB<=0} aria-label="Remove a slot">−</button>
              <span><TNum value={maxB}/></span>
              <button onClick={()=>setCap(maxB+1)} aria-label="Add a slot">+</button>
            </div>
          </div>
        </div>

        {/* Lunch */}
        <div className="card sm">
          <div className="card-hd">
            <div className="card-t">Lunch</div>
            <div className="card-ctl">
              <button className="icb sm" onClick={()=>go('lunch')} title="Edit schedule"><Ic n="edit" size={16}/></button>
              <Kebab><MI n="utensils" onClick={()=>go('lunch')}>Lunch schedule</MI><MI n="swap" onClick={()=>go('swaps')}>Swap requests</MI></Kebab>
            </div>
          </div>
          <div className="sm-cols">
            <div><div className="sm-l">Group A</div><div className="sm-v">{slots.A.from}</div><div style={{color:'var(--mut)',fontSize:13.5,marginTop:4}}>{grpA.length} agents</div></div>
            <div><div className="sm-l">Group B</div><div className="sm-v">{slots.B.from}</div><div style={{color:'var(--mut)',fontSize:13.5,marginTop:4}}>{grpB.length} agents</div></div>
            <div><div className="sm-l">Now</div><div className="sm-v">{atLunch?`Group ${atLunch}`:'–'}</div></div>
          </div>
          <hr className="sm-hr"/>
          <div className="sm-ft">
            <div><div className="sm-l">Swap requests</div><div className="sm-v"><TNum value={swaps}/> pending</div></div>
            <button className="lnk" onClick={()=>go('swaps')}>View <Ic n="chevron" size={15}/></button>
          </div>
        </div>

        {/* Attendance */}
        <div className="card sm">
          <div className="card-hd">
            <div className="card-t">Attendance</div>
            <div className="card-ctl">
              <button className="icb sm" onClick={()=>go('clocks')} title="Clock in an agent"><Ic n="plus" size={18}/></button>
              <Kebab><MI n="clock" onClick={()=>go('clocks')}>Clock in/out</MI><MI n="download" onClick={exportToday}>Export today</MI></Kebab>
            </div>
          </div>
          <div className="sm-cols">
            <div><div className="sm-l">On shift</div><div className="sm-v"><TNum value={onShift.length+active.length}/></div></div>
            <div><div className="sm-l">Out</div><div className="sm-v"><TNum value={clockedOut.length}/></div></div>
            <div><div className="sm-l">Breaks</div><div className="sm-v"><TNum value={todayLogs.length}/></div></div>
          </div>
          <hr className="sm-hr"/>
          <div className="sm-ft">
            <div><div className="sm-l">Average break</div><div className="sm-v pv"><DurAmt s={avgToday}/> <span style={{color:'var(--mut)',fontSize:14}}>· max {durStr(longest)}</span></div></div>
            <button className="lnk" onClick={()=>go('analytics')}>View <Ic n="chevron" size={15}/></button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   ADMIN SHELL
══════════════════════════════════════════════════════════════ */
function AdminApp({user,name,onLogout}){
  const [tab,setTab]=useState('home');
  const [navOpen,setNavOpen]=useState(false);
  const [hide,setHide]=useState(false);
  const [counts,setCounts]=useState({live:0,swaps:0});
  const [spin,setSpin]=useState(false);
  useAdminLunchBroadcast(5); // auto-broadcast 5 min before each group's lunch
  useSlotSchedulerTick();
  useTeamConfig();

  const loadCounts=useCallback(async()=>{
    const [l,s]=await Promise.all([
      run(SB.from('bt_logs').select('id').is('end_time',null)),
      run(SB.from('bt_swap_requests').select('id').eq('date',todayISO()).eq('status','pending')),
    ]);
    setCounts({live:(l.data||[]).length, swaps:(s.data||[]).length});
  },[]);
  useEffect(()=>{ loadCounts(); },[loadCounts]);
  useAutoRefresh(loadCounts,5000);
  useEffect(()=>{ document.body.classList.toggle('privacy',hide); return()=>document.body.classList.remove('privacy'); },[hide]);

  const go=id=>{ setTab(id); setNavOpen(false); window.scrollTo({top:0}); };
  const main=[
    {id:'home',      n:'home',     label:'Home'},
    {id:'cx',        n:'phone',    label:'3CX'},
    {id:'live',      n:'activity', label:'Live Rack', badge:counts.live},
    {id:'clocks',    n:'clock',    label:'Clock In/Out'},
    {id:'analytics', n:'bars',     label:'Analytics'},
    {id:'logs',      n:'list',     label:'All Logs'},
  ];
  const flows=[
    {id:'lunch',    n:'utensils', label:'Lunch Schedule'},
    {id:'trainees', n:'users',    label:'Trainees'},
    {id:'swaps',    n:'swap',     label:'Lunch Swaps', badge:counts.swaps},
    {id:'notifs',   n:'bell',     label:'Notifications'},
    {id:'settings', n:'settings', label:'Settings'},
  ];
  const exportToday=async()=>{
    const {data}=await run(SB.from('bt_logs').select('*').gte('start_time',new Date(localMidnight()).toISOString()).order('start_time'));
    csvExport(data||[]);
  };
  const searchItems=[
    ...[...main,...flows].map(i=>({...i,hint:'Page'})),
    {id:'a-bc', n:'send',     label:'Broadcast a message', kw:'notify alert', hint:'Action', run:()=>go('notifs')},
    {id:'a-rb', n:'play',     label:'Start a break remotely', kw:'remote', hint:'Action', run:()=>go('live')},
    {id:'a-ci', n:'login2',   label:'Clock in an agent', kw:'attendance', hint:'Action', run:()=>go('clocks')},
    {id:'a-ex', n:'download', label:'Export today as CSV', kw:'download csv', hint:'Action', run:exportToday},
    {id:'a-cap',n:'users',    label:'Change break capacity', kw:'max concurrent slots', hint:'Action', run:()=>go('settings')},
  ];
  const refreshAll=()=>{ setSpin(true); bumpSync(); loadCounts(); window.dispatchEvent(new Event('focus')); setTimeout(()=>setSpin(false),800); };

  const NavItem=({id,n,label,badge})=>(
    <button className={`ni${tab===id?' on':''}`} onClick={()=>go(id)}>
      <Ic n={n} size={20} sw={1.6}/><span>{label}</span>
      {badge>0&&<span className="nbadge">{badge}</span>}
    </button>
  );

  return (
    <div className="shell">
      <div className={`scrim${navOpen?' open':''}`} onClick={()=>setNavOpen(false)}/>
      <aside className={`side${navOpen?' open':''}`}>
        <div className="side-org">
          <div className="wm">
            <div className="wm-icon"><Ic n="tower" size={16} col="#c9c9d2" sw={1.8}/></div>
            <span className="wm-t">BreakTrack</span>
          </div>
          <Ic n="chevdown" size={18}/>
        </div>
        <nav className="side-nav">
          {main.map(i=><NavItem key={i.id} {...i}/>)}
          <div className="side-sec">Workflows</div>
          {flows.map(i=><NavItem key={i.id} {...i}/>)}
        </nav>
        <div className="side-ft"><ConnInstrument compact/><span className="muted">Admin</span></div>
      </aside>

      <div className="main">
        <header className="top">
          <button className="icb top-menu" onClick={()=>setNavOpen(true)} aria-label="Menu"><Ic n="menu" size={20}/></button>
          <SearchBar items={searchItems} onPick={it=>it.run?it.run():go(it.id)}/>
          <Menu trigger={({toggle})=>(
            <button className="mv" onClick={toggle}><Ic n="zap" size={18}/><span className="lbl">Quick actions</span><Ic n="chevdown" size={16}/></button>
          )}>
            <MI n="send" onClick={()=>go('notifs')}>Broadcast a message</MI>
            <MI n="play" onClick={()=>go('live')}>Start a break remotely</MI>
            <MI n="login2" onClick={()=>go('clocks')}>Clock in an agent</MI>
            <MI n="utensils" onClick={()=>go('lunch')}>Edit lunch groups</MI>
            <MI n="download" onClick={exportToday}>Export today as CSV</MI>
          </Menu>
          <div className="top-ic">
            <button className={`icb hide-s${hide?' on':''}`} onClick={()=>setHide(h=>!h)} title={hide?'Show names & numbers':'Hide names & numbers'}><Ic n={hide?'eye':'eyeoff'} size={20}/></button>
            <button className="icb" onClick={()=>go('swaps')} title={counts.swaps?`${counts.swaps} pending swap request(s)`:'Notifications'}><Ic n="bell" size={20}/>{counts.swaps>0&&<span className="dot"/>}</button>
            <AvatarMenu name={name} role="Controller · Admin" onLogout={onLogout} extra={<MI n="settings" onClick={()=>go('settings')}>Settings</MI>}/>
          </div>
        </header>
        <main>
          {tab==='home'      &&<AHome name={name} go={go} hide={hide}/>}
          {tab==='live'      &&<ALive/>}
          {tab==='clocks'    &&<AClocks/>}
          {tab==='lunch'     &&<ALunch/>}
          {tab==='trainees'  &&<ATrainees/>}
          {tab==='cx'        &&<A3cx go={go}/>}
          {tab==='swaps'     &&<ASwapRequests/>}
          {tab==='analytics' &&<AAnalytics/>}
          {tab==='logs'      &&<ALogs/>}
          {tab==='notifs'    &&<ANotifications/>}
          {tab==='settings'  &&<ASettings/>}
        </main>
      </div>
      <button className={`fab${spin?' spinning':''}`} onClick={refreshAll} title="Sync now"><Ic n="refresh" size={24} sw={1.7}/></button>
    </div>
  );
}

/* ── Admin Live (the Live Rack) ── */
function ALive(){
  const [live,setLive]=useState([]);
  const [clocked,setClocked]=useState([]);
  const [maxB,setMaxB]=useState(3);
  const [loading,setLoad]=useState(true);
  const [err,setErr]=useState('');
  const [rt,setRt]=useState(false);
  const [confirm,setConfirm]=useState(null);
  const [remoting,setRemoting]=useState(null);

  const load=useCallback(async()=>{
    setErr('');
    const {data:bl,error:e1}=await run(SB.from('bt_logs').select('*').is('end_time',null).order('start_time'));
    if(e1){setErr(e1.message);setLoad(false);return;}
    setLive(bl||[]);
    const today=todayISO();
    const {data:ck}=await run(SB.from('bt_clocklogs').select('*').eq('date',today).is('clock_out',null));
    setClocked(ck||[]);
    const {data:cfg}=await run(SB.from('bt_settings').select('max_concurrent_breaks').eq('id',1).maybeSingle());
    if(cfg)setMaxB(cfg.max_concurrent_breaks);
    setLoad(false);
    bumpSync();
  },[]);

  useEffect(()=>{
    load();
    const ch=SB.channel('live-rt2')
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'bt_logs'},({new:nw})=>{ if(!nw.end_time)setLive(p=>[...p,nw]); bumpSync(); })
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'bt_logs'},({new:nw})=>{ if(nw.end_time)setLive(p=>p.filter(r=>r.id!==nw.id)); else setLive(p=>p.map(r=>r.id===nw.id?nw:r)); bumpSync(); })
      .subscribe(s=>{ setRt(s==='SUBSCRIBED'); if(s==='SUBSCRIBED') load(); });
    return()=>SB.removeChannel(ch);
  },[load]);
  useAutoRefresh(load, 4000);

  const remoteStart=async(agent)=>{
    setRemoting(agent.user_id); setErr('');
    // Re-check the live count fresh from the DB right before inserting — the button's
    // disabled state uses local `live`/`maxB`, which can lag a few seconds behind on a
    // slow connection, so we can't trust it alone as the only guard.
    const {data:tc}=await run(SB.from('bt_logs').select('id,agent_name').is('end_time',null));
    if(!isTrainee(agent.agent_name)&&slotCount(tc)>=maxB){ setErr(`All ${maxB} break slots are taken. Please wait.`); setRemoting(null); setConfirm(null); return; }
    const now=nowISO();
    const {data,error}=await run(SB.from('bt_logs').insert({user_id:agent.user_id,agent_name:agent.agent_name,start_time:now}).select().single());
    if(error){setErr(error.message?.includes('break slots are taken')?error.message:'Remote break failed: '+error.message);}
    else{setLive(p=>[...p,data]);}
    setRemoting(null); setConfirm(null);
  };

  const onBreakIds=new Set(live.map(l=>l.user_id));
  const available=clocked.filter(a=>!onBreakIds.has(a.user_id));
  const slotLive=live.filter(l=>!isTrainee(l.agent_name));   // trainees don't use break slots
  const atCap=slotLive.length>=maxB;

  return(
    <div className="panel">
      <div className="phd">
        <div><h1 className="pt">Live Rack</h1><p className="ps"><TNum value={`${slotLive.length}/${maxB}`}/> slots in use · updates instantly</p></div>
        <div className="fc g10">
          <ConnInstrument/>
          <button className="bs" onClick={load}><Ic n="refresh" size={14}/> Refresh</button>
        </div>
      </div>
      {err&&<div className="ebox"><Ic n="alert" size={14}/>{err}</div>}
      {loading?<div className="es"><div className="spin"/></div>:(
        <>
          {live.length>0&&(
            <div className="sc" style={{marginBottom:16}}>
              <div className="sc-hd"><span className="ldot"/><h2 className="sc-t">On Break Now ({live.length})</h2></div>
              <div className="tbl-wrap"><table className="dt">
                <thead><tr><th>Agent</th><th>Started</th><th>Elapsed</th><th>Predicted Type</th></tr></thead>
                <tbody>{live.map(l=><tr key={l.id}><td><AvC name={l.agent_name}/></td><td>{fmtT(l.start_time)}</td><td><LSec start={l.start_time}/></td><td><LType start={l.start_time}/></td></tr>)}</tbody>
              </table></div>
            </div>
          )}
          {live.length===0&&<div className="es" style={{padding:'24px 20px'}}><span className="es-ic"><Ic n="coffee" size={36} sw={1.2}/></span><p>No agents on break right now</p></div>}
          <div className="sc">
            <div className="sc-hd">
              <span className="sc-ic"><Ic n="play" size={15}/></span>
              <h2 className="sc-t">Start Break Remotely</h2>
              <span style={{marginLeft:8,fontSize:11,color:'var(--mut)'}}>For agents who left their desk without starting</span>
            </div>
            {available.length===0
              ?<div className="es" style={{padding:'24px 20px'}}><p>All clocked-in agents are already on break or none are clocked in yet.</p></div>
              :(
                <div className="tbl-wrap"><table className="dt">
                  <thead><tr><th>Agent</th><th>Clocked In</th><th>Status</th><th>Action</th></tr></thead>
                  <tbody>
                    {available.map(a=>(
                      <tr key={a.id}>
                        <td><AvC name={a.agent_name}/></td>
                        <td>{fmtT(a.clock_in)}</td>
                        <td><span className="badge b-in"><span style={{width:6,height:6,borderRadius:'50%',background:'var(--green)',display:'inline-block'}}/> On Shift</span></td>
                        <td>
                          <button className="btn-remote" disabled={(atCap&&!isTrainee(a.agent_name))||remoting===a.user_id} onClick={()=>setConfirm({user_id:a.user_id,agent_name:a.agent_name})}>
                            {remoting===a.user_id?<span className="spin-sm"/>:<Ic n="play" size={12}/>}
                            {atCap&&!isTrainee(a.agent_name)?'Slots Full':'Start Break'}
                          </button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table></div>
              )
            }
          </div>
        </>
      )}
      {confirm&&(
        <div className="modal-bg" onClick={e=>e.target===e.currentTarget&&setConfirm(null)}>
          <div className="modal-box">
            <div className="modal-title">Start break for {confirm.agent_name}?</div>
            <div className="modal-sub">This will log a break starting right now on their behalf. The timer will begin immediately and they will see it on their screen.</div>
            <div className="modal-foot">
              <button className="bs" onClick={()=>setConfirm(null)}>Cancel</button>
              <button className="bp blue" onClick={()=>remoteStart(confirm)} disabled={!!remoting}>{remoting?<span className="spin-sm on-dark"/>:<Ic n="play" size={14}/>} Confirm</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ── Admin Clock In/Out ── */
function AClocks(){
  const [rows,setRows]=useState([]);
  const [date,setDate]=useState(todayISO());
  const [loading,setLoad]=useState(true);
  const [err,setErr]=useState('');
  const [rt,setRt]=useState(false);
  const [clockingIn,setClockingIn]=useState(null); // user_id being processed
  const [confirmClock,setConfirmClock]=useState(null); // {user_id,agent_name}

  const load=useCallback(async()=>{
    setLoad(true);setErr('');
    const {data,error}=await run(SB.from('bt_clocklogs').select('*').eq('date',date).order('clock_in',{ascending:true}));
    if(error){setErr(error.message);setLoad(false);return;}
    setRows(data||[]); setLoad(false);
    bumpSync();
  },[date]);

  useEffect(()=>{
    load();
    const ch=SB.channel('clock-rt2')
      .on('postgres_changes',{event:'*',schema:'public',table:'bt_clocklogs'},({eventType,new:nw,old:ol})=>{
        if(nw?.date!==date&&ol?.date!==date)return;
        if(eventType==='INSERT')setRows(p=>[...p,nw]);
        if(eventType==='UPDATE')setRows(p=>p.map(r=>r.id===nw.id?nw:r));
        if(eventType==='DELETE')setRows(p=>p.filter(r=>r.id!==ol.id));
        bumpSync();
      }).subscribe(s=>{ setRt(s==='SUBSCRIBED'); if(s==='SUBSCRIBED') load(); });
    return()=>SB.removeChannel(ch);
  },[load,date]);
  useAutoRefresh(load, 6000);

  /* Remote clock in — needs the user_id and display_name from Supabase Auth.
     We look them up from auth.users via a simple approach: we use the agent_name
     stored in existing clock records or fetch from a known list. Since we can't
     query auth.users from the client directly, we use a workaround:
     Admin types the agent name and we create the clock record with user_id from
     the most recent existing record for that agent, or admin picks from a dropdown. */
  const remoteClockIn=async(agentName,userId)=>{
    setClockingIn(userId);setErr('');
    const now=nowISO();
    const {data,error}=await run(
      SB.from('bt_clocklogs').insert({user_id:userId,agent_name:agentName,clock_in:now,date:date}).select().single()
    );
    if(error){setErr('Remote clock-in failed: '+error.message);}
    else{setRows(p=>[...p,data]);}
    setClockingIn(null);setConfirmClock(null);
  };

  const remoteClockOut=async(row)=>{
    const now=nowISO();
    const {data,error}=await run(SB.from('bt_clocklogs').update({clock_out:now}).eq('id',row.id).select().single());
    if(error){setErr('Clock-out failed: '+error.message);return;}
    setRows(p=>p.map(r=>r.id===row.id?data:r));
  };

  const clockedIn=rows.filter(r=>r.clock_in&&!r.clock_out);
  const clockedOut=rows.filter(r=>r.clock_out);
  const shiftDur=r=>{ if(!r.clock_in||!r.clock_out)return'—'; return durStr(Math.round((new Date(r.clock_out)-new Date(r.clock_in))/1000)); };

  return(
    <div className="panel">
      <div className="phd">
        <div><h1 className="pt">Clock In / Out</h1><p className="ps">Agent attendance · {rows.length} records</p></div>
        <div className="fc g10">
          <ConnInstrument/>
          <input className="si" type="date" value={date} onChange={e=>setDate(e.target.value)} style={{width:160}}/>
          <button className="bs" onClick={load}><Ic n="refresh" size={14}/> Refresh</button>
        </div>
      </div>
      {err&&<div className="ebox"><Ic n="alert" size={14}/>{err}</div>}
      <div className="sg3" style={{marginBottom:20}}>
        <SC n="users"  label="Total agents" val={rows.length}/>
        <SC n="login2" label="Currently in"  val={clockedIn.length} ac={clockedIn.length>0}/>
        <SC n="moon"   label="Clocked out"   val={clockedOut.length}/>
      </div>
      {loading?<div className="es"><div className="spin"/></div>:(
        <div className="sc">
          <div className="sc-hd">
            <span className="sc-ic"><Ic n="sun" size={15}/></span>
            <h2 className="sc-t">Attendance — {date}</h2>
            {date===todayISO()&&<button className="btn-remote" style={{marginLeft:'auto'}} onClick={()=>setConfirmClock('new')}><Ic n="login2" size={12}/> Clock In Agent</button>}
          </div>
          {rows.length===0
            ?<div className="es"><span className="es-ic"><Ic n="sun" size={36} sw={1.2}/></span><p>No clock records for this date</p></div>
            :(
              <div className="tbl-wrap"><table className="dt">
                <thead><tr><th>Agent</th><th>Clock In</th><th>Clock Out</th><th>Shift Duration</th><th>Status</th><th>Action</th></tr></thead>
                <tbody>
                  {rows.map(r=>(
                    <tr key={r.id}>
                      <td><AvC name={r.agent_name}/></td>
                      <td>{fmtT(r.clock_in)}</td>
                      <td>{r.clock_out?fmtT(r.clock_out):'—'}</td>
                      <td>{shiftDur(r)}</td>
                      <td>{r.clock_out?<span className="badge b-out">Clocked Out</span>:<span className="badge b-in"><span style={{width:6,height:6,borderRadius:'50%',background:'var(--green)',display:'inline-block'}}/> On Shift</span>}</td>
                      <td>{!r.clock_out&&<button className="btn-edit" onClick={()=>remoteClockOut(r)}><Ic n="logoff" size={12}/> Clock Out</button>}</td>
                    </tr>
                  ))}
                </tbody>
              </table></div>
            )
          }
        </div>
      )}
      {confirmClock==='new'&&<RemoteClockInModal date={date} onDone={(agentName,userId)=>remoteClockIn(agentName,userId)} onClose={()=>setConfirmClock(null)}/>}
    </div>
  );
}

/* Modal for remote clock in — picks from ALL known agents, filters out already clocked in today */
function RemoteClockInModal({date,onDone,onClose}){
  const [allAgents,  setAllAgents]  = useState([]); // everyone ever in bt_clocklogs
  const [todayNames, setTodayNames] = useState([]); // names already clocked in today
  const [available,  setAvailable]  = useState([]); // allAgents minus today
  const [selected,   setSelected]   = useState('');
  const [busy,       setBusy]       = useState(false);
  const [loading,    setLoading]    = useState(true);
  const [err,        setErr]        = useState('');

  useEffect(()=>{
    (async()=>{
      // 1. All unique agents ever recorded — order by clock_in desc, no created_at needed
      const {data:hist} = await run(
        SB.from('bt_clocklogs')
          .select('user_id,agent_name')
          .order('clock_in',{ascending:false})
          .limit(500)
      );
      const seen = new Set();
      const unique = [];
      (hist||[]).forEach(r=>{
        if(!seen.has(r.user_id)){ seen.add(r.user_id); unique.push(r); }
      });
      setAllAgents(unique);

      // 2. Who is already clocked in today?
      const {data:today} = await run(
        SB.from('bt_clocklogs').select('agent_name').eq('date',date)
      );
      const todaySet = new Set((today||[]).map(r=>r.agent_name));
      setTodayNames([...todaySet]);

      // 3. Available = in history but NOT already clocked in today
      const avail = unique.filter(a=>!todaySet.has(a.agent_name));
      setAvailable(avail);
      if(avail.length>0) setSelected(avail[0].user_id);
      setLoading(false);
    })();
  },[date]);

  const go=async()=>{
    const ag=available.find(a=>a.user_id===selected);
    if(!ag)return;
    setBusy(true);
    await onDone(ag.agent_name, ag.user_id);
    setBusy(false);
  };

  return(
    <div className="modal-bg" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal-box">
        <div className="modal-title">Clock In Agent Remotely</div>
        <div className="modal-sub">
          Select an agent to clock them in right now. Only agents not yet clocked in today are shown.
        </div>
        {loading
          ?<div style={{textAlign:'center',padding:'16px'}}><div className="spin" style={{margin:'0 auto'}}/></div>
          :available.length===0
            ?<div style={{background:'var(--card)',borderRadius:8,padding:'12px 14px',fontSize:13,color:'var(--mut)',marginBottom:16}}>
                {allAgents.length===0
                  ?'No agents found in the system yet. Each agent must clock in manually at least once before they appear here.'
                  :`All ${allAgents.length} known agent${allAgents.length>1?'s are':' is'} already clocked in today.`
                }
              </div>
            :(
              <div className="fg">
                <label className="fl">Select Agent ({available.length} available)</label>
                <select className="fi" value={selected} onChange={e=>setSelected(e.target.value)}>
                  {available.map(a=><option key={a.user_id} value={a.user_id}>{a.agent_name}</option>)}
                </select>
              </div>
            )
        }
        {err&&<div className="aerr"><Ic n="alert" size={14}/>{err}</div>}
        <div className="modal-foot">
          <button className="bs" onClick={onClose}>Cancel</button>
          <button className="bp" onClick={go} disabled={busy||available.length===0||loading}>
            {busy?<span className="spin-sm"/>:<Ic n="login2" size={14}/>} Clock In
          </button>
        </div>
      </div>
    </div>
  );
}

/* ── Admin Lunch Schedule ── */
function ALunch(){
  useTeamConfig();
  const [date,    setDate]    = useState(todayISO());
  const [row,     setRow]     = useState(null);   // bt_lunch_schedule row
  const [grpA,    setGrpA]    = useState([]);
  const [grpB,    setGrpB]    = useState([]);
  const [pool,    setPool]    = useState([]);     // clocked in but unassigned
  const [first,   setFirst]   = useState('A');    // which group goes at 12:00
  const [loading, setLoad]    = useState(true);
  const [saving,  setSaving]  = useState(false);
  const [err,     setErr]     = useState('');
  const [saved,   setSaved]   = useState(false);

  const load=useCallback(async()=>{
    setLoad(true);setErr('');setSaved(false);

    // Load existing schedule for the selected date
    const {data:ls}=await run(SB.from('bt_lunch_schedule').select('*').eq('date',date).maybeSingle());

    // Load agents clocked in on the selected date
    const {data:ck}=await run(SB.from('bt_clocklogs').select('agent_name').eq('date',date));
    const allClocked=[...new Set((ck||[]).map(r=>r.agent_name))].filter(n=>!isTrainee(n));   // trainees have their own lunch time

    if(ls){
      // Schedule already exists for this date — use it directly
      const a=ls.group_a||[];
      const b=ls.group_b||[];
      setRow(ls); setGrpA(a); setGrpB(b);
      setFirst(ls.group_first||defaultFirst(date));
      // Any agent clocked in today but not yet assigned → pool
      setPool(allClocked.filter(n=>!a.includes(n)&&!b.includes(n)));
    } else {
      // No schedule for this date — try to auto-fill from the most recent previous schedule
      const {data:prev}=await run(
        SB.from('bt_lunch_schedule')
          .select('*')
          .lt('date', date)          // any date before today
          .order('date',{ascending:false})
          .limit(1)
          .maybeSingle()
      );

      setRow(null);
      setFirst(defaultFirst(date));

      if(prev){
