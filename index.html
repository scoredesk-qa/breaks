/* ═══ Bonus audit and Late & extra time (admin) ═══ */
const BONUS_SQL=`-- Bonus audit: the numbers an admin types in (QA pass rate, corrections) and the month's working days. Run once in the Supabase SQL Editor. Safe to run again.
-- Admin only (user_metadata.role = 'admin', same as the rest of the app).

create or replace function public.bt_is_admin() returns boolean language sql stable as $$
  select coalesce((auth.jwt() -> 'user_metadata' ->> 'role') = 'admin', false)
$$;

create table if not exists public.bt_bonus_inputs (
  month           text        not null,                 -- '2026-10'
  agent_name      text        not null,                 -- the agent, or '__month__' for the settings of the month
  qa_rate         numeric     check (qa_rate is null or (qa_rate >= 0 and qa_rate <= 1)),   -- 0.9 = 90 %
  absent_override int         check (absent_override is null or absent_override >= 0),      -- replaces the days absent worked out by the page
  punct_adj       int         not null default 0,       -- added to the punctuality events (negative to forgive some)
  workdays        text,                                 -- month row only: weekdays worked, e.g. '12345' (1 = Monday ... 7 = Sunday)
  holidays        text,                                 -- month row only: days nobody works, e.g. '2026-10-06,2026-10-20'
  leave_counts    boolean     not null default false,   -- month row only: do approved time-off days count as absent
  updated_at      timestamptz not null default now(),
  primary key (month, agent_name)
);

alter table public.bt_bonus_inputs enable row level security;

do $$ begin
  if not exists (select 1 from pg_policies where schemaname = 'public' and tablename = 'bt_bonus_inputs' and policyname = 'bonus admin') then
    create policy "bonus admin" on public.bt_bonus_inputs for all to authenticated using (public.bt_is_admin()) with check (public.bt_is_admin());
  end if;
end $$;

grant select, insert, update on public.bt_bonus_inputs to authenticated;

notify pgrst, 'reload schema';
`;
const BR={start:'08:30',end:'17:30',graceSec:60,lunchSec:3600,brkSec:900,flexSec:900,lunchMin:3000,brkMin:800};
const BEV={late_start:'Late start',late_lunch:'Lunch over',late_break:'Break over',flex_over:'Short breaks over',extra_break:'Extra break',stayed_late:'On a call after 17:30'};
const hmSec=hm=>{ const [h,m]=hm.split(':').map(Number); return h*3600+m*60; };
const ymd=t=>{ const w=wall(t); return `${w.getUTCFullYear()}-${pad(w.getUTCMonth()+1)}-${pad(w.getUTCDate())}`; };
const secInDay=t=>{ const w=wall(t); return w.getUTCHours()*3600+w.getUTCMinutes()*60+w.getUTCSeconds(); };
const fmtMin=m=>m>=60?`${Math.floor(m/60)}h${m%60?` ${m%60}m`:''}`:`${m}m`;
async function fetchAllRows(make){
  let out=[],i=0,last=false;
  while(!last&&i<120){
    const {data,error}=await run(make().range(i*1000,i*1000+999));
    if(error) return {data:out,error};
    out=out.concat(data||[]); last=!data||data.length<1000; i++;
  }
  return {data:out,error:null};
}
function dlCsv(name,head,rows){
  const q=v=>{ const s=String(v==null?'':v); return /[",\n;]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  const txt='﻿'+[head,...rows].map(r=>r.map(q).join(',')).join('\r\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500);
}

/* Everything here comes from the 3CX status log: when an agent came online, their break and lunch statuses, and their calls. */
const hmOf=sec=>`${pad(Math.floor(sec/3600))}:${pad(Math.floor(sec%3600/60))}`;
const CXR_CACHE={};   // status_log rows per date range, so going back and forth is quick
async function loadCxRange(first,last,setProg){
  const tz=clockOff(), today=todayISO();
  const lo=Date.parse(first+'T00:00:00Z')-tz*3600000-36*3600000, hi=Date.parse(isoAdd(last,1)+'T00:00:00Z')-tz*3600000;
  const k=first+'|'+last, c=CXR_CACHE[k];
  let rows;
  if(c&&Date.now()-c.at<(last<today?3600000:90000)) rows=c.rows;
  else{
    let n=0;
    const r=await fetchAllRows(()=>{ n++; setProg(`Reading the 3CX log, page ${n}`); return SB.from('status_log').select('changed_at,extension,agent,old_status,new_status,detail').gte('changed_at',new Date(lo).toISOString()).lt('changed_at',new Date(hi).toISOString()).order('changed_at',{ascending:true}); });
    if(r.error) return {error:r.error.message||String(r.error),days:{}};
    rows=r.data.map(x=>({...x,ms:Date.parse(x.changed_at)})); CXR_CACHE[k]={at:Date.now(),rows};
  }
  const days={}, cfg=_cxCfg, now=appNow(), notWork=x=>['off','hol'].includes(cxCat(x));
  for(let d=first;d<=last&&d<=today;d=isoAdd(d,1)){
    const [from,to]=CX.dayRange(d,tz);
    const part=rows.filter(x=>x.ms>=from-36*3600000&&x.ms<to);
    if(!part.length) continue;
    setProg(`Working out ${d}`);
    try{
      const R=CX.analyze(CX.rowsFromStatusLog(part),{day:d,now:Math.min(now,to),...cfg,tzOffsetHours:0,dayOffsetHours:tz});
      const end=iv=>iv.end==null?R.now:iv.end, cutoff=from+hmSec(BR.end)*1000, rec={};
      Object.values(R.agents).forEach(a=>{
        const ivs=R.intervals.filter(iv=>iv.ext===a.ext);
        const carried=ivs.find(iv=>iv.start<from&&end(iv)>from);
        const inDayIvs=ivs.filter(iv=>iv.start>=from&&iv.start<to);
        const firstIv=(!carried||notWork(carried.status))?inDayIvs.find(iv=>!notWork(iv.status)):null;
        const brks=inDayIvs.filter(iv=>CX.isBreak(iv.status)&&(iv.end!=null||(d===today&&iv.end==null))).map(iv=>({start:iv.start,end:iv.end,secs:Math.round((end(iv)-iv.start)/1000),type:CX.breakType(iv.status,iv.detail)})).filter(x=>x.secs>=(cfg.minBreakSec||10));
        let afterSecs=0, afterN=0;
        R.calls.filter(cl=>cl.ext===a.ext&&cl.start<to).forEach(cl=>{ const ce=cl.end==null?R.now:cl.end; if(ce>cutoff){ afterSecs+=(Math.min(ce,to)-Math.max(cl.start,cutoff))/1000; afterN++; } });
        const k2=CX.nameKey(a.agent);
        rec[k2]={name:a.agent,calls:a.calls,answered:a.answered,ignored:a.ignored,
          present:inDayIvs.some(iv=>!notWork(iv.status))||a.calls>0,
          firstSec:firstIv&&!firstIv.partialStart?(firstIv.start-from)/1000:null,
          breaks:brks,afterSecs:Math.round(afterSecs),afterN};
      });
      days[d]=rec;
    }catch(e){}
    await new Promise(r=>setTimeout(r,0));
  }
  return {days,error:null};
}

/* Every late event, from the per-day 3CX records. A start, a break or a lunch counts as late from one full minute over.
   Staying past the end of the shift only counts as time spent on calls after it (the client pays for calls, not for being logged in). */
function cxEvents(days){
  const ev=[];
  Object.entries(days).forEach(([day,rec])=>Object.values(rec).forEach(a=>{
    const add=(type,secOver,detail)=>ev.push({day,agent:CX.displayName?CX.displayName(a.name):a.name,key:CX.nameKey(a.name),type,mins:Math.floor(secOver/60),detail});
    if(a.firstSec!=null){ const over=a.firstSec-hmSec(BR.start); if(over>=BR.graceSec) add('late_start',over,`Came online at ${hmOf(a.firstSec)}, shift starts ${BR.start}`); }
    if(a.afterSecs>=BR.graceSec) add('stayed_late',a.afterSecs,`On ${a.afterN} call${a.afterN===1?'':'s'} for ${fmtMin(Math.floor(a.afterSecs/60))} after ${BR.end}`);
    const span=x=>`${hhmm(x.start)}–${x.end!=null?hhmm(x.end):'now'}`, m=x=>fmtMin(Math.round(x.secs/60));
    const items=a.breaks.slice().sort((p,q)=>q.secs-p.secs);
    const li=items.findIndex(x=>x.type==='Lunch Break'||x.secs>=BR.lunchMin), lunch=li>=0?items.splice(li,1)[0]:null;
    if(lunch&&lunch.secs-BR.lunchSec>=BR.graceSec) add('late_lunch',lunch.secs-BR.lunchSec,`Lunch ${span(lunch)} took ${m(lunch)}, 1h allowed`);
    const flex=items.filter(x=>x.type==='Bathroom Break'||(x.type!=='Lunch Break'&&x.secs<BR.brkMin)), reg=items.filter(x=>!flex.includes(x));
    reg.forEach((x,i)=>{
      if(i<2){ if(x.secs-BR.brkSec>=BR.graceSec) add('late_break',x.secs-BR.brkSec,`Break ${span(x)} took ${m(x)}, 15m allowed`); }
      else add('extra_break',x.secs,`Third break ${span(x)} (${m(x)}); only two 15m breaks are allowed`);
    });
    const ft=flex.reduce((t,x)=>t+x.secs,0);
    if(ft-BR.flexSec>=BR.graceSec) add('flex_over',ft-BR.flexSec,`${flex.length} short break${flex.length===1?'':'s'} added up to ${fmtMin(Math.round(ft/60))}, 15m allowed`);
  }));
  return ev.sort((a,b)=>b.day.localeCompare(a.day)||a.agent.localeCompare(b.agent)||a.type.localeCompare(b.type));
}

/* Bonus rules (the same as the October sheet) */
function bonusOf({abs,punct,qa,calls,ign}){
  const out=abs>=2||punct>=3;
  const att=out?0:(abs===1?100:200);
  const qaB=out?0:(qa>=1?150:qa>=0.9?75:0);
  const prod=out?0:((calls<600||ign>0.02)?0:(abs===1?75:150));
  return {att,qaB,prod,total:att+qaB+prod};
}

function ABonus({go}){
  const cur=todayISO().slice(0,7);
  const [ym,setYm]=useState(cur);
  const [data,setData]=useState(null);
  const [cx,setCx]=useState(null);
  const [prog,setProg]=useState('');
  const [inp,setInp]=useState({});
  const [off,setOff]=useState(false);
  const [err,setErr]=useState('');
  const [showSet,setShowSet]=useState(false);
  const first=ym+'-01', next=monthAdd(first,1);
  useEffect(()=>{
    let dead=false;
    (async()=>{
      setData(null); setCx(null); setErr(''); setProg('Reading 3CX');
      const [q,i]=await Promise.all([
        run(SB.from('bt_requests').select('*').eq('status','approved').in('kind',['pto','sick']).lte('start_date',isoAdd(next,-1)).gte('end_date',first)),
        run(SB.from('bt_bonus_inputs').select('*').eq('month',ym)),
      ]);
      if(dead) return;
      const missing=!!(i.error&&/bt_bonus_inputs|schema cache|does not exist/i.test(i.error.message||''));
      setOff(missing);
      const m={}; (i.data||[]).forEach(r=>{ m[r.agent_name]=r; }); setInp(m);
      setData({reqs:q.data||[]});
      const r=await loadCxRange(first,isoAdd(next,-1),t=>{ if(!dead) setProg(t); });
      if(dead) return;
      if(r.error) setErr("Couldn't read the 3CX log: "+r.error);
      setCx(r); setProg('');
    })();
    return()=>{ dead=true; };
  },[ym]);
  const month=inp.__month__||{};
  const workdays=(month.workdays||'12345'), holidays=new Set((month.holidays||'').split(/[\s,;]+/).filter(Boolean)), leaveCounts=!!month.leave_counts;
  const save=async(name,patch)=>{
    const row={...(inp[name]||{}),month:ym,agent_name:name,...patch,updated_at:nowISO()};
    delete row.id;
    setInp(p=>({...p,[name]:row}));
    if(off) return;
    const {error}=await run(SB.from('bt_bonus_inputs').upsert({month:ym,agent_name:name,qa_rate:row.qa_rate??null,absent_override:row.absent_override??null,punct_adj:row.punct_adj??0,workdays:row.workdays??null,holidays:row.holidays??null,leave_counts:!!row.leave_counts,updated_at:row.updated_at},{onConflict:'month,agent_name'}));
    if(error){ if(/bt_bonus_inputs|schema cache/i.test(error.message||'')) setOff(true); else setErr('Save: '+error.message); }
  };
  const rowsOut=useMemo(()=>{
    if(!data||!cx) return [];
    const today=todayISO();
    const days=[]; for(let d=first;d<next&&d<today;d=isoAdd(d,1)){ const wd=new Date(d+'T00:00:00Z').getUTCDay()||7; if(workdays.includes(String(wd))&&!holidays.has(d)) days.push(d); }
    const people={}, tot={}, worked={};
    Object.entries(cx.days).forEach(([d,rec])=>Object.entries(rec).forEach(([k,a])=>{
      people[k]=people[k]||{key:k,name:CX.displayName?CX.displayName(a.name):a.name};
      const t=tot[k]=tot[k]||{calls:0,answered:0,ignored:0}; t.calls+=a.calls; t.answered+=a.answered; t.ignored+=a.ignored;
      if(a.present) (worked[k]=worked[k]||new Set()).add(d);
    }));
    const ev=cxEvents(cx.days).filter(e=>e.type!=='stayed_late');
    return Object.values(people).filter(p=>worked[p.key]&&worked[p.key].size>0||tot[p.key].calls>0).sort((a,b)=>a.name.localeCompare(b.name)).map(p=>{
      const leave=new Set(); data.reqs.filter(r=>CX.nameKey(r.agent_name)===p.key).forEach(r=>{ for(let d=r.start_date;d<=(r.end_date||r.start_date);d=isoAdd(d,1)) leave.add(d); });
      const auto=days.filter(d=>!(worked[p.key]&&worked[p.key].has(d))&&(leaveCounts||!leave.has(d))).length;
      const i=inp[p.name]||inp[Object.keys(inp).find(n=>CX.nameKey(n)===p.key)]||{};
      const abs=i.absent_override!=null?i.absent_override:auto;
      const n=ev.filter(e=>e.key===p.key).length, adj=i.punct_adj||0, punct=Math.max(0,n+adj);
      const a=tot[p.key], rings=a.answered+a.ignored, ign=rings?a.ignored/rings:0;
      const qa=i.qa_rate!=null?Number(i.qa_rate):0;
      return {...p,auto,abs,n,adj,punct,qa,qaSet:i.qa_rate!=null,calls:a.calls,ign,ignN:a.ignored,over:i.absent_override!=null,...bonusOf({abs,punct,qa,calls:a.calls,ign})};
    });
  },[data,cx,inp,ym]);
  const sum=k=>rowsOut.reduce((t,r)=>t+r[k],0);
  const monthName=new Date(first+'T00:00:00Z').toLocaleDateString('en-GB',{month:'long',year:'numeric',timeZone:'UTC'});
  const toggleDay=d=>{ const s=new Set(workdays.split('')); s.has(String(d))?s.delete(String(d)):s.add(String(d)); save('__month__',{workdays:[...s].sort().join('')}); };
  const exportCsv=()=>dlCsv(`bonus-audit-${ym}.csv`,['Employee','Days absent','Punctuality events','QA pass rate','Handled calls','Ignored calls rate','Attendance bonus (MAD)','QA bonus (MAD)','Productivity bonus (MAD)','Total bonus (MAD)'],
    rowsOut.map(r=>[r.name,r.abs,r.punct,r.qaSet?Math.round(r.qa*1000)/10+'%':'',r.calls,(Math.round(r.ign*1000)/10)+'%',r.att,r.qaB,r.prod,r.total]));
  const numIn=(r,field,val,parse)=>(
    <input className="fi bn-in" defaultValue={val} key={r.key+field+ym+String(val)} inputMode="decimal"
      onBlur={e=>{ const t=e.target.value.trim(); const v=parse(t); if(v!==undefined) save(r.name,{[field]:v}); }}
      onKeyDown={e=>{ if(e.key==='Enter') e.target.blur(); }} aria-label={`${field} for ${r.name}`}/>);
  return(
    <div className="panel" id="tab-bonus">
      <div className="tab-h"><h1>Bonus audit</h1><p>Attendance, QA and productivity bonus for the month, all from the 3CX status log.</p></div>
      {err&&<div className="ebox"><Ic n="alert" size={14}/>{err}</div>}
      {off&&<div className="sblk" style={{marginBottom:18}}><h2 className="sh">One-time setup</h2><p className="sd">QA rates and corrections need a small table. Copy this SQL into the Supabase SQL Editor and run it, then reload. Until then what you type is kept only on this page.</p><CopySql sql={BONUS_SQL}/></div>}
      <div className="pf-nav">
        <button className="icb" onClick={()=>setYm(monthAdd(first,-1).slice(0,7))} aria-label="Previous month"><Ic n="chevleft" size={18}/></button>
        <b>{monthName}</b>
        <button className="icb" onClick={()=>setYm(monthAdd(first,1).slice(0,7))} disabled={ym>=cur} aria-label="Next month"><span style={{display:'inline-flex',transform:'rotate(180deg)'}}><Ic n="chevleft" size={18}/></span></button>
        {prog&&<span className="rq-s" style={{marginLeft:8}}>{prog}…</span>}
        <span style={{marginLeft:'auto',display:'flex',gap:10}}>
          <button className="bs" onClick={()=>setShowSet(s=>!s)}><Ic n="settings" size={15}/> Month settings</button>
          <button className="bs" onClick={()=>go&&go('late')}><Ic n="clock" size={15}/> Late events</button>
          <button className="bs" onClick={exportCsv} disabled={!rowsOut.length}><Ic n="download" size={15}/> Export CSV</button>
        </span>
      </div>
      {showSet&&<div className="sblk" id="bn-set" style={{marginBottom:18}}>
        <h2 className="sh">Month settings</h2>
        <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center',marginBottom:14}}>
          <span style={{minWidth:130}}>Working days</span>
          {['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map((n,i)=><button key={n} className={`fchip${workdays.includes(String(i+1))?' on':''}`} onClick={()=>toggleDay(i+1)}>{n}</button>)}
        </div>
        <div style={{display:'flex',gap:12,flexWrap:'wrap',alignItems:'center',marginBottom:14}}>
          <span style={{minWidth:130}}>Days nobody works</span>
          <input className="fi" style={{maxWidth:420}} defaultValue={month.holidays||''} key={ym+'h'+(month.holidays||'')} placeholder="2026-10-06, 2026-10-20" onBlur={e=>save('__month__',{holidays:e.target.value.trim()})} aria-label="Holidays"/>
        </div>
        <label style={{display:'flex',gap:10,alignItems:'center',cursor:'pointer'}}><input type="checkbox" checked={leaveCounts} onChange={e=>save('__month__',{leave_counts:e.target.checked})}/> Count approved time off as days absent</label>
      </div>}
      {(data===null||cx===null)?<div className="es"><div className="spin"/></div>:(
        <div className="card" style={{padding:'10px 18px 14px',overflowX:'auto'}}>
          <table className="tbl bn-tbl"><thead><tr><th>Employee</th><th title="Working days with no 3CX activity. Type a number to replace it.">Days absent</th><th title="Late starts and break or lunch time passed by a minute or more. Add or remove events with the adjustment.">Punctuality events</th><th>QA pass rate</th><th>Handled calls</th><th title="Ignored rings out of the rings the agent was offered">Ignored calls</th><th>Attendance</th><th>QA</th><th>Productivity</th><th>Total (MAD)</th></tr></thead><tbody>
            {rowsOut.length===0&&<tr><td colSpan={10} style={{color:'var(--mut)',padding:'22px 10px'}}>No 3CX activity in {monthName}.</td></tr>}
            {rowsOut.map(r=>(
              <tr key={r.key} data-agent={r.name}>
                <td>{r.name}</td>
                <td className="n">{numIn(r,'absent_override',r.abs,t=>t===''?null:(/^\d+$/.test(t)?Number(t):undefined))}{r.over&&<span className="bn-flag" title={`Worked out: ${r.auto}`}>edited</span>}</td>
                <td className="n"><span className={r.punct>=3?'bn-bad':''}>{r.punct}</span>{r.adj!==0&&<span className="bn-flag" title={`${r.n} found, ${r.adj>0?'+':''}${r.adj} adjusted`}>{r.adj>0?'+':''}{r.adj}</span>}
                  <button className="bn-adj" title="Adjust the number of events" onClick={()=>{ const t=prompt(`Adjust ${r.name}'s punctuality events (found ${r.n}). Use -1 to forgive one, +1 to add one:`,String(r.adj)); if(t!==null&&/^-?\d+$/.test(t.trim())) save(r.name,{punct_adj:Number(t)}); }}>±</button></td>
                <td className="n">{numIn(r,'qa_rate',r.qaSet?Math.round(r.qa*1000)/10:'',t=>t===''?null:(Number.isFinite(Number(t))&&Number(t)>=0&&Number(t)<=100?Number(t)/100:undefined))}<span className="bn-pct">%</span></td>
                <td className="n">{r.calls}</td>
                <td className="n"><span className={r.ign>0.02?'bn-bad':''}>{(Math.round(r.ign*1000)/10).toFixed(1)}%</span></td>
                <td className="n">{r.att}</td><td className="n">{r.qaB}</td><td className="n">{r.prod}</td><td className="n"><b>{r.total}</b></td>
              </tr>))}
            {rowsOut.length>0&&<tr className="bn-tot"><td>Total</td><td/><td/><td/><td className="n">{sum('calls')}</td><td/><td className="n">{sum('att')}</td><td className="n">{sum('qaB')}</td><td className="n">{sum('prod')}</td><td className="n">{sum('total')}</td></tr>}
          </tbody></table>
        </div>)}
    </div>
  );
}

function ALate(){
  const today=todayISO();
  const [from,setFrom]=useState(today.slice(0,8)+'01');
  const [to,setTo]=useState(today);
  const [agent,setAgent]=useState('');
  const [types,setTypes]=useState([]);       // empty = all
  const [data,setData]=useState(null);
  const [err,setErr]=useState('');
  const [prog,setProg]=useState('');
  const seq=useRef(0);
  const load=useCallback(async()=>{
    if(!from||!to||to<from) return;
    const my=++seq.current;
    const r=await loadCxRange(from,to,setProg);
    if(my!==seq.current) return;   // a newer range was asked for meanwhile
    setProg('');
    if(r.error){ setErr("Couldn't read the 3CX log: "+r.error); return; }
    setErr(''); setData(r);
  },[from,to]);
  useEffect(()=>{ setData(null); load(); },[load]);
  useAutoRefresh(load,60000);
  const all=useMemo(()=>data?cxEvents(data.days):[],[data]);
  const names=[...new Set(all.map(e=>e.agent))].sort((a,b)=>a.localeCompare(b));
  const list=all.filter(e=>(!agent||e.agent===agent)&&(!types.length||types.includes(e.type)));
  const isLate=e=>e.type!=='stayed_late';
  const nStart=list.filter(e=>e.type==='late_start').length, nBrk=list.filter(e=>isLate(e)&&e.type!=='late_start').length;
  const extra=list.filter(e=>e.type==='stayed_late').reduce((t,e)=>t+e.mins,0);
  const preset=k=>{ const t=todayISO(); if(k==='today'){ setFrom(t); setTo(t); } else if(k==='week'){ const d=new Date(t+'T00:00:00Z'); const wd=(d.getUTCDay()||7)-1; setFrom(isoAdd(t,-wd)); setTo(t); } else if(k==='month'){ setFrom(t.slice(0,8)+'01'); setTo(t); } else { const pm=monthAdd(t.slice(0,8)+'01',-1); setFrom(pm); setTo(isoAdd(monthAdd(pm,1),-1)); } };
  const toggle=t=>setTypes(p=>p.includes(t)?p.filter(x=>x!==t):[...p,t]);
  const exportCsv=()=>dlCsv(`late-and-extra-time-${from}-to-${to}.csv`,['Date','Agent','Type','Minutes over','Details'],list.map(e=>[e.day,e.agent,BEV[e.type],e.mins,e.detail]));
  return(
    <div className="panel" id="tab-late">
      <div className="tab-h"><h1>Late &amp; extra time</h1><p>From the 3CX log: late starts, break and lunch time passed by a minute or more, and time on calls after {BR.end}.</p></div>
      {err&&<div className="ebox"><Ic n="alert" size={14}/>{err}</div>}
      <div className="lt-filters">
        <label>From<input className="fi" type="date" value={from} max={to} onChange={e=>setFrom(e.target.value)} aria-label="From date"/></label>
        <label>To<input className="fi" type="date" value={to} min={from} onChange={e=>setTo(e.target.value)} aria-label="To date"/></label>
        <label>Agent<select className="fi" value={agent} onChange={e=>setAgent(e.target.value)} aria-label="Agent"><option value="">Everyone</option>{names.map(n=><option key={n} value={n}>{n}</option>)}</select></label>
        <div className="lt-pre">{[['today','Today'],['week','This week'],['month','This month'],['last','Last month']].map(([k,l])=><button key={k} className="fchip" onClick={()=>preset(k)}>{l}</button>)}</div>
        <button className="bs" onClick={exportCsv} disabled={!list.length} style={{marginLeft:'auto'}}><Ic n="download" size={15}/> Export CSV</button>
      </div>
      <div className="lt-types">{Object.entries(BEV).map(([k,l])=><button key={k} data-type={k} className={`fchip${types.includes(k)?' on':''}`} onClick={()=>toggle(k)}>{l}</button>)}{types.length>0&&<button className="fchip" onClick={()=>setTypes([])}>Clear</button>}</div>
      <div className="kpis">
        <div className="kpi"><div className="kpi-ic r"><Ic n="clock" size={20}/></div><b id="lt-k-start">{nStart}</b><span>Late starts</span></div>
        <div className="kpi"><div className="kpi-ic"><Ic n="coffee" size={20}/></div><b id="lt-k-brk">{nBrk}</b><span>Break and lunch overruns</span></div>
        <div className="kpi"><div className="kpi-ic p"><Ic n="timer" size={20}/></div><b id="lt-k-extra">{fmtMin(extra)}</b><span>Time on calls after {BR.end}</span></div>
        <div className="kpi"><div className="kpi-ic b"><Ic n="users" size={20}/></div><b>{new Set(list.map(e=>e.agent)).size}</b><span>Agents involved</span></div>
      </div>
      {data===null?<div className="es"><div className="spin"/>{prog&&<div className="rq-s" style={{marginTop:10}}>{prog}…</div>}</div>:(
        <div className="card" style={{padding:'10px 18px 14px',overflowX:'auto'}}>
          <table className="tbl"><thead><tr><th>Date</th><th>Agent</th><th>Type</th><th>Over by</th><th>Details</th></tr></thead><tbody>
            {list.length===0&&<tr><td colSpan={5} style={{color:'var(--mut)',padding:'22px 10px'}}>Nothing late or extra in this period.</td></tr>}
            {list.map((e,i)=>(<tr key={i} data-ev={e.type}><td>{fmtD(e.day+'T12:00:00Z')}</td><td>{e.agent}</td><td><span className={`lt-t ${e.type}`}>{BEV[e.type]}</span></td><td className="n">{e.mins}m</td><td style={{color:'var(--mut)'}}>{e.detail}</td></tr>))}
          </tbody></table>
        </div>)}
    </div>
  );
}

function App() {
  const [user,  setUser]  = useState(null);
  const [ready, setReady] = useState(false);
  useNotifPermission();
  useEffect(()=>{
    Promise.all([SB.auth.getSession(), loadLunchStart()]).then(([{data:{session}}])=>{ setUser(session?.user||null); setReady(true); });
    const {data:{subscription}} = SB.auth.onAuthStateChange((_,session)=>{ setUser(session?.user||null); });
    return ()=>subscription.unsubscribe();
  },[]);
  const [,bumpApp]=useState(0);
  useEffect(()=>{ const id=setInterval(()=>loadLunchStart().then(c=>c&&bumpApp(n=>n+1)),30000); return()=>clearInterval(id); },[]);
  if(!ready) return <><Splash/><ToastContainer/></>;
  if(!user)  return <><LoginPage/><ToastContainer/></>;
  const role = user.user_metadata?.role;
  const name = user.user_metadata?.display_name || user.email;
  const out  = ()=>SB.auth.signOut();
  return (
    <>
      {role==='admin'
        ? <AdminApp user={user} name={name} onLogout={out}/>
        : <AgentApp user={user} name={name} onLogout={out}/>}
      <ToastContainer/>
    </>
  );
}

/* ══════════════════════════════════════════════════════════════
   AGENT
══════════════════════════════════════════════════════════════ */
function AgentApp({user,name,onLogout}){
  const [clockRow,  setClockRow]  = useState(null);
  const [active,    setActive]    = useState(null);
  const [logs,      setLogs]      = useState([]);
  const [elapsed,   setElapsed]   = useState(0);
  const [maxB,      setMaxB]      = useState(3);
  const [teamCount, setTeamCount] = useState(0);
  useSlotSchedulerTick();
  const team = useTeamConfig();
  const cxs = useAgentCx(name);
  const [tab,setTab]=useState('home');
  const [navOpen,setNavOpen]=useState(false);
  const [reqN]=useReqBadge(user,false,tab==='requests');
  useRequestToasts(user,false);
  const trainee = isTrainee(name);
  const [confirmOut, setConfirmOut] = useState(false);
  const [loading,   setLoading]   = useState(true);
  const [err,       setErr]       = useState('');
  const [lunchInfo, setLunchInfo] = useState(null); // {group:'A'|'B', slot:{from,to}}
  // Swap request state
  const [incomingSwaps, setIncomingSwaps] = useState([]); // pending requests TO this agent
  const [outgoingSwap,  setOutgoingSwap]  = useState(null); // request FROM this agent (pending)
  const [showSwapModal, setShowSwapModal] = useState(false);
  const [swapBusy,      setSwapBusy]      = useState(false);
  const timerRef = useRef(null);
  const outgoingSwapRef = useRef(null);
  useEffect(()=>{ outgoingSwapRef.current = outgoingSwap; },[outgoingSwap]);
  const today = todayISO();

  // Notification hooks
  useLunchReminder(trainee ? null : lunchInfo);
  useAgentNotifListener(user.id, trainee ? null : lunchInfo);

  // Swap listener — receives broadcast events for immediate response UX
  useSwapListener(user.id, useCallback((payload) => {
    if (payload.action === 'request' && payload.toUserId === user.id) {
      // New incoming request — the postgres_changes sub will also catch it, but toast here for immediacy
      fireNotification({ title: '🔄 Lunch Swap Request', body: `${payload.fromName} wants to swap lunch groups with you.`, type: 'custom', duration: 15000 });
    }
    if (payload.action === 'accepted' && payload.fromUserId === user.id) {
      // Our request was accepted — update outgoing swap and reload lunch
      setOutgoingSwap(null);
      fireNotification({ title: '✅ Swap Accepted!', body: `${payload.toName} accepted. Your lunch group has been updated.`, type: 'info', duration: 10000 });
      // Fetch fresh lunch schedule from DB
      run(SB.from('bt_lunch_schedule').select('*').eq('date',today).maybeSingle()).then(({data:ls})=>{
        if(!ls) return;
        const grpA=ls.group_a||[]; const grpB=ls.group_b||[];
        const myGrp=grpA.includes(name)?'A':grpB.includes(name)?'B':null;
        const first=ls.group_first||defaultFirst(today); const slots=lunchSlots(first);
        if(myGrp) setLunchInfo({group:myGrp,slot:slots[myGrp],allA:grpA,allB:grpB,first,slots});
        else setLunchInfo({group:null,allA:grpA,allB:grpB});
      });
    }
    if (payload.action === 'declined' && payload.fromUserId === user.id) {
      setOutgoingSwap(null);
      fireNotification({ title: '❌ Swap Declined', body: `${payload.toName} declined your swap request.`, type: 'warn', duration: 8000 });
    }
  }, [user.id, today, name]));

  const load = useCallback(async()=>{
    setLoading(true); setErr('');
    const {data:cr} = await run(SB.from('bt_clocklogs').select('*').eq('user_id',user.id).eq('date',today).maybeSingle());
    setClockRow(cr||null);
    const {data:bl,error:e2} = await run(SB.from('bt_logs').select('*').eq('user_id',user.id).gte('start_time',today+'T00:00:00.000Z').order('start_time',{ascending:false}));
    if(e2){setErr(e2.message);setLoading(false);return;}
    setLogs(bl||[]);
    const openBreak = (bl||[]).find(l=>!l.end_time);
    setActive(openBreak||null);
    const {data:cfg} = await run(SB.from('bt_settings').select('max_concurrent_breaks').eq('id',1).maybeSingle());
    if(cfg) setMaxB(cfg.max_concurrent_breaks);
    const {data:tc} = await run(SB.from('bt_logs').select('id,agent_name').is('end_time',null));
    setTeamCount(slotCount(tc));
    // Lunch schedule
    const {data:ls} = await run(SB.from('bt_lunch_schedule').select('*').eq('date',today).maybeSingle());
    if(ls){
      const grpA = ls.group_a || [];
      const grpB = ls.group_b || [];
      const myGrp = grpA.includes(name) ? 'A' : grpB.includes(name) ? 'B' : null;
      if(myGrp){
        const first = ls.group_first || defaultFirst(today);
        const slots = lunchSlots(first);
        setLunchInfo({group:myGrp, slot:slots[myGrp], allA:grpA, allB:grpB, first, slots});
      } else {
        setLunchInfo({group:null, allA:grpA, allB:grpB});
      }
    } else {
      // No DB row for today yet — use default rotation so agents still see their group
      const first = defaultFirst(today);
      const slots = lunchSlots(first);
      setLunchInfo({ group: null, allA: [], allB: [], first, slots, isDefault: true });
    }
    // Load any pending outgoing swap requests
    const {data:mySwaps} = await run(SB.from('bt_swap_requests').select('*').eq('from_user_id',user.id).eq('date',today).eq('status','pending').order('created_at',{ascending:false}).limit(1));
    if(mySwaps&&mySwaps.length>0) setOutgoingSwap(mySwaps[0]);
    else setOutgoingSwap(null);
    // Load pending incoming swap requests
    const {data:incoming} = await run(SB.from('bt_swap_requests').select('*').eq('to_user_id',user.id).eq('date',today).eq('status','pending').order('created_at',{ascending:false}));
    setIncomingSwaps(incoming||[]);
    setLoading(false);
    bumpSync();
  },[user.id,today,name]);

  useEffect(()=>{ load(); },[load]);

  // Real-time: break logs — re-fetches team count/logs whenever the socket (re)connects,
  // so a dropped-and-restored connection never leaves this screen showing stale state.
  useEffect(()=>{
    const ch = SB.channel('agent-rt-'+user.id)
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'bt_logs'},({new:nw})=>{
        if(nw.user_id!==user.id) setTeamCount(c=>c+1);
        else setLogs(p=>p.some(l=>l.id===nw.id)?p:[nw,...p]);
        bumpSync();
      })
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'bt_logs'},({new:nw})=>{
        if(nw.user_id!==user.id){ if(nw.end_time) setTeamCount(c=>Math.max(0,c-1)); }
        else setLogs(p=>p.map(l=>l.id===nw.id?nw:l));
        bumpSync();
      })
      .subscribe(status => { if(status === 'SUBSCRIBED') load(); });
    return()=>SB.removeChannel(ch);
  },[user.id]);

  // Real-time: lunch schedule — call load() on any change so we always get fresh data
  // (REPLICA IDENTITY may not be FULL on this table, so we don't trust the payload)
  useEffect(()=>{
    // Helper: apply fetched schedule to agent state
    const applySchedule = (ls) => {
      if(!ls){
        const first = defaultFirst(today); const slots = lunchSlots(first);
        setLunchInfo(prev => prev?.group ? prev : { group:null, allA:[], allB:[], first, slots, isDefault:true });
        return;
      }
      const grpA = ls.group_a || []; const grpB = ls.group_b || [];
      const myGrp = grpA.includes(name) ? 'A' : grpB.includes(name) ? 'B' : null;
      const first = ls.group_first || defaultFirst(today); const slots = lunchSlots(first);
      if(myGrp) setLunchInfo({group:myGrp, slot:slots[myGrp], allA:grpA, allB:grpB, first, slots});
      else setLunchInfo({group:null, allA:grpA, allB:grpB, first, slots});
    };
    const fetchAndApply = () =>
      run(SB.from('bt_lunch_schedule').select('*').eq('date',today).maybeSingle()).then(({data})=>{applySchedule(data); bumpSync();});

    const ch = SB.channel('agent-lunch-rt-'+user.id)
      .on('postgres_changes',{event:'*',schema:'public',table:'bt_lunch_schedule'},()=>{
        // Always re-fetch rather than trusting payload (REPLICA IDENTITY may not be FULL)
        fetchAndApply();
      })
      // Re-fetch on reconnect so agents who were offline catch up immediately
      .subscribe(status => { if(status === 'SUBSCRIBED') fetchAndApply(); });
    return()=>SB.removeChannel(ch);
  },[user.id,today,name]);

  // Real-time: swap requests — re-fetch on any change, fire toast for new incoming
  useEffect(()=>{
    const ch = SB.channel('agent-swaps-rt-'+user.id)
      .on('postgres_changes',{event:'*',schema:'public',table:'bt_swap_requests'},async({eventType,new:nw})=>{
        // Re-fetch pending incoming swaps
        const {data:incoming} = await run(SB.from('bt_swap_requests').select('*').eq('to_user_id',user.id).eq('date',today).eq('status','pending').order('created_at',{ascending:false}));
        setIncomingSwaps(prev => {
          const newList = incoming||[];
          // Fire toast for brand-new incoming requests
          newList.forEach(sr => { if(!prev.some(p=>p.id===sr.id)) {
            fireNotification({ title:'🔄 Lunch Swap Request', body:`${sr.from_name} wants to swap lunch groups with you.`, type:'custom', duration:15000 });
          }});
          return newList;
        });
        // Re-fetch outgoing
        const {data:mySwaps} = await run(SB.from('bt_swap_requests').select('*').eq('from_user_id',user.id).eq('date',today).eq('status','pending').order('created_at',{ascending:false}).limit(1));
        const hadOutgoing = !!outgoingSwapRef.current;
        const newOutgoing = (mySwaps&&mySwaps.length>0) ? mySwaps[0] : null;
        setOutgoingSwap(newOutgoing);
        bumpSync();
        // If our outgoing just got accepted, reload lunch info
        if(hadOutgoing && !newOutgoing && nw?.from_user_id===user.id && nw?.status==='accepted') {
          fireNotification({ title:'✅ Swap Accepted!', body:`Your lunch group has been updated.`, type:'info', duration:10000 });
          run(SB.from('bt_lunch_schedule').select('*').eq('date',today).maybeSingle()).then(({data:ls})=>{
            if(!ls) return;
            const grpA=ls.group_a||[]; const grpB=ls.group_b||[];
            const myGrp=grpA.includes(name)?'A':grpB.includes(name)?'B':null;
            const first=ls.group_first||defaultFirst(today); const slots=lunchSlots(first);
            if(myGrp) setLunchInfo({group:myGrp,slot:slots[myGrp],allA:grpA,allB:grpB,first,slots});
          });
        }
        if(hadOutgoing && !newOutgoing && nw?.from_user_id===user.id && nw?.status==='declined') {
          fireNotification({ title:'❌ Swap Declined', body:`Your swap request was declined.`, type:'warn', duration:8000 });
        }
      })
      .subscribe(status => { if(status==='SUBSCRIBED'){ /* resync happens via the effect above on mount */ } });
    return()=>SB.removeChannel(ch);
  },[user.id,today,name]);

  useEffect(()=>{
    // Poll team break count every 8s (tightened from 15s so a dropped realtime
    // socket never leaves the agent staring at a stale team-capacity number)
    const id=setInterval(async()=>{
      const {data}=await run(SB.from('bt_logs').select('id,agent_name').is('end_time',null));
      setTeamCount(slotCount(data));
      const {data:cfg}=await run(SB.from('bt_settings').select('max_concurrent_breaks').eq('id',1).maybeSingle());
      if(cfg) setMaxB(cfg.max_concurrent_breaks);
    },8000);
    // Poll lunch schedule every 20s as a safety net — catches changes that slip past
    // the realtime subscription (e.g. direct Supabase edits, brief network drops)
    const applyLunchData = (ls) => {
      if(!ls){
        const first=defaultFirst(today); const slots=lunchSlots(first);
        setLunchInfo(prev => prev?.group ? prev : { group:null, allA:[], allB:[], first, slots, isDefault:true });
        return;
      }
      const grpA=ls.group_a||[]; const grpB=ls.group_b||[];
      const myGrp=grpA.includes(name)?'A':grpB.includes(name)?'B':null;
      const first=ls.group_first||defaultFirst(today); const slots=lunchSlots(first);
      if(myGrp) setLunchInfo({group:myGrp,slot:slots[myGrp],allA:grpA,allB:grpB,first,slots});
      else setLunchInfo({group:null,allA:grpA,allB:grpB,first,slots});
    };
    const lunchPoll=setInterval(async()=>{
      const {data:ls}=await run(SB.from('bt_lunch_schedule').select('*').eq('date',today).maybeSingle());
      applyLunchData(ls);
    },20000);
    return()=>{ clearInterval(id); clearInterval(lunchPoll); };
  },[today,name]);

  useEffect(()=>{
    if(active){ const s=new Date(active.start_time).getTime(); timerRef.current=setInterval(()=>setElapsed(appNow()-s),250); }
    else{ clearInterval(timerRef.current); setElapsed(0); }
    return()=>clearInterval(timerRef.current);
  },[active]);

  const clockIn = async()=>{
    setErr('');
    const now=nowISO();
    const {data,error}=await run(SB.from('bt_clocklogs').insert({user_id:user.id,agent_name:name,clock_in:now,date:today}).select().single());
    if(error){setErr('Clock-in failed: '+error.message);return;}
    setClockRow(data);
  };
  const clockOut = async()=>{
    if(!clockRow)return; setErr('');
    const now=nowISO();
    const {data,error}=await run(SB.from('bt_clocklogs').update({clock_out:now}).eq('id',clockRow.id).select().single());
    if(error){setErr('Clock-out failed: '+error.message);return;}
    setClockRow(data);
  };
  // Ask before clocking out unless the shift has ended (clocking out can't be undone for the day)
  const askClockOut = ()=>{
    if(!clockRow) return;
    if(team.shiftEnd && hhmm(appNow())>=team.shiftEnd){ clockOut(); return; }
    setConfirmOut(true);
  };
  const startBreak = async()=>{
    setErr('');
    const {data:tc}=await run(SB.from('bt_logs').select('id,agent_name').is('end_time',null));
    // Read the cap fresh too: the slot schedule may have changed it since this screen loaded
    const {data:cfg}=await run(SB.from('bt_settings').select('max_concurrent_breaks').eq('id',1).maybeSingle());
    const cap=cfg?cfg.max_concurrent_breaks:maxB; if(cfg) setMaxB(cap);
    // Trainees have no slot limit: they skip this check, and their breaks aren't counted for others
    if(!trainee&&slotCount(tc)>=cap){setErr(`All ${cap} break slots are taken. Please wait.`);return;}
    const now=nowISO();
    const {data,error}=await run(SB.from('bt_logs').insert({user_id:user.id,agent_name:name,start_time:now}).select().single());
    if(error){setErr(error.message?.includes('break slots are taken')?error.message:'Could not start break: '+error.message);return;}
    setActive(data); setLogs(p=>[data,...p]); if(!trainee) setTeamCount(c=>c+1);
  };
  const endBreak = async()=>{
    if(!active)return; setErr('');
    const now=nowISO();
    const durSecs=Math.round((new Date(now)-new Date(active.start_time))/1000);
    const bt=bType(durSecs);
    const {error}=await run(SB.from('bt_logs').update({end_time:now,duration_secs:durSecs,break_type:bt}).eq('id',active.id));
    if(error){setErr('Could not end break: '+error.message);return;}
    setLogs(p=>p.map(l=>l.id===active.id?{...l,end_time:now,duration_secs:durSecs,break_type:bt}:l));
    setActive(null); if(!trainee) setTeamCount(c=>Math.max(0,c-1));
  };

  // Swap: send request to another agent
  const sendSwapRequest = async(targetAgent) => {
    if(!lunchInfo?.group) return;
    setSwapBusy(true);
    const targetGroup = targetAgent.group;
    const {data,error} = await createSwapRequest({
      fromUserId: user.id, fromName: name,
      toUserId: targetAgent.userId, toName: targetAgent.name,
      fromGroup: lunchInfo.group, toGroup: targetGroup, date: today,
    });
    if(error){ setErr('Could not send swap request: '+error.message); setSwapBusy(false); return; }
    setOutgoingSwap(data);
    await broadcastSwap({ action:'request', id:data.id, fromUserId:user.id, fromName:name, toUserId:targetAgent.userId, toName:targetAgent.name, fromGroup:lunchInfo.group, toGroup:targetGroup, date:today });
    setShowSwapModal(false);
    setSwapBusy(false);
    fireNotification({ title: '📤 Swap Request Sent', body: `Waiting for ${targetAgent.name} to respond.`, type: 'info', duration: 6000 });
  };

  const cancelSwapRequest = async() => {
    if(!outgoingSwap) return;
    await run(SB.from('bt_swap_requests').update({status:'cancelled'}).eq('id',outgoingSwap.id));
    setOutgoingSwap(null);
  };

  // Swap: respond to incoming request
  const respondToSwap = async(swapReq, accepted) => {
    setSwapBusy(true);
    const newStatus = accepted ? 'accepted' : 'declined';
    // 1. Update the swap request status
    await run(SB.from('bt_swap_requests').update({status:newStatus, responded_at:nowISO()}).eq('id',swapReq.id));
    setIncomingSwaps(p=>p.filter(s=>s.id!==swapReq.id));

    if(accepted) {
      // 2. Perform the actual group swap in bt_lunch_schedule
      const {data:ls} = await run(SB.from('bt_lunch_schedule').select('*').eq('date',today).maybeSingle());
      if(ls) {
        let newA = [...(ls.group_a||[])];
        let newB = [...(ls.group_b||[])];
        // Remove both from their current groups
        newA = newA.filter(n=>n!==swapReq.from_name && n!==swapReq.to_name);
        newB = newB.filter(n=>n!==swapReq.from_name && n!==swapReq.to_name);
        // Put each in the other's group
        if(swapReq.from_group==='A') { newB.push(swapReq.from_name); newA.push(swapReq.to_name); }
        else { newA.push(swapReq.from_name); newB.push(swapReq.to_name); }
        await run(SB.from('bt_lunch_schedule').update({group_a:newA,group_b:newB,updated_at:nowISO()}).eq('id',ls.id));
        // 3. Notify admin via the admin broadcast channel
        broadcastNotif({ title:`🔄 Lunch Swap Done`, body:`${swapReq.from_name} (Grp ${swapReq.from_group}) ↔ ${swapReq.to_name} (Grp ${swapReq.to_group}) · schedule updated automatically.`, type:'info' });
        // 4. Update our own lunch card immediately (the acceptor)
        const acceptorNewGroup = swapReq.from_group; // we take the requester's group
        const first = ls.group_first || defaultFirst(today);
        const slots = lunchSlots(first);
        setLunchInfo({group:acceptorNewGroup, slot:slots[acceptorNewGroup], allA:newA, allB:newB, first, slots});
      }
      // 5. Broadcast directly to the requester so they update immediately
      await broadcastSwap({ action:'accepted', id:swapReq.id, fromUserId:swapReq.from_user_id, fromName:swapReq.from_name, toUserId:user.id, toName:name });
    } else {
      // Notify requester of decline
      await broadcastSwap({ action:'declined', id:swapReq.id, fromUserId:swapReq.from_user_id, fromName:swapReq.from_name, toUserId:user.id, toName:name });
    }
    setSwapBusy(false);
  };

  const done=logs.filter(l=>l.end_time);
  const totalSec=done.reduce((s,l)=>s+(l.duration_secs||0),0);
  const predType=active?bType(Math.floor(elapsed/1000)):null;
  const atCap=!trainee&&teamCount>=maxB;
  const li=trainee?null:lunchInfo;   // trainees have no lunch group
  const isClockedIn=clockRow?.clock_in&&!clockRow?.clock_out;
  const isClockedOut=clockRow?.clock_out;
  // Other agents in the opposite group (for swap target selection)
  const otherGroupAgents = li?.group ? (
    li.group==='A'
      ? (li.allB||[]).map(n=>({name:n, group:'B', userId:null}))
      : (li.allA||[]).map(n=>({name:n, group:'A', userId:null}))
  ) : [];

  const [showAll,setShowAll]=useState(false);
  const [nowA,setNowA]=useState(appNow());
  useEffect(()=>{ const id=setInterval(()=>setNowA(appNow()),1000); return()=>clearInterval(id); },[]);
  const todaySec=logs.reduce((s,l)=>s+secOf(l,nowA),0);
  const avgMine=done.length?Math.round(totalSec/done.length):0;
  const breakDisabled=atCap||loading||!isClockedIn;
  const breakHint=!isClockedIn?(isClockedOut?'Your shift has ended for today':'Clock in first to take breaks')
    :(!trainee&&maxB<=0)?'Breaks are paused right now — check with your supervisor'
    :atCap?`All ${maxB} break slots are in use — wait for a colleague to return`:null;
  const listed=showAll?logs:logs.slice(0,5);
  const shiftSec=clockRow?.clock_in?Math.round(((clockRow.clock_out?new Date(clockRow.clock_out).getTime():nowA)-new Date(clockRow.clock_in).getTime())/1000):0;
  // Break allowance: earned by the hour (the full amount for a full shift), and every break counts. Leaving early means a smaller allowance.
  const allowSec=team.allowanceMin*60;
  const earnedSec=Math.min(allowSec,allowSec*(shiftSec/3600)/team.fullShiftH);
  const totalAllow=isClockedOut?earnedSec:allowSec;
  const leftSec=Math.round(totalAllow-todaySec);
  const overMin=leftSec<=-60?Math.floor(-leftSec/60):0;     // going over by less than a minute is not worth mentioning
  const mFmt=x=>{ const h=Math.floor(x/60), m=x%60; return h?`${h}h${m?` ${m}m`:''}`:`${m}m`; };
  const usedPct=totalAllow>0?Math.min(100,todaySec/totalAllow*100):100, earnedPct=totalAllow>0?Math.min(100,earnedSec/totalAllow*100):0;
  const pct=maxB>0?Math.min(100,teamCount/maxB*100):100;
  const elSec=Math.floor(elapsed/1000);
  const idleWord=!isClockedIn?(isClockedOut?'Shift ended':'Off shift'):breakHint?'Paused':'Ready';
  const agentNav=[{id:'home',n:'home',label:'Home'},{id:'calls',n:'phone',label:'Calls'},{id:'lunch',n:'utensils',label:'Lunch'},{id:'requests',n:'message',label:'Requests',badge:reqN}];
  const goTab=id=>{ setTab(id); setNavOpen(false); window.scrollTo({top:0}); };

  return(
    <div className="shell">
      <Sidebar items={agentNav} active={tab} onGo={goTab} open={navOpen} onClose={()=>setNavOpen(false)} role={trainee?'Agent · Trainee':'Agent'} onLogout={onLogout}/>
      <div className="main">
      <header className="top">
        <button className="icb top-menu" onClick={()=>setNavOpen(true)} aria-label="Menu"><Ic n="menu" size={20}/></button>
        <span style={{marginRight:'auto'}}/>
        <div className="top-ic">
          <ClockPill/>
          <span className="hide-s"><ConnInstrument compact/></span>
          <AvatarMenu name={name} role={trainee?'Agent · Trainee':li?.group?`Agent · Group ${li.group}`:'Agent'} onLogout={onLogout}
            extra={<MI n="refresh" onClick={load}>Refresh</MI>}/>
        </div>
      </header>

      <div className="page">
        <NotifBanner/>
        {err&&<div className="aerr"><Ic n="alert" size={15}/> {err}</div>}

        {incomingSwaps.map(sr=>(
          <div key={sr.id} className="notice hi">
            <div className="acc-ic brk"><Ic n="swap" size={17}/></div>
            <div className="notice-b">
              <div className="notice-t">{sr.from_name} wants to swap lunch groups</div>
              <div className="notice-s">You'd move to Group {sr.from_group} and {sr.from_name} to Group {sr.to_group}. Admin is notified automatically.</div>
            </div>
            <div className="notice-a">
              <button className="bs" onClick={()=>respondToSwap(sr,false)} disabled={swapBusy}>Decline</button>
              <button className="bp" onClick={()=>respondToSwap(sr,true)} disabled={swapBusy}>{swapBusy?<span className="spin-sm"/>:<Ic n="check" size={15}/>} Accept</button>
            </div>
          </div>
        ))}
        {outgoingSwap&&(
          <div className="notice">
            <div className="acc-ic"><Ic n="timer" size={17}/></div>
            <div className="notice-b">
              <div className="notice-t">Swap request sent to {outgoingSwap.to_name}</div>
              <div className="notice-s">Group {outgoingSwap.from_group} ↔ Group {outgoingSwap.to_group} · waiting for a response…</div>
            </div>
            <button className="bs" onClick={cancelSwapRequest}>Cancel request</button>
          </div>
        )}

        {tab==='home'&&(<>
        <h1 className="hello">Welcome, {firstName(name)}</h1>
        <p className="hello-s">{wall(nowA).toLocaleDateString([],{weekday:'long',month:'long',day:'numeric',timeZone:'UTC'})}{isClockedIn?` · on shift since ${hhmm(clockRow.clock_in)}`:''}</p>

        <div className="lunch-strip" id="lunch-strip">
          {(()=>{
            const mins=x=>{ const [h,m]=x.split(':').map(Number); return h*60+m; };
            const slot=trainee?{from:team.lunch,to:addMin(team.lunch,60)}:li?.group?li.slot:null;
            if(!slot) return <span className="lunch-pill"><Ic n="utensils" size={15}/> Lunch · <b>Unassigned</b></span>;
            const nowM=mins(hhmm(nowA)), a=mins(slot.from), z=mins(slot.to);
            const lm=x=>x>=60?`${Math.floor(x/60)}h ${x%60}m`:`${x}m`;
            const when=nowM<a?`starts in ${lm(a-nowM)}`:nowM<z?`now · ends in ${lm(z-nowM)}`:'finished';
            return(<>
              <span className={`lunch-pill${nowM>=a&&nowM<z?' now':''}`}><Ic n="utensils" size={15}/> Lunch · <b>{trainee?'Trainee':`Group ${li.group}`}</b> · <b>{slot.from}–{slot.to}</b> · {when}</span>
            </>);
          })()}
        </div>

        <div className="acts">
          {!clockRow&&<button className="bp" onClick={clockIn}><Ic n="login2" size={16}/> Clock in</button>}
          {isClockedIn&&<button className="bs" onClick={askClockOut}><Ic n="logoff" size={16}/> Clock out</button>}
          {li?.group&&!outgoingSwap&&isClockedIn&&<button className="bs" onClick={()=>setShowSwapModal(true)}><Ic n="swap" size={16}/> Swap lunch</button>}
          <button className="bs" onClick={load}><Ic n="refresh" size={16}/> Refresh</button>
          <div className="acts-r"><ConnInstrument/></div>
        </div>

        <div className="grid2">
          {/* Break timer — the one thing an agent needs */}
          <div className={`card timer${active?' on':''}`}>
            <div className="card-hd">
              <div className="card-t">
                {active?'On break':'Break timer'}
                {active?<span className={`badge ${BCLS[predType]||'b-on'}`}>{predType}</span>:<span className={`badge ${breakHint?'b-out':'b-in'}`}>{breakHint?'Unavailable':'Available'}</span>}
              </div>
            </div>
            <div className={`timer-big${active?'':' idle'}`}>{active?<DurAmt s={elSec}/>:idleWord}</div>
            <div className="timer-sub">{active?`Started at ${fmtT(active.start_time)} · logged automatically when you return`:breakHint||'Your break will be timed and logged automatically'}</div>
            {active&&(
              <div className="tbar">
                <div className="tbar-track">
                  <span style={{flex:13}}/><span style={{flex:37}}/><span style={{flex:10}}/>

/* ── Swap Request Modal ── */
function SwapRequestModal({myName,myGroup,otherGroup,otherSlot,mySlot,date,onSend,onClose,busy}){
  const [agents,setAgents]=useState([]);
  const [loading,setLoading]=useState(true);
  const [selected,setSelected]=useState(null);
  const [err,setErr]=useState('');

  useEffect(()=>{
    (async()=>{
      // Load agents in the other group with their user_ids from bt_clocklogs
      const {data:ls}=await run(SB.from('bt_lunch_schedule').select('*').eq('date',date).maybeSingle());
      if(!ls){setErr('No lunch schedule found for today.');setLoading(false);return;}
      const otherNames = otherGroup==='A' ? (ls.group_a||[]) : (ls.group_b||[]);
      if(otherNames.length===0){setErr(`No agents in Group ${otherGroup} to swap with.`);setLoading(false);return;}
      // Look up user_ids from bt_clocklogs
      const {data:ck}=await run(SB.from('bt_clocklogs').select('user_id,agent_name').eq('date',date).in('agent_name',otherNames));
      const seen=new Set(); const list=[];
      (ck||[]).forEach(r=>{ if(!seen.has(r.user_id)){seen.add(r.user_id);list.push({userId:r.user_id,name:r.agent_name,group:otherGroup});} });
      setAgents(list);
      if(list.length>0)setSelected(list[0].userId);
      setLoading(false);
    })();
  },[date,otherGroup]);

  const handleSend=()=>{
    const ag=agents.find(a=>a.userId===selected);
    if(ag) onSend(ag);
  };

  return(
    <div className="modal-bg" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal-box">
        <div className="modal-title"><Ic n="swap" size={18}/> Request Lunch Swap</div>
        <div className="modal-sub">
          Ask a colleague in Group {otherGroup} to swap lunch slots with you.<br/>
          <strong>Your slot:</strong> Group {myGroup} · {mySlot.from}–{mySlot.to}<br/>
          <strong>Their slot:</strong> Group {otherGroup} · {otherSlot.from}–{otherSlot.to}
        </div>
        {err&&<div className="ebox" style={{marginBottom:12}}><Ic n="alert" size={14}/>{err}</div>}
        {loading?<div style={{textAlign:'center',padding:16}}><div className="spin" style={{margin:'0 auto'}}/></div>
         :agents.length===0&&!err?<div className="ebox"><Ic n="alert" size={14}/>No agents in Group {otherGroup} are clocked in today.</div>
         :(
          <div className="fg">
            <label className="fl">Select agent to request swap ({agents.length} available)</label>
            <select className="fi" value={selected||''} onChange={e=>setSelected(e.target.value)}>
              {agents.map(a=><option key={a.userId} value={a.userId}>{a.name} (Group {a.group})</option>)}
            </select>
          </div>
        )}
        <div style={{background:'var(--card)',border:'1px solid var(--bdr)',borderRadius:8,padding:'10px 14px',fontSize:12,color:'var(--mut)',marginBottom:20,lineHeight:1.6}}>
          If they accept: the swap happens automatically and admin is notified.
        </div>
        <div className="modal-foot">
          <button className="bs" onClick={onClose}>Cancel</button>
          <button className="bp" onClick={handleSend} disabled={busy||loading||agents.length===0||!selected}>
            {busy?<span className="spin-sm"/>:<Ic n="send" size={14}/>} Send Request
          </button>
        </div>
      </div>
    </div>
  );
}
