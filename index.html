        // Auto-fill: keep agents from previous groups if they're clocked in today
        const prevA = (prev.group_a||[]).filter(n=>allClocked.includes(n));
        const prevB = (prev.group_b||[]).filter(n=>allClocked.includes(n));
        const assigned = new Set([...prevA,...prevB]);
        // Any new agent clocked in today who wasn't in yesterday's schedule → pool
        const newAgents = allClocked.filter(n=>!assigned.has(n));
        setGrpA(prevA); setGrpB(prevB);
        setPool(newAgents);
      } else {
        // No previous schedule at all — everyone goes to pool
        setGrpA([]); setGrpB([]);
        setPool(allClocked);
      }
    }
    setLoad(false);
    bumpSync();
  },[date]);

  useEffect(()=>{load();},[load]);

  // Real-time: when the schedule changes (e.g. swap auto-applied or Supabase direct edit),
  // reload — but filter to only the date being viewed so unrelated days don't trigger a refresh.
  // No polling interval here — that was causing constant re-renders every 20s.
  useEffect(()=>{
    const ch=SB.channel('admin-lunch-rt')
      .on('postgres_changes',{event:'*',schema:'public',table:'bt_lunch_schedule'},({new:nw,old:ol})=>{
        const changedDate = nw?.date || ol?.date;
        if(changedDate && changedDate !== date) return;
        load();
      })
      .subscribe(s=>{ if(s==='SUBSCRIBED') load(); });
    return()=>{ SB.removeChannel(ch); };
  },[date,load]);
  useAutoRefresh(load, null); // no polling here (breaks drag-and-drop); just refetch when tab/app regains focus

  const move=(name,from,to)=>{
    const rem=arr=>arr.filter(n=>n!==name);
    if(from==='A')setGrpA(rem);
    else if(from==='B')setGrpB(rem);
    else setPool(rem);
    if(to==='A')setGrpA(p=>[...p,name]);
    else if(to==='B')setGrpB(p=>[...p,name]);
    else setPool(p=>[...p,name]);
  };

  const save=async()=>{
    setSaving(true);setErr('');setSaved(false);
    const payload={date,group_a:grpA,group_b:grpB,group_first:first,updated_at:nowISO()};
    let error;
    if(row){
      ({error}=await run(SB.from('bt_lunch_schedule').update(payload).eq('id',row.id)));
    } else {
      const {data,error:e}=await run(SB.from('bt_lunch_schedule').insert(payload).select().single());
      error=e; if(data)setRow(data);
    }
    if(error)setErr('Save failed: '+error.message);
    else setSaved(true);
    setSaving(false);
  };

  const slots=lunchSlots(first);

  return(
    <div className="panel">
      <div className="phd">
        <div><h1 className="pt">Lunch Schedule</h1><p className="ps">Assign agents to groups · groups rotate daily</p></div>
        <div className="fc g10">
          <input className="si" type="date" value={date} onChange={e=>setDate(e.target.value)} style={{width:160}}/>
          <button className="bs" onClick={load}><Ic n="refresh" size={14}/> Reload</button>
          <button className="bp" onClick={save} disabled={saving}>{saving?<span className="spin-sm"/>:<Ic n="check" size={14}/>} Save Schedule</button>
          {saved&&<span style={{color:'var(--green)',fontSize:13,fontWeight:600}}>✓ Saved</span>}
        </div>
      </div>
      {err&&<div className="ebox"><Ic n="alert" size={14}/>{err}</div>}

      {/* First slot toggle */}
      <div className="sc" style={{marginBottom:14}}>
        <div className="sc-hd"><span className="sc-ic"><Ic n="clock" size={15}/></span><h2 className="sc-t">Rotation — who goes first today?</h2></div>
        <div style={{padding:'16px 18px',display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}>
          <button onClick={()=>setFirst('A')} style={{padding:'8px 20px',borderRadius:8,border:'1.5px solid',fontWeight:700,fontSize:13,cursor:'pointer',fontFamily:'var(--font)',background:first==='A'?'var(--amber-d)':'var(--card)',color:first==='A'?'var(--amber)':'var(--mut)',borderColor:first==='A'?'var(--amber-r)':'var(--bdr)'}}>
            Group A first — {fmtH(_lunchStart)}
          </button>
          <button onClick={()=>setFirst('B')} style={{padding:'8px 20px',borderRadius:8,border:'1.5px solid',fontWeight:700,fontSize:13,cursor:'pointer',fontFamily:'var(--font)',background:first==='B'?'var(--indigo-d)':'var(--card)',color:first==='B'?'var(--indigo)':'var(--mut)',borderColor:first==='B'?'var(--indigo-r)':'var(--bdr)'}}>
            Group B first — {fmtH(_lunchStart)}
          </button>
          <span style={{fontSize:12,color:'var(--mut)',marginLeft:8}}>Auto-rotates daily · override here if needed</span>
        </div>
      </div>

      {loading?<div className="es"><div className="spin"/></div>:(
        <>
          <div className="lunch-groups">
            {/* Group A */}
            <div className="lunch-group-card grp-a">
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
                <div className="fc g8">
                  <span className="badge b-a">Group A</span>
                  <span style={{fontSize:12,color:'var(--amber)',fontWeight:600}}>{slots.A.from} – {slots.A.to}</span>
                  {first==='A'&&<span style={{fontSize:10,background:'var(--violet)',color:'#fff',padding:'2px 7px',borderRadius:20,fontWeight:700}}>FIRST</span>}
                </div>
                <span style={{fontSize:12,color:'var(--mut)'}}>{grpA.length} agents</span>
              </div>
              {grpA.length===0&&<div style={{textAlign:'center',padding:'16px',fontSize:12,color:'var(--mut)',border:'1px dashed var(--bdr)',borderRadius:8}}>No agents assigned</div>}
              {grpA.map(n=>(
                <div key={n} className="agent-chip">
                  <div className="av">{ini(n)}</div>
                  <span style={{fontSize:13,flex:1}}>{n}</span>
                  <button className="chip-move ind" onClick={()=>move(n,'A','B')}>→ B</button>
                  <button className="chip-move" style={{marginLeft:4}} onClick={()=>move(n,'A','pool')}>Remove</button>
                </div>
              ))}
            </div>

            {/* Group B */}
            <div className="lunch-group-card grp-b">
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
                <div className="fc g8">
                  <span className="badge b-b">Group B</span>
                  <span style={{fontSize:12,color:'var(--indigo)',fontWeight:600}}>{slots.B.from} – {slots.B.to}</span>
                  {first==='B'&&<span style={{fontSize:10,background:'var(--indigo)',color:'#05060f',padding:'2px 7px',borderRadius:20,fontWeight:700}}>FIRST</span>}
                </div>
                <span style={{fontSize:12,color:'var(--mut)'}}>{grpB.length} agents</span>
              </div>
              {grpB.length===0&&<div style={{textAlign:'center',padding:'16px',fontSize:12,color:'var(--mut)',border:'1px dashed var(--bdr)',borderRadius:8}}>No agents assigned</div>}
              {grpB.map(n=>(
                <div key={n} className="agent-chip">
                  <div className="av" style={{background:'var(--indigo-d)',color:'var(--indigo)',border:'1px solid var(--indigo-r)'}}>{ini(n)}</div>
                  <span style={{fontSize:13,flex:1}}>{n}</span>
                  <button className="chip-move" onClick={()=>move(n,'B','A')}>→ A</button>
                  <button className="chip-move" style={{marginLeft:4}} onClick={()=>move(n,'B','pool')}>Remove</button>
                </div>
              ))}
            </div>
          </div>

          {/* Unassigned pool */}
          {pool.length>0&&(
            <div className="lunch-group-card unset-pool" style={{borderRadius:14,padding:16,marginBottom:14}}>
              <div style={{fontSize:12,fontWeight:700,color:'var(--mut)',marginBottom:10}}>Unassigned — clocked in today ({pool.length})</div>
              {pool.map(n=>(
                <div key={n} className="agent-chip">
                  <div className="av" style={{background:'var(--card)',color:'var(--mut)',border:'1px solid var(--bdr)'}}>{ini(n)}</div>
                  <span style={{fontSize:13,flex:1}}>{n}</span>
                  <button className="chip-move" onClick={()=>move(n,'pool','A')}>→ A</button>
                  <button className="chip-move ind" style={{marginLeft:4}} onClick={()=>move(n,'pool','B')}>→ B</button>
                </div>
              ))}
            </div>
          )}

          {pool.length===0&&grpA.length===0&&grpB.length===0&&(
            <div className="es"><span className="es-ic"><Ic n="users" size={36} sw={1.2}/></span><p>No agents clocked in for {date} yet. Once agents clock in their names will appear here.</p></div>
          )}
        </>
      )}
    </div>
  );
}

/* ── Admin Swap Requests ── */
function ASwapRequests(){
  const [swaps,setSwaps]=useState([]);
  const [loading,setLoad]=useState(true);
  const [err,setErr]=useState('');
  const [rt,setRt]=useState(false);
  const today=todayISO();

  const load=useCallback(async()=>{
    setLoad(true);setErr('');
    const {data,error}=await run(
      SB.from('bt_swap_requests').select('*').eq('date',today).order('created_at',{ascending:false})
    );
    if(error){setErr(error.message);}
    else setSwaps(data||[]);
    setLoad(false);
    bumpSync();
  },[today]);

  useEffect(()=>{
    load();
    const ch=SB.channel('admin-swaps-rt')
      .on('postgres_changes',{event:'*',schema:'public',table:'bt_swap_requests'},({eventType,new:nw,old:ol})=>{
        // Re-fetch on any change (safest approach regardless of REPLICA IDENTITY setting)
        load();
      }).subscribe(s=>{ setRt(s==='SUBSCRIBED'); if(s==='SUBSCRIBED') load(); });
    // Polling fallback every 12s
    const poll = setInterval(load, 12000);
    return()=>{ SB.removeChannel(ch); clearInterval(poll); };
  },[load]);
  useAutoRefresh(load, null); // instant refetch on regaining focus, on top of the 12s poll above

  const pending=swaps.filter(s=>s.status==='pending');
  const completed=swaps.filter(s=>s.status!=='pending'&&s.status!=='cancelled');
  const cancelled=swaps.filter(s=>s.status==='cancelled');

  const statusEl=(s)=>{
    if(s==='pending')return <span className="swap-status-pending">⏳ Pending</span>;
    if(s==='accepted')return <span className="swap-status-accepted">✅ Accepted</span>;
    if(s==='declined')return <span className="swap-status-declined">❌ Declined</span>;
    if(s==='cancelled')return <span style={{color:'var(--mut)'}}>Cancelled</span>;
    return <span>{s}</span>;
  };

  return(
    <div className="panel">
      <div className="phd">
        <div><h1 className="pt">Lunch Swap Requests</h1><p className="ps">Today's swap activity · auto-updates</p></div>
        <div className="fc g10">
          <ConnInstrument/>
          <button className="bs" onClick={load}><Ic n="refresh" size={14}/> Refresh</button>
        </div>
      </div>
      {err&&<div className="ebox"><Ic n="alert" size={14}/>{err}</div>}
      <div className="sg3" style={{marginBottom:20}}>
        <SC n="timer"    label="Pending"   val={pending.length}   wn={pending.length>0}/>
        <SC n="check"    label="Accepted"  val={completed.filter(s=>s.status==='accepted').length} ac={completed.filter(s=>s.status==='accepted').length>0}/>
        <SC n="activity" label="Declined"  val={completed.filter(s=>s.status==='declined').length}/>
      </div>
      {loading?<div className="es"><div className="spin"/></div>:swaps.length===0?(
        <div className="es"><span className="es-ic"><Ic n="swap" size={36} sw={1.2}/></span><p>No swap requests today</p></div>
      ):(
        <div className="sc">
          <div className="sc-hd"><span className="sc-ic"><Ic n="swap" size={15}/></span><h2 className="sc-t">All Swap Requests — Today</h2></div>
          <div className="tbl-wrap"><table className="dt">
            <thead><tr><th>From</th><th>To</th><th>Swap</th><th>Status</th><th>Time</th></tr></thead>
            <tbody>
              {swaps.map(s=>(
                <tr key={s.id}>
                  <td><AvC name={s.from_name}/></td>
                  <td><AvC name={s.to_name}/></td>
                  <td>
                    <span className="badge b-a">Grp {s.from_group}</span>
                    <span style={{color:'var(--mut)',margin:'0 6px'}}>↔</span>
                    <span className="badge b-b">Grp {s.to_group}</span>
                  </td>
                  <td>{statusEl(s.status)}</td>
                  <td style={{color:'var(--mut)',fontSize:12}}>{fmtT(s.created_at)}</td>
                </tr>
              ))}
            </tbody>
          </table></div>
        </div>
      )}
      {pending.length>0&&(
        <div className="awrn" style={{marginTop:16}}>
          <Ic n="alert" size={15}/> {pending.length} swap request{pending.length>1?'s are':' is'} waiting for a response. No action needed — swaps are automatic when accepted.
        </div>
      )}
    </div>
  );
}

/* ── Admin Analytics ── */
function AAnalytics(){
  const [agents,setAgents]=useState([]);
  const [summary,setSummary]=useState({count:0,total:0,avg:0,lunch:0,brk:0,bath:0});
  const [loading,setLoad]=useState(true);
  const [err,setErr]=useState('');
  const today=todayISO();
  const load=useCallback(async()=>{
    setLoad(true);setErr('');
    const {data,error}=await run(SB.from('bt_logs').select('agent_name,start_time,duration_secs,break_type').gte('start_time',today+'T00:00:00.000Z').not('duration_secs','is',null).order('start_time',{ascending:false}));
    if(error){setErr(error.message);setLoad(false);return;}
    const rows=data||[];
    const total=rows.reduce((s,l)=>s+(l.duration_secs||0),0);
    const avg=rows.length?Math.round(total/rows.length):0;
    const lunch=rows.filter(l=>l.break_type==='Lunch Break').length;
    const brk=rows.filter(l=>l.break_type==='Break').length;
    const bath=rows.filter(l=>l.break_type==='Bathroom Break').length;
    setSummary({count:rows.length,total,avg,lunch,brk,bath});
    const byAg={};
    rows.forEach(l=>{
      if(!byAg[l.agent_name])byAg[l.agent_name]={count:0,total:0,lunch:0,brk:0,bath:0};
      byAg[l.agent_name].count++; byAg[l.agent_name].total+=l.duration_secs||0;
      if(l.break_type==='Lunch Break')byAg[l.agent_name].lunch++;
      else if(l.break_type==='Break')byAg[l.agent_name].brk++;
      else if(l.break_type==='Bathroom Break')byAg[l.agent_name].bath++;
    });
    setAgents(Object.entries(byAg).map(([n,v])=>({name:n,...v,avg:Math.round(v.total/v.count)})).sort((a,b)=>b.total-a.total));
    setLoad(false);
    bumpSync();
  },[today]);
  useEffect(()=>{load();},[load]);
  useAutoRefresh(load, 8000); // no realtime channel on this screen, so poll + refetch-on-focus keeps it current
  return(
    <div className="panel">
      <div className="phd">
        <div><h1 className="pt">Analytics</h1><p className="ps">Today · {fmtD(today+'T12:00:00')}</p></div>
        <div className="fc g10"><ConnInstrument/><button className="bs" onClick={load}><Ic n="refresh" size={14}/> Refresh</button></div>
      </div>
      {err&&<div className="ebox"><Ic n="alert" size={14}/>{err}</div>}
      {loading?<div className="es"><div className="spin"/></div>:(
        <>
          <div className="sg4" style={{marginBottom:16}}>
            <SC n="activity" label="Total Breaks Today" val={summary.count}/>
            <SC n="clock"    label="Total Break Time"   val={durStr(summary.total)}/>
            <SC n="trending" label="Avg per Break"      val={durStr(summary.avg)}/>
            <SC n="users"    label="Agents on Breaks"   val={agents.length}/>
          </div>
          <div className="sg3" style={{marginBottom:20}}>
            <SC n="utensils" label="Lunch Breaks"    val={summary.lunch} ac={summary.lunch>0}/>
            <SC n="coffee"   label="Breaks"          val={summary.brk}/>
            <SC n="activity" label="Bathroom Breaks" val={summary.bath}/>
          </div>
          <div className="sc">
            <div className="sc-hd"><span className="sc-ic"><Ic n="users" size={15}/></span><h2 className="sc-t">Per Agent — Today</h2></div>
            {agents.length===0?<div className="es"><span className="es-ic"><Ic n="trending" size={36} sw={1.2}/></span><p>No completed breaks yet today</p></div>:(
              <div className="tbl-wrap"><table className="dt">
                <thead><tr><th>Agent</th><th>Breaks</th><th>Total Time</th><th>Avg</th><th>Lunch</th><th>Break</th><th>Bathroom</th></tr></thead>
                <tbody>{agents.map(a=><tr key={a.name}><td><AvC name={a.name}/></td><td>{a.count}</td><td style={{fontWeight:600,color:'var(--amber)'}}>{durStr(a.total)}</td><td>{durStr(a.avg)}</td><td>{a.lunch||'—'}</td><td>{a.brk||'—'}</td><td>{a.bath||'—'}</td></tr>)}</tbody>
              </table></div>
            )}
          </div>
        </>
      )}
    </div>
  );
}

/* ── Admin All Logs ── */
function ALogs(){
  const [logs,setLogs]=useState([]);
  const [filter,setFilter]=useState('');
  const [date,setDate]=useState('');
  const [loading,setLoad]=useState(true);
  const [err,setErr]=useState('');
  const [editing,setEditing]=useState(null);
  const [saving,setSaving]=useState(null);

  const load=useCallback(()=>{ run(SB.from('bt_logs').select('*').order('start_time',{ascending:false}).limit(500)).then(({data,error})=>{ if(error)setErr(error.message); setLogs(data||[]); setLoad(false); bumpSync(); }); },[]);
  useEffect(()=>{load();},[load]);
  useAutoRefresh(load, 8000); // no realtime channel on this screen, so poll + refetch-on-focus keeps it current

  const saveType=async(logId,newType)=>{
    setSaving(logId);
    const {error}=await run(SB.from('bt_logs').update({break_type:newType}).eq('id',logId));
    if(error)setErr('Save failed: '+error.message);
    else setLogs(p=>p.map(l=>l.id===logId?{...l,break_type:newType}:l));
    setSaving(null); setEditing(null);
  };

  const filtered=logs.filter(l=>{ const nm=!filter||l.agent_name.toLowerCase().includes(filter.toLowerCase()); const dt=!date||l.start_time.startsWith(date); return nm&&dt; });
  return(
    <div className="panel">
      <div className="phd">
        <div><h1 className="pt">All Break Logs</h1><p className="ps">{logs.length} total records</p></div>
        <div className="phr">
          <input className="si" placeholder="Filter by agent…" value={filter} onChange={e=>setFilter(e.target.value)}/>
          <input className="si" type="date" value={date} onChange={e=>setDate(e.target.value)} style={{width:150}}/>
          <button className="bs" onClick={load}><Ic n="refresh" size={14}/> Refresh</button>
          <button className="bs" onClick={()=>csvExport(filtered)}><Ic n="download" size={14}/> Export CSV</button>
        </div>
      </div>
      {err&&<div className="ebox"><Ic n="alert" size={14}/>{err}</div>}
      {loading?<div className="es"><div className="spin"/></div>
        :filtered.length===0?<div className="es"><span className="es-ic"><Ic n="clock" size={36} sw={1.2}/></span><p>No records found</p></div>
        :(
          <div className="sc">
            <div className="tbl-wrap"><table className="dt">
              <thead><tr><th>Agent</th><th>Date</th><th>Start</th><th>Return</th><th>Duration</th><th>Type</th><th></th></tr></thead>
              <tbody>
                {filtered.map(l=>(
                  <tr key={l.id}>
                    <td><AvC name={l.agent_name}/></td>
                    <td style={{color:'var(--mut)',fontSize:12}}>{fmtD(l.start_time)}</td>
                    <td>{fmtT(l.start_time)}</td>
                    <td>{l.end_time?fmtT(l.end_time):<span className="badge b-on">On Break</span>}</td>
                    <td>{l.duration_secs!=null?durStr(l.duration_secs):l.end_time?'—':<LSec start={l.start_time}/>}</td>
                    <td>
                      {editing===l.id?(
                        <div className="fc g6">
                          <select className="type-sel" defaultValue={l.break_type||''} onChange={e=>saveType(l.id,e.target.value)} disabled={saving===l.id}>
                            <option value="" disabled>Select…</option>
                            {BREAK_TYPES.map(t=><option key={t} value={t}>{t}</option>)}
                          </select>
                          {saving===l.id&&<span className="spin-sm"/>}
                        </div>
                      ):(l.break_type?<BB type={l.break_type}/>:l.end_time?<span style={{color:'var(--mut)',fontSize:12}}>No label</span>:<LType start={l.start_time}/>)}
                    </td>
                    <td>
                      {l.end_time&&(editing===l.id
                        ?<button className="btn-edit" onClick={()=>setEditing(null)}>✕</button>
                        :<button className="btn-edit" onClick={()=>setEditing(l.id)}><Ic n="edit" size={12}/> Edit</button>
                      )}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table></div>
          </div>
        )
      }
    </div>
  );
}

/* ── Admin Notifications ── */
const PRESETS = [
  { key:'lunch_a',  icon:'utensils', iconCls:'lunch',  title:'Lunch — Group A',   body:"Group A: your lunch break starts now. Please wrap up your call and do not take anymore calls.",   recipientHint:'group_a' },
  { key:'lunch_b',  icon:'utensils', iconCls:'break',  title:'Lunch — Group B',   body:"Group B: your lunch break starts now. Please wrap up your call and do not take anymore calls",   recipientHint:'group_b' },
  { key:'break',    icon:'coffee',   iconCls:'break',  title:'Take Your Break',    body:"It's time to take your 15-minute break. Please log it in BreakTrack.",  recipientHint:'all' },
  { key:'clockin',  icon:'login2',   iconCls:'info',   title:'Clock In Reminder', body:"Your shift is starting. Please clock in via BreakTrack now.",            recipientHint:'all' },
  { key:'return',   icon:'zap',      iconCls:'warn',   title:'Break Time',        body:"It's time for you to go on a break 😊",              recipientHint:'all' },
  { key:'meeting',  icon:'users',    iconCls:'custom', title:'Team Meeting',       body:"There is a team meeting starting shortly. Please wrap up and join teams meeting.",     recipientHint:'all' },
];

// recipientMode: 'all' | 'group_a' | 'group_b' | 'custom'
function ANotifications(){
  const [agents,        setAgents]        = useState([]);   // [{user_id, agent_name}]
  const [lunchGroups,   setLunchGroups]   = useState({ a:[], b:[] }); // names per group today
  const [recipientMode, setRecipientMode] = useState('all');
  const [customPicks,   setCustomPicks]   = useState(new Set()); // user_ids for 'custom' mode
  const [msgTab,        setMsgTab]        = useState('presets');
  const [customTitle,   setCustomTitle]   = useState('');
  const [customBody,    setCustomBody]    = useState('');
  const [alertMins,     setAlertMins]     = useState(5);
  const [sentLog,       setSentLog]       = useState([]);
  const [loading,       setLoading]       = useState(true);
  const [sending,       setSending]       = useState(false);
  const [err,           setErr]           = useState('');

  useEffect(() => {
    (async () => {
      const today = todayISO();
      // All known agents
      const { data: cl } = await run(SB.from('bt_clocklogs').select('user_id,agent_name').order('clock_in',{ascending:false}).limit(500));
      const seen = new Set(); const unique = [];
      (cl||[]).forEach(r => { if(!seen.has(r.user_id)){seen.add(r.user_id);unique.push(r);} });
      setAgents(unique);
      // Today's lunch groups
      const { data: ls } = await run(SB.from('bt_lunch_schedule').select('group_a,group_b').eq('date',today).maybeSingle());
      if (ls) setLunchGroups({ a: ls.group_a||[], b: ls.group_b||[] });
      setLoading(false);
    })();
  }, []);

  const toggleCustom = (uid) => setCustomPicks(s => { const n=new Set(s); n.has(uid)?n.delete(uid):n.add(uid); return n; });

  // Resolve who actually gets the notification given current recipientMode
  const resolveTargets = (overrideMode) => {
    const mode = overrideMode || recipientMode;
    if (mode === 'all')     return { lunchGroup: null, userIds: null, label: 'All agents' };
    if (mode === 'group_a') return { lunchGroup: 'A',  userIds: null, label: 'Group A' };
    if (mode === 'group_b') return { lunchGroup: 'B',  userIds: null, label: 'Group B' };
    // custom: specific user_ids
    const ids = [...customPicks];
    const names = ids.map(uid => agents.find(a=>a.user_id===uid)?.agent_name||'?').join(', ');
    return { lunchGroup: null, userIds: ids, label: names || 'No one selected' };
  };

  const doSend = async (title, body, type='custom', overrideMode=null) => {
    if (!title.trim()) return;
    const { lunchGroup, userIds, label } = resolveTargets(overrideMode);
    if (recipientMode==='custom' && !overrideMode && customPicks.size===0) { setErr('Select at least one agent in Custom mode.'); return; }
    setSending(true); setErr('');
    try {
      if (userIds) {
        for (const uid of userIds) await broadcastNotif({ title, body, type, targetUserId: uid, lunchGroup });
      } else {
        await broadcastNotif({ title, body, type, targetUserId: null, lunchGroup });
      }
      setSentLog(p => [{ id:appNow(), title, body, type, to:label, time:appNow() }, ...p].slice(0,30));
      if (msgTab==='custom') { setCustomTitle(''); setCustomBody(''); }
    } catch(e) { setErr('Broadcast failed: '+e.message); }
    setSending(false);
  };

  const [autoEnabled, setAutoEnabled] = useState(true);

  const modeOpts = [
    { value:'all',     label:'All Agents' },
    { value:'group_a', label:'Group A'    },
    { value:'group_b', label:'Group B'    },
    { value:'custom',  label:'Custom…'   },
  ];

  const { label: recipientLabel } = resolveTargets();

  return (
    <div className="panel">
      <div className="phd">
        <div><h1 className="pt">Notifications</h1><p className="ps">Send real-time alerts — sound · toast · OS desktop notification</p></div>
      </div>
      {err&&<div className="ebox"><Ic n="alert" size={14}/>{err}</div>}

      {loading ? <div className="es"><div className="spin"/></div> : (
        <div style={{display:'grid',gridTemplateColumns:'1fr 300px',gap:20,alignItems:'start'}}>

          {/* ══ LEFT COLUMN ══ */}
          <div style={{display:'flex',flexDirection:'column',gap:20}}>

            {/* ── AUTOMATED LUNCH ALERTS ── */}
            <div style={{background:'var(--surf)',border:'1px solid var(--bdr)',borderRadius:14,padding:'18px 20px'}}>
              <div style={{display:'flex',alignItems:'center',gap:12}}>
                <div className="toast-ic lunch" style={{width:32,height:32,borderRadius:9,flexShrink:0}}><Ic n="utensils" size={14} sw={2}/></div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:14,fontWeight:700}}>Automated Lunch Alerts</div>
                  <div style={{fontSize:12,color:'var(--mut)',marginTop:1}}>Fires before each group's slot — only that group is notified</div>
                </div>
                {/* Toggle switch */}
                <button onClick={()=>setAutoEnabled(v=>!v)} style={{
                  width:44,height:24,borderRadius:12,border:'none',cursor:'pointer',flexShrink:0,
                  background:autoEnabled?'var(--violet)':'rgba(186,214,247,.12)',
                  position:'relative',transition:'background .2s',padding:0,
                }}>
                  <span style={{
                    position:'absolute',top:3,left:autoEnabled?22:3,width:18,height:18,
                    borderRadius:'50%',background:'#fff',transition:'left .2s',display:'block',
                  }}/>
                </button>
                <span style={{fontSize:12,fontWeight:700,color:autoEnabled?'var(--amber)':'var(--mut)',minWidth:32}}>{autoEnabled?'On':'Off'}</span>
              </div>
              {autoEnabled && (
                <div style={{display:'flex',alignItems:'center',gap:10,marginTop:14,paddingTop:14,borderTop:'1px solid var(--bdr)',flexWrap:'wrap'}}>
                  <span style={{fontSize:13,color:'var(--mut)'}}>Alert</span>
                  <button className="nb" style={{width:26,height:26,fontSize:15}} onClick={()=>setAlertMins(n=>Math.max(1,n-1))}>−</button>
                  <span style={{fontSize:20,fontWeight:800,color:'var(--amber)',minWidth:28,textAlign:'center',fontFamily:'var(--font-mono)'}}>{alertMins}</span>
                  <button className="nb" style={{width:26,height:26,fontSize:15}} onClick={()=>setAlertMins(n=>Math.min(30,n+1))}>+</button>
                  <span style={{fontSize:13,color:'var(--mut)'}}>minutes before lunch</span>
                  <span style={{fontSize:11,color:'var(--mut)'}}>· requires a schedule saved for today</span>
                </div>
              )}
            </div>

            {/* ── RECIPIENTS ── */}
            <div style={{background:'var(--surf)',border:'1px solid var(--bdr)',borderRadius:14,padding:'18px 20px'}}>
              <div style={{fontSize:11,fontWeight:700,color:'var(--mut)',letterSpacing:.5,textTransform:'uppercase',marginBottom:12}}>Recipients</div>
              <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center'}}>
                {modeOpts.map(o => (
                  <button key={o.value} onClick={()=>setRecipientMode(o.value)}
                    style={{padding:'7px 16px',borderRadius:8,border:'1.5px solid',fontWeight:700,fontSize:13,cursor:'pointer',fontFamily:'var(--font)',
                      background: recipientMode===o.value ? (o.value==='group_b'?'var(--indigo-d)':'var(--amber-d)') : 'var(--card)',
                      color:      recipientMode===o.value ? (o.value==='group_b'?'var(--indigo)':'var(--amber)') : 'var(--mut)',
                      borderColor:recipientMode===o.value ? (o.value==='group_b'?'var(--indigo-r)':'var(--amber-r)') : 'var(--bdr)',
                    }}>
                    {o.label}
                    {o.value==='group_a'&&lunchGroups.a.length>0&&<span style={{fontSize:10,opacity:.7,marginLeft:5}}>({lunchGroups.a.length})</span>}
                    {o.value==='group_b'&&lunchGroups.b.length>0&&<span style={{fontSize:10,opacity:.7,marginLeft:5}}>({lunchGroups.b.length})</span>}
                  </button>
                ))}
              </div>

              {recipientMode==='custom' && (
                <div style={{marginTop:14,paddingTop:14,borderTop:'1px solid var(--bdr)'}}>
                  <div style={{fontSize:11,fontWeight:700,color:'var(--mut)',letterSpacing:.5,textTransform:'uppercase',marginBottom:8,display:'flex',alignItems:'center',gap:8}}>
                    Select agents
                    {customPicks.size>0&&<button style={{background:'none',border:'none',color:'var(--amber)',cursor:'pointer',fontSize:11,fontWeight:700}} onClick={()=>setCustomPicks(new Set())}>Clear all</button>}
                  </div>
                  <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(180px,1fr))',gap:6,maxHeight:200,overflowY:'auto'}}>
                    {agents.length===0&&<div style={{fontSize:12,color:'var(--mut)',gridColumn:'1/-1'}}>No agents found yet.</div>}
                    {agents.map(a=>{
                      const on=customPicks.has(a.user_id);
                      const grp=lunchGroups.a.includes(a.agent_name)?'A':lunchGroups.b.includes(a.agent_name)?'B':null;
                      return(
                        <div key={a.user_id} onClick={()=>toggleCustom(a.user_id)} style={{
                          display:'flex',alignItems:'center',gap:8,padding:'7px 10px',borderRadius:8,cursor:'pointer',
                          background:on?'var(--amber-d)':'var(--card)',border:'1px solid',borderColor:on?'var(--amber-r)':'var(--bdr)',transition:'all .12s',
                        }}>
                          <input type="checkbox" readOnly checked={on} style={{accentColor:'var(--amber)',width:13,height:13,pointerEvents:'none',flexShrink:0}}/>
                          <div className="av" style={{width:22,height:22,fontSize:9,flexShrink:0}}>{ini(a.agent_name)}</div>
                          <span style={{fontSize:12,fontWeight:500,flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{a.agent_name}</span>
                          {grp&&<span className={`badge ${grp==='A'?'b-a':'b-b'}`} style={{fontSize:9,padding:'1px 6px'}}>{grp}</span>}
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}
            </div>

            {/* ── MESSAGE ── */}
            <div style={{background:'var(--surf)',border:'1px solid var(--bdr)',borderRadius:14,padding:'18px 20px'}}>
              <div style={{fontSize:11,fontWeight:700,color:'var(--mut)',letterSpacing:.5,textTransform:'uppercase',marginBottom:12}}>Message</div>
              <div style={{display:'flex',gap:8,marginBottom:16}}>
                <button onClick={()=>setMsgTab('presets')} className={msgTab==='presets'?'bp':'bs'} style={{fontSize:12,padding:'7px 16px'}}>Quick Presets</button>
                <button onClick={()=>setMsgTab('custom')}  className={msgTab==='custom'?'bp':'bs'}  style={{fontSize:12,padding:'7px 16px'}}>Custom Message</button>
              </div>

              {msgTab==='presets' && (
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
                  {PRESETS.map(p=>(
                    <button key={p.key} className="notif-preset" disabled={sending}
                      onClick={()=>doSend(p.title,p.body,p.iconCls,p.recipientHint!=='all'?p.recipientHint:null)}>
                      <div style={{display:'flex',alignItems:'center',gap:9,marginBottom:6}}>
                        <div className={`toast-ic ${p.iconCls}`} style={{width:28,height:28,borderRadius:7,flexShrink:0}}><Ic n={p.icon} size={13} sw={2}/></div>
                        <span className="notif-preset-title">{p.title}</span>
                      </div>
                      <div className="notif-preset-sub">{p.body}</div>
                      <div style={{marginTop:7,fontSize:10,color:'var(--mut)',fontWeight:600}}>
                        → {p.recipientHint==='group_a'?'Group A only':p.recipientHint==='group_b'?'Group B only':'selected recipients'}
                      </div>
                    </button>
                  ))}
                </div>
              )}

              {msgTab==='custom' && (
                <div style={{display:'flex',flexDirection:'column',gap:12}}>
                  <div className="fg" style={{marginBottom:0}}>
                    <label className="fl">Title</label>
                    <input className="fi" placeholder="e.g. System Update" value={customTitle} onChange={e=>setCustomTitle(e.target.value)} maxLength={80}/>
                  </div>
                  <div className="fg" style={{marginBottom:0}}>
                    <label className="fl">Message</label>
                    <textarea className="fi" rows={4} placeholder="Write your message here…" value={customBody} onChange={e=>setCustomBody(e.target.value)} maxLength={300} style={{resize:'vertical',minHeight:90}}/>
                  </div>
                  <div style={{display:'flex',alignItems:'center',gap:12}}>
                    <button className="bp" onClick={()=>doSend(customTitle,customBody,'custom')} disabled={sending||!customTitle.trim()}>
                      {sending?<span className="spin-sm"/>:<Ic n="send" size={14}/>} Send to {recipientLabel}
                    </button>
                    {sending&&<span style={{fontSize:12,color:'var(--mut)'}}>Sending…</span>}
                  </div>
                </div>
              )}
            </div>
          </div>

          {/* ══ RIGHT COLUMN — Sent Log ══ */}
          <div className="sc" style={{position:'sticky',top:16}}>
            <div className="sc-hd">
              <span className="sc-ic"><Ic n="bell" size={15}/></span>
              <h2 className="sc-t">Sent This Session</h2>
              <span style={{marginLeft:'auto',fontSize:10,color:'var(--mut)'}}>clears on refresh</span>
            </div>
            {sentLog.length===0
              ?<div className="es" style={{padding:'32px 20px'}}>
                  <span className="es-ic"><Ic n="bell" size={32} sw={1.2}/></span>
                  <p>Nothing sent yet</p>
                </div>
              :<div style={{padding:'10px 14px'}} className="notif-history">
                {sentLog.map(h=>(
                  <div key={h.id} className="notif-hist-item">
                    <div className={`notif-hist-ic toast-ic ${h.type}`} style={{width:26,height:26,borderRadius:7,flexShrink:0}}><Ic n="bell" size={11} sw={2}/></div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:12,fontWeight:700,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{h.title}</div>
                      <div style={{fontSize:11,color:'var(--mut)',marginTop:1,lineHeight:1.4,overflow:'hidden',display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical'}}>{h.body}</div>
                      <div style={{fontSize:10,color:'var(--mut)',marginTop:4}}>→ {h.to} · {wallHM(h.time)}</div>
                    </div>
                  </div>
                ))}
              </div>
            }
          </div>

        </div>
      )}
    </div>
  );
}

/* ── Admin Settings ── */
/* ── Scheduled break slots ────────────────────────────────────
   The schedule is stored in bt_settings.slot_schedule and applied by the
   database itself (pg_cron runs bt_apply_slot_schedule every minute), so
   slots change on time even when nobody has the app open. Each entry fires
   once, so a manual change on Home stays until the next scheduled time. */
const SLOT_SETUP_SQL = `-- Scheduled break slots: one-time setup. Run in the Supabase SQL Editor.
-- Safe to run again. Re-run it whenever the app tells you the setup is out of date.
-- For the every-minute background job, turn on pg_cron first (Database > Extensions).
-- Without pg_cron the schedule still applies while anyone has the app open.

alter table bt_settings add column if not exists lunch_start int default 12;
alter table bt_settings add column if not exists slot_schedule jsonb default '[]'::jsonb;
alter table bt_settings add column if not exists slot_tz text;
alter table bt_settings add column if not exists slot_applied text;

-- Sets max_concurrent_breaks from the latest schedule entry that has started today.
-- Each entry fires once, so manual changes from the app stay until the next entry.
create or replace function bt_slot_apply(at_ts timestamptz default now()) returns jsonb
language plpgsql security definer set search_path = public as $$
declare
  s        bt_settings%rowtype;
  tz       text;
  loc      timestamp;
  today    date;
  hm       text;
  r        jsonb;
  lsj      jsonb;
  lh       int;
  first    text;
  a_size   int := 0;
  b_size   int := 0;
  best_t   text;
  best_n   int;
  ev_t     text;
  ev_n     int;
  k        text;
  changed  boolean := false;
  lunch_err text;
begin
  select * into s from bt_settings where id = 1;
  if not found then
    return jsonb_build_object('v', 4, 'ok', false, 'reason', 'bt_settings has no row with id 1');
  end if;
  if s.slot_schedule is null or jsonb_array_length(s.slot_schedule) = 0 then
    return jsonb_build_object('v', 4, 'ok', true, 'reason', 'No schedule saved yet');
  end if;
  tz    := coalesce(nullif(s.slot_tz, ''), 'UTC');
  loc   := at_ts at time zone tz;
  today := loc::date;
  hm    := to_char(loc, 'HH24:MI');
  lh    := coalesce(s.lunch_start, 12);

  -- Read today's lunch groups as JSON so a different column layout can't break the schedule.
  -- If anything about the lunch table is unexpected, skip only the lunch rules and say why.
  begin
    select to_jsonb(l) into lsj from bt_lunch_schedule l where l.date::text = today::text limit 1;
    if lsj is not null then
      if jsonb_typeof(lsj->'group_a') = 'array' then a_size := jsonb_array_length(lsj->'group_a'); end if;
      if jsonb_typeof(lsj->'group_b') = 'array' then b_size := jsonb_array_length(lsj->'group_b'); end if;
      first := coalesce(nullif(lsj->>'group_first', ''),
                        case when extract(day from today)::int % 2 = 0 then 'A' else 'B' end);
    end if;
  exception when others then
    lunch_err := sqlerrm; first := null;
  end;

  for r in select * from jsonb_array_elements(s.slot_schedule) loop
    for ev_t, ev_n in
      select t, n from (
        -- fixed time: {"time":"09:00","slots":4}
        select r->>'time' as t, (r->>'slots')::int as n where r ? 'time'
        -- lunch: {"lunch":true,"extra":1,"after":3}; group times come from lunch_start
        union all select lpad(lh::text, 2, '0') || ':00',
               (case when first = 'A' then a_size else b_size end) + coalesce((r->>'extra')::int, 0)
          where r ? 'lunch' and first is not null
        union all select lpad((lh + 1)::text, 2, '0') || ':00',
               (case when first = 'A' then b_size else a_size end) + coalesce((r->>'extra')::int, 0)
          where r ? 'lunch' and first is not null
        union all select lpad((lh + 2)::text, 2, '0') || ':00', (r->>'after')::int
          where r ? 'lunch' and r->>'after' is not null
      ) e
    loop
      if ev_t <= hm and (best_t is null or ev_t >= best_t) then
        best_t := ev_t; best_n := ev_n;
      end if;
    end loop;
  end loop;

  if best_t is null then
    return jsonb_build_object('v', 4, 'ok', true, 'reason', 'No scheduled time has started yet today', 'now', hm, 'tz', tz, 'lunch_error', lunch_err);
  end if;
  k := today::text || ' ' || best_t;
  if k is distinct from s.slot_applied then
    update bt_settings
       set max_concurrent_breaks = greatest(0, best_n), slot_applied = k, updated_at = now()
     where id = 1;
    changed := true;
  end if;
  return jsonb_build_object('v', 4, 'ok', true, 'lunch_error', lunch_err, 'changed', changed, 'slots', greatest(0, best_n),
                            'rule', best_t, 'now', hm, 'tz', tz);
end $$;

-- Called by the app (every 30s from any open screen, and by the Check now button).
-- It only applies what the admin saved, so it is safe for any signed-in user to call.
create or replace function bt_slot_sync() returns jsonb
language plpgsql security definer set search_path = public as $$
declare
  res      jsonb;
  cron_on  boolean := false;
  last_run text;
begin
  res := bt_slot_apply();
  begin
    execute $q$select exists(select 1 from cron.job where jobname = 'bt-slot-schedule')$q$ into cron_on;
  exception when others then cron_on := false;
  end;
  begin
    execute $q$select d.status || coalesce(' - ' || d.return_message, '')
               from cron.job_run_details d join cron.job j using (jobid)
               where j.jobname = 'bt-slot-schedule' order by d.start_time desc limit 1$q$ into last_run;
  exception when others then last_run := null;
  end;
  -- server_ms: the server's real time, so the app doesn't depend on each PC's clock
  return res || jsonb_build_object('cron', cron_on, 'cron_last_run', last_run,
                                   'server_ms', (extract(epoch from clock_timestamp()) * 1000)::bigint);
end $$;

revoke all on function bt_slot_apply(timestamptz) from public, anon, authenticated;
revoke all on function bt_slot_sync() from public, anon;
grant execute on function bt_slot_sync() to authenticated;

-- Background job: every minute, even when nobody has the app open.
do $$
begin
  perform cron.unschedule('bt-slot-schedule') where exists (select 1 from cron.job where jobname = 'bt-slot-schedule');
  perform cron.schedule('bt-slot-schedule', '* * * * *', 'select bt_slot_apply()');
exception when others then
  raise notice 'pg_cron is not enabled, so the background job was skipped: %', sqlerrm;
end $$;
`;
function Stepper({value,onChange,min=0,max=50}){
  return(
    <div style={{display:'flex',alignItems:'center',gap:8}}>
      <button className="nb" style={{width:32,height:32,fontSize:17}} onClick={()=>onChange(Math.max(min,value-1))}>−</button>
      <span style={{minWidth:28,textAlign:'center',fontSize:18,fontVariantNumeric:'tabular-nums'}}>{value}</span>
      <button className="nb" style={{width:32,height:32,fontSize:17}} onClick={()=>onChange(Math.min(max,value+1))}>+</button>
    </div>
  );
}
/* The schedule runs on a fixed UTC offset the admin picks, so it matches the clock they actually work by. */
const offToTz = o => o===0 ? 'UTC' : `Etc/GMT${o>0?'-':'+'}${Math.abs(o)}`;
const tzToOff = tz => { if(tz==='UTC') return 0; const m=/^Etc\/GMT([+-])(\d{1,2})$/.exec(tz||''); return m ? (m[1]==='-'?1:-1)*parseInt(m[2]) : null; };
const clockAt = off => { const d=new Date(appNow()+off*3600000); return `${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}`; };
function ASlotSchedule(){
  const [rules,setRules]=useState([]);                                  // [{time:'09:00',slots:4}]
  const [lunch,setLunch]=useState({on:false,extra:0,afterOn:false,after:3});
  const [lunchH,setLunchH]=useState(_lunchStart);
  const [off,setOff]=useState(()=>Math.round(-new Date().getTimezoneOffset()/60));
  const [,tick]=useState(0);
  const [needSetup,setNeedSetup]=useState(false);
  const [busy,setBusy]=useState(false);
  const [ok,setOk]=useState(false);
  const [copied,setCopied]=useState(false);
  const [status,setStatus]=useState(null);   // {text, warn}
  const [needFn,setNeedFn]=useState(false);
  const [checking,setChecking]=useState(false);
  const [err,setErr]=useState('');
  useEffect(()=>{ const id=setInterval(()=>tick(n=>n+1),15000); return()=>clearInterval(id); },[]);
  const checkNow=async()=>{
    setChecking(true);
    const {data,error}=await run(SB.rpc('bt_slot_sync'));
    setChecking(false);
    if(error||!data||!(data.v>=4)){
      setNeedFn(true); _slotFnMissing=true;
      setStatus({warn:true,text:'The schedule can’t run because the setup SQL in Supabase is old or didn’t finish'+(error?` (${error.message})`:'')+'. Use the Copy setup SQL button above, paste it into the SQL Editor, run it, and check the result panel for errors. Then click Check now.'});
      return;
    }
    setNeedFn(false); _slotFnMissing=false;
    const parts=[];
    if(!data.ok) parts.push(data.reason);
    let warn=!data.ok;
    if(data.lunch_error){ warn=true; parts.push('Lunch rules were skipped: '+data.lunch_error); }
    if(data.cron===false){ warn=true; parts.push('The background job isn’t running (pg_cron is off or wasn’t set up). The schedule still applies while anyone has the app open; for exact timing when nobody does, turn on pg_cron and run the setup SQL.'); }
    else if(data.cron_last_run && /^failed/i.test(data.cron_last_run)) { warn=true; parts.push('Last background run: '+data.cron_last_run); }
    setStatus(warn?{warn,text:parts.join(' ')}:null);
  };
  useEffect(()=>{
    checkNow();
    run(SB.from('bt_settings').select('*').eq('id',1).maybeSingle()).then(({data,error})=>{
      if(error){setErr('Load: '+error.message);return;}
      if(!data) return;
      if(!('slot_schedule' in data)){ setNeedSetup(true); return; }
      if(data.lunch_start!=null) setLunchH(parseInt(data.lunch_start));
      const o=tzToOff(data.slot_tz); if(o!==null) setOff(o);
      const list=Array.isArray(data.slot_schedule)?data.slot_schedule:[];
      setRules(list.filter(r=>r.time).map(r=>({time:r.time,slots:r.slots|0})).sort((a,b)=>a.time.localeCompare(b.time)));
      const l=list.find(r=>r.lunch);
      if(l) setLunch({on:true,extra:l.extra|0,afterOn:l.after!=null,after:l.after!=null?l.after|0:3});
    });
  },[]);
  const edit=(i,patch)=>setRules(rs=>rs.map((r,j)=>j===i?{...r,...patch}:r));
  const addRule=()=>setRules(rs=>{
    const last=rs.length?rs[rs.length-1].time:'07:00';
    const h=Math.min(23,parseInt(last)+1);
    return [...rs,{time:`${pad(h)}:00`,slots:rs.length?rs[rs.length-1].slots:3}];
  });
  const save=async()=>{
    setBusy(true);setErr('');setOk(false);
    const sorted=[...rules].filter(r=>/^\d\d:\d\d$/.test(r.time)).sort((a,b)=>a.time.localeCompare(b.time));
    const schedule=[...sorted];
    if(lunch.on) schedule.push(lunch.afterOn?{lunch:true,extra:lunch.extra,after:lunch.after}:{lunch:true,extra:lunch.extra});
    const tz=offToTz(off);
    const {error}=await run(SB.from('bt_settings').update({slot_schedule:schedule,slot_tz:tz,updated_at:nowISO()}).eq('id',1));
    setBusy(false);
    if(error){ if(/slot_schedule|slot_tz/.test(error.message||'')) setNeedSetup(true); setErr('Save: '+error.message); return; }
    setRules(sorted); setOk(true); setTimeout(()=>setOk(false),3000);
    checkNow();   // apply right away if a time has already passed today
  };
  const copySql=()=>{ navigator.clipboard?.writeText(SLOT_SETUP_SQL).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),3000);}); };
  const first=fmtH(lunchH), second=fmtH(lunchH+1), after=fmtH(lunchH+2);
  const row={display:'flex',alignItems:'center',gap:14,flexWrap:'wrap',marginBottom:12};

  return(
    <div className="sblk">
      <h2 className="sh">Automatic slot schedule</h2>
      <p className="sd">Change the number of break slots automatically at set times each day. At each time, slots are set to that number. You can still change slots by hand on Home; your change stays until the next scheduled time.</p>
      {err&&<div className="ebox"><Ic n="alert" size={14}/>{err}</div>}
      {needFn&&!needSetup&&(
        <div style={{marginBottom:18}}>
          <p className="sd" style={{marginBottom:10}}>The setup SQL in Supabase needs to be run again. Copy it, paste it into the Supabase SQL Editor, run it, and come back.</p>
          <button className="bs" onClick={copySql}>{copied?<><Ic n="check" size={15}/> Copied</>:'Copy setup SQL'}</button>
        </div>
      )}
      {needSetup?(
        <div>
          <p className="sd" style={{marginBottom:10}}>One-time setup: in Supabase, open <b>Database → Extensions</b> and turn on <b>pg_cron</b>. Then copy this SQL, paste it into the SQL Editor, run it, and reload this page.</p>
          <button className="bs" onClick={copySql}>{copied?<><Ic n="check" size={15}/> Copied</>:'Copy setup SQL'}</button>
        </div>
      ):(<>
        <div style={{...row,marginBottom:18}}>
          <span style={{fontSize:15,color:'var(--mut)'}}>Clock</span>
          <button className="nb" style={{width:32,height:32,fontSize:17}} onClick={()=>setOff(o=>Math.max(-12,o-1))} aria-label="One hour earlier">−</button>
          <span style={{minWidth:64,textAlign:'center',fontSize:16,fontVariantNumeric:'tabular-nums'}}>UTC{off<0?'−':'+'}{Math.abs(off)}</span>
          <button className="nb" style={{width:32,height:32,fontSize:17}} onClick={()=>setOff(o=>Math.min(14,o+1))} aria-label="One hour later">+</button>
          <span style={{fontSize:15,color:'var(--mut)'}}>Now <b style={{color:'var(--txt)',fontWeight:500,fontVariantNumeric:'tabular-nums'}}>{clockAt(off)}</b></span>
        </div>
        {rules.length===0&&<p style={{fontSize:14,color:'var(--mut)',marginBottom:12}}>No scheduled times yet.</p>}
        {rules.map((r,i)=>(
          <div key={i} style={row}>
            <span style={{fontSize:15,color:'var(--mut)'}}>At</span>
            <input className="fi" type="time" value={r.time} onChange={e=>edit(i,{time:e.target.value})} style={{width:130}}/>
            <span style={{fontSize:15,color:'var(--mut)'}}>set slots to</span>
            <Stepper value={r.slots} onChange={n=>edit(i,{slots:n})}/>
            <button className="ib" onClick={()=>setRules(rs=>rs.filter((_,j)=>j!==i))} aria-label="Remove"><Ic n="x" size={16}/></button>
          </div>
        ))}
        <button className="bs" onClick={addRule}><Ic n="plus" size={15}/> Add time</button>

        <div style={{borderTop:'1px solid var(--bdr)',marginTop:22,paddingTop:18}}>
          <label style={{display:'flex',alignItems:'center',gap:10,fontSize:15,cursor:'pointer'}}>
            <input type="checkbox" checked={lunch.on} onChange={e=>setLunch(l=>({...l,on:e.target.checked}))} style={{accentColor:'var(--violet)',width:16,height:16}}/>
            Lunch: give each group enough slots to go out together
          </label>
          {lunch.on&&(
            <div style={{marginTop:14,paddingLeft:26}}>
              <p style={{fontSize:13.5,color:'var(--mut)',marginBottom:12}}>At {first} and {second}, slots are set to the number of agents in the group going to lunch, plus any extra slots for regular breaks. Group sizes come from today's lunch schedule.</p>
              <div style={row}>
                <span style={{fontSize:15,color:'var(--mut)'}}>Extra slots during lunch</span>
                <Stepper value={lunch.extra} onChange={n=>setLunch(l=>({...l,extra:n}))}/>
              </div>
              <label style={{...row,fontSize:15,cursor:'pointer'}}>
                <input type="checkbox" checked={lunch.afterOn} onChange={e=>setLunch(l=>({...l,afterOn:e.target.checked}))} style={{accentColor:'var(--violet)',width:16,height:16}}/>
                <span style={{color:'var(--mut)'}}>After lunch ({after}) set slots to</span>
                {lunch.afterOn&&<Stepper value={lunch.after} onChange={n=>setLunch(l=>({...l,after:n}))}/>}
              </label>
            </div>
          )}
        </div>

        <div style={{marginTop:20,display:'flex',alignItems:'center',gap:12}}>
          <button className="bp" onClick={save} disabled={busy}>{busy?<span className="spin-sm"/>:'Save'}</button>
          <button className="bs" onClick={checkNow} disabled={checking}>{checking?<span className="spin-sm"/>:'Check now'}</button>
          {ok&&<span style={{color:'var(--green)',fontSize:14,display:'flex',alignItems:'center',gap:6}}><Ic n="check" size={15}/> Saved</span>}
        </div>
        {status&&<p style={{fontSize:13.5,lineHeight:1.55,marginTop:14,color:status.warn?'#f7b3c1':'var(--mut)'}}>{status.text}</p>}
      </>)}
    </div>
  );
}

/* ── Trainees & shift end ─────────────────────────────────────
   Trainees have no break slot limit and one shared lunch time (no groups).
   Shift end is the clock-out time: agents who clock out earlier are asked to confirm. */
const TEAM_SETUP_SQL = `-- Trainees and shift end: one-time setup. Run in the Supabase SQL Editor. Safe to run again.

alter table bt_settings add column if not exists trainees jsonb default '[]'::jsonb;
alter table bt_settings add column if not exists trainee_lunch text default '12:00';
alter table bt_settings add column if not exists shift_end text default '16:30';

-- Break slot limit, now aware of trainees: a trainee can always start a break,
-- and trainees' open breaks don't count toward the limit for everyone else.
create or replace function public.enforce_max_concurrent_breaks()
 returns trigger
 language plpgsql
as $function$
declare
  cap int;
  v_trainees jsonb;
  current_count int;
begin
  -- Lock the settings row for the duration of this transaction. This is
  -- what makes the check atomic: if two breaks try to start at the same
  -- moment, the second one waits here until the first has fully committed,
  -- then sees the up-to-date count that includes the first break.
  select max_concurrent_breaks, coalesce(trainees, '[]'::jsonb)
    into cap, v_trainees
    from bt_settings where id = 1 for update;

  if cap is null then
    return new; -- no cap configured yet, don't block anything
  end if;

  if jsonb_typeof(v_trainees) is distinct from 'array' then
    v_trainees := '[]'::jsonb;
  end if;

  -- Trainees have no slot limit
  if exists (select 1 from jsonb_array_elements_text(v_trainees) t
              where lower(regexp_replace(trim(t), '[[:space:]]+', ' ', 'g'))
                  = lower(regexp_replace(trim(coalesce(new.agent_name, '')), '[[:space:]]+', ' ', 'g'))) then
    return new;
  end if;

  -- Trainees' open breaks don't use up slots for the rest of the team
  select count(*) into current_count
    from bt_logs l
   where l.end_time is null
     and not exists (select 1 from jsonb_array_elements_text(v_trainees) t
                      where lower(regexp_replace(trim(t), '[[:space:]]+', ' ', 'g'))
                          = lower(regexp_replace(trim(coalesce(l.agent_name, '')), '[[:space:]]+', ' ', 'g')));

  if current_count >= cap then
    raise exception 'All % break slots are taken. Please wait.', cap;
  end if;

  return new;
end;
$function$;`;
function CopySql({sql,label='Copy setup SQL'}){
  const [c,setC]=useState(false);
  return <button className="bs" onClick={()=>navigator.clipboard?.writeText(sql).then(()=>{setC(true);setTimeout(()=>setC(false),3000);})}>{c?<><Ic n="check" size={15}/> Copied</>:label}</button>;
}
function ATrainees(){
  const [list,setList]=useState([]);
  const [lunch,setLunch]=useState('12:00');
  const [known,setKnown]=useState([]);
  const [today,setToday]=useState({clocks:[],open:[]});
  const [input,setInput]=useState('');
  const [needSetup,setNeedSetup]=useState(false);
  const [loading,setLoading]=useState(true);
  const [busy,setBusy]=useState('');
  const [ok,setOk]=useState('');
  const [err,setErr]=useState('');
  const lunchLoaded=useRef(false);

  const load=useCallback(async()=>{
    const [cfg,hist,ck,open]=await Promise.all([
      run(SB.from('bt_settings').select('*').eq('id',1).maybeSingle()),
      run(SB.from('bt_clocklogs').select('agent_name').order('clock_in',{ascending:false}).limit(500)),
      run(SB.from('bt_clocklogs').select('agent_name,clock_in,clock_out').eq('date',todayISO())),
      run(SB.from('bt_logs').select('agent_name,start_time').is('end_time',null)),
    ]);
    if(cfg.error){ setErr('Load: '+cfg.error.message); setLoading(false); return; }
    const d=cfg.data;
    if(d){
      if(!('trainees' in d)) setNeedSetup(true);
      else{
        setNeedSetup(false);
        if(!lunchLoaded.current){ lunchLoaded.current=true; setLunch(HM_RE.test(d.trainee_lunch||'')?d.trainee_lunch:'12:00'); }
        setList(Array.isArray(d.trainees)?d.trainees.filter(x=>typeof x==='string'):[]);
      }
    }
    setKnown([...new Set((hist.data||[]).map(r=>r.agent_name).filter(Boolean))].sort((a,b)=>a.localeCompare(b)));
    setToday({clocks:ck.data||[],open:open.data||[]});
    setLoading(false); bumpSync();
  },[]);
  useEffect(()=>{ load(); },[load]);
  useAutoRefresh(load,8000);

  const save=async(patch,key)=>{
    setBusy(key);setErr('');
    const {error}=await run(SB.from('bt_settings').update({...patch,updated_at:nowISO()}).eq('id',1));
    setBusy('');
    if(error){ if(/trainees|trainee_lunch/.test(error.message||'')) setNeedSetup(true); setErr('Save: '+error.message); return false; }
    return true;
  };
  const saveList=async next=>{ if(await save({trainees:next},'list')){ setList(next); _traineeSet=new Set(next.map(normName)); return true; } return false; };
  const add=async()=>{
    const n=input.trim().replace(/\s+/g,' ');
    if(!n) return;
    if(list.some(x=>normName(x)===normName(n))){ setErr(`${n} is already a trainee.`); return; }
    setErr('');
    if(await saveList([...list,n])) setInput('');
  };
  const saveLunch=async()=>{
    if(await save({trainee_lunch:lunch},'lunch')){ setOk('lunch'); setTimeout(()=>setOk(''),3000); }
  };
  const statusOf=n=>{
    const k=normName(n);
    const br=today.open.find(l=>normName(l.agent_name)===k);
    if(br) return {cls:'b-on',text:`On break since ${hhmm(br.start_time)}`};
    const c=today.clocks.find(r=>normName(r.agent_name)===k);
    if(!c) return {cls:'b-out',text:'Not in yet'};
    if(c.clock_out) return {cls:'b-out',text:`Clocked out ${hhmm(c.clock_out)}`};
    return {cls:'b-in',text:`On shift since ${hhmm(c.clock_in)}`};
  };
  const options=known.filter(k=>!list.some(x=>normName(x)===normName(k)));
  const unknownTyped=input.trim()&&!known.some(k=>normName(k)===normName(input));
  const Saved=({k})=>ok===k?<span style={{color:'var(--green)',fontSize:14,display:'flex',alignItems:'center',gap:6}}><Ic n="check" size={15}/> Saved</span>:null;

  return(
    <div className="panel">
      <div className="phd"><div><h1 className="pt">Trainees</h1><p className="ps">Agents in training have no break slot limit and one shared lunch time</p></div></div>
