<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TEST · Fingerprint admin</title>
<style><!--CSS--></style></head>
<body>
<div class="ribbon">TEST PAGE · admin view · <span id="modeTag">demo data</span></div>
<div class="wrap" id="app"></div>
<script><!--SCRIPTS--></script>
<script>
const rotaFn = (n, k) => FPDB.rota()(n, k);
let sess = null, tab = 'today', weekSel = null, logDay = null, logAgent = '', agents = [], punches = [], err = '', info = '', busy = false, unsub = null, M = null, loginErr = '', loaded = false, editing = null;

const rangeFor = () => {
  const off = FPDB.getOff(), now = FPDB.now(), today = FP.dayKey(now, off);
  if (tab === 'today') return [FP.dayStart(FP.addDays(today, -8), off), FP.dayStart(FP.addDays(today, 2), off)];   // a week back so forgotten clock-outs show up
  if (tab === 'log') { const d = logDay || today; return [FP.dayStart(FP.addDays(d, -1), off), FP.dayStart(FP.addDays(d, 2), off)]; }
  const wk = weekSel || FP.mondayOf(today); return [FP.dayStart(FP.addDays(wk, -1), off), FP.dayStart(FP.addDays(wk, 8), off)];
};
async function refresh() {
  if (!sess || !sess.isAdmin || busy) return; busy = true;
  try { const [a, b] = rangeFor(); const r = await Promise.all([FPDB.listAgents(), FPDB.listPunches(a, b)]); agents = r[0]; punches = r[1]; err = ''; if (FPDB.live()) { const known = new Set(agents.map(a => a.name.toLowerCase())); const seen = [...new Set(punches.map(p => p.badge_id))].filter(n => !known.has(n.toLowerCase())); agents = agents.concat(seen.map(n => ({ badge_id: n, name: n, active: true, has_code: false, unregistered: true }))); } loaded = true; }
  catch (e) { err = String(e.message || e); }
  busy = false; compute(); render();
}
function compute() {
  const off = FPDB.getOff(), now = FPDB.now(), today = FP.dayKey(now, off), nameOf = b => (agents.find(a => a.badge_id === b) || {}).name;
  const sched = (badge, key) => rotaFn(nameOf(badge) || badge, key);
  const built = FP.buildShifts(punches.map(p => ({ badge_id: p.badge_id, punched_at: p.punched_at, punch_type: p.punch_type })), { off, sched });
  const wk = weekSel || FP.mondayOf(today), act = agents.filter(a => a.active);
  const weeks = act.map(a => FP.weekFor(a, built.shifts, wk, now, (n, k) => rotaFn(n, k), { off }));
  M = { off, now, today, wk, built, weeks, nameOf, sched };
}

/* what is each agent doing right now */
function board() {
  const m = M, out = [];
  for (const a of agents.filter(x => x.active)) {
    const mine = m.built.shifts.filter(s => s.badge === a.badge_id), open = mine.filter(s => s.state === 'on' || s.state === 'brk').pop() || null;
    const todays = mine.filter(s => s.dayKey === m.today).pop() || null, s = open || todays, sc = rotaFn(a.name, m.today);
    let kind, label, cls;
    if (s && s.state === 'brk') { kind = 'brk'; label = 'On a break'; cls = 'brk'; }
    else if (s && s.state === 'on') { kind = 'on'; label = 'On shift'; cls = 'on'; }
    else if (s && s.state === 'no_out') { kind = 'done'; label = 'No clock-out'; cls = 'bad'; }
    else if (s) { kind = 'done'; label = 'Finished'; cls = 'done'; }
    else if (sc && FP.dayStart(m.today, m.off) + FP.toMin(sc.start) * 60000 + 5 * 60000 < m.now) { kind = 'late'; label = 'Not clocked in'; cls = 'bad'; }
    else if (sc) { kind = 'soon'; label = 'Starts ' + sc.start; cls = ''; }
    else { kind = 'off'; label = 'Day off'; cls = ''; }
    out.push({ a, s, sc, kind, label, cls, met: s ? FP.metrics(s, m.now) : null, cmp: s ? FP.compare(s, sc, { off: m.off }) : null });
  }
  return out;
}

function render() {
  const app = $('#app'); $('#modeTag').textContent = FPDB.live() ? 'your Supabase' : 'demo data';
  const head = `<h1>Fingerprint clock — admin</h1><p class="sub">Who is on shift, on a break, and weekly reports. Only the one admin account can open this.</p>` + connPanel();
  if (!sess) {
    app.innerHTML = head + `<div class="card login"><h2>Admin sign in</h2><label class="f">Email<input class="fi" id="em" autocomplete="username"></label><label class="f">Password<input class="fi" id="pw" type="password" autocomplete="current-password"></label>
      ${loginErr ? `<div class="err">${esc(loginErr)}</div>` : ''}<button class="btn p" id="go" style="width:100%;margin-top:6px">Sign in</button>
      ${FPDB.live() ? '' : '<p class="mut" style="font-size:13px;margin:14px 0 0">Demo login: <a href="#" id="fill" style="color:var(--acc)">admin@demo.test · admin123</a></p>'}</div>`;
    connWire(() => { sess = null; start(); });
    $('#go').onclick = async () => { loginErr = ''; const r = await FPDB.adminSignIn($('#em').value, $('#pw').value); if (!r.ok) { loginErr = r.message || 'Could not sign in.'; render(); return; } await start(); };
    $('#pw').onkeydown = e => { if (e.key === 'Enter') $('#go').click(); };
    const f = $('#fill'); if (f) f.onclick = e => { e.preventDefault(); $('#em').value = 'admin@demo.test'; $('#pw').value = 'admin123'; };
    return;
  }
  if (!sess.isAdmin) {
    app.innerHTML = head + `<div class="card login"><h2>No access</h2><p>${esc(sess.email)} is signed in, but this account is not the fingerprint admin. Ask whoever set up the database to mark it (step at the bottom of the setup SQL).</p><button class="btn p" id="so">Sign out</button></div>`;
    connWire(() => start()); $('#so').onclick = async () => { await FPDB.adminSignOut(); sess = null; render(); }; return;
  }
  const tabs = [['today', 'Today'], ['week', 'Weekly report'], ['log', 'Punch log'], ['agents', 'Agents & setup']];
  app.innerHTML = head + `<div class="row" style="margin-bottom:12px"><div class="tabs" style="margin:0">${tabs.map(([k, l]) => `<button class="tab ${tab === k ? 'on' : ''}" data-tab="${k}">${l}</button>`).join('')}</div><span class="mut sp">${esc(sess.email)}</span><button class="btn s" id="so">Sign out</button></div>
    ${err ? `<div class="err">${esc(err)}</div>` : ''}${info ? `<div class="card ok" style="padding:12px 18px">${esc(info)}</div>` : ''}<div id="body">${!loaded ? '<p class="mut">Loading…</p>' : M ? bodyHtml() : ''}</div>${demoTools()}`;
  connWire(() => { sess = null; loaded = false; start(); });
  $$('[data-tab]').forEach(b => b.onclick = () => { tab = b.dataset.tab; info = ''; loaded = false; render(); refresh(); });
  $('#so').onclick = async () => { await FPDB.adminSignOut(); sess = null; render(); };
  if (loaded && M) wireBody();
  wireDemo();
}

function bodyHtml() { return tab === 'today' ? todayHtml() : tab === 'week' ? weekHtml() : tab === 'log' ? logHtml() : agentsHtml(); }

function todayHtml() {
  const B = board(), m = M, c = k => B.filter(x => x.kind === k).length;
  const noOut = m.built.shifts.filter(s => s.state === 'no_out');
  const tile = (n, l) => `<div class="tile ${n ? '' : 'zero'}"><b>${n}</b><span>${l}</span></div>`;
  return `<div class="tiles">${tile(c('on'), 'On shift')}${tile(c('brk'), 'On a break')}${tile(c('late'), 'Should be in, not clocked in')}${tile(c('done'), 'Finished today')}${tile(c('soon') + c('off'), 'Not working yet / day off')}</div>
    ${noOut.length ? `<div class="err">Shifts with no clock-out: ${noOut.map(s => esc(m.nameOf(s.badge) || s.badge) + ' (' + esc(dayLabel(s.dayKey)) + ' from ' + FP.hm(s.inMs, m.off) + ')').join(', ')}</div>` : ''}
    <div class="grid">${B.map(x => `<div class="ag"><div class="row"><span class="nm">${esc(x.a.name)}</span><span class="chip ${x.cls} sp">${esc(x.label)}</span></div>
      ${x.s && (x.s.state === 'on' || x.s.state === 'brk') ? `<div class="t" data-since="${x.s.state === 'brk' ? x.s.breaks[x.s.breaks.length - 1].s : x.s.inMs}">${since((m.now - (x.s.state === 'brk' ? x.s.breaks[x.s.breaks.length - 1].s : x.s.inMs)) / 1000)}</div><div class="mut" style="margin-top:-8px;font-size:13px">${x.s.state === 'brk' ? 'on this break' : 'on shift'}</div>` : x.met && x.met.worked != null ? `<div class="t">${FP.dur(x.met.worked)}</div><div class="mut" style="margin-top:-8px;font-size:13px">worked today</div>` : ''}
      <div class="ln">${x.s ? `In ${FP.hm(x.s.inMs, m.off)}${x.s.out != null ? ' · out ' + FP.hm(x.s.out, m.off) : ''}` : 'No scans today'}${x.met ? ` · breaks ${x.met.breaks} (${FP.dur(x.met.breakSecs)})` : ''}</div>
      <div class="ln">${x.sc ? 'Rota ' + esc(x.sc.start + '–' + x.sc.end) : 'No rota today'} ${x.cmp && x.cmp.lateMin ? `<span class="chip bad">${x.cmp.lateMin} min late</span>` : ''}${x.cmp && x.cmp.earlyMin ? `<span class="chip bad">left ${x.cmp.earlyMin} min early</span>` : ''}</div></div>`).join('') || '<p class="mut">No agents yet. Add them under “Agents & setup”.</p>'}</div>`;
}

function weekHtml() {
  const m = M, wk = m.wk, nowWk = FP.mondayOf(m.today);
  const cell = d => !d.shifts.length ? (d.absent ? '<span class="chip bad">no clock-in</span>' : d.sched ? `<span class="mut">${esc(d.sched.start)}–${esc(d.sched.end)}</span>` : '<span class="mut">—</span>')
    : `<div class="n" style="white-space:nowrap">${FP.hm(d.in, m.off)}–${d.out != null ? FP.hm(d.out, m.off) : (d.noOut ? '<span class="red">?</span>' : 'now')}</div><div class="mut n" style="font-size:12.5px">${d.noOut ? 'no clock-out' : FP.dur(d.worked)} · ${d.breaks} break${d.breaks === 1 ? '' : 's'}</div>${d.lateMin ? `<span class="chip bad">${d.lateMin}m late</span>` : ''}`;
  return `<div class="card"><div class="row" style="margin-bottom:12px"><h2 style="margin:0">Week of ${esc(dayLabel(wk))} – ${esc(dayLabel(FP.addDays(wk, 6)))}</h2><span class="sp"></span>
      <button class="btn s" id="pw">‹ Previous</button><button class="btn s" id="tw" ${wk === nowWk ? 'disabled' : ''}>This week</button><button class="btn s" id="nw">Next ›</button>
      <button class="btn p" id="dl">Download weekly report (CSV)</button></div>
    <div class="scroll"><table class="tbl"><thead><tr><th>Agent</th>${m.weeks[0] ? m.weeks[0].days.map(d => `<th>${esc(dayLabel(d.key))}</th>`).join('') : ''}<th>Worked</th><th>Breaks</th><th>Late days</th><th></th></tr></thead><tbody>
    ${m.weeks.map((w, i) => `<tr><td><b>${esc(w.agent.name)}</b></td>${w.days.map(d => `<td class="${d.key === m.today ? 'today' : ''}">${cell(d)}</td>`).join('')}<td class="n" style="white-space:nowrap">${w.totals.shifts ? `<b>${FP.dur(w.totals.worked)}</b>` : '<span class="mut">—</span>'}${w.totals.scheduledMin ? `<div class="mut" style="font-size:12.5px">of ${FP.dur(w.totals.scheduledMin * 60)} rota</div>` : ''}</td><td class="n" style="white-space:nowrap">${w.totals.shifts ? FP.dur(w.totals.break) : '—'}</td><td class="n">${w.totals.late}${w.totals.noOut ? ` <span class="chip bad">${w.totals.noOut} no out</span>` : ''}</td><td><button class="btn s" data-csv="${i}">CSV</button></td></tr>`).join('')}
    </tbody></table></div><p class="mut" style="margin:12px 0 0;font-size:13px">Late = more than 5 minutes after the rota start. “Worked” is time on shift minus breaks. The rota comes from the Fusion24 rota file embedded in this test page.</p></div>`;
}

function logHtml() {
  const m = M, day = logDay || m.today, from = FP.dayStart(day, m.off), to = from + 86400000;
  const rows = m.built.log.filter(l => l.t >= from && l.t < to && (!logAgent || l.badge === logAgent));
  return `<div class="card"><div class="row" style="margin-bottom:12px"><h2 style="margin:0">Every scan on the day</h2><span class="sp"></span><input class="fi" type="date" id="ld" value="${day}" style="width:170px"><select class="fi" id="la" style="width:180px"><option value="">All agents</option>${agents.map(a => `<option value="${esc(a.badge_id)}" ${logAgent === a.badge_id ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}</select></div>
    <div class="scroll"><table class="tbl"><thead><tr><th>Time</th><th>Agent</th><th>Recorded as</th></tr></thead><tbody>${rows.map(l => `<tr><td class="n">${clock(l.t, m.off)}</td><td>${esc(m.nameOf(l.badge) || l.badge)}</td><td>${l.act ? esc(ACT[l.act]) + (l.inferred ? ' <span class="mut">(worked out from the order)</span>' : '') : `<span class="red">Ignored: ${esc(l.ignored)}</span>`}</td></tr>`).join('') || '<tr><td colspan="3" class="mut">No scans on this day.</td></tr>'}</tbody></table></div></div>`;
}

function agentsHtml() {
  const e = editing || { name: '', code: '', active: true, isNew: true };
  return `<div class="card"><h2>${e.isNew ? 'Add an agent' : 'Edit ' + esc(e.name)}</h2><div class="row" style="align-items:flex-end">
            <label class="f" style="flex:2 1 200px">Name (as enrolled on the scanner without “(PT)”, and as on the rota)<input class="fi" id="an" value="${esc(e.name)}" ${e.isNew ? '' : 'disabled'}></label>
      <label class="f" style="flex:1 1 170px">Agent's personal code (4–8 digits)<input class="fi" id="ac" inputmode="numeric" placeholder="${e.isNew ? '' : 'leave empty to keep'}"></label>
      <label class="f" style="flex:0 1 110px">Active<select class="fi" id="aa"><option value="1" ${e.active ? 'selected' : ''}>Yes</option><option value="0" ${e.active ? '' : 'selected'}>No</option></select></label>
      <button class="btn p" id="asave">Save</button>${e.isNew ? '' : '<button class="btn" id="acancel">Cancel</button>'}</div>
      <p class="mut" style="margin:10px 0 0;font-size:13px">Agents sign in on the agent page with their name and this code. Give them the code in person. A code can be changed at any time.</p></div>
    <div class="card"><h2>Agents</h2><div class="scroll"><table class="tbl"><thead><tr><th>Name</th><th>Code</th><th>Active</th><th></th></tr></thead><tbody>${agents.map(a => `<tr><td>${esc(a.name)}${a.unregistered ? ' <span class="chip bad">has scans, not added yet</span>' : ''}</td><td>${a.has_code ? '<span class="ok">set</span>' : '<span class="red">not set — agent cannot sign in</span>'}</td><td>${a.active ? 'Yes' : 'No'}</td><td><button class="btn s" data-edit="${esc(a.badge_id)}">Edit</button></td></tr>`).join('')}</tbody></table></div></div>
    <div class="card"><h2>Database setup (Supabase SQL Editor, once)</h2><p class="mut" style="margin-top:0">Keeps your existing pt_punches table and admin rule (the clock server keeps writing it with its service_role key) and adds a code for each agent, a lookup that shows an agent only their own punches, and live updates. Safe to run again. The last comment shows how to mark your one admin account.</p>
      <div class="row" style="margin-bottom:10px"><button class="btn p" id="csql">Copy the setup SQL</button></div><div class="sql">${esc(FP_SETUP_SQL)}</div></div>`;
}

function wireBody() {
  if (tab === 'week') {
    const go = n => { weekSel = FP.addDays(M.wk, n); loaded = false; render(); refresh(); };
    $('#pw').onclick = () => go(-7); $('#nw').onclick = () => go(7); $('#tw').onclick = () => { weekSel = null; loaded = false; render(); refresh(); };
    const dl = (ws, name) => { const blob = new Blob([FP.weeklyCsv(ws, M.wk, M.off)], { type: 'text/csv;charset=utf-8' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); };
    $('#dl').onclick = () => dl(M.weeks, `weekly-report-${M.wk}.csv`);
    $$('[data-csv]').forEach(b => b.onclick = () => { const w = M.weeks[Number(b.dataset.csv)]; dl([w], `weekly-report-${M.wk}-${w.agent.name.replace(/\W+/g, '_')}.csv`); });
  }
  if (tab === 'log') { $('#ld').onchange = e => { logDay = e.target.value || null; loaded = false; render(); refresh(); }; $('#la').onchange = e => { logAgent = e.target.value; render(); }; }
  if (tab === 'agents') {
    $('#csql').onclick = e => copyText(FP_SETUP_SQL, e.target);
    $$('[data-edit]').forEach(b => b.onclick = () => { const a = agents.find(x => x.badge_id === b.dataset.edit); editing = { ...a, code: '' }; render(); window.scrollTo(0, 0); });
    const c = $('#acancel'); if (c) c.onclick = () => { editing = null; render(); };
    $('#asave').onclick = async () => {
      const a = { name: $('#an').value.trim(), code: $('#ac').value.trim(), active: $('#aa').value === '1' }; a.badge_id = a.name;
      if (!a.name) { err = 'Enter the agent\'s name.'; render(); return; }
      if (a.code && !/^[0-9]{4,8}$/.test(a.code)) { err = 'The code must be 4 to 8 digits.'; render(); return; }
      if (!a.code && !agents.some(x => x.badge_id.toLowerCase() === a.badge_id.toLowerCase() && x.has_code)) { err = 'Set a code so the agent can sign in.'; render(); return; }
      try { await FPDB.upsertAgent(a); info = `Saved ${a.name}.`; err = ''; editing = null; await refresh(); } catch (e) { err = String(e.message || e); render(); }
    };
  }
}

function demoTools() {
  if (FPDB.live() || !sess || !sess.isAdmin) return '';
  return `<div class="demo"><h2>Test tools (demo data only)</h2><p class="mut" style="margin-top:0">The real scanner app writes the punches. Here, scan a fingerprint for an agent and watch the board above change.</p>
    <div class="row"><select class="fi" id="dsel" style="width:200px">${agents.filter(a => a.active).map(a => `<option value="${esc(a.badge_id)}">${esc(a.name)}</option>`).join('')}</select><button class="btn p" id="dscan">Fingerprint scan</button><span class="sp"></span>
    <button class="btn s" id="d15">+15 min</button><button class="btn s" id="d60">+1 hour</button><button class="btn s" id="drst">Reset demo data</button></div>
    <p class="mut" style="margin:10px 0 0;font-size:13px">Demo time now: ${M ? esc(dayLabel(M.today)) + ' ' + FP.hm(M.now, M.off) : ''}</p></div>`;
}
function wireDemo() {
  const s = $('#dscan'); if (!s) return;
  s.onclick = () => { FPDB.scan($('#dsel').value); refresh(); };
  $('#d15').onclick = () => { FPDB.skip(15); refresh(); }; $('#d60').onclick = () => { FPDB.skip(60); refresh(); }; $('#drst').onclick = () => { FPDB.reset(); loaded = false; refresh(); };
}

function tick() { if (!M) return; const now = FPDB.now(); $$('[data-since]').forEach(e => { e.textContent = since((now - Number(e.dataset.since)) / 1000); }); }
async function start() {
  try { sess = await FPDB.adminSession(); } catch (e) { sess = null; err = String(e.message || e); }
  if (sess && !sess.isAdmin) { render(); return; }
  if (unsub) unsub(); unsub = FPDB.onPunch(() => refresh());
  render(); if (sess) refresh();
}
setInterval(tick, 1000); setInterval(() => { if (sess && sess.isAdmin && tab === 'today') { compute(); const b = $('#body'); if (b && loaded) { b.innerHTML = bodyHtml(); } } }, 20000);
start();
</script></body></html>
